<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>離散數學動畫</title>
<style>html,body{margin:0;height:100%;background:#05080f;display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100vw;max-height:100vh}</style></head>
<body><canvas id="cv" width="1280" height="720"></canvas>
<script>
'use strict';
const W = 1280, H = 720, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const C = { bg0: '#060a14', bg1: '#0d1730', ink: '#eaf1ff', dim: '#7f8aa3', faint: '#2a3550', teal: '#2ee6c9', amber: '#ffc547', coral: '#ff6b8b', violet: '#a98bff', green: '#5cf28a', blue: '#5aa8ff' };
const SANS = '"Noto Sans CJK TC","Noto Sans CJK HK","Microsoft JhengHei",sans-serif', SERIF = '"Noto Serif CJK TC","Noto Serif CJK HK","PMingLiU",serif', MONO = '"DejaVu Sans Mono",monospace';
const E = {
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI / 3)) + 1,
  lin: t => t,
};
const cl = x => Math.max(0, Math.min(1, x));
const P = (t, s, d, e = E.io) => e(cl((t - s) / d));
const L = (a, b, u) => a + (b - a) * u;
const win = (t, s, e, f = .4) => Math.min(cl((t - s) / f), cl((e - t) / f));
const bell = (t, s, d) => { const u = (t - s) / d; return u <= 0 || u >= 1 ? 0 : Math.sin(Math.PI * u); };
function rnd(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- background: gradient, drifting glows, twinkling stars ---------- */
const STARS = (() => { const r = rnd(7); return Array.from({ length: 140 }, () => ({ x: r() * W, y: r() * H, s: r() * 1.6 + .4, p: r() * 6.28, v: r() * .8 + .3 })); })();
function background(t, hue = 0) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, C.bg0); g.addColorStop(1, C.bg1); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const blobs = [[.18, .25, 380, hue === 1 ? C.violet : C.teal], [.85, .2, 420, C.violet], [.7, .9, 460, hue === 2 ? C.amber : C.blue]];
  for (const [bx, by, br, col] of blobs) {
    const x = bx * W + Math.sin(t * .23 + bx * 9) * 40, y = by * H + Math.cos(t * .19 + by * 7) * 30;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, br); rg.addColorStop(0, col + '26'); rg.addColorStop(1, col + '00'); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  for (const s of STARS) { ctx.globalAlpha = .25 + .35 * (0.5 + 0.5 * Math.sin(t * s.v + s.p)); ctx.fillStyle = '#cfe1ff'; ctx.fillRect(s.x, (s.y - t * 4 * s.v + H) % H, s.s, s.s); }
  ctx.globalAlpha = 1;
  const v = ctx.createRadialGradient(W / 2, H / 2, 260, W / 2, H / 2, 820); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ---------- primitives ---------- */
function txt(s, x, y, o = {}) {
  const { size = 28, color = C.ink, align = 'center', weight = 500, font = SANS, alpha = 1, glow = 0, grad = null, base = 'middle', spacing = 0 } = o;
  if (alpha <= 0.002 || !s) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = base;
  if (spacing) ctx.letterSpacing = spacing + 'px';
  if (grad) { const w = ctx.measureText(s).width; const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x; const lg = ctx.createLinearGradient(x0, 0, x0 + w, 0); grad.forEach((c, i) => lg.addColorStop(i / (grad.length - 1), c)); ctx.fillStyle = lg; }
  else ctx.fillStyle = color;
  if (glow) { ctx.shadowColor = grad ? grad[0] : color; ctx.shadowBlur = glow; }
  ctx.fillText(s, x, y); ctx.restore();
}
function type(s, u) { const n = Math.floor([...s].length * cl(u)); return [...s].slice(0, n).join(''); }
function rrect(x, y, w, h, r, fill, stroke, lw = 1.5) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function glass(x, y, w, h, alpha = 1, accent = C.teal) {
  if (alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha;
  const g = ctx.createLinearGradient(x, y, x, y + h); g.addColorStop(0, 'rgba(30,42,70,.62)'); g.addColorStop(1, 'rgba(14,20,38,.62)');
  rrect(x, y, w, h, 18, g, 'rgba(255,255,255,.09)');
  const a = ctx.createLinearGradient(x, 0, x + w, 0); a.addColorStop(0, accent); a.addColorStop(1, accent + '00'); ctx.fillStyle = a; ctx.fillRect(x + 18, y, w - 36, 2);
  ctx.restore();
}
function node(x, y, r, label, o = {}) {
  const { stroke = C.dim, fill = '#111a2e', color = C.ink, scale = 1, alpha = 1, glow = 0, size = 22, lw = 2.5 } = o;
  if (scale <= 0.001 || alpha <= 0.002) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  if (glow) { ctx.shadowColor = stroke; ctx.shadowBlur = glow; }
  const g = ctx.createRadialGradient(-r * .3, -r * .4, 2, 0, 0, r); g.addColorStop(0, '#24345a'); g.addColorStop(1, fill);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); ctx.shadowBlur = 0;
  txt(label, 0, 1, { size, color, weight: 700, font: MONO }); ctx.restore();
}
function line(x1, y1, x2, y2, u = 1, o = {}) {
  if (u <= 0) return; const { color = C.dim, w = 2, glow = 0, alpha = 1, dash = null } = o;
  ctx.save(); ctx.globalAlpha *= alpha; if (dash) ctx.setLineDash(dash); if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(L(x1, x2, u), L(y1, y2, u)); ctx.stroke(); ctx.restore();
}
function poly(pts, u, o = {}) { // draw polyline up to fraction u of total length
  if (u <= 0 || pts.length < 2) return null; const { color = C.blue, w = 4, glow = 16, alpha = 1 } = o;
  const seg = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot += d; }
  let rem = tot * cl(u); ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.beginPath(); ctx.moveTo(...pts[0]); let head = pts[0];
  for (let i = 1; i < pts.length; i++) { if (rem <= 0) break; const f = Math.min(1, rem / seg[i - 1]); head = [L(pts[i - 1][0], pts[i][0], f), L(pts[i - 1][1], pts[i][1], f)]; ctx.lineTo(...head); rem -= seg[i - 1]; }
  ctx.stroke(); ctx.restore(); return head;
}
function curve(x1, y1, x2, y2, hgt, u, o = {}) { // quadratic arc
  const pts = []; for (let i = 0; i <= 30; i++) { const s = i / 30; const cx = (x1 + x2) / 2, cy = Math.min(y1, y2) - hgt; pts.push([(1 - s) * (1 - s) * x1 + 2 * (1 - s) * s * cx + s * s * x2, (1 - s) * (1 - s) * y1 + 2 * (1 - s) * s * cy + s * s * y2]); }
  return poly(pts, u, o);
}
function burst(x, y, t, t0, col, n = 18, seed = 1, spread = 90) { // deterministic particle burst
  const u = (t - t0) / 1.1; if (u <= 0 || u >= 1) return; const r = rnd(seed);
  ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 10;
  for (let i = 0; i < n; i++) { const a = r() * 6.283, sp = (r() * .6 + .4) * spread, d = E.out(u) * sp; ctx.globalAlpha = (1 - u) * .9; ctx.fillStyle = i % 3 ? col : '#ffffff'; ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d - 18 * u * u, 2.6 * (1 - u) + .6, 0, 7); ctx.fill(); }
  ctx.restore();
}
function ring(x, y, t, t0, col, r0 = 20, r1 = 70) { const u = (t - t0) / .9; if (u <= 0 || u >= 1) return; ctx.save(); ctx.globalAlpha = 1 - u; ctx.strokeStyle = col; ctx.lineWidth = 3 * (1 - u) + 1; ctx.shadowColor = col; ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(x, y, L(r0, r1, E.out(u)), 0, 7); ctx.stroke(); ctx.restore(); }
function header(t, n, title, accent) {
  const a = P(t, .2, .8, E.out);
  txt(`0${n}`, 64, 62, { size: 54, weight: 900, font: SERIF, grad: [accent, C.violet], alpha: a, align: 'left', glow: 20 });
  txt(title, 150, 64, { size: 32, weight: 700, font: SERIF, alpha: a, align: 'left' });
  line(150, 92, L(150, 560, P(t, .5, 1.2)), 92, 1, { color: accent, w: 2, glow: 10, alpha: .8 });
}
function captions(t, list) {
  for (const [s, e, c] of list) {
    const a = win(t, s, e, .35); if (a <= 0) continue; const yo = (1 - P(t, s, .5, E.out)) * 14;
    ctx.save(); ctx.font = `500 25px ${SANS}`; const w = ctx.measureText(c).width + 64; ctx.globalAlpha = a;
    const g = ctx.createLinearGradient(W / 2 - w / 2, 0, W / 2 + w / 2, 0); g.addColorStop(0, 'rgba(10,16,32,.0)'); g.addColorStop(.12, 'rgba(10,16,32,.86)'); g.addColorStop(.88, 'rgba(10,16,32,.86)'); g.addColorStop(1, 'rgba(10,16,32,0)');
    ctx.fillStyle = g; ctx.fillRect(W / 2 - w / 2, 640 + yo, w, 54); ctx.restore();
    txt(c, W / 2, 667 + yo, { size: 25, alpha: a, color: '#f2f6ff' });
  }
}
const count = (t, s, d, a, b) => Math.round(L(a, b, P(t, s, d, E.out)));

/* =============== scenes =============== */
const SC = [];

/* 0. title */
SC.push({ dur: 6, hue: 1, draw(t) {
  const chars = [...'離散數學'];
  chars.forEach((ch, i) => { const u = P(t, .3 + i * .12, .9, E.back); txt(ch, 640 - 165 + i * 110, 300 + (1 - u) * 60, { size: 112, weight: 900, font: SERIF, alpha: cl(u), grad: [C.teal, C.violet], glow: 30 * u }); });
  txt('五個看得見的證明', 640, 410, { size: 38, weight: 700, alpha: P(t, 1.1, .8), spacing: 8 });
  line(640 - 260 * P(t, 1.3, 1), 455, 640 + 260 * P(t, 1.3, 1), 455, 1, { color: C.amber, w: 2.5, glow: 16 });
  const tags = ['鴿籠原理', '排容原理', 'Catalan 反射', 'Hasse 圖', '歐幾里得'];
  tags.forEach((s, i) => { const u = P(t, 1.8 + i * .18, .6, E.back); const x = 640 + (i - 2) * 190; ctx.save(); ctx.globalAlpha = cl(u); ctx.translate(x, 520); ctx.scale(L(.6, 1, cl(u)), L(.6, 1, cl(u))); rrect(-82, -24, 164, 48, 24, 'rgba(255,255,255,.06)', [C.teal, C.amber, C.coral, C.violet, C.green][i] + 'aa', 1.6); ctx.restore(); txt(s, x, 521, { size: 21, alpha: cl(u), color: [C.teal, C.amber, C.coral, C.violet, C.green][i] }); });
  txt('資工所衝刺站', 640, 190, { size: 20, alpha: P(t, .2, .8), color: C.amber, spacing: 10, weight: 700 });
  burst(640, 300, t, 1.0, C.teal, 40, 3, 260);
} });

/* 1. 鴿籠：Erdős–Szekeres */
(() => {
  const a = [5, 3, 8, 1, 9, 2, 7, 4, 6, 10], N = a.length, n = 3;
  const inc = Array(N), dec = Array(N);
  for (let k = N - 1; k >= 0; k--) { inc[k] = 1; dec[k] = 1; for (let j = k + 1; j < N; j++) { if (a[j] > a[k]) inc[k] = Math.max(inc[k], inc[j] + 1); if (a[j] < a[k]) dec[k] = Math.max(dec[k], dec[j] + 1); } }
  const X = k => 190 + k * 100, Y = 215;
  const gx = 230, gy = 372, cw = 112, ch = 72;
  const over = a.map((_, k) => inc[k] > n || dec[k] > n);
  let oi = 0; const target = a.map((_, k) => over[k] ? [800 + (oi++) * 100, 470] : [gx + (dec[k] - .5) * cw, gy + (inc[k] - .5) * ch]);
  const lis = [3, 5, 7, 8, 9];
  const scan = k => 3 + (N - 1 - k) * 1.05;
  SC.push({ dur: 44, hue: 0, draw(t) {
    header(t, 1, '鴿籠原理 · Erdős–Szekeres', C.teal);
    const gridA = win(t, 15, 30.5, .9), dimRow = 1 - .45 * win(t, 17, 30, .8);
    // scanning arcs
    for (let k = 0; k < N; k++) { const s = scan(k), w = win(t, s, s + 1.05, .25); if (w <= 0) continue;
      for (let j = k + 1; j < N; j++) curve(X(k), Y - 32, X(j), Y - 32, 30 + (j - k) * 9, 1, { color: a[j] > a[k] ? C.teal : C.violet, w: 1.6, glow: 8, alpha: w * .55 }); }
    // row
    for (let k = 0; k < N; k++) {
      const pop = P(t, .5 + k * .1, .6, E.back), s = scan(k), active = win(t, s, s + 1.05, .2);
      const inL = lis.includes(k), li = lis.indexOf(k), lit = inL ? P(t, 31 + li * 1.1, .5) : 0;
      const stroke = lit > 0 ? C.amber : active > 0 ? C.teal : C.dim;
      node(X(k), Y, 31, String(a[k]), { scale: pop, stroke, glow: 26 * Math.max(active, lit), alpha: Math.max(dimRow, lit), size: 22 });
      const lab = P(t, s + .35, .45, E.back);
      txt(`(${inc[k]},${dec[k]})`, X(k), Y + 56, { size: 19, font: MONO, alpha: cl(lab) * Math.max(dimRow, lit), color: over[k] ? C.coral : C.ink, weight: 700 });
      if (lab > 0 && lab < 1) burst(X(k), Y + 56, t, s + .35, over[k] ? C.coral : C.teal, 10, k + 11, 40);
    }
    txt('i = 以它開頭的最長遞增　　d = 最長遞減', 640, 310, { size: 20, color: C.dim, alpha: win(t, 3, 15, .5) });
    // pigeonholes
    if (gridA > 0) {
      ctx.save(); ctx.globalAlpha = gridA;
      for (let i = 0; i < 3; i++) for (let d = 0; d < 3; d++) rrect(gx + d * cw + 4, gy + i * ch + 4, cw - 8, ch - 8, 12, 'rgba(46,230,201,.06)', 'rgba(46,230,201,.35)', 1.4);
      for (let i = 0; i < 3; i++) txt(`i=${i + 1}`, gx - 34, gy + (i + .5) * ch, { size: 18, color: C.dim, font: MONO });
      for (let d = 0; d < 3; d++) txt(`d=${d + 1}`, gx + (d + .5) * cw, gy - 18, { size: 18, color: C.dim, font: MONO });
      txt('3 × 3 = 9 個鴿籠', gx + 1.5 * cw, gy + 3 * ch + 26, { size: 20, color: C.teal, weight: 700 });
      rrect(740, 400, 440, 140, 18, 'rgba(255,107,139,.07)', 'rgba(255,107,139,.5)', 1.6);
      txt('擠不進鴿籠（i 或 d > 3）', 960, 382, { size: 20, color: C.coral, weight: 700 });
      ctx.restore();
    }
    // flying pigeons
    for (let k = 0; k < N; k++) {
      const s = 17.2 + k * .62, u = P(t, s, .95, E.io); if (u <= 0 || t > 30.5) continue;
      const [tx, ty] = target[k]; const x = L(X(k), tx, u), y = L(Y, ty, u) - Math.sin(Math.PI * u) * 90;
      node(x, y, 25, String(a[k]), { stroke: over[k] ? C.coral : C.teal, glow: over[k] ? 24 : 14, size: 19, alpha: gridA });
      if (u >= 1) { ring(tx, ty, t, s + .95, over[k] ? C.coral : C.teal); burst(tx, ty, t, s + .95, over[k] ? C.coral : C.teal, 14, k * 7 + 3, 60); }
    }
    // LIS arcs
    for (let q = 0; q < lis.length - 1; q++) curve(X(lis[q]), Y - 34, X(lis[q + 1]), Y - 34, 60, P(t, 31.3 + q * 1.1, .9), { color: C.amber, w: 3.5, glow: 20 });
    const fin = P(t, 36.5, .9, E.back);
    if (t > 31) { txt('1 → 2 → 4 → 6 → 10', 640, 420, { size: 40, font: MONO, weight: 700, alpha: P(t, 32, .8), color: C.amber, glow: 18 });
      ctx.save(); ctx.globalAlpha = cl(fin); ctx.translate(640, 505); ctx.scale(L(.5, 1, cl(fin)), L(.5, 1, cl(fin))); txt('長度 5 ≥ n + 1 = 4', 0, 0, { size: 46, weight: 900, font: SERIF, grad: [C.amber, C.coral], glow: 26 }); ctx.restore();
      burst(640, 505, t, 36.6, C.amber, 36, 99, 230); }
    captions(t, [[1, 7, '任意 n² + 1 = 10 個相異數，一定有長度 n + 1 = 4 的遞增或遞減子序列'], [7.2, 15, '從右往左，替每個數算出數對 (i, d)'], [15.3, 22.5, '假設 i、d 都 ≤ 3：只有 9 個鴿籠，卻有 10 隻鴿子'],
      [22.7, 30.3, '同一格的兩數會互相矛盾（小的能接在大的前面），所以一定有人超出 3'], [31, 43.5, '找到了：遞增子序列 1 → 2 → 4 → 6 → 10']]);
  } });
})();

/* 2. 排容 */
(() => {
  const R = 150, CI = { A: { x: 360, y: 320, c: C.teal }, B: { x: 490, y: 320, c: C.violet }, C: { x: 425, y: 432, c: C.amber } };
  const region = { a: [9, 285, 285, 'A'], b: [13, 565, 285, 'B'], c: [8, 425, 520, 'C'], ab: [5, 425, 262, 'AB'], ac: [3, 350, 405, 'AC'], bc: [4, 500, 405, 'BC'], abc: [3, 425, 358, 'ABC'] };
  const steps = [['+', 'A', 20], ['+', 'B', 25], ['+', 'C', 18], ['−', 'AB', 8], ['−', 'AC', 6], ['−', 'BC', 7], ['+', 'ABC', 3]];
  const st = j => 7.5 + j * 3;
  const zh = s => [...s].join(' ∩ ');
  const counts = (t) => { const c = { a: 0, b: 0, c: 0, ab: 0, ac: 0, bc: 0, abc: 0 }; steps.forEach(([sg, S], j) => { if (t >= st(j) + .7) for (const k in c) if ([...S].every(x => region[k][3].includes(x))) c[k] += sg === '+' ? 1 : -1; }); return c; };
  const totals = [20, 45, 63, 55, 49, 42, 45];
  function clipFill(sets, col, al) { ctx.save(); for (const s of sets) { ctx.beginPath(); ctx.arc(CI[s].x, CI[s].y, R, 0, 7); ctx.clip(); } ctx.globalAlpha = al; ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  SC.push({ dur: 40, hue: 1, draw(t) {
    header(t, 2, '排容原理 · 每一塊剛好算一次', C.violet);
    for (const [nm, c] of Object.entries(CI)) { const i = 'ABC'.indexOf(nm), u = P(t, .6 + i * .35, 1.3);
      clipFill([nm], c.c, .07 * u);
      ctx.save(); ctx.strokeStyle = c.c; ctx.lineWidth = 3; ctx.shadowColor = c.c; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(c.x, c.y, R, -Math.PI / 2, -Math.PI / 2 + 6.2832 * u); ctx.stroke(); ctx.restore();
      const lp = { A: [215, 205], B: [635, 205], C: [425, 610] }[nm]; txt(nm, lp[0], lp[1], { size: 34, weight: 900, font: SERIF, color: c.c, alpha: u, glow: 14 }); }
    steps.forEach(([sg, S], j) => { const b = bell(t, st(j), 1.6); if (b > 0) clipFill([...S], sg === '+' ? C.green : C.coral, .32 * b); });
    const cnt = counts(t);
    for (const [k, [v, x, y]] of Object.entries(region)) {
      const appear = P(t, 3.2, .8, E.back); const c = cnt[k];
      const changed = steps.some(([sg, S], j) => [...S].every(z => region[k][3].includes(z)) && bell(t, st(j) + .5, .7) > 0);
      const col = c === 1 ? C.green : c === 0 ? C.dim : C.coral; const sc = cl(appear) * (1 + (changed ? .22 * Math.max(...steps.map((_, j) => bell(t, st(j) + .5, .7))) : 0));
      ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); txt(String(v), 0, -10, { size: 26, weight: 800, font: MONO }); rrect(-30, 6, 60, 24, 12, col + '33', col, 1.4); txt(`×${c}`, 0, 18.5, { size: 16, weight: 700, font: MONO, color: col }); ctx.restore();
    }
    if (t > 34) for (const [k, [, x, y]] of Object.entries(region)) burst(x, y + 18, t, 34.1 + Object.keys(region).indexOf(k) * .08, C.green, 10, k.length * 13 + 5, 45);
    // right panel
    const pa = P(t, 2, 1); glass(760, 150, 460, 450, pa, C.violet);
    txt('|A ∪ B ∪ C| =', 790, 190, { size: 26, weight: 700, align: 'left', alpha: pa, font: SERIF });
    steps.forEach(([sg, S, v], j) => { const u = P(t, st(j), .6, E.out); const col = sg === '+' ? C.green : C.coral;
      txt(`${sg} |${zh(S)}|`, 800 + (1 - u) * 30, 236 + j * 38, { size: 23, align: 'left', alpha: u, color: col, font: MONO, weight: 700 });
      txt(`${v}`, 1010, 236 + j * 38, { size: 23, align: 'right', alpha: u, color: col, font: MONO, weight: 700 }); });
    let tot = 0; for (let j = 0; j < steps.length; j++) if (t >= st(j)) tot = j === 0 ? count(t, st(0), .8, 0, 20) : count(t, st(j), .8, totals[j - 1], totals[j]);
    if (t > st(0)) txt(String(tot), 1110, 330, { size: 92, weight: 900, font: SERIF, grad: t > 29 ? [C.green, C.teal] : [C.ink, C.violet], glow: t > 29 ? 30 : 10 });
    txt('9 + 13 + 8 + 5 + 3 + 4 + 3 = 45', 990, 540, { size: 22, font: MONO, alpha: P(t, 33, .8), color: C.teal, glow: 8 });
    txt('直接加七塊驗算', 990, 505, { size: 18, color: C.dim, alpha: P(t, 33, .8) });
    captions(t, [[1, 7.2, '三個集合的聯集有多大？直接相加會重複計算'], [7.5, 16.3, '先加上 |A|、|B|、|C|：重疊的地方被算了 2 次、正中間 3 次'], [16.5, 25.3, '減掉兩兩交集：重疊回到 1 次，但正中間變成 0 次'],
      [25.5, 33, '最後加回三者交集：每一塊都剛好 ×1'], [33.2, 39.5, '口訣：奇數個交集加、偶數個交集減']]);
  } });
})();

/* 3. Catalan reflection */
(() => {
  const path = 'RUURURRU', n = 4, s = 78, ox = 150, oy = 600;
  const X = x => ox + x * s, Y = y => oy - y * s;
  const pts = [[0, 0]]; for (const c of path) { const [x, y] = pts[pts.length - 1]; pts.push(c === 'R' ? [x + 1, y] : [x, y + 1]); }
  const touch = 3; const ref = pts.map((p, i) => i < touch ? p : [p[1] - 1, p[0] + 1]);
  SC.push({ dur: 42, hue: 2, draw(t) {
    header(t, 3, 'Catalan 數 · 反射原理', C.coral);
    const g = P(t, .6, 1.4);
    for (let i = 0; i <= n + 1; i++) line(X(0), Y(i), X(n), Y(i), g, { color: C.faint, w: 1.4 });
    for (let i = 0; i <= n; i++) line(X(i), Y(0), X(i), Y(n + 1), g, { color: C.faint, w: 1.4 });
    line(X(0), Y(0), X(n), Y(n), P(t, 1.6, 1.2), { color: C.green, w: 2.5, glow: 12 });
    const mirrorGlow = 10 + 24 * win(t, 14, 22, .6);
    line(X(0), Y(1), X(n), Y(n + 1), P(t, 2.2, 1.2), { color: C.coral, w: 2.5, glow: mirrorGlow, dash: [10, 8] });
    txt('y = x', X(n) + 34, Y(n) + 8, { size: 18, color: C.green, alpha: P(t, 2.4, .6), font: MONO });
    txt('y = x + 1', X(0) - 12, Y(1) - 14, { size: 18, color: C.coral, alpha: P(t, 2.8, .6), font: MONO, align: 'right' });
    node(X(0), Y(0), 9, '', { stroke: C.ink, alpha: g }); txt('(0,0)', X(0) - 6, Y(0) + 30, { size: 17, font: MONO, alpha: g, color: C.dim });
    // path drawing
    const u = P(t, 6, 7.2, E.lin), P0 = pts.map(([x, y]) => [X(x), Y(y)]);
    const refU = P(t, 14.3, 4.5);
    const head = poly(P0, u, { color: C.blue, w: 5, glow: 18, alpha: refU > 0 ? L(1, .35, refU) : 1 });
    if (head && u < 1) { ctx.save(); ctx.shadowColor = C.ink; ctx.shadowBlur = 24; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(...head, 7, 0, 7); ctx.fill(); ctx.restore(); }
    const tT = 6 + 7.2 * (3 / 8);
    if (t > tT) { ring(X(1), Y(2), t, tT, C.coral, 10, 80); ring(X(1), Y(2), t, tT + .35, C.coral, 10, 60); burst(X(1), Y(2), t, tT, C.coral, 26, 5, 110);
      node(X(1), Y(2), 10, '', { stroke: C.coral, fill: C.coral, glow: 26 }); txt('第一次碰到！', X(1) - 22, Y(2) - 34, { size: 20, color: C.coral, weight: 700, alpha: win(t, tT, 13.8, .4), align: 'right' }); }
    // reflection morph
    if (refU > 0) { const M = pts.map((p, i) => i < touch ? [X(p[0]), Y(p[1])] : [X(L(p[0], ref[i][0], refU)), Y(L(p[1], ref[i][1], refU))]);
      poly(M, 1, { color: C.amber, w: 5.5, glow: 26 });
      const end = M[M.length - 1]; node(end[0], end[1], 10, '', { stroke: C.amber, fill: C.amber, glow: 30 });
      txt(refU < .5 ? '(4,4)' : '(3,5)', end[0] + 16, end[1] - 22, { size: 20, font: MONO, color: C.amber, weight: 700 });
      if (refU >= 1) burst(end[0], end[1], t, 18.8, C.amber, 28, 8, 120); }
    else if (u >= 1) txt('(4,4)', X(n) + 16, Y(n) - 22, { size: 20, font: MONO, color: C.blue });
    // right panel
    const pa = P(t, 3, 1); glass(640, 150, 580, 450, pa, C.coral);
    txt('所有路徑', 680, 205, { size: 22, color: C.dim, align: 'left', alpha: pa });
    txt(`C(8,4) = ${count(t, 3.4, 1.6, 0, 70)}`, 680, 250, { size: 38, font: MONO, weight: 700, align: 'left', alpha: pa });
    const b = P(t, 22.3, .8); txt('壞路徑  ⟷  終點 (3,5) 的路徑', 680, 320, { size: 22, color: C.amber, align: 'left', alpha: b });
    txt(`C(8,5) = ${count(t, 23, 1.6, 0, 56)}`, 680, 365, { size: 38, font: MONO, weight: 700, align: 'left', alpha: b, color: C.amber });
    const gd = P(t, 30, .9, E.back);
    ctx.save(); ctx.globalAlpha = cl(gd); ctx.translate(680, 455); ctx.scale(L(.7, 1, cl(gd)), L(.7, 1, cl(gd))); txt(`好路徑 = 70 − 56 = ${count(t, 30.6, 1.2, 70, 14)}`, 0, 0, { size: 40, weight: 900, font: SERIF, align: 'left', grad: [C.green, C.teal], glow: 24 }); ctx.restore();
    if (t > 31.8) burst(900, 455, t, 31.8, C.green, 34, 12, 200);
    txt('Cₙ = C(2n, n) − C(2n, n+1) = C(2n, n) / (n+1)', 680, 535, { size: 23, font: MONO, align: 'left', alpha: P(t, 33.5, .9), color: C.ink });
    captions(t, [[1, 6, '從 (0,0) 走到 (4,4)，每步向右或向上；好路徑永遠不越過對角線'], [6.2, 14, '這條路徑碰到了虛線 y = x + 1：它是壞路徑'], [14.3, 22, '把第一次碰到之後的每一步沿虛線鏡射：右變上、上變右'],
      [22.2, 29.8, '每條壞路徑都一一對應到一條走到 (3,5) 的路徑'], [30, 41.5, '好路徑 = 全部 − 壞路徑 = 14 = C₄']]);
  } });
})();

/* 4. Hasse */
(() => {
  const D = [1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60];
  const om = m => { let c = 0; for (let p = 2; p * p <= m; p++) while (m % p === 0) { m /= p; c++; } return c + (m > 1 ? 1 : 0); };
  const lv = {}; D.forEach(d => lv[d] = om(d));
  const levels = [0, 1, 2, 3, 4].map(L0 => D.filter(d => lv[d] === L0));
  const Pp = {}; levels.forEach((ds, l) => ds.forEach((d, j) => { Pp[d] = [450 + (j - (ds.length - 1) / 2) * 135, 600 - l * 108]; }));
  const all = [], cov = []; for (const a of D) for (const b of D) if (a < b && b % a === 0) { all.push([a, b]); if (!D.some(c => c !== a && c !== b && c % a === 0 && b % c === 0)) cov.push([a, b]); }
  const isCov = (a, b) => cov.some(([x, y]) => x === a && y === b);
  const chain = [1, 2, 4, 12, 60], anti = [4, 6, 10, 15];
  SC.push({ dur: 38, hue: 1, draw(t) {
    header(t, 4, 'Hasse 圖 · 60 的因數', C.green);
    const allA = P(t, 4.2, 1.6), reduce = P(t, 9.5, 3);
    const chainOn = win(t, 15, 28, .6), meetOn = win(t, 28.3, 37.5, .6);
    for (const [a, b] of all) { const c = isCov(a, b);
      if (!c) { const al = allA * (1 - reduce) * .55; line(...Pp[a], ...Pp[b], 1, { color: C.coral, w: 1.4, alpha: al }); continue; }
      let col = C.dim, w = 2, glow = 0, al = Math.max(allA * .55, reduce * .9);
      const ci = chain.indexOf(a); if (ci >= 0 && chain[ci + 1] === b) { const u = P(t, 15.5 + ci * 1.0, .8); if (chainOn > 0 && u > 0) { line(...Pp[a], ...Pp[b], 1, { color: col, w, alpha: al }); line(...Pp[a], ...Pp[b], u, { color: C.teal, w: 5, glow: 22, alpha: chainOn }); continue; } }
      if (meetOn > 0 && ((a === 4 && (b === 12 || b === 20)))) { line(...Pp[a], ...Pp[b], 1, { color: C.teal, w: 5, glow: 22, alpha: meetOn }); continue; }
      if (meetOn > 0 && ((b === 60 && (a === 12 || a === 20)))) { line(...Pp[a], ...Pp[b], 1, { color: C.coral, w: 5, glow: 22, alpha: meetOn }); continue; }
      line(...Pp[a], ...Pp[b], 1, { color: col, w, glow, alpha: al }); }
    for (const d of D) { const l = lv[d], j = levels[l].indexOf(d); const pop = P(t, .7 + l * .55 + j * .09, .6, E.back);
      let stroke = C.dim, glow = 0;
      const ci = chain.indexOf(d); if (ci >= 0 && chainOn > 0 && t > 15.5 + Math.max(0, ci - 1) * 1.0 + (ci ? .8 : 0)) { stroke = C.teal; glow = 26 * chainOn; }
      const aw = win(t, 22.3, 28.2, .5); if (anti.includes(d) && aw > 0) { stroke = C.amber; glow = 30 * aw * (.7 + .3 * Math.sin(t * 6)); }
      if (meetOn > 0 && (d === 12 || d === 20)) { stroke = C.violet; glow = 26 * meetOn; }
      if (meetOn > 0 && d === 4) { stroke = C.teal; glow = 30 * meetOn; }
      if (meetOn > 0 && d === 60) { stroke = C.coral; glow = 30 * meetOn; }
      node(...Pp[d], 25, String(d), { scale: pop, stroke, glow, size: 19 }); }
    if (win(t, 22.3, 28.2) > 0) line(220, Pp[4][1], 700, Pp[4][1], P(t, 22.3, .8), { color: C.amber, w: 1.6, dash: [6, 8], alpha: win(t, 22.3, 28.2, .5) * .7 });
    // panel
    const pa = P(t, 2, 1); glass(800, 150, 420, 450, pa, C.green);
    const ph = [[0, 4.1, ['a ∣ b 是偏序', '自反 · 反對稱 · 遞移'], C.ink], [4.2, 9.4, ['所有可比較的對', `${all.length} 條邊：一團亂`], C.coral], [9.5, 14.9, ['刪掉能由遞移推出的邊', `只剩 ${cov.length} 條覆蓋關係`], C.green],
      [15, 22.2, ['最長鏈', '1 ∣ 2 ∣ 4 ∣ 12 ∣ 60', '長度 5'], C.teal], [22.3, 28.2, ['最大反鏈', '{4, 6, 10, 15}', 'Dilworth：至少 4 條鏈'], C.amber], [28.3, 38, ['12 ∧ 20 = gcd = 4', '12 ∨ 20 = lcm = 60', '任兩元素都有 ∧ 與 ∨ → 格'], C.violet]];
    for (const [s, e, lines, col] of ph) { const a = win(t, s, e, .45) * pa; lines.forEach((ln, i) => txt(ln, 1010, 250 + i * 70 + (1 - P(t, s, .5, E.out)) * 16, { size: i === 0 ? 30 : 26, weight: i === 0 ? 800 : 600, font: i === 0 ? SERIF : (/[0-9∣∧∨{]/.test(ln) ? MONO : SANS), color: i === 0 ? col : C.ink, alpha: a, glow: i === 0 ? 14 : 0 })); }
    if (t > 12.5) burst(450, 380, t, 12.5, C.green, 30, 21, 260);
    captions(t, [[1, 4.1, '把 60 的 12 個因數依「整除」排起來'], [4.2, 9.4, '如果把所有可比較的對都連線……'], [9.5, 14.9, '擦掉能由遞移性推出的邊，留下的就是 Hasse 圖'],
      [15, 22.2, '最長鏈長度 5：至少要 5 個反鏈才蓋得住（Mirsky）'], [22.3, 28.2, '同一層兩兩不可比較：最大反鏈大小 4'], [28.3, 37.5, '往下找最大下界、往上找最小上界：整除格裡就是 gcd 與 lcm']]);
  } });
})();

/* 5. Euclid tiling */
(() => {
  const k = 1.88, ox = 96, oy = 200;
  const R = (x, y, w, h) => [ox + x * k, oy + y * k, w * k, h * k];
  const sq = [[0, 0, 198, C.teal, 3.6], [198, 0, 54, C.amber, 8.6], [198, 54, 54, C.amber, 9.3], [198, 108, 54, C.amber, 10.0], [198, 162, 36, C.violet, 15.4], [234, 162, 18, C.coral, 19.4], [234, 180, 18, C.coral, 20.0]];
  const eq = [['252 = 1 × 198 + 54', C.teal, 4.4], ['198 = 3 × 54 + 36', C.amber, 10.6], ['54 = 1 × 36 + 18', C.violet, 16.2], ['36 = 2 × 18 + 0', C.coral, 20.8]];
  const back = ['18 = 54 − 1 × 36', '   = 54 − (198 − 3 × 54)', '   = 4 × 54 − 198', '   = 4 × (252 − 198) − 198', '   = 4 × 252 − 5 × 198'];
  SC.push({ dur: 40, hue: 2, draw(t) {
    header(t, 5, '歐幾里得 · 用正方形鋪滿長方形', C.amber);
    const [rx, ry, rw, rh] = R(0, 0, 252, 198); const o = P(t, .6, 1.6);
    ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.shadowColor = C.ink; ctx.shadowBlur = 10; ctx.setLineDash([2 * (rw + rh) * o, 4000]); ctx.strokeRect(rx, ry, rw, rh); ctx.restore();
    txt('252', rx + rw / 2, ry - 22, { size: 22, font: MONO, alpha: P(t, 1.4, .6), color: C.dim }); txt('198', rx - 30, ry + rh / 2, { size: 22, font: MONO, alpha: P(t, 1.6, .6), color: C.dim });
    sq.forEach(([x, y, s, col, t0], i) => { const u = P(t, t0, .8, E.back); if (u <= 0) return; const [sx, sy, sw] = R(x, y, s, s);
      ctx.save(); ctx.translate(sx, sy); ctx.scale(cl(u) * Math.min(u, 1.1), cl(u) * Math.min(u, 1.1)); ctx.globalAlpha = cl(u);
      const g = ctx.createLinearGradient(0, 0, sw, sw); g.addColorStop(0, col + '55'); g.addColorStop(1, col + '18'); ctx.fillStyle = g; ctx.fillRect(1.5, 1.5, sw - 3, sw - 3);
      ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.strokeRect(1.5, 1.5, sw - 3, sw - 3); ctx.restore();
      if (s >= 36) txt(String(s), sx + sw / 2, sy + sw / 2, { size: s > 100 ? 56 : 24, font: MONO, weight: 800, color: col, alpha: cl(u) * (1 - .6 * P(t, 24, 1)), glow: 12 });
      burst(sx + sw / 2, sy + sw / 2, t, t0 + .3, col, 14, i * 17 + 2, 50 + s * .3); });
    // 18-grid overlay
    const gu = P(t, 24.2, 3, E.io);
    if (gu > 0) { ctx.save(); ctx.globalAlpha = .55 * (1 - .5 * P(t, 30, 1)); ctx.strokeStyle = C.coral; ctx.lineWidth = 1; ctx.shadowColor = C.coral; ctx.shadowBlur = 6;
      for (let i = 1; i < 14; i++) { const x = rx + i * 18 * k; ctx.beginPath(); ctx.moveTo(x, ry); ctx.lineTo(x, ry + rh * cl(gu * 1.4 - i * .03)); ctx.stroke(); }
      for (let j = 1; j < 11; j++) { const y = ry + j * 18 * k; ctx.beginPath(); ctx.moveTo(rx, y); ctx.lineTo(rx + rw * cl(gu * 1.4 - j * .03), y); ctx.stroke(); } ctx.restore();
      txt('14 × 18 = 252　　11 × 18 = 198', rx + rw / 2, ry + rh + 34, { size: 22, font: MONO, color: C.coral, alpha: win(t, 25.5, 30.5, .5), weight: 700 }); }
    // panel
    const pa = P(t, 3, 1); glass(680, 150, 540, 450, pa, C.amber);
    const fadeEq = 1 - P(t, 29.6, .7);
    eq.forEach(([s, col, t0], i) => txt(type(s, P(t, t0, 1.1, E.lin)), 720, 215 + i * 56, { size: 28, font: MONO, weight: 700, align: 'left', color: col, alpha: pa * fadeEq, glow: 8 }));
    const gc = P(t, 22, .9, E.back);
    ctx.save(); ctx.globalAlpha = cl(gc) * fadeEq; ctx.translate(950, 470); ctx.scale(L(.6, 1, cl(gc)), L(.6, 1, cl(gc))); txt('gcd(252, 198) = 18', 0, 0, { size: 44, weight: 900, font: SERIF, grad: [C.coral, C.amber], glow: 26 }); ctx.restore();
    if (t > 22.3 && t < 24) burst(950, 470, t, 22.3, C.coral, 34, 31, 220);
    back.forEach((s, i) => { const t0 = 30.4 + i * 1.15; txt(type(s, P(t, t0, 1.0, E.lin)), 712, 210 + i * 52, { size: 25, font: MONO, weight: 700, align: 'left', color: i === back.length - 1 ? C.amber : C.ink, alpha: P(t, t0, .2), glow: i === back.length - 1 ? 16 * P(t, t0 + 1, .5) : 0 }); });
    const bz = P(t, 36.5, .7, E.back); if (bz > 0) { ctx.save(); ctx.globalAlpha = cl(bz); ctx.translate(950, 500); ctx.scale(L(.6, 1, cl(bz)), L(.6, 1, cl(bz))); rrect(-92, -24, 184, 48, 24, 'rgba(255,197,71,.14)', C.amber, 1.6); txt('Bézout 等式', 0, 1, { size: 22, weight: 800, color: C.amber }); ctx.restore(); }
    captions(t, [[1, 8.3, '求 gcd(252, 198)：用最大的正方形去鋪長方形'], [8.5, 15.2, '剩下 54 × 198：再用邊長 54 的正方形鋪'], [15.3, 21.5, '剩下 54 × 36、再剩 18 × 36：用 36、18 的正方形'],
      [21.7, 30, '剛好鋪滿的最小正方形邊長 18 就是 gcd：它同時量盡 252 與 198'], [30.2, 39.5, '倒推回去：18 = 4·252 − 5·198；gcd 為 1 時就得到模反元素（RSA 私鑰）']]);
  } });
})();

/* 6. outro */
SC.push({ dur: 6, hue: 0, draw(t) {
  txt('看完不算會', 640, 250, { size: 60, weight: 900, font: SERIF, grad: [C.teal, C.violet], glow: 26, alpha: P(t, .3, .8) });
  txt('講得出每一步的「因為…所以…」才算會', 640, 330, { size: 30, alpha: P(t, .9, .8) });
  const items = ['① 到網站「動畫實驗室」自己改輸入、單步重播', '② 交離散的費曼關卡，讓 Agent 審你的思考鏈', '③ 去「無限隨機題」做計數與數論各 10 題'];
  items.forEach((s, i) => txt(s, 640, 420 + i * 48, { size: 24, color: [C.teal, C.amber, C.coral][i], alpha: P(t, 1.6 + i * .3, .6), weight: 600 }));
  burst(640, 250, t, .6, C.violet, 40, 77, 300);
} });

/* ---------- render API ---------- */
window.SCENES = SC.map(s => s.dur);
window.renderAt = (i, t) => {
  const sc = SC[i]; ctx.save(); background(t, sc.hue);
  const z = 1 + .012 * Math.sin(t * .35), zin = L(1.05, 1, P(t, 0, 1.0, E.out));
  ctx.translate(W / 2, H / 2); ctx.scale(z * zin, z * zin); ctx.translate(-W / 2, -H / 2);
  sc.draw(t); ctx.restore();
  const f = Math.min(cl(t / .55), cl((sc.dur - t) / .55)); if (f < 1) { ctx.fillStyle = `rgba(5,8,15,${1 - f})`; ctx.fillRect(0, 0, W, H); }
};
window.frameJPEG = (i, t) => { window.renderAt(i, t); return cv.toDataURL('image/jpeg', 0.93); };
/* 直接用瀏覽器打開時即時播放（錄影時網址加 ?render 就不自動播放） */
if (!location.search.includes('render')) {
  const total = SC.reduce((a, s) => a + s.dur, 0); const t0 = performance.now();
  const loop = now => { let t = ((now - t0) / 1000) % total, i = 0; while (t >= SC[i].dur) { t -= SC[i].dur; i++; } window.renderAt(i, t); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
