<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Huffman 編碼</title>
<!--
  資工所衝刺 · 短影音 37：Huffman 編碼——每次合併最少的兩個
  記憶宮殿：演算法館 · 第 5 間。CLRS 例：a 45、b 13、c 12、d 16、e 9、f 5。六根柱子站在地板上，高度＝出現次數。
  01 最矮的兩個發琥珀光、往上長出一個新節點（和），依序 14、25、30、55、100，樹從地板長到天花板。
  02 左邊 0、右邊 1；f 的路徑 1100 亮起；碼只在葉子上 → 前綴碼，01011100 切成 a b f。
  03 成本 224 vs 固定 300；a 和 f 交換位置 → 344，所以貪婪合併最佳。
-->
<style>
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Thin.otf'); font-weight: 100; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-ExtraLight.otf'); font-weight: 200; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Light.otf'); font-weight: 300; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Regular.otf'); font-weight: 400; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Text.otf'); font-weight: 450; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Medium.otf'); font-weight: 500; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-SemiBold.otf'); font-weight: 600; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Bold.otf'); font-weight: 700; }
  @font-face { font-family: 'Plex'; src: url('fonts/MathFB.ttf'); font-weight: 100 550; unicode-range: U+00B2-00B3, U+00B9, U+00BC-00BE, U+00D7, U+00F7, U+02B0-02FF, U+1D00-1DBF, U+2070-209F, U+2190-21FF, U+2200-22FF, U+2308-230B, U+2713-2717; }
  @font-face { font-family: 'Plex'; src: url('fonts/MathFB-Bold.ttf'); font-weight: 551 900; unicode-range: U+00B2-00B3, U+00B9, U+00BC-00BE, U+00D7, U+00F7, U+02B0-02FF, U+1D00-1DBF, U+2070-209F, U+2190-21FF, U+2200-22FF, U+2308-230B, U+2713-2717; }
  html, body { margin: 0; background: #000; overflow: hidden; }
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<script src="motion.js"></script>
<script src="kit.js"></script>
<script src="cs.js"></script>
<script src="space.js"></script>
<script src="timing.js"></script>
<script>
const W = 1080, H = 1920, FPS = 60, DUR = TIMING.total, CX = W / 2;
const stage = document.getElementById('stage');
const { prog, ease: E, lerp, clamp } = M;

const BG = '#04070d', INK = '#eef3fa', CY = '#5be7ff', AM = '#ffc14d', CO = '#ff6a5c', GR = '#6ee7a8', VI = '#b48cff';
const K = Kit({ W, H, stage, duration: DUR, seed: 371, vignette: .6, grain: .16, bloom: .95,
  palette: { bg: BG, ink: INK, sub: '#8a98a6', accent: CY, accent2: AM } });
K.warm([CY, AM, CO, GR, VI, INK]);
K.hud.show = false;
const S = CS(K, { stage });
const V = Space(K, S, { cy: H * .5, fogNear: 9, fogFar: 26 });
K.caption.set(TIMING.lines, {
  y: 1452, size: 54, maxW: W * .88, hookSize: 112, hookY: 1170, hookMaxW: W * .9, shade: .5,
  colors: { 最少的兩個: AM, 一棵樹: GR, '1 位': GR, 前綴碼: CY, 更長: CO, 最佳: GR },
});
const o1 = L.o1, o2 = L.o2, T = L.T, Ec = L.E, A1 = L.a1, B1 = L.b1, C1 = L.c1;
const add = (a, b) => a.map((v, i) => v + b[i]), mix3 = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
const room = (c, a = 1) => V.floor(c, { n: 10, step: 1, color: CY, a: .26 * a, major: 3 });
let tNow = 0;
const lab = (c, s, p, col, a, size = .15, ex = {}) => { if (a > .003) V.label(c, s, p, Object.assign({ size, w: 700, color: col, a, minPx: 18, maxPx: 60 }, ex)); };

// ═════════ 葉子與內部節點
const LF = { a: [-1.0, 45], c: [-.5, 12], b: [-.15, 13], f: [.25, 5], e: [.6, 9], d: [.98, 16] };
const HS = .016;
const leafTop = (k, x = LF[k][0]) => [x, 0, LF[k][1] * HS + .13];
const IN = { n14: [.425, 1.15, 14, 'f', 'e'], n25: [-.325, 1.15, 25, 'c', 'b'], n30: [.7, 1.6, 30, 'n14', 'd'], n55: [.19, 2.05, 55, 'n25', 'n30'], n100: [-.405, 2.5, 100, 'a', 'n55'] };
const ORDER = ['n14', 'n25', 'n30', 'n55', 'n100'];
const CODE = { a: '0', c: '100', b: '101', f: '1100', e: '1101', d: '111' };
const POOL = [[5, 9, 12, 13, 16, 45], [12, 13, 14, 16, 45], [14, 16, 25, 45], [25, 30, 45], [45, 55], [100]];
const PICK = [[5, 9], [12, 13], [14, 16], [25, 30], [45, 55], []];

// ═════════ 鏡頭
V.camKeys([
  [0, V.orbit(-10, 7.6, 1.1, [0, 0, .75], 44)], [T.start, V.orbit(-6, 7.8, 1.3, [0, 0, .9], 44)],
  [A1.start, V.orbit(-10, 6.0, .9, [0, 0, .6], 44)], [L.a3.start + .5, V.orbit(-8, 6.8, 1.0, [0, 0, .95], 44)], [L.a3.end, V.orbit(4, 6.9, 1.1, [0, 0, .95], 44)],
  [B1.start + .3, V.orbit(-8, 6.9, 1.0, [0, 0, .9], 44)], [L.b3.end, V.orbit(6, 7.0, 1.2, [0, 0, .9], 44)],
  [C1.start + .3, V.orbit(-6, 7.0, 1.2, [0, 0, .9], 44)], [L.c2.end, V.orbit(6, 7.1, 1.3, [0, 0, .9], 44)], [DUR, V.orbit(-2, 7.3, 1.4, [0, 0, .9], 44)],
]);

/** st: lf 葉子出現（0..1）、mg[k] 合併進度、hiL 候選高亮、bits、codes、path、swap */
function drawTree(c, t, st) {
  const { a = 1, lf = 1, mg = {}, cand = [], bits = 0, codes = 0, path = 0, swap = 0 } = st;
  const sw = E.inOutCubic(swap);
  const X = { ...Object.fromEntries(Object.entries(LF).map(([k, [x]]) => [k, x])) };
  X.a = lerp(LF.a[0], LF.f[0], sw); X.f = lerp(LF.f[0], LF.a[0], sw);
  const lift = Math.sin(Math.PI * swap) * .45;
  const pos = (k) => k[0] === 'n' ? [IN[k][0], 0, IN[k][1]] : add(leafTop(k, X[k]), [0, (k === 'a' || k === 'f') ? -lift : 0, (k === 'a' || k === 'f') ? lift * .6 : 0]);
  const hOf = (k) => LF[k][1] * HS;
  const slotTop = (k) => { let h = hOf(k); if (k === 'a') h = lerp(hOf('a'), hOf('f'), sw); if (k === 'f') h = lerp(hOf('f'), hOf('a'), sw); return [LF[k][0], 0, h + .13]; };
  const items = [];
  // 葉子柱子
  Object.keys(LF).forEach((k, i) => {
    const g = prog(lf, i * .1, i * .1 + .45); if (g <= 0) return;
    const p = pos(k), h = LF[k][1] * HS * E.outCubic(g), hot = cand.includes(k) ? 1 : 0, onP = path > 0 && (k === 'f') ? path : 0;
    const col = hot ? AM : onP > 0 ? GR : CY;
    items.push({ p: [p[0], p[1], h / 2], draw: () => { V.pillar(c, [p[0], p[1], 0], .24, Math.max(.02, h), col, a * g * .85); V.glow(c, [p[0], p[1], h + .13], .4, (.2 + .5 * hot) * a * g, col); V.orb(c, [p[0], p[1], h + .13], .12, { color: col, a: a * g }); lab(c, String(LF[k][1]), [p[0], p[1] - .14, h + .13], '#ffffff', a * g, .11); lab(c, k, [p[0], p[1] - .3, -.06], INK, a * g * .9, .17); if (codes > 0) lab(c, CODE[k], [p[0], p[1] - .3, -.3], k === 'a' ? GR : k === 'f' ? AM : CY, a * codes, .12, { minPx: 16 }); } });
  });
  // 內部節點與邊
  ORDER.forEach(k => {
    const m = mg[k] ?? 0; if (m <= 0) return;
    const [x, z, v, L1, R1] = IN[k], p = [x, 0, z], g = E.outCubic(m), hot = cand.includes(k) ? 1 : 0;
    [[L1, '0'], [R1, '1']].forEach(([ch, bit]) => {
      const q = ch[0] === 'n' ? pos(ch) : slotTop(ch), onP = path > 0 && ['n100', 'n55', 'n30', 'n14'].includes(k) && ['n55', 'n30', 'n14', 'f'].includes(ch) && ORDER.indexOf(k) > (ch[0] === 'n' ? ORDER.indexOf(ch) : -1);
      V.line(c, q, mix3(q, p, g), { color: onP ? GR : INK, a: a * (onP ? .95 : .5), w: onP ? 3.6 : 2 });
      if (bits > 0) { const mid = mix3(q, p, .5); lab(c, bit, add(mid, [bit === '0' ? -.1 : .1, -.05, .02]), onP ? GR : bit === '0' ? VI : AM, a * bits * g, .16); }
    });
    const col = hot ? AM : k === 'n100' ? GR : INK;
    items.push({ p, draw: () => { V.glow(c, p, .45, (.25 + .5 * hot) * a * g, col); V.orb(c, p, .15, { color: col, a: a * g }); lab(c, String(v), add(p, [0, -.17, 0]), '#ffffff', a * g, .12); } });
  });
  V.sorted(items);
}
function pool(c, t, step, a, y = 290) {
  if (a <= .003) return; const P = POOL[step], n = P.length, pk = PICK[step];
  P.forEach((v, i) => { const x = CX + (i - (n - 1) / 2) * 140, hot = pk.includes(v); S.label(c, String(v), x, y, { size: hot ? 70 : 54, w: 700, color: hot ? AM : INK, a: a * (hot ? 1 : .6) }); });
}

// ═════════ 場景
const MT = () => ({ n14: L.a2.start + 1.2, n25: L.a3.start + .4, n30: L.a3.start + 1.3, n55: L.a3.start + 2.2, n100: L.a3.start + 3.1 });
function sOpen(c, t) {
  const out = 1 - prog(t, T.start - .4, T.start + .05, E.inCubic); if (out <= 0) return;
  c.save(); c.globalAlpha *= out * prog(t, -.4, .3);
  room(c);
  const mg = {}; ORDER.forEach((k, i) => mg[k] = prog(t, .6 + i * .4, 1.0 + i * .4));
  drawTree(c, t, { lf: prog(t, 0, .8), mg, codes: prog(t, o2.start + .6, o2.start + 1.0) });
  c.restore();
}
const title = S.titleCard(T, { kick: '演算法 · 貪婪法', big: 'Huffman', size: 170, y: 600, en: 'HUFFMAN  CODING', q: '最少的兩個先合併', qGap: 330, color: CY });
function sTitle(c, t) {
  const a = prog(t, T.start - .2, T.start + .3) * (1 - prog(t, T.end - .1, T.end + .35)); if (a <= 0) return;
  const mg = {}; ORDER.forEach(k => mg[k] = 1);
  c.save(); c.globalAlpha *= a * .2; room(c); drawTree(c, t, { mg }); c.restore();
  K.core(c, CX, 700, 9, a * (.6 + .4 * Math.sin(t * 3)), CY);
}
function sBuild(c, t) {
  const fade = 1 - prog(t, C1.start - .3, C1.start); if (fade <= 0) return;
  c.save(); c.globalAlpha *= fade;
  room(c);
  const mt = MT(), mg = {}; ORDER.forEach(k => mg[k] = prog(t, mt[k], mt[k] + .55));
  // 現在是第幾步、候選是誰
  let step = 0; ORDER.forEach((k, i) => { if (t >= mt[k] + .3) step = i + 1; });
  const nextK = ORDER[step], cand = nextK && t > mt[nextK] - .7 && t < mt[nextK] + .3 ? [IN[nextK][3], IN[nextK][4]] : [];
  const b1 = B1.start, b2 = L.b2.start, b3 = L.b3.start;
  drawTree(c, t, { lf: prog(t, A1.start + .2, A1.start + 1.6), mg, cand, bits: prog(t, b1 + .3, b1 + 1.0), codes: prog(t, b2 + .2, b2 + .8), path: prog(t, b2 + .3, b2 + .7) });
  const pa = prog(t, A1.start + 1.2, A1.start + 1.6) * (1 - prog(t, b1 - .2, b1 + .1));
  pool(c, t, Math.min(step, 5), pa);
  const ra = prog(t, b1 + .3, b1 + .7) * (1 - prog(t, b2, b2 + .3));
  if (ra > 0) { S.label(c, '左 0', 380, 290, { size: 66, w: 700, color: VI, a: ra }); S.label(c, '右 1', 700, 290, { size: 66, w: 700, color: AM, a: ra }); }
  const ca = prog(t, b2 + .5, b2 + .9) * (1 - prog(t, b3, b3 + .3));
  if (ca > 0) { S.label(c, 'a = 0', 360, 290, { size: 62, w: 700, color: GR, a: ca }); S.label(c, 'f = 1100', 720, 290, { size: 62, w: 700, color: AM, a: ca }); }
  const sa = prog(t, b3 + .3, b3 + .7);
  if (sa > 0) { S.label(c, '01011100', CX, 260, { size: 70, w: 700, color: INK, a: sa * (1 - prog(t, b3 + 1.6, b3 + 1.9)) }); const sp = prog(t, b3 + 1.6, b3 + 2.0); if (sp > 0) { S.label(c, '0 | 101 | 1100', CX, 260, { size: 64, w: 700, color: CY, a: sp }); S.label(c, 'a　b　f', CX, 350, { size: 60, w: 700, color: GR, a: prog(t, b3 + 2.1, b3 + 2.5) }); } }
  c.restore();
}
function sCost(c, t) {
  const endDim = 1 - prog(t, Ec.start - .2, Ec.start + .4); if (endDim <= 0) return;
  c.save(); c.globalAlpha *= endDim;
  room(c);
  const c1 = C1.start, c2 = L.c2.start, c3 = L.c3.start;
  const mg = {}; ORDER.forEach(k => mg[k] = 1);
  const swap = prog(t, c2 + .3, c2 + 1.3) * (1 - prog(t, c3 + .1, c3 + 1.1));
  drawTree(c, t, { a: prog(t, c1, c1 + .3), mg, swap, bits: 1, codes: 1 - prog(t, c2 + .1, c2 + .3) + prog(t, c3 + 1.1, c3 + 1.4) });
  const ca = prog(t, c1 + .3, c1 + .7) * (1 - prog(t, c2 + .1, c2 + .4));
  if (ca > 0) { S.label(c, '45×1 + 41×3 + 14×4', CX, 200, { size: 44, a: .8 * ca }); S.label(c, '= 224', 400, 285, { size: 76, w: 700, color: GR, a: ca }); S.label(c, '300', 720, 285, { size: 76, w: 700, color: CO, a: ca * prog(t, c1 + 1.4, c1 + 1.8) }); S.label(c, '固定 3 位', 720, 345, { size: 32, a: .7 * ca * prog(t, c1 + 1.4, c1 + 1.8) }); }
  const sa = prog(t, c2 + .4, c2 + .8) * (1 - prog(t, c3 + .1, c3 + .4));
  if (sa > 0) { const v = Math.round(lerp(224, 344, E.inOutCubic(prog(t, c2 + .3, c2 + 1.3)))); S.label(c, 'a ↔ f', CX, 200, { size: 46, a: .8 * sa }); S.label(c, String(v), CX, 280, { size: 84, w: 700, color: v > 224 ? CO : GR, a: sa }); S.label(c, '+45×3 − 5×3 = +120', CX, 355, { size: 36, color: CO, a: .8 * sa * prog(t, c2 + 1.4, c2 + 1.8) }); }
  const ga = prog(t, c3 + 1.0, c3 + 1.4);
  if (ga > 0) { S.label(c, '224 最小', CX, 300, { size: 80, w: 700, color: GR, a: ga }); V.glow(c, [IN.n100[0], 0, IN.n100[1]], 1.0, .5 * ga, GR); }
  c.restore();
}
function sExam(c, t) {
  const a = prog(t, Ec.start + .1, Ec.start + .6); if (a <= 0) return;
  c.save(); c.globalAlpha *= a;
  S.label(c, '考試這樣寫', CX, 520, { size: 32, a: .6, ls: '6px' });
  const rows = [['每次合併頻率最小的兩棵', AM, 54], ['成本 = Σ 頻率 × 深度', CY, 54], ['前綴碼、滿二元樹', GR, 54], ['用 heap：O(n lg n)', INK, 54]];
  rows.forEach(([s, col, sz], i) => { const p = E.outCubic(prog(t, Ec.start + .3 + i * .5, Ec.start + .8 + i * .5)); if (p > 0) S.label(c, s, CX, 680 + i * 140 + (1 - p) * 18, { size: sz, w: 700, color: col, a: p }); });
  c.restore();
}

K.scenes([
  { id: 'open', start: 0, end: T.start, draw: sOpen },
  { id: 'title', start: T.start, end: A1.start, draw: sTitle, in: { type: 'cut' } },
  { id: 'build', start: A1.start, end: C1.start, draw: sBuild, color: CY, in: { type: 'iris', dur: .55, x: CX, y: 960 } },
  { id: 'cost', start: C1.start, end: DUR, draw: (c, t) => { sCost(c, t); sExam(c, t); }, color: GR, in: { type: 'iris', dur: .55, x: CX, y: 960 } },
]);
function drawAll(t) { if (t < A1.start) { sOpen(K.ctx, t); sTitle(K.ctx, t); return; } K.drawScenes(t); }
K.amb.keys([
  [0, { haze: .14, stars: .2, dust: .3, cam: .2 }],
  [o1.start + 1, { haze: .18, stars: .26, dust: .45, bokeh: .15, cam: .2 }],
  [T.start, { haze: .2, stars: .3, dust: .5, bokeh: .3, cam: .2 }],
  [A1.start, { haze: .17, stars: .22, dust: .45, bokeh: .2, cam: .2 }],
  [DUR, { haze: .18, stars: .26, dust: .45, bokeh: .25, cam: .2 }],
]);
K.flash(T.start, .1, .35); K.flare(T.start + .05, CX, 680, .85, 1.6);
K.flash(B1.start, .06, .3); K.flash(C1.start, .06, .3);
const TAG = '記憶宮殿 · 演算法館 · 第 5 間  /  ';
S.chapters([[A1.start, TAG + '01 合併'], [B1.start, TAG + '02 編碼'], [C1.start, TAG + '03 為什麼最佳'], [Ec.start, '']]);

function render(t) {
  tNow = t;
  K.begin(t); V.begin(t);
  drawAll(t);
  title(t); S.drawHeroes(t); S.drawChap(t);
  K.end(t);
}
const mt = MT(), b1 = B1.start, b2 = L.b2.start, b3 = L.b3.start, c1 = C1.start, c2 = L.c2.start, c3 = L.c3.start;
M.film({
  width: W, height: H, fps: FPS, duration: DUR, stage, render,
  scenes: TIMING.lines.map((l, i) => ({ id: l.id, start: l.start, end: TIMING.lines[i + 1]?.start ?? DUR, label: l.id })),
  cues: [
    ...ORDER.map((k, i) => ({ t: .6 + i * .4, sfx: 'pop', gain: -13 })),
    { t: T.start, sfx: 'riser', align: 'end', gain: -10 },
    { t: T.start, sfx: 'impact', gain: -3 },
    ...[0, 1, 2, 3, 4, 5].map(i => ({ t: A1.start + .2 + i * .14, sfx: 'tick', gain: -14 })),
    ...ORDER.map((k, i) => ({ t: mt[k], sfx: i === 4 ? 'impact' : 'thump', gain: i === 4 ? -7 : -10 })),
    ...ORDER.map(k => ({ t: mt[k] - .7, sfx: 'tick', gain: -12 })),
    { t: b1 + .3, sfx: 'swish', gain: -11 }, { t: b2 + .3, sfx: 'chime', gain: -9 },
    { t: b3 + .3, sfx: 'pop', gain: -11 }, { t: b3 + 1.6, sfx: 'swish', gain: -10 }, { t: b3 + 2.1, sfx: 'chime', gain: -9 },
    { t: c1 + .3, sfx: 'tick', gain: -10 }, { t: c1 + 1.4, sfx: 'tick', gain: -10 },
    { t: c2 + .3, sfx: 'whoosh', gain: -10 }, { t: c2 + 1.3, sfx: 'glitch', gain: -9 },
    { t: c3 + .1, sfx: 'whoosh', gain: -11 }, { t: c3 + 1.1, sfx: 'chime', gain: -8 },
    { t: Ec.start + .2, sfx: 'chime', gain: -8 },
  ],
});
</script>
</body>
</html>
