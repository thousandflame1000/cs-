<!doctype html>

<meta charset="utf-8">
<title>fork 會生幾個行程</title>
<!--
  資工所衝刺 · 短影音 17：fork 會生幾個行程——行程像細胞一樣分裂
  記憶宮殿：作業系統館 · 第 3 間。每次 fork，所有行程沿一個新的軸分裂：第 1 次沿 x、第 2 次沿 y、第 3 次沿 z，
  三次之後 8 個行程剛好站在立方體的 8 個頂點上（頂點座標 = 哪幾次 fork 拿到 0）。
  接著 fork() && fork() || fork() 的 5 個行程樹、copy-on-write 的實體頁複製。
-->
<style>
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Thin.otf'); font-weight: 100; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-ExtraLight.otf'); font-weight: 200; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Light.otf'); font-weight: 300; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Regular.otf'); font-weight: 400; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Text.otf'); font-weight: 450; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Medium.otf'); font-weight: 500; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-SemiBold.otf'); font-weight: 600; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Bold.otf'); font-weight: 700; }
  @font-face { font-family: 'Plex'; src: url('fonts/MathFB.ttf'); font-weight: 100 550; unicode-range: U+00B2-00B3, U+00B9, U+00BC-00BE, U+00D7, U+00F7, U+02B0-02FF, U+1D00-1DBF, U+2070-209F, U+2190-21FF, U+2200-22FF, U+2308-230B, U+2713-2717; }
  @font-face { font-family: 'Plex'; src: url('fonts/MathFB-Bold.ttf'); font-weight: 551 900; unicode-range: U+00B2-00B3, U+00B9, U+00BC-00BE, U+00D7, U+00F7, U+02B0-02FF, U+1D00-1DBF, U+2070-209F, U+2190-21FF, U+2200-22FF, U+2308-230B, U+2713-2717; }
  html, body { margin: 0; background: #000; overflow: hidden; }

<body>
<div id="stage"><div id="world"></div></div>
<script src="motion.js"></script>
<script src="kit.js"></script>
<script src="cs.js"></script>
<script src="space.js"></script>
<script src="timing.js"></script>
<script>
const W = 1080, H = 1920, FPS = 60, DUR = TIMING.total, CX = W / 2;
const stage = document.getElementById('stage');
const { prog, ease: E, lerp, clamp } = M;

const BG = '#04080a', INK = '#eef3fa', GR = '#6ee7a8', CY = '#5be7ff', AM = '#ffc14d', PK = '#ff9ad5', CO = '#ff6a5c';
const K = Kit({ W, H, stage, duration: DUR, seed: 171, vignette: .62, grain: .16, bloom: .95,
  palette: { bg: BG, ink: INK, sub: '#8a98a6', accent: GR, accent2: CY } });
K.warm([GR, CY, AM, PK, CO, INK]);
K.hud.show = false;
const S = CS(K, { stage });
const V = Space(K, S, { cy: H * .46, fogNear: 10, fogFar: 26 });
K.caption.set(TIMING.lines, {
  y: 1452, size: 54, maxW: W * .88, hookSize: 112, hookY: 1170, hookMaxW: W * .9, shade: .5,
  colors: { 8: GR, 複製: GR, 0: CY, 下一行: AM, 所有: GR, 立方體: GR, 14: AM, 短路: CO, 第三個: CY, 5: PK, 看不到: AM, 寫入: CO },
});
const o1 = L.o1, o2 = L.o2, T = L.T, Ec = L.E, A1 = L.a1, B1 = L.b1, C1 = L.c1, D1 = L.d1;
const add = (a, b) => a.map((v, i) => v + b[i]), mul = (a, k) => a.map((v) => v * k), mix3 = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
const room = (c, a = 1) => V.floor(c, { n: 10, step: 1, color: GR, a: .7 * a, major: 3 });
const pulse = (t, t0) => Math.exp(-Math.max(0, t - t0) * 4) * (t >= t0 ? 1 : 0);
/** 一個行程＝一顆細胞 */
function cell(c, p, col, a = 1, o = {}) {
  if (a <= .003) return;
  const r = (o.r ?? .3) * (1 + .25 * (o.pulse || 0));
  V.glow(c, p, r * 3.2, .35 * a, col);
  V.orb(c, p, r, { color: col, a, atmo: .7, spec: .6, rim: .9, nucleus: { r: .34, color: K.mix(col, '#ffffff', .35) }, membrane: true, t: o.t || 0 });
  if (o.name) V.label(c, o.name, add(p, [0, 0, r + .26]), { size: .22, w: 700, color: col, a, minPx: 20, maxPx: 52 });
}

// ═════════ 立方體分裂：bits 第 k 位 = 第 k 次 fork 時「我是子行程」
const C0 = [0, .4, 2.4], HALF = 1.25, AX = [[1, 0, 0], [0, 1, 0], [0, 0, 1]], GEN = [GR, CY, AM, PK];
const pop = (b) => (b & 1) + ((b >> 1) & 1) + ((b >> 2) & 1), hi = (b) => (b >= 4 ? 2 : b >= 2 ? 1 : 0);
function cubeAt(t, F, dur) {
  const pk = F.map((f) => E.inOutCubic(prog(t, f, f + dur)));
  const P = [];
  for (let b = 0; b < 8; b++) {
    let ok = true, p = C0.slice();
    for (let k = 0; k < 3; k++) { if ((b >> k) & 1 && pk[k] <= 0) ok = false; p = add(p, mul(AX[k], ((b >> k) & 1 ? 1 : -1) * HALF * pk[k])); }
    P.push(ok ? p : null);
  }
  return { P, pk };
}
function drawCube(c, t, F, dur, a = 1, o = {}) {
  const { P, pk } = cubeAt(t, F, dur);
  // 樹邊：子行程 b 的父 = b 去掉最高位
  for (let b = 1; b < 8; b++) if (P[b]) { const par = b ^ (1 << hi(b)); V.line(c, P[par], P[b], { color: GEN[pop(b)], a: .55 * a * pk[hi(b)], w: 2.4 }); }
  if (o.wire > 0) for (let b = 0; b < 8; b++) for (let k = 0; k < 3; k++) if (!((b >> k) & 1) && P[b] && P[b | (1 << k)]) V.line(c, P[b], P[b | (1 << k)], { color: INK, a: .22 * o.wire * a, w: 1.2, plain: true });
  const items = [];
  for (let b = 0; b < 8; b++) if (P[b]) items.push({ p: P[b], draw: () => cell(c, P[b], GEN[pop(b)], a * (b ? clamp(pk[hi(b)] * 4) : 1), { pulse: o.flash ? o.flash(b) : 0, t }) });
  V.sorted(items);
  return P;
}
const FO = [o2.start + .15, o2.start + .55, o2.start + .95];

// ═════════ 程式碼面板（畫面座標）
function code(c, lines, a = 1, o = {}) {
  if (a <= .003) return;
  const x0 = o.x ?? 200, y0 = o.y ?? 270, gap = o.gap ?? 64;
  c.save(); c.globalAlpha *= a;
  const w = o.w ?? 680, h = gap * lines.length + 34;
  c.fillStyle = K.rgba('#0b1412', .62); c.strokeStyle = K.rgba(GR, .35); c.lineWidth = 1.5;
  c.beginPath(); c.roundRect(x0 - 40, y0 - gap / 2 - 17, w, h, 18); c.fill(); c.stroke();
  lines.forEach((s, i) => { if (s == null) return; const [txt, col, al] = Array.isArray(s) ? s : [s, INK, 1]; S.label(c, txt, x0, y0 + i * gap, { size: o.size ?? 42, w: 500, color: col, a: al, align: 'left' }); });
  (o.ptr || []).forEach(([row, col, pa, dx]) => { if (pa <= .003) return; const y = y0 + row * gap, x = x0 - 22 + (dx || 0); c.fillStyle = K.rgba(col, pa); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 18, y - 11); c.lineTo(x - 18, y + 11); c.closePath(); c.fill(); });
  c.restore();
}

// ═════════ 鏡頭
const TA = [0, .4, 2.6];
V.camKeys([
  [0, V.orbit(-34, 9.8, 3.6, C0, 44)], [T.start, V.orbit(-4, 10.6, 4.4, C0, 44)],
  [A1.start, V.orbit(-14, 9.2, 2.8, TA, 44)], [L.a3.end, V.orbit(12, 9.2, 3.0, TA, 44)],
  [B1.start + .3, V.orbit(-36, 11.8, 5.8, [0, .4, 2.75], 44)], [L.b2.end, V.orbit(-8, 12.0, 5.4, [0, .4, 2.75], 44)], [L.b3.end, V.orbit(20, 12.0, 5.0, [0, .4, 2.75], 44)],
  [C1.start + .3, V.orbit(-12, 10.6, 3.0, [0, .4, 2.3], 44)], [L.c4.end, V.orbit(12, 10.6, 3.4, [0, .4, 2.3], 44)],
  [D1.start + .3, V.orbit(-12, 9.2, 2.6, [0, .4, 2.2], 44)], [DUR, V.orbit(10, 9.6, 3.0, [0, .4, 2.2], 44)],
]);

// ═════════ 場景
function sOpen(c, t) {
  const out = 1 - prog(t, T.start - .4, T.start + .05, E.inCubic); if (out <= 0) return;
  c.save(); c.globalAlpha *= out * prog(t, -.4, o1.start + .3);
  room(c);
  drawCube(c, t, FO, .38, 1, { flash: (b) => pulse(t, FO[hi(b)] + .1) * (b ? 1 : 0), wire: prog(t, FO[2] + .4, FO[2] + 1) });
  c.restore();
}
const title = S.titleCard(T, { kick: '作業系統 · 行程', big: 'fork()', size: 200, y: 600, en: 'HOW  MANY  PROCESSES  DOES  FORK  MAKE', q: '一次複製一份，次數一多就爆炸', qGap: 330, color: GR });
function sTitle(c, t) {
  const a = prog(t, T.start - .2, T.start + .3) * (1 - prog(t, T.end - .1, T.end + .35)); if (a <= 0) return;
  c.save(); c.globalAlpha *= a * .16; room(c); drawCube(c, 99, FO, .38, 1, { wire: 1 }); c.restore();
  K.core(c, CX, 700, 9, a * (.6 + .4 * Math.sin(t * 3)), GR);
}
// a：一次 fork
const FA = A1.start + 1.0;
function sOne(c, t) {
  room(c);
  const k = E.inOutCubic(prog(t, FA, FA + 1.0));
  const P0 = add(C0, [-1.0 * k, 0, 0]), P1 = add(C0, [1.0 * k, 0, 0]);
  const born = clamp(k * 4);
  if (born > 0) V.line(c, P0, P1, { color: CY, a: .5 * born, w: 2.4 });
  cell(c, P0, GR, prog(t, A1.start - .1, A1.start + .4), { r: .36, pulse: pulse(t, FA), name: 'PID 100', t });
  if (born > 0) cell(c, P1, CY, born, { r: .36, name: 'PID 101', t });
  const rv = prog(t, L.a2.start + .2, L.a2.start + .7), rc = prog(t, L.a2.start + 1.0, L.a2.start + 1.5);
  V.label(c, 'fork() = 101', add(P0, [0, 0, -.72]), { size: .24, w: 700, color: AM, a: rv, minPx: 24, maxPx: 60 });
  V.label(c, 'fork() = 0', add(P1, [0, 0, -.72]), { size: .24, w: 700, color: CY, a: rc, minPx: 24, maxPx: 60 });
  // a3：兩個都印 hi
  for (const [p, col, t0] of [[P0, AM, L.a3.start + 1.1], [P1, CY, L.a3.start + 1.3]]) {
    const q = prog(t, t0, t0 + 1.6); if (q <= 0 || q >= 1) continue;
    V.label(c, 'hi', add(p, [0, 0, .75 + q * .6]), { size: .34, w: 700, color: col, a: Math.sin(q * Math.PI), minPx: 26, maxPx: 80 });
  }
  const ca = prog(t, A1.start + .2, A1.start + .7), mv = E.inOutCubic(prog(t, L.a3.start + .2, L.a3.start + .8));
  code(c, ['pid = fork();', 'printf("hi\\n");'], ca, { ptr: [[mv, GR, 1 - clamp(k * 3)], [mv, AM, clamp(k * 3)], [mv, CY, clamp(k * 3), -26]] });
}
// b：迴圈 fork 三次
const FB = [B1.start + .9, B1.start + 2.5, L.b2.start + .25], RB = [L.b3.start + .5, L.b3.start + 1.4, L.b3.start + 2.3];
function sLoop(c, t) {
  room(c);
  const fl = (b) => { let f = 0; for (let k = 0; k < 3; k++) if (b < (2 << k)) f = Math.max(f, pulse(t, RB[k])); return f; };
  const P = drawCube(c, t, FB, .9, prog(t, B1.start - .1, B1.start + .3), { flash: fl, wire: prog(t, L.b2.start + 1.3, L.b2.start + 2.0) });
  // printf 冒出來的 x
  for (let k = 0; k < 3; k++) for (let b = 0; b < (2 << k); b++) {
    const q = prog(t, RB[k], RB[k] + 1.3); if (q <= 0 || q >= 1 || !P[b]) continue;
    V.label(c, 'x', add(P[b], [0, 0, .55 + q * .9]), { size: .3, w: 700, color: AM, a: Math.sin(q * Math.PI), minPx: 22, maxPx: 70 });
  }
  const wl = prog(t, L.b2.start + 1.6, L.b2.start + 2.2);
  if (wl > 0) S.label(c, '頂點座標 = 哪幾次 fork 拿到 0', CX, 1350, { size: 36, w: 600, color: INK, a: .85 * wl * (1 - prog(t, L.b3.start, L.b3.start + .4)) });
  const inb3 = prog(t, L.b3.start - .1, L.b3.start + .4);
  code(c, ['for (i = 0; i < 3; i++)', ['    fork();', INK, 1 - inb3], inb3 > 0 ? ['    { fork(); printf("x"); }', AM, inb3] : null], prog(t, B1.start + .1, B1.start + .6), { w: 760, x: 190 });
  // 計數
  const n = FB.filter((f) => t >= f + .45).length, seq = ['1', '2', '4', '8'].slice(0, n + 1).join('  →  ');
  if (inb3 < 1) S.label(c, seq, CX, 500, { size: 64, w: 700, color: GR, a: prog(t, B1.start + .4, B1.start + .8) * (1 - inb3) });
  const sums = ['2', '2 + 4', '2 + 4 + 8 = 14'], m = RB.filter((r) => t >= r).length;
  if (m > 0) S.label(c, sums[m - 1], CX, 500, { size: m === 3 ? 72 : 64, w: 700, color: m === 3 ? AM : INK, a: inb3 });
}
// c：fork() && fork() || fork()
const TR = { R: [0, .4, 4.05], A: [-1.45, .1, 2.65], B: [1.45, .8, 2.65], C: [-1.7, .6, 1.2], D: [1.7, .2, 1.2] };
const TC = { R: GR, A: CY, B: AM, C: PK, D: PK };
const SP = { A: L.c2.start + .25, B: L.c2.start + 1.35, C: L.c3.start + 1.1, D: L.c3.start + 2.2 };
const PAR = { A: 'R', B: 'R', C: 'A', D: 'B' }, VIA = { A: 1, B: 2, C: 3, D: 3 };
function sAndOr(c, t) {
  room(c);
  const items = [];
  for (const id of ['R', 'A', 'B', 'C', 'D']) {
    const k = id === 'R' ? prog(t, C1.start + .3, C1.start + .8) : E.outCubic(prog(t, SP[id], SP[id] + .8)); if (k <= 0) continue;
    const p = id === 'R' ? TR.R : mix3(TR[PAR[id]], TR[id], k);
    if (id !== 'R') { V.line(c, TR[PAR[id]], p, { color: TC[id], a: .6 * k, w: 2.6 }); const mid = mix3(TR[PAR[id]], p, .5); V.label(c, '#' + VIA[id], add(mid, [0, 0, .18]), { size: .2, w: 700, color: TC[id], a: k, minPx: 18, maxPx: 44 }); }
    const fl = id === 'R' ? Math.max(pulse(t, SP.A), pulse(t, SP.B)) : id === 'A' ? pulse(t, SP.C) : id === 'B' ? pulse(t, SP.D) : 0;
    const cnt = prog(t, L.c4.start + .1 + 'RABCD'.indexOf(id) * .18, L.c4.start + .5 + 'RABCD'.indexOf(id) * .18);
    items.push({ p, draw: () => { cell(c, p, TC[id], clamp(k * 3), { r: .32, pulse: fl + .6 * pulse(t, L.c4.start + .1 + 'RABCD'.indexOf(id) * .18), t }); if (cnt > 0) V.label(c, String('RABCD'.indexOf(id) + 1), add(p, [.5, 0, .34]), { size: .36, w: 700, color: '#ffffff', a: cnt, minPx: 30, maxPx: 84 }); } });
  }
  V.sorted(items);
  const note = (k, s, col, t0) => { const a = prog(t, t0, t0 + .5) * (1 - prog(t, L.c4.start, L.c4.start + .4)); if (a > 0) S.label(c, s, CX, 1250 + k * 54, { size: 34, w: 600, color: col, a }); };
  note(0, '原行程：#1 真 && #2 真 → ∣∣ 短路', GR, L.c2.start + 2.2);
  note(1, '#1 的子：得 0 → && 短路 → 跑 #3', CY, L.c3.start + .1);
  note(2, '#2 的子：#1 真、#2 得 0 → 跑 #3', AM, L.c3.start + 1.6);
  const tot = prog(t, L.c4.start + .9, L.c4.start + 1.3); if (tot > 0) S.label(c, '共 5 個行程', CX, 1300, { size: 64, w: 700, color: PK, a: tot });
  // 程式碼：三個 fork 依序被誰執行
  const ca = prog(t, C1.start + .1, C1.start + .6); if (ca <= 0) return;
  c.save(); c.globalAlpha *= ca;
  c.fillStyle = K.rgba('#0b1412', .62); c.strokeStyle = K.rgba(GR, .35); c.lineWidth = 1.5; c.beginPath(); c.roundRect(110, 236, 860, 150, 18); c.fill(); c.stroke();
  const TK = [['fork()', 230, 1], ['&&', 375, 0], ['fork()', 520, 2], ['∣∣', 665, 0], ['fork()', 810, 3]];
  const run = [[1, GR, SP.A - .1], [2, GR, SP.B - .1], [3, CY, SP.C - .1], [3, AM, SP.D - .1]];
  TK.forEach(([s, x, id]) => {
    let col = INK, gl = 0; for (const [k, cc, t0] of run) if (k === id && t >= t0) { col = cc; gl = pulse(t, t0); }
    S.label(c, s, x, 296, { size: 44, w: 600, color: col, a: 1 });
    if (id) S.label(c, '#' + id, x, 350, { size: 26, w: 600, color: col, a: .7 });
    if (gl > 0) K.halo(c, x, 296, 90, .3 * gl, col);
  });
  const st = prog(t, L.c2.start + 2.2, L.c2.start + 2.6); // || 短路（原行程）
  if (st > 0) { c.strokeStyle = K.rgba(CO, st); c.lineWidth = 4; c.beginPath(); c.moveTo(640, 296); c.lineTo(640 + 340 * st, 296); c.stroke(); }
  c.restore();
}
// d：copy-on-write
function sCow(c, t) {
  const endDim = 1 - prog(t, Ec.start - .2, Ec.start + .4); if (endDim <= 0) return;
  c.save(); c.globalAlpha *= endDim;
  room(c);
  const PP = [-1.35, .4, 3.4], PC = [1.35, .4, 3.4];
  const w = E.inOutCubic(prog(t, D1.start + 1.3, D1.start + 2.1));
  const pg0 = mix3([0, .4, .9], [-1.35, .4, .9], w), pg1 = mix3([0, .4, .9], [1.35, .4, .9], w);
  const a0 = prog(t, D1.start - .1, D1.start + .4);
  // 實體頁
  V.pillar(c, add(pg0, [0, 0, -.18]), .9, .36, GR, a0, { fill: .5 });
  if (w > 0) V.pillar(c, add(pg1, [0, 0, -.18]), .9, .36, CO, clamp(w * 3), { fill: .5 });
  V.label(c, w > .5 ? '實體頁 x = 5' : '實體頁 x = 5（共享）', add(pg0, [0, 0, -.62]), { size: .24, w: 700, color: GR, a: a0, minPx: 22, maxPx: 56 });
  if (w > .5) V.label(c, '實體頁 x = 6', add(pg1, [0, 0, -.62]), { size: .24, w: 700, color: CO, a: prog(t, D1.start + 1.8, D1.start + 2.2), minPx: 22, maxPx: 56 });
  // 頁表映射
  V.line(c, PP, add(pg0, [0, 0, .2]), { color: GR, a: .55 * a0, w: 2 });
  V.line(c, PC, add(w > 0 ? pg1 : pg0, [0, 0, .2]), { color: w > 0 ? CO : GR, a: .55 * a0, w: 2 });
  cell(c, PP, GR, a0, { r: .34, name: '父', t });
  cell(c, PC, CY, a0, { r: .34, name: '子', pulse: pulse(t, D1.start + 1.2), t });
  const wr = prog(t, D1.start + .7, D1.start + 1.1) * (1 - prog(t, D1.start + 2.4, D1.start + 2.8));
  if (wr > 0) V.label(c, 'x = 6;', add(PC, [-.55, 0, .1]), { size: .28, w: 700, color: CO, a: wr, align: 'right', minPx: 24, maxPx: 70 });
  const va = prog(t, L.d2.start + .6, L.d2.start + 1.1);
  for (const p of [PP, PC]) V.label(c, '&x = 0x7ff0', add(p, [0, 0, -.62]), { size: .2, w: 600, color: INK, a: .8 * va, minPx: 20, maxPx: 48 });
  if (va > 0) S.label(c, '虛擬位址相同，實體頁不同', CX, 330, { size: 46, w: 700, color: AM, a: va });
  c.restore();
}
function sExam(c, t) {
  const a = prog(t, Ec.start + .1, Ec.start + .6); if (a <= 0) return;
  c.save(); c.globalAlpha *= a;
  S.label(c, '考試這樣寫', CX, 520, { size: 32, a: .6, ls: '6px' });
  const rows = [['父拿 PID，子拿 0', CY, 58], ['fork n 次 → 2ⁿ 個', GR, 58], ['&& ∣∣ 會短路', PK, 58], ['寫入才複製', INK, 54]];
  rows.forEach(([s, col, sz], i) => { const p = E.outCubic(prog(t, Ec.start + .3 + i * .5, Ec.start + .8 + i * .5)); if (p > 0) S.label(c, s, CX, 680 + i * 140 + (1 - p) * 18, { size: sz, w: 700, color: col, a: p }); });
  c.restore();
}

K.scenes([
  { id: 'open', start: 0, end: T.start, draw: sOpen },
  { id: 'title', start: T.start, end: A1.start, draw: sTitle, in: { type: 'cut' } },
  { id: 'one', start: A1.start, end: B1.start, draw: sOne, color: GR, in: { type: 'iris', dur: .55, x: CX, y: 860 } },
  { id: 'loop', start: B1.start, end: C1.start, draw: sLoop, color: GR, in: { type: 'cut' } },
  { id: 'andor', start: C1.start, end: D1.start, draw: sAndOr, color: PK, in: { type: 'cut' } },
  { id: 'cow', start: D1.start, end: DUR, draw: (c, t) => { sCow(c, t); sExam(c, t); }, color: GR, in: { type: 'iris', dur: .55, x: CX, y: 860 } },
]);
function drawAll(t) { if (t < A1.start) { sOpen(K.ctx, t); sTitle(K.ctx, t); return; } K.drawScenes(t); }
K.amb.keys([
  [0, { haze: .12, stars: .2, dust: .3, cam: .2 }],
  [o1.start + 1, { haze: .17, stars: .26, dust: .45, bokeh: .15, cam: .2 }],
  [T.start, { haze: .2, stars: .3, dust: .5, bokeh: .3, cam: .2 }],
  [A1.start, { haze: .17, stars: .22, dust: .45, bokeh: .2, cam: .2 }],
  [DUR, { haze: .18, stars: .26, dust: .45, bokeh: .25, cam: .2 }],
]);
K.flash(T.start, .1, .35); K.flare(T.start + .05, CX, 680, .85, 1.6);
K.flash(B1.start, .06, .3); K.flash(C1.start, .06, .3);
S.chapters([[A1.start, '記憶宮殿 · 作業系統館 · 第 3 間  /  01 一次 fork'], [B1.start, '記憶宮殿 · 作業系統館 · 第 3 間  /  02 迴圈'], [C1.start, '記憶宮殿 · 作業系統館 · 第 3 間  /  03 短路求值'], [D1.start, '記憶宮殿 · 作業系統館 · 第 3 間  /  04 copy-on-write'], [Ec.start, '']]);

function render(t) {
  K.begin(t); V.begin(t);
  drawAll(t);
  title(t); S.drawHeroes(t); S.drawChap(t);
  K.end(t);
}
M.film({
  width: W, height: H, fps: FPS, duration: DUR, stage, render,
  scenes: TIMING.lines.map((l, i) => ({ id: l.id, start: l.start, end: TIMING.lines[i + 1]?.start ?? DUR, label: l.id })),
  cues: [
    { t: o1.start + .2, sfx: 'chime', gain: -12 },
    ...FO.map((f) => ({ t: f, sfx: 'swish', gain: -12 })),
    { t: T.start, sfx: 'riser', align: 'end', gain: -10 },
    { t: T.start, sfx: 'impact', gain: -3 },
    { t: A1.start, sfx: 'whoosh', gain: -11 },
    { t: FA, sfx: 'swish', gain: -10 },
    { t: L.a3.start + 1.1, sfx: 'tick', gain: -12 }, { t: L.a3.start + 1.3, sfx: 'tick', gain: -12 },
    { t: B1.start, sfx: 'whoosh', gain: -11 },
    ...FB.map((f) => ({ t: f, sfx: 'swish', gain: -10 })),
    ...RB.map((r) => ({ t: r, sfx: 'tick', gain: -10 })),
    { t: C1.start, sfx: 'whoosh', gain: -11 },
    ...Object.values(SP).map((s) => ({ t: s, sfx: 'swish', gain: -11 })),
    { t: L.c2.start + 2.2, sfx: 'glitch', gain: -10 },
    { t: L.c4.start + .1, sfx: 'impact', gain: -6 },
    { t: D1.start, sfx: 'whoosh', gain: -11 },
    { t: D1.start + 1.3, sfx: 'swish', gain: -10 },
    { t: Ec.start + .2, sfx: 'chime', gain: -8 },
  ],
});
