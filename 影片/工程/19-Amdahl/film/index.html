<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Amdahl 定律</title>
<!--
  資工所衝刺 · 短影音 19：Amdahl 定律——時間條上不能加速的那一段
  記憶宮殿：計組館 · 第 3 間。執行時間是一條躺在地上的 3D 時間條：珊瑚色＝不能加速、青色＝能加速。
  青色壓扁 100 倍，總長只剩 2.08 → 快 4.8 倍；壓到 0 也只剩珊瑚色 → 上限 5。牆上的曲線往 5 爬但碰不到。
  開 1000 核：地上一大片核心，青色變細，加速停在 9.9。Gustafson：時間不變、青色一層層往上疊 → 近線性。
  畫面上只有數字，公式交給字幕與考試卡。
-->
<style>
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Thin.otf'); font-weight: 100; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-ExtraLight.otf'); font-weight: 200; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Light.otf'); font-weight: 300; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Regular.otf'); font-weight: 400; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Text.otf'); font-weight: 450; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Medium.otf'); font-weight: 500; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-SemiBold.otf'); font-weight: 600; }
  @font-face { font-family: 'Plex'; src: url('fonts/IBMPlexSansTC-Bold.otf'); font-weight: 700; }
  @font-face { font-family: 'Plex'; src: url('fonts/MathFB.ttf'); font-weight: 100 550; unicode-range: U+00B2-00B3, U+00B9, U+00BC-00BE, U+00D7, U+00F7, U+02B0-02FF, U+1D00-1DBF, U+2070-209F, U+2190-21FF, U+2200-22FF, U+2308-230B, U+2713-2717; }
  @font-face { font-family: 'Plex'; src: url('fonts/MathFB-Bold.ttf'); font-weight: 551 900; unicode-range: U+00B2-00B3, U+00B9, U+00BC-00BE, U+00D7, U+00F7, U+02B0-02FF, U+1D00-1DBF, U+2070-209F, U+2190-21FF, U+2200-22FF, U+2308-230B, U+2713-2717; }
  html, body { margin: 0; background: #000; overflow: hidden; }
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<script src="motion.js"></script>
<script src="kit.js"></script>
<script src="cs.js"></script>
<script src="space.js"></script>
<script src="timing.js"></script>
<script>
const W = 1080, H = 1920, FPS = 60, DUR = TIMING.total, CX = W / 2;
const stage = document.getElementById('stage');
const { prog, ease: E, lerp, clamp } = M;

const BG = '#06060b', INK = '#eef3fa', CO = '#ff6a5c', CY = '#5be7ff', AM = '#ffc14d', GR = '#6ee7a8';
const K = Kit({ W, H, stage, duration: DUR, seed: 191, vignette: .62, grain: .16, bloom: .95,
  palette: { bg: BG, ink: INK, sub: '#8a98a6', accent: CO, accent2: CY } });
K.warm([CO, CY, AM, GR, INK]);
K.hud.show = false;
const S = CS(K, { stage });
const V = Space(K, S, { cy: H * .5, fogNear: 9, fogFar: 26 });
K.caption.set(TIMING.lines, {
  y: 1452, size: 54, maxW: W * .88, hookSize: 112, hookY: 1170, hookMaxW: W * .9, shade: .5,
  colors: { '5 倍': CO, 不能加速的: CO, '100 倍': CY, '4.8 倍': AM, 不能加速的比例: CO, 5: CO, '10 倍': CO, 'N 倍': GR, 線性: GR },
});
const o1 = L.o1, o2 = L.o2, T = L.T, Ec = L.E, A1 = L.a1, B1 = L.b1, C1 = L.c1, D1 = L.d1;
const room = (c, a = 1) => V.floor(c, { n: 10, step: 1, color: CO, a: .55 * a, major: 3 });
let tNow = 0;

/** 長方體：只畫朝向鏡頭的面 */
function box(c, x0, x1, y0, y1, z0, z1, col, a = 1, fill = .5) {
  if (a <= .003 || x1 - x0 < .002 || z1 - z0 < .002) return;
  const cam = V.camAt(tNow).pos, mid = [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2];
  const F = [
    { n: [0, -1, 0], q: [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], k: .55 },
    { n: [1, 0, 0], q: [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], k: .38 },
    { n: [-1, 0, 0], q: [[x0, y1, z0], [x0, y0, z0], [x0, y0, z1], [x0, y1, z1]], k: .38 },
    { n: [0, 1, 0], q: [[x1, y1, z0], [x0, y1, z0], [x0, y1, z1], [x1, y1, z1]], k: .3 },
    { n: [0, 0, 1], q: [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], k: .95 },
  ];
  for (const f of F) { const d = [cam[0] - mid[0], cam[1] - mid[1], cam[2] - mid[2]]; if (f.n[0] * d[0] + f.n[1] * d[1] + f.n[2] * d[2] <= 0) continue; V.poly(c, f.q, K.rgba(K.mix(col, '#ffffff', f.k * .35), fill * f.k), K.rgba(K.mix(col, '#ffffff', .4), .85), a); }
}
function ghost(c, x0, x1, y0, y1, z1, a) { if (a <= .003) return; const q = [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]]; V.poly(c, q, K.rgba(INK, .03 * a), K.rgba(INK, .35 * a), 1); V.line(c, [x0, y0, 0], [x0, y0, z1], { color: INK, a: .3 * a, w: 1, plain: true }); V.line(c, [x1, y0, 0], [x1, y0, z1], { color: INK, a: .3 * a, w: 1, plain: true }); }
/** 2D 計數：小標＋大數字 */
function counter(c, label, val, col, a, x = CX, y = 300, sz = 84) {
  if (a <= .003) return;
  S.label(c, label, x, y - 50, { size: 30, w: 500, color: INK, a: .6 * a, ls: '4px' });
  S.label(c, val, x, y + 14, { size: sz, w: 700, color: col, a });
}
const fx = (v, d = 1) => (Math.round(v * 10 ** d) / 10 ** d).toFixed(d);

// ═════════ 時間條（f = 0.8）：1 個時間單位 = U 世界單位
const U = .3, X0 = -1.5, BZ = .45, BY = [-.38, .38];
const sq = (t) => { // 青色那段剩幾分之幾
  const a = E.inOutCubic(prog(t, L.a2.start + .4, L.a2.start + 2.6)), b = E.inOutCubic(prog(t, B1.start + .3, B1.start + 1.6));
  return lerp(lerp(1, .01, a), 0, b);
};
function bar(c, t, f, scale, a = 1, o = {}) {
  const ser = (1 - f) * 10 * U, par = f * 10 * U * scale, x1 = X0 + ser, x2 = x1 + par;
  ghost(c, X0, X0 + 10 * U, BY[0], BY[1], BZ, a * (o.ghost ?? 1));
  box(c, X0, x1, BY[0], BY[1], 0, BZ, CO, a);
  box(c, x1 + .005, Math.max(x1 + .006, x2), BY[0], BY[1], 0, BZ, CY, a);
  return { x1, x2 };
}

// ═════════ 鏡頭
const TG = [0, 0, .5];
V.camKeys([
  [0, V.orbit(-30, 7.6, 3.4, [0, 0, -.4], 44)], [T.start, V.orbit(-12, 8.2, 3.8, [0, 0, -.2], 44)],
  [A1.start, V.orbit(-22, 7.4, 3.2, TG, 44)], [L.a3.end, V.orbit(-6, 7.6, 3.4, TG, 44)],
  [B1.start + .3, V.orbit(-14, 7.4, 3.2, TG, 44)], [L.b3.start + .2, V.orbit(-6, 8.2, 2.6, [0, .8, 1.2], 44)], [L.b3.end, V.orbit(6, 8.4, 2.8, [0, .8, 1.2], 44)],
  [C1.start + .3, V.orbit(-18, 7.8, 5.0, [0, .6, .3], 44)], [L.c2.end, V.orbit(4, 8.2, 5.4, [0, .6, .3], 44)],
  [D1.start + .3, V.orbit(-26, 7.6, 3.4, [0, .2, .9], 44)], [L.d2.end, V.orbit(-10, 8.2, 3.8, [0, .2, 1.3], 44)], [L.d3.start + .2, V.orbit(-4, 8.8, 2.6, [0, .8, 1.2], 44)], [DUR, V.orbit(6, 9.0, 2.8, [0, .8, 1.2], 44)],
]);

// ═════════ 場景
function sOpen(c, t) {
  const out = 1 - prog(t, T.start - .4, T.start + .05, E.inCubic); if (out <= 0) return;
  c.save(); c.globalAlpha *= out * prog(t, -.4, .3);
  room(c);
  const k = E.inOutCubic(prog(t, o1.start + .6, o1.start + 1.9));
  bar(c, t, .8, lerp(1, .01, k), 1, { ghost: k });
  const sp = 1 / (.2 + .8 * lerp(1, .01, k));
  counter(c, '加速', fx(sp) + '×', sp > 4 ? AM : INK, prog(t, o1.start + .3, o1.start + .8));
  c.restore();
}
const title = S.titleCard(T, { kick: '計算機組織 · 效能', big: 'Amdahl', size: 190, y: 600, en: "AMDAHL'S  LAW", q: '整體有多快，看最慢的那段', qGap: 330, color: CO });
function sTitle(c, t) {
  const a = prog(t, T.start - .2, T.start + .3) * (1 - prog(t, T.end - .1, T.end + .35)); if (a <= 0) return;
  c.save(); c.globalAlpha *= a * .2; room(c); bar(c, t, .8, .01, 1); c.restore();
  K.core(c, CX, 700, 9, a * (.6 + .4 * Math.sin(t * 3)), CO);
}
function sBar(c, t) {
  room(c);
  const s = sq(t), { x1, x2 } = bar(c, t, .8, s, prog(t, A1.start - .1, A1.start + .4), { ghost: prog(t, L.a2.start + .4, L.a2.start + 1) });
  const la = prog(t, A1.start + .5, A1.start + 1.0) * (1 - prog(t, L.b3.start - .2, L.b3.start + .3));
  V.label(c, '2', [(X0 + x1) / 2, 0, BZ + .35], { size: .34, w: 700, color: CO, a: la, minPx: 26, maxPx: 90 });
  V.label(c, s > .5 ? '8' : s > .005 ? '0.08' : '0', [Math.max((x1 + x2) / 2, x1 + .25), 0, BZ + .35], { size: .34, w: 700, color: CY, a: la, minPx: 26, maxPx: 90 });
  if (s < .6) V.label(c, '10', [X0 + 5 * U, 0, BZ + .95], { size: .26, w: 600, color: INK, a: .6 * prog(t, L.a2.start + 1.4, L.a2.start + 2) * (1 - prog(t, L.b3.start - .2, L.b3.start + .3)), minPx: 22, maxPx: 70 });
  const total = 2 + 8 * s, sp = 10 / total;
  counter(c, '總時間', fx(total, 2), INK, prog(t, A1.start + .3, A1.start + .8), CX - 200);
  counter(c, '加速', fx(sp) + '×', sp > 4.5 ? AM : INK, prog(t, A1.start + .3, A1.start + .8), CX + 200);
  // b2：上限 5
  const cap = prog(t, L.b2.start + .3, L.b2.start + .8) * (1 - prog(t, L.b3.start, L.b3.start + .4));
  if (cap > 0) S.label(c, '上限 5×', CX, 470, { size: 64, w: 700, color: CO, a: cap });
  // b3：牆上的曲線 S(s) = 1 / (0.2 + 0.8/s)，s 從 1 到 1000（對數座標）
  const wa = prog(t, L.b3.start, L.b3.start + .6); if (wa <= 0) return;
  const WY = 1.4, ZS = .42, X = (lg) => -1.5 + lg;
  V.poly(c, [[-1.65, WY, 0], [1.65, WY, 0], [1.65, WY, 2.6], [-1.65, WY, 2.6]], K.rgba('#0d1424', .6 * wa), K.rgba(INK, .18 * wa), 1);
  for (let lg = 0; lg <= 3; lg++) { V.line(c, [X(lg), WY - .01, 0], [X(lg), WY - .01, 2.5], { color: INK, a: .12 * wa, w: 1, plain: true }); V.label(c, String(10 ** lg), [X(lg), WY - .02, -.18], { size: .18, color: INK, a: .6 * wa, minPx: 18, maxPx: 44 }); }
  const asz = 5 * ZS; for (let k = 0; k < 20; k++) V.line(c, [X(k * .15), WY - .02, asz], [X(k * .15 + .08), WY - .02, asz], { color: CO, a: .9 * wa, w: 2.4 });
  V.label(c, '5', [1.8, WY - .02, asz], { size: .3, w: 700, color: CO, a: wa, minPx: 26, maxPx: 80 });
  const pts = []; for (let i = 0; i <= 60; i++) { const lg = i / 20, s2 = 10 ** lg; pts.push([X(lg), WY - .03, ZS / (.2 + .8 / s2)]); }
  const end = V.path(c, pts, { p: E.inOutCubic(prog(t, L.b3.start + .5, L.b3.start + 3.0)), color: AM, w: 3.4 });
  if (end) K.core(c, end[0], end[1], 7, wa, AM);
}
// c：f = 0.9，N 核
const NS = [1, 10, 100, 1000], NT = [C1.start + .4, C1.start + 1.5, C1.start + 2.6, C1.start + 3.5];
function sCores(c, t) {
  room(c);
  let n = 1, k = 0; for (let i = 0; i < 4; i++) if (t >= NT[i]) { n = NS[i]; k = i; }
  const kk = E.outCubic(prog(t, NT[k], NT[k] + .6)), nPrev = NS[Math.max(0, k - 1)], nEff = k ? Math.exp(lerp(Math.log(nPrev), Math.log(n), kk)) : 1;
  const a = prog(t, C1.start - .1, C1.start + .4);
  bar(c, t, .9, 1 / nEff, a, { ghost: prog(t, NT[1], NT[1] + .5) });
  // 核心：地上一大片
  const cols = Math.ceil(Math.sqrt(n * 2.5)), rows = Math.ceil(n / cols), sp = Math.min(.45, 3.0 / cols), gx = -(cols - 1) * sp / 2, gy = .9;
  for (let i = 0; i < n; i++) { const r = Math.floor(i / cols), q = i % cols, ap = clamp((kk * n - i * (k ? 1 : 0) * .5) / Math.max(1, n * .2) + (i < nPrev ? 1 : 0)); if (ap <= 0) continue; const p = [gx + q * sp, gy + r * sp, .05]; if (n <= 100) box(c, p[0] - sp * .32, p[0] + sp * .32, p[1] - sp * .32, p[1] + sp * .32, 0, sp * .5, CY, a * ap, .45); else V.core(c, p, .018, .55 * a * ap, CY); }
  const spd = 1 / (.1 + .9 / nEff);
  counter(c, '核心', String(Math.round(nEff)), CY, a, CX - 200);
  counter(c, '加速', fx(spd) + '×', spd > 9 ? AM : INK, a, CX + 200);
  const cap = prog(t, L.c2.start + .2, L.c2.start + .7);
  if (cap > 0) S.label(c, '上限 10×', CX, 470, { size: 60, w: 700, color: CO, a: cap });
}
// d：Gustafson：時間固定，平行部分的工作量疊 N 層
const GN = [1, 2, 4, 10], GT = [D1.start + .6, D1.start + 1.6, D1.start + 2.6, L.d2.start + .3];
function sGus(c, t) {
  const endDim = 1 - prog(t, Ec.start - .2, Ec.start + .4); if (endDim <= 0) return;
  c.save(); c.globalAlpha *= endDim;
  room(c);
  const a = prog(t, D1.start - .1, D1.start + .4), chart = prog(t, L.d3.start, L.d3.start + .5);
  let n = 1; GT.forEach((g, i) => { if (t >= g) n = GN[i]; });
  const x1 = X0 + U, x2 = X0 + 10 * U, LZ = .2, LS = .25;
  c.save(); c.globalAlpha *= 1 - .8 * chart;
  box(c, X0, x1, BY[0], BY[1], 0, LZ, CO, a);
  for (let L2 = 0; L2 < 10; L2++) { const ap = L2 === 0 ? 1 : prog(t, GT[GN.findIndex((g) => g > L2)] ?? 0, (GT[GN.findIndex((g) => g > L2)] ?? 0) + .5); if (L2 >= n || ap <= 0) continue; const z0 = L2 * LS; box(c, x1 + .005, x2, BY[0], BY[1], z0, z0 + LZ, CY, a * ap, .45); }
  c.restore();
  const big = prog(t, L.d2.start + 1.8, L.d2.start + 2.3), nShow = big > 0 ? Math.round(lerp(10, 100, big)) : n;
  const gs = nShow - .1 * (nShow - 1);
  counter(c, '核心', String(nShow), CY, a * (1 - chart * .0), CX - 200);
  counter(c, '加速', fx(gs) + '×', GR, a, CX + 200);
  if (chart > 0) { // 兩條線：Gustafson 直直往上、Amdahl 停在 10
    const WY = 1.4, X = (lg) => -1.5 + lg / 2 * 3, ZS = .021;
    V.poly(c, [[-1.65, WY, 0], [1.65, WY, 0], [1.65, WY, 2.6], [-1.65, WY, 2.6]], K.rgba('#0d1424', .6 * chart), K.rgba(INK, .18 * chart), 1);
    for (let lg = 0; lg <= 2; lg++) V.label(c, String(10 ** lg), [X(lg), WY - .02, -.18], { size: .18, color: INK, a: .6 * chart, minPx: 18, maxPx: 44 });
    const pg = [], pa = []; for (let i = 0; i <= 40; i++) { const lg = i / 20, N = 10 ** lg; pg.push([X(lg), WY - .03, ZS * (N - .1 * (N - 1)) * 1.2]); pa.push([X(lg), WY - .03, ZS * 1.2 / (.1 + .9 / N)]); }
    const pp = E.inOutCubic(prog(t, L.d3.start + .3, L.d3.start + 2.2));
    V.path(c, pg, { p: pp, color: GR, w: 3.4 }); V.path(c, pa, { p: pp, color: CO, w: 3 });
    V.label(c, 'Gustafson', [.7, WY - .02, 2.45], { size: .22, w: 700, color: GR, a: chart * prog(t, L.d3.start + 1.8, L.d3.start + 2.3), minPx: 20, maxPx: 56 });
    V.label(c, 'Amdahl', [1.1, WY - .02, .55], { size: .22, w: 700, color: CO, a: chart * prog(t, L.d3.start + 1.8, L.d3.start + 2.3), minPx: 20, maxPx: 56 });
  }
  c.restore();
}
function sExam(c, t) {
  const a = prog(t, Ec.start + .1, Ec.start + .6); if (a <= 0) return;
  c.save(); c.globalAlpha *= a;
  S.label(c, '考試這樣寫', CX, 520, { size: 32, a: .6, ls: '6px' });
  const rows = [['上限 = 1 ÷ (1 − f)', CO, 58], ['f = 90% → 不到 10 倍', AM, 54], ['瓶頸是不能加速的那段', INK, 50], ['題目變大 → 近線性', GR, 54]];
  rows.forEach(([s, col, sz], i) => { const p = E.outCubic(prog(t, Ec.start + .3 + i * .5, Ec.start + .8 + i * .5)); if (p > 0) S.label(c, s, CX, 680 + i * 140 + (1 - p) * 18, { size: sz, w: 700, color: col, a: p }); });
  c.restore();
}

K.scenes([
  { id: 'open', start: 0, end: T.start, draw: sOpen },
  { id: 'title', start: T.start, end: A1.start, draw: sTitle, in: { type: 'cut' } },
  { id: 'bar', start: A1.start, end: C1.start, draw: sBar, color: CO, in: { type: 'iris', dur: .55, x: CX, y: 960 } },
  { id: 'cores', start: C1.start, end: D1.start, draw: sCores, color: CY, in: { type: 'cut' } },
  { id: 'gus', start: D1.start, end: DUR, draw: (c, t) => { sGus(c, t); sExam(c, t); }, color: GR, in: { type: 'iris', dur: .55, x: CX, y: 960 } },
]);
function drawAll(t) { if (t < A1.start) { sOpen(K.ctx, t); sTitle(K.ctx, t); return; } K.drawScenes(t); }
K.amb.keys([
  [0, { haze: .14, stars: .2, dust: .3, cam: .2 }],
  [o1.start + 1, { haze: .18, stars: .26, dust: .45, bokeh: .15, cam: .2 }],
  [T.start, { haze: .2, stars: .3, dust: .5, bokeh: .3, cam: .2 }],
  [A1.start, { haze: .17, stars: .22, dust: .45, bokeh: .2, cam: .2 }],
  [DUR, { haze: .18, stars: .26, dust: .45, bokeh: .25, cam: .2 }],
]);
K.flash(T.start, .1, .35); K.flare(T.start + .05, CX, 680, .85, 1.6);
K.flash(C1.start, .06, .3); K.flash(D1.start, .06, .3);
S.chapters([[A1.start, '記憶宮殿 · 計組館 · 第 3 間  /  01 壓扁 100 倍'], [B1.start, '記憶宮殿 · 計組館 · 第 3 間  /  02 上限'], [C1.start, '記憶宮殿 · 計組館 · 第 3 間  /  03 多核'], [D1.start, '記憶宮殿 · 計組館 · 第 3 間  /  04 Gustafson'], [Ec.start, '']]);

function render(t) {
  tNow = t;
  K.begin(t); V.begin(t);
  drawAll(t);
  title(t); S.drawHeroes(t); S.drawChap(t);
  K.end(t);
}
M.film({
