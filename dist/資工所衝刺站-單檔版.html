<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資工所衝刺站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 資工所衝刺站 — 版面：左側索引欄＋右側講義紙；藍筆是可操作、紅筆是批改、螢光筆是考點 */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #18202c;
  --ink-2: #4b5667;
  --line: #d8dee6;
  --accent: #2f4fd8;
  --accent-ink: #ffffff;
  --pen: #d33a2c;
  --hl: #ffeb8a;
  --hl-strong: #f2c200;
  --good: #1d8a4a;
  --warn: #b26a00;
  --bad: #c62f2f;
  --s-ds: #0e8a8c;
  --s-al: #5b47d1;
  --s-co: #d06a14;
  --s-os: #8a3cb0;
  --s-dm: #2e7d3b;
  --s-la: #c23a68;
  --f-display: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1319; --surface: #161b23; --surface-2: #1c232d; --ink: #e5e9ef; --ink-2: #a2adbb; --line: #2b3440;
    --accent: #8098ff; --accent-ink: #0f1319; --pen: #ff7b6b; --hl: rgba(255, 214, 64, .26); --hl-strong: #ffd640;
    --good: #4cc77f; --warn: #f0a83c; --bad: #ff6b6b;
    --s-ds: #3cc7c9; --s-al: #9a8bff; --s-co: #ff9d4d; --s-os: #c788ee; --s-dm: #6fd07e; --s-la: #ff7aa6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1319; --surface: #161b23; --surface-2: #1c232d; --ink: #e5e9ef; --ink-2: #a2adbb; --line: #2b3440;
  --accent: #8098ff; --accent-ink: #0f1319; --pen: #ff7b6b; --hl: rgba(255, 214, 64, .26); --hl-strong: #ffd640;
  --good: #4cc77f; --warn: #f0a83c; --bad: #ff6b6b;
  --s-ds: #3cc7c9; --s-al: #9a8bff; --s-co: #ff9d4d; --s-os: #c788ee; --s-dm: #6fd07e; --s-la: #ff7aa6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.75 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.6rem, 2.6vw, 2.2rem); margin: .2em 0 .3em; letter-spacing: .01em; }
h2 { font-size: 1.22rem; margin: 1.6em 0 .5em; }
h3 { font-size: 1.05rem; margin: 1.2em 0 .4em; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em; }
pre.code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 14px/1.55 var(--f-mono); }
pre.code code { background: none; border: 0; padding: 0; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.bad-t { color: var(--bad); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; }
textarea { width: 100%; line-height: 1.6; resize: vertical; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 18px; height: 18px; }
input[type="range"] { padding: 0; accent-color: var(--accent); }

/* ---------- buttons ---------- */
.btn { font: 500 .93rem/1.2 var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { padding: 5px 10px; font-size: .85rem; }
.btn.on { background: var(--hl); border-color: var(--hl-strong); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.row.end { justify-content: flex-end; }
.row.wrap { flex-wrap: wrap; }

/* ---------- shell ---------- */
.topbar { display: none; }
.shell { display: grid; grid-template-columns: 284px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px 40px; }
.brand { display: flex; justify-content: space-between; align-items: center; }
.brand a { text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 900; font-size: 1.35rem; letter-spacing: .04em; }
.brand .b2 { color: var(--pen); margin-left: 2px; }
.rail-close { display: none; background: none; border: 0; font-size: 1.6rem; color: var(--ink-2); cursor: pointer; }
.rail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 10px; }
.count { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; }
.count b { font: 900 1.5rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.count span { font-size: .78rem; color: var(--ink-2); }
.bridge-pill { display: inline-flex; align-items: center; gap: 8px; font-size: .82rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); text-decoration: none; background: var(--surface-2); }
.rail > .bridge-pill { width: 100%; margin-bottom: 10px; }
.bridge-pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-2); }
.bridge-pill.on .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.bridge-pill.on { color: var(--good); }
.bridge-pill.wait .dot { background: var(--warn); }
.nav-main { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.nav-main a, .nav-ch { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; text-decoration: none; color: var(--ink); font-size: .95rem; }
.nav-main a:hover, .nav-ch:hover { background: var(--surface-2); }
.nav-main a.cur, .nav-ch.cur { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 700; }
.nav-count { margin-left: auto; font-size: .78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.unread-badge { margin-left: auto; background: var(--pen); color: #fff; font-size: .72rem; border-radius: 999px; padding: 0 7px; line-height: 1.6; }
.nav-label { margin: 18px 10px 6px; font-size: .75rem; letter-spacing: .12em; color: var(--ink-2); }
.nav-subj summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; font-weight: 700; font-size: .95rem; }
.nav-subj summary::-webkit-details-marker { display: none; }
.nav-subj summary:hover { background: var(--surface-2); }
.nav-subj .nav-ch { padding-left: 26px; font-size: .88rem; color: var(--ink-2); }
.sdot { width: 10px; height: 10px; border-radius: 3px; background: var(--sc, var(--accent)); flex: none; display: inline-block; }
.st { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }
.st.read { border-color: var(--accent); }
.st.pending { background: var(--warn); border-color: var(--warn); }
.st.revise { background: var(--bad); border-color: var(--bad); }
.st.pass { background: var(--good); border-color: var(--good); }

main { padding: 28px clamp(16px, 4vw, 48px) 120px; min-width: 0; max-width: 1180px; outline: none; }
.page-head { margin-bottom: 18px; }
.page-head.slim { margin-bottom: 10px; }
.eyebrow { font-size: .85rem; color: var(--ink-2); letter-spacing: .03em; }
.subj-eb { color: var(--sc); font-weight: 700; }
.subj-eb a { color: inherit; }
.lede { color: var(--ink-2); max-width: 68ch; margin: 0 0 8px; }
.sec { margin-top: 28px; }

/* ---------- cards & dashboard ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; margin: 14px 0; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-h h2, .card-h h3 { margin: 0 0 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; }
.kpi .k { font: 900 1.65rem/1.15 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .k small { font: 500 .85rem var(--f-body); color: var(--ink-2); }
.kpi .l { font-size: .8rem; color: var(--ink-2); }
.tasks { list-style: none; padding: 0; margin: 0; }
.tasks li { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px dashed var(--line); }
.tasks li:last-child { border-bottom: 0; }
.tasks .tick { width: 22px; height: 22px; flex: none; border: 1.5px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-weight: 900; color: var(--good); }
.tasks li.done .tick { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.tasks li.done label { color: var(--ink-2); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-2) 50%, transparent); }
.tasks label { flex: 1; min-width: 0; }
.tasks .go { margin-left: auto; font-size: .85rem; white-space: nowrap; border: 1px solid var(--line); padding: 3px 10px; border-radius: 6px; text-decoration: none; background: var(--surface); color: var(--accent); cursor: pointer; font-family: inherit; }
.tasks.compact li { padding: 4px; }
.gate { font-size: .75rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.gate.g-pass { color: var(--good); border-color: var(--good); }
.gate.g-pending { color: var(--warn); border-color: var(--warn); }
.gate.g-revise { color: var(--bad); border-color: var(--bad); }
.gate.g-self { color: var(--accent); border-color: var(--accent); }
.checkin { margin-top: 12px; }
.ok-note { color: var(--good); font-weight: 700; }
.alerts { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.alerts li { padding: 8px 12px; border-radius: 8px; border-left: 4px solid; background: var(--surface-2); font-size: .93rem; }
.al-bad { border-color: var(--bad) !important; }
.al-warn { border-color: var(--warn) !important; }
.al-info { border-color: var(--accent) !important; }
.timer { text-align: center; }
.face { font: 600 3.4rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
.timer .row { justify-content: center; }
.heat { display: grid; grid-template-rows: repeat(7, 13px); grid-auto-flow: column; grid-auto-columns: 13px; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.hm { border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.hm.l1 { background: color-mix(in srgb, var(--accent) 25%, var(--surface)); }
.hm.l2 { background: color-mix(in srgb, var(--accent) 50%, var(--surface)); }
.hm.l3 { background: color-mix(in srgb, var(--accent) 75%, var(--surface)); }
.hm.l4 { background: var(--accent); }
.hm.ck { outline: 2px solid var(--good); outline-offset: -2px; }
.subj-bars { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.sbar { display: grid; grid-template-columns: 4.5em 1fr 3.2em 6em; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-size: .88rem; }
.sbar .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.sbar .bar i { display: block; height: 100%; background: var(--sc); }
.sbar .v { font-variant-numeric: tabular-nums; text-align: right; }
.sbar .v2 { color: var(--ink-2); font-size: .8rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-size: .9rem; }
.chip.sm { font-size: .8rem; padding: 2px 10px; }
.chip.mock { border-style: dashed; border-color: var(--pen); color: var(--pen); }
.pill { font-size: .82rem; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }

/* ---------- modal & toast ---------- */
.modal-wrap { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; border: 1px solid var(--line); padding: 20px 22px; width: min(680px, 100%); max-height: 90vh; overflow-y: auto; }
.modal h2 { margin-top: 0; }
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 9px; font-size: .92rem; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); transition: opacity .5s, transform .5s; max-width: 90vw; }
.toast.good { background: var(--good); color: #fff; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.out { opacity: 0; transform: translateY(8px); }
.dock { position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; text-decoration: none; font-weight: 700; display: flex; gap: 8px; align-items: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); z-index: 30; }

/* ---------- plan ---------- */
.plan { display: flex; flex-direction: column; gap: 8px; }
.pday { display: grid; grid-template-columns: 92px minmax(0, 1fr) 72px; gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.pday.now { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.pday.full { box-shadow: inset 4px 0 0 var(--good); }
.pday.part { box-shadow: inset 4px 0 0 var(--warn); }
.pday.miss { box-shadow: inset 4px 0 0 var(--bad); }
.pd-n b { font: 900 1.4rem var(--f-display); display: block; }
.pd-n span { font-size: .8rem; color: var(--ink-2); }
.pd-b h3 { margin: 0 0 2px; }
.pd-b p { margin: 0 0 8px; font-size: .9rem; }
.pd-s { font-size: .85rem; text-align: right; color: var(--ink-2); }

/* ---------- subject & lesson ---------- */
.ch-list { display: flex; flex-direction: column; gap: 6px; }
.ch-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--sc); border-radius: 8px; text-decoration: none; color: var(--ink); }
.ch-row:hover { border-color: var(--sc); }
.ch-i { font: 900 1.1rem var(--f-display); color: var(--sc); }
.ch-t { font-weight: 700; display: flex; flex-direction: column; }
.ch-t small { font-weight: 400; color: var(--ink-2); }
.ch-m { font-size: .82rem; color: var(--ink-2); white-space: nowrap; }
.lesson { max-width: 860px; }
.prose { max-width: 76ch; }
.prose p, .prose li { margin: .55em 0; }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose h2 { border-bottom: 2px solid var(--line); padding-bottom: 4px; font-family: var(--f-display); font-size: 1.35rem; }
.prose h3 { color: var(--sc, var(--ink)); }
.prose hr { border: 0; border-top: 1px dashed var(--line); margin: 1.6em 0; }
mark.hl { background: linear-gradient(transparent 38%, var(--hl) 38%); color: inherit; padding: 0 1px; }
.recall mark.hl { background: var(--ink-2); color: transparent; border-radius: 3px; cursor: pointer; filter: none; user-select: none; }
.recall mark.hl.shown { background: linear-gradient(transparent 38%, var(--hl) 38%); color: inherit; }
.recall mark.hl math, .recall mark.hl .katex { visibility: hidden; }
.recall mark.hl.shown math, .recall mark.hl.shown .katex { visibility: visible; }
.tbl { overflow-x: auto; margin: .9em 0; }
.tbl table { border-collapse: collapse; font-size: .92rem; min-width: 50%; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.tbl th { background: var(--surface-2); font-weight: 700; }
.callout { border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--surface); border-radius: 8px; padding: 10px 14px; margin: 1em 0; }
.callout > p:first-of-type { margin-top: .2em; }
.c-label { font-size: .8rem; font-weight: 700; letter-spacing: .06em; color: var(--accent); }
.c-key { border-left-color: var(--hl-strong); background: color-mix(in srgb, var(--hl) 40%, var(--surface)); }
.c-key .c-label { color: var(--warn); }
.c-trap { border-left-color: var(--pen); }
.c-trap .c-label { color: var(--pen); }
.c-proof { border-left-color: var(--ink-2); background: var(--surface-2); }
.c-proof .c-label { color: var(--ink-2); }
.c-thm, .c-def { border-left-color: var(--sc, var(--accent)); }
.c-thm .c-label, .c-def .c-label { color: var(--sc, var(--accent)); }
.c-ntu { border-left-color: var(--pen); background: color-mix(in srgb, var(--pen) 6%, var(--surface)); }
.c-ntu .c-label { color: var(--pen); }
.c-ex { border-left-color: var(--good); }
.c-ex .c-label { color: var(--good); }
.c-why, .c-feyn { border-left-color: var(--accent); border-style: dashed solid dashed solid; }
details.sol { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin: .8em 0; background: var(--surface-2); }
details.sol summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.sol-body { padding-top: 4px; }
.mblock { overflow-x: auto; margin: .6em 0; }
math[display="block"] { margin: .5em 0; }
math { font-size: 1.08em; }
code.tex { color: var(--ink-2); }
.toolbar { margin-top: 6px; }
.feyn { border: 2px solid var(--accent); margin-top: 28px; }
.feyn-prompt { font-weight: 500; }
.feyn-prompt p { margin: 0; }
.grade { border-radius: 8px; padding: 10px 14px; margin: 10px 0; border: 1px solid; }
.grade.pass { border-color: var(--good); background: color-mix(in srgb, var(--good) 8%, var(--surface)); }
.grade.revise { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, var(--surface)); }
.rubric li { margin: 4px 0; }
.pn { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
.pn a { text-decoration: none; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

/* ---------- wrong book & chat ---------- */
.wrong-list { display: flex; flex-direction: column; gap: 10px; }
.wrong { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 8px; padding: 10px 14px; }
.wrong.healed { border-left-color: var(--good); }
.w-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.w-stem { font-size: .93rem; }
.w-note { font-size: .9rem; background: var(--surface-2); padding: 6px 10px; border-radius: 6px; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.bubble { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; max-width: 88%; background: var(--surface); }
.bubble.out { align-self: flex-end; background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.bubble.in { align-self: flex-start; border-left: 4px solid var(--pen); }
.b-h { display: flex; gap: 10px; align-items: center; font-size: .85rem; margin-bottom: 4px; }
.tag { font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.verdict { font-weight: 700; }
.verdict.pass { color: var(--good); }
.verdict.revise { color: var(--bad); }
.msg-body p:first-child { margin-top: 0; }
.steps li { margin: 4px 0; }
.form { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 10px 14px; align-items: center; max-width: 720px; }
.form .row { margin: 0; }
.form .row.end { grid-column: 1 / -1; }

/* ---------- labs ---------- */
.lab-sec { display: flex; align-items: center; gap: 8px; }
.lab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.lab-card { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--sc); border-radius: 8px; text-decoration: none; color: var(--ink); font: inherit; cursor: pointer; }
.lab-card:hover { border-color: var(--sc); }
.lab-card span { font-size: .87rem; color: var(--ink-2); }
.lab { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 1em 0; }
.lab-form { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.lf { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; min-width: 0; }
.lf.wide { flex: 1 1 320px; }
.lf.wide input, .lf.wide textarea { width: 100%; }
.lf label { color: var(--ink-2); }
.lab-presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: .85rem; color: var(--ink-2); }
.lab-ctrl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 12px 0 6px; padding-top: 10px; border-top: 1px dashed var(--line); }
.spd { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--ink-2); margin-left: 8px; }
.stepc { font-size: .82rem; color: var(--ink-2); margin-left: auto; font-variant-numeric: tabular-nums; }
.lab-note { min-height: 2.6em; padding: 8px 12px; background: var(--surface-2); border-radius: 8px; font-size: .93rem; }
.lab-note p { margin: 0; }
.lab-stage { margin-top: 10px; }
.lab-teaser { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border: 1px dashed var(--sc); border-radius: 8px; background: var(--surface); }
.lab-teaser div { display: flex; flex-direction: column; }
.lab-teaser span { font-size: .87rem; color: var(--ink-2); }
.svgwrap { overflow-x: auto; }
svg text { font-family: var(--f-mono); font-size: 13px; text-anchor: middle; fill: var(--ink); }
.edge { stroke: var(--ink-2); stroke-width: 1.5; }
.node circle { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.node.red circle { fill: color-mix(in srgb, var(--bad) 22%, var(--surface)); stroke: var(--bad); stroke-width: 2.4; }
.node.black circle { fill: var(--ink); }
.node.black text { fill: var(--surface); }
.node.hl circle { stroke: var(--accent); stroke-width: 4; }
.node.hl2 circle { stroke: var(--hl-strong); stroke-width: 4; stroke-dasharray: 4 3; }
text.sub { font-size: 10px; fill: var(--ink-2); }
.arr rect { fill: var(--surface); stroke: var(--line); }
.cell.hl rect { fill: color-mix(in srgb, var(--accent) 22%, var(--surface)); stroke: var(--accent); }
.cell.probe rect { fill: color-mix(in srgb, var(--warn) 18%, var(--surface)); }
.cell .idx { font-size: 10px; fill: var(--ink-2); }
.bars rect { fill: color-mix(in srgb, var(--ink-2) 35%, var(--surface)); }
.bar.cmp rect { fill: var(--hl-strong); }
.bar.swap rect { fill: var(--pen); }
.bar.cur rect { fill: var(--accent); }
.bar.done rect { fill: color-mix(in srgb, var(--good) 65%, var(--surface)); }
.bar.dim { opacity: .35; }
.bars text { font-size: 11px; }
.gedge path { fill: none; stroke: var(--line); stroke-width: 2; }
.gedge text { font-size: 12px; fill: var(--ink-2); }
.gedge.tree path { stroke: var(--accent); stroke-width: 4; }
.gedge.cand path { stroke: var(--hl-strong); stroke-width: 3; }
.gedge.dim path { stroke-dasharray: 3 4; opacity: .5; }
.gedge.back path { stroke: var(--pen); stroke-width: 3; }
.gedge.fwd path { stroke: var(--s-dm); stroke-width: 3; }
.gedge.cross path { stroke: var(--s-os); stroke-width: 3; }
.ah { fill: var(--ink-2); }
.gnode circle { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.gnode.gray circle { fill: color-mix(in srgb, var(--ink-2) 30%, var(--surface)); }
.gnode.black circle { fill: var(--ink); }
.gnode.black > text:not(.glab) { fill: var(--surface); }
.gnode.cur circle { stroke: var(--accent); stroke-width: 4; }
.glab { font-size: 12px; fill: var(--pen) !important; font-weight: 600; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--ink-2); }
.lg::before { content: ""; display: inline-block; width: 18px; height: 4px; margin-right: 5px; vertical-align: middle; border-radius: 2px; }
.lg.tree::before { background: var(--accent); } .lg.cand::before { background: var(--hl-strong); } .lg.back::before { background: var(--pen); } .lg.fwd::before { background: var(--s-dm); } .lg.cross::before { background: var(--s-os); }
.seg rect { stroke: var(--surface); stroke-width: 1; }
.seg.idle rect { fill: var(--surface-2); stroke: var(--line); stroke-dasharray: 3 3; }
.seg.p0 rect { fill: color-mix(in srgb, var(--s-ds) 45%, var(--surface)); } .seg.p1 rect { fill: color-mix(in srgb, var(--s-al) 45%, var(--surface)); } .seg.p2 rect { fill: color-mix(in srgb, var(--s-co) 45%, var(--surface)); }
.seg.p3 rect { fill: color-mix(in srgb, var(--s-os) 45%, var(--surface)); } .seg.p4 rect { fill: color-mix(in srgb, var(--s-dm) 45%, var(--surface)); } .seg.p5 rect { fill: color-mix(in srgb, var(--s-la) 45%, var(--surface)); }
.tick { font-size: 10px; fill: var(--ink-2); }
.axis { stroke: var(--line); stroke-width: 2; }
.trail { fill: none; stroke: var(--accent); stroke-width: 2; }
.dpt circle { fill: var(--accent); }
.dpt.cur circle { fill: var(--pen); r: 7px; }
.dpt text { text-anchor: start; font-size: 11px; }
.lab-tbl td, .lab-tbl th { text-align: center; font-family: var(--f-mono); font-size: .85rem; min-width: 2.2em; }
.lab-tbl td.cur { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
.lab-tbl td.dep { background: color-mix(in srgb, var(--hl) 70%, var(--surface)); }
.lab-tbl td.path { background: color-mix(in srgb, var(--good) 25%, var(--surface)); font-weight: 700; }
.lab-tbl td.chg { background: color-mix(in srgb, var(--pen) 16%, var(--surface)); }
.lab-tbl td.kk { background: var(--surface-2); }
.lab-tbl td.ok { background: color-mix(in srgb, var(--good) 18%, var(--surface)); }
.lab-tbl td.stl { color: var(--pen); }
.lab-tbl small { color: var(--ink-2); font-size: .72rem; margin-right: 2px; }
.curh { color: var(--accent); font-weight: 900; text-decoration: underline; }
.addr { font: 600 1.05rem var(--f-mono); display: flex; gap: 2px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.addr span { padding: 2px 6px; border-radius: 4px; }
.addr .t { background: color-mix(in srgb, var(--s-co) 22%, var(--surface)); }
.addr .i { background: color-mix(in srgb, var(--s-ds) 22%, var(--surface)); }
.addr .o { background: color-mix(in srgb, var(--s-al) 22%, var(--surface)); }
.addr small { margin-left: 8px; font: .8rem var(--f-body); color: var(--ink-2); }

/* ---------- practice ---------- */
.mode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.mode { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; font: inherit; color: var(--ink); text-decoration: none; }
.mode:hover:not(:disabled) { border-color: var(--accent); }
.mode:disabled { opacity: .5; cursor: not-allowed; }
.mode span { font-size: .87rem; color: var(--ink-2); }
.mode.mock { border-left: 4px solid var(--pen); }
.ch-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px 18px; }
.ch-pick h3 { display: flex; align-items: center; gap: 8px; }
.ch-btn { display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 6px 10px; margin: 3px 0; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; font: inherit; font-size: .9rem; cursor: pointer; color: var(--ink); }
.ch-btn small { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ch-btn:hover:not(:disabled) { border-color: var(--accent); }
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; background: var(--accent); }
.qcard { max-width: 900px; }
.q-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.stars { color: var(--hl-strong); letter-spacing: 1px; }
.opts { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 4px; }
.opt .ol { font-weight: 700; color: var(--ink-2); }
.opt .ot { flex: 1; min-width: 0; }
.opt .ot p { margin: 0; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.fill { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.fill input { min-width: 260px; font-family: var(--f-mono); }
.conf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0 4px; font-size: .9rem; color: var(--ink-2); }
.cf { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: .88rem; color: var(--ink); }
.cf.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.reason summary { cursor: pointer; color: var(--ink-2); font-size: .9rem; margin: 6px 0; }
.fb { padding: 10px 14px; border-radius: 8px; margin-top: 12px; }
.fb.good { background: color-mix(in srgb, var(--good) 12%, var(--surface)); border: 1px solid var(--good); }
.fb.bad { background: color-mix(in srgb, var(--bad) 9%, var(--surface)); border: 1px solid var(--bad); }
.fb.neutral { background: var(--surface-2); border: 1px solid var(--line); }
.hcw { margin-top: 6px; color: var(--bad); font-weight: 700; }
.expl { margin-top: 8px; }
.cause, .selfeval { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--pen); border-radius: 8px; }
.selfeval { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-color: var(--line); }
.res { list-style: none; padding: 0; margin: 0; }
.res li { display: grid; grid-template-columns: 3em minmax(0, 1fr) 4em; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .92rem; }
.res li.ok span:first-child { color: var(--good); font-weight: 700; }
.res li.no span:first-child { color: var(--bad); font-weight: 700; }
.exam { padding-left: 1.4em; }
.exam > li.ok { border-left: 4px solid var(--good); }
.exam > li.no { border-left: 4px solid var(--bad); }
.exam-head { position: sticky; top: 0; background: var(--bg); z-index: 5; padding: 8px 0; border-bottom: 1px solid var(--line); }
.exam-clock { font: 600 1.6rem var(--f-mono); color: var(--pen); }

/* ---------- 短影音（9:16） ---------- */
.clip-player { position: relative; aspect-ratio: 9 / 16; border-radius: 18px; overflow: hidden; background: #05080f; box-shadow: 0 10px 34px rgba(0, 0, 0, .32); user-select: none; -webkit-user-select: none; }
.clip-player canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.clip-bar { position: absolute; left: 12px; right: 12px; bottom: 9px; height: 3px; background: rgba(255, 255, 255, .16); border-radius: 2px; overflow: hidden; pointer-events: none; }
.clip-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2ee6c9, #a98bff); }
.clip-btn { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .25); background: rgba(8, 13, 28, .6); color: #fff; font-size: 17px; cursor: pointer; backdrop-filter: blur(6px); display: grid; place-items: center; padding: 0; }
.clip-btn.on { border-color: #2ee6c9; box-shadow: 0 0 0 3px rgba(46, 230, 201, .22); }
.clip-hint { display: none; }
.clip-player:not(.playing)::after { content: '▶'; position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: rgba(8, 13, 28, .55); border: 1px solid rgba(255, 255, 255, .35); color: #fff; font-size: 26px; line-height: 68px; text-align: center; text-indent: 4px; pointer-events: none; backdrop-filter: blur(4px); }
.clip-sec { margin: 4px 0 24px; padding: 14px 16px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.clip-sec-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.clip-sec-h h3 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; color: var(--sc); }
.clip-sec-h .btn { margin-left: auto; }
.clip-strip { display: flex; gap: 16px; overflow-x: auto; padding: 4px 8px 14px; margin: 0 -8px; scroll-snap-type: x mandatory; }
.clip-strip .clip-player { box-shadow: 0 3px 12px rgba(0, 0, 0, .18); }
.clip-item { flex: none; width: min(250px, 64vw); scroll-snap-align: start; }
.clip-meta { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; margin-top: 6px; color: var(--ink-2); }
.clip-meta a { color: var(--sc, var(--accent)); text-decoration: none; font-weight: 700; }

.today-clip { display: flex; align-items: center; gap: 14px; margin: 16px 0 18px; padding: 12px 16px; border-radius: 14px; text-decoration: none; color: #eef3ff; background: linear-gradient(110deg, #0b1430, #1d1840 60%, #0e2b33); border: 1px solid rgba(46, 230, 201, .35); box-shadow: 0 6px 22px rgba(10, 20, 50, .25); }
.today-clip .tc-ic { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #2ee6c9, #a98bff); color: #05080f; font-size: 18px; }
.today-clip b { display: block; }
.today-clip small { color: #a9b6d6; }
.today-clip .tc-go { margin-left: auto; font-weight: 700; color: #2ee6c9; white-space: nowrap; }
body.feed-mode main { padding: 0; max-width: none; }
body.feed-mode .dock { display: none; }
.feed-wrap { position: relative; }
.feed { height: 100vh; height: 100dvh; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; background: radial-gradient(ellipse at 50% 40%, #121c38 0%, #05080f 70%); scrollbar-width: none; outline: none; }
.feed::-webkit-scrollbar { display: none; }
.feed-item { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; gap: 22px; position: relative; padding: 58px 14px 14px; }
.feed-slot { height: min(calc(100% - 72px), calc((100vw - 28px) * 16 / 9)); aspect-ratio: 9 / 16; }
.feed-slot .clip-player { height: 100%; width: auto; border-radius: 22px; }
.feed-acts { display: flex; flex-direction: column; gap: 16px; align-self: flex-end; margin-bottom: 70px; }
.feed-acts a, .feed-acts button { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; color: #e3eaff; background: none; border: 0; font: 600 .75rem var(--f-body); text-decoration: none; cursor: pointer; text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }
.feed-acts .ic { width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, .09); border: 1px solid rgba(255, 255, 255, .2); display: grid; place-items: center; font-size: 21px; backdrop-filter: blur(6px); transition: transform .15s, background .15s; }
.feed-acts a:hover .ic, .feed-acts button:hover .ic { transform: scale(1.08); background: rgba(46, 230, 201, .2); }
.feed-cap { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: none; }
.feed-filter { position: absolute; z-index: 6; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; max-width: calc(100% - 24px); scrollbar-width: none; }
.feed-filter .chip { background: rgba(8, 13, 28, .7); color: #dfe7ff; border-color: rgba(255, 255, 255, .18); backdrop-filter: blur(8px); cursor: pointer; white-space: nowrap; font-size: .82rem; padding: 4px 11px; }
.feed-filter .chip.on { background: var(--sc, #2ee6c9); border-color: var(--sc, #2ee6c9); color: #05080f; font-weight: 700; }
.feed-end { color: #e3eaff; text-align: center; }
.feed-end h2 { font-family: var(--f-display); font-size: 2rem; margin: 0 0 6px; }
.feed-end p { color: #9aa8c6; }
@media (max-width: 820px) {
  .feed { height: calc(100vh - 53px); height: calc(100dvh - 53px); }
  .feed-item { padding: 46px 8px 6px; flex-direction: column; gap: 6px; justify-content: flex-start; }
  .feed-slot { height: min(calc(100% - 122px), calc((100vw - 16px) * 16 / 9)); }
  .feed-acts { flex-direction: row; align-self: center; margin: 0; gap: 14px; }
  .feed-acts a, .feed-acts button { width: 58px; }
  .feed-acts .ic { width: 40px; height: 40px; font-size: 17px; }
  .feed-filter { top: 8px; }
}

/* ---------- 學習法升級：必背卡／儀表板／預測驗／反思 ---------- */
.good-t { color: var(--good); }
.row.center { justify-content: center; }
.kpis.kpis4 { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 14px; }
.mode.hot { border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
kbd { font: 600 .72rem var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; margin-left: 6px; color: var(--ink-2); background: var(--surface-2); }
.deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.deck { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-left: 4px solid var(--sc); border-radius: var(--r); background: var(--surface); cursor: pointer; font: inherit; color: var(--ink); }
.deck:hover { border-color: var(--sc); }
.deck .muted, .deck .bar { grid-column: 1 / -1; }
.deck .bar, .calib .bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; position: relative; display: block; }
.deck .bar i, .calib .bar i { display: block; height: 100%; background: var(--sc, var(--accent)); border-radius: 99px; }
.fcard { max-width: 760px; margin-left: auto; margin-right: auto; border-top: 4px solid var(--sc); padding: 20px 24px; }
.f-ask { font-size: .82rem; color: var(--ink-2); letter-spacing: .04em; margin-bottom: 6px; }
.f-q { font: 700 1.35rem/1.6 var(--f-body); margin-bottom: 18px; }
.f-q p { margin: 0; }
.fcard.k-key .f-q { font-family: var(--f-display); }
.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn.tf { justify-content: center; padding: 14px; font-size: 1.1rem; font-weight: 800; }
.btn.tf.no:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }
.btn.tf.yes:hover:not(:disabled) { color: var(--good); border-color: var(--good); }

.btn.tf.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); opacity: 1; }
.f-b { margin: 12px 0; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.btn.rt { flex-direction: column; gap: 2px; padding: 10px 6px; justify-content: center; }

.calib { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 10px; }

.calib .bar { height: 14px; overflow: visible; }
.calib .bar em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; border-radius: 2px; }
.cv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; } .cv small { font-weight: 400; color: var(--ink-2); }
.fcurve { width: 100%; height: auto; font: 11px var(--f-mono); }
.fcurve text { fill: var(--ink-2); }
.fcurve .gl { stroke: var(--line); }
.fcurve .tg { stroke: var(--good); stroke-dasharray: 6 6; }
.fcurve .ex { stroke: var(--pen); stroke-dasharray: 3 4; } .fcurve .ext { fill: var(--pen); font-weight: 700; }
.fcurve .fc { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; }
.mgrid { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 10px; overflow-x: auto; }

.go-sub { margin: 0 0 6px; font-size: 1.02rem; }
.go-why { margin: 0 0 16px; color: var(--ink-2); font-size: .9rem; }
.btn.go-btn { font-size: 1.12rem; padding: 12px 30px; border-radius: 12px; font-weight: 800; }

.go-list li button { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 8px; border: 0; border-bottom: 1px dashed var(--line); background: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer; border-radius: 8px; }

.go-list .gm { font-size: .82rem; color: var(--ink-2); white-space: nowrap; }
.go-list li.ok .gi { background: var(--good); border-color: var(--good); color: #fff; font-weight: 900; }
.go-list li.ok .gt { color: var(--ink-2); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-2) 50%, transparent); }

window.CSDATA = {"subjects": [{"id": "ds", "name": "資料結構", "short": "資結", "exam": "資料結構與演算法", "refs": "CLRS 4th ed.；Horowitz《Fundamentals of Data Structures in C++》", "desc": "攤銷分析、各種樹與堆積、雜湊、Union-Find、排序下界、圖的基本結構。台大考法重「為什麼」：給證明、給反例、給精確的界。", "intro": "資料結構以 CLRS 第 10–13、17–21 章與 Horowitz 為核心。台大的考法有兩種：**多選題逐句判斷**（每個敘述都要能給證明或反例），以及**設計題**（給操作與時間要求，選結構並分析）。分析一律寫到精確的界，例如「最壞 $\\Theta(\\lg n)$、攤銷 $O(1)$」，不要只寫「很快」。"}, {"id": "al", "name": "演算法", "short": "演算法", "exam": "資料結構與演算法", "refs": "CLRS 4th ed. Ch.3-4, 14-17, 22-26, 34-35；Kleinberg & Tardos", "desc": "遞迴式、分治、DP、貪婪、最短路徑與 MST、網路流、NP-完備性、機率分析。台大常要求設計演算法並證明正確性與複雜度。", "intro": "演算法以 CLRS 第 3、4、15、16、22–26、34、35 章為核心，台大常見題型：**判斷漸近大小與遞迴式**、**設計 DP 並寫出遞迴式與時間**、**證明 greedy 正確（交換論證）**、**NP-complete 歸約方向**、**多選題逐一判斷敘述**。設計題一定要寫：狀態定義 → 遞迴式 → 邊界 → 計算順序 → 時間空間。"}, {"id": "co", "name": "計算機組織／結構", "short": "計組", "exam": "計算機結構與作業系統", "refs": "Patterson & Hennessy《COD》；Hennessy & Patterson《CA: AQA》", "desc": "效能公式、數字表示與算術、資料路徑、管線與危障、ILP（Tomasulo、ROB）、Cache 與虛擬記憶體、一致性協定。", "intro": "計算機結構以 Patterson & Hennessy《Computer Organization and Design》（COD）與 Hennessy & Patterson《Computer Architecture: A Quantitative Approach》（CA:AQA）為主。台大偏重**定量計算**（CPI、加速比、AMAT、管線時脈數、cache 位元數）與**機制的因果**（為什麼 forwarding 解不了 load-use、Tomasulo 怎麼消掉 WAR／WAW、VIPT 為什麼有大小限制）。每一個公式都要知道它的假設。"}, {"id": "os", "name": "作業系統", "short": "OS", "exam": "計算機結構與作業系統", "refs": "Silberschatz《Operating System Concepts》10th ed.", "desc": "行程與執行緒、排程、同步、死結、記憶體管理、虛擬記憶體、檔案與磁碟。台大愛考同步的正確性論證與 fork/執行緒的語意。", "intro": "作業系統以 Silberschatz《Operating System Concepts》為主。台大題型：**多選題判斷敘述**（每個選項都有一個細節陷阱）、**計算題**（排程、EAT、頁表大小、頁替換、磁碟、RAID、檔案大小），以及**程式語意題**（fork、執行緒、同步程式碼是否正確、違反哪一條性質）。同步題一定要能寫出「交錯執行的反例」。"}, {"id": "dm", "name": "離散數學", "short": "離散", "exam": "數學（線代＋離散）", "refs": "Rosen《Discrete Mathematics and Its Applications》；Grimaldi", "desc": "邏輯與證明、計數與排容、遞迴與生成函數、關係、圖論、數論與代數結構。", "intro": "離散數學以 Rosen 與 Grimaldi 為主，台大數學（A）中離散約占一半。題目常見三類：**計數**（要能說出你在數什麼、有沒有重複或遺漏）、**證明**（歸納法、鴿籠、組合論證要寫完整）、**結構判斷**（關係性質、圖的平面性與著色）。計數題寫答案前一定要用小 n 驗算。"}, {"id": "la", "name": "線性代數", "short": "線代", "exam": "數學（線代＋離散）", "refs": "Strang《Introduction to Linear Algebra》；Friedberg；Leon", "desc": "線性系統、向量空間與線性變換、行列式、特徵值與對角化、正交與最小平方、對稱矩陣與 SVD。台大線代證明題比例高。", "intro": "線性代數以 Strang、Friedberg 與 Leon 為主。台大線代的證明題比例很高：常見「證明或舉反例」（例如兩個可對角化矩陣的和是否可對角化）、「給條件求所有可能的 rank／特徵值」、「判斷二次型正定」。證明時要分清楚「對所有向量成立」與「存在某個向量」；反例要選最小的（2×2）。"}], "lessons": [{"id": "ds-amortized", "subject": "ds", "title": "堆疊、佇列與攤銷分析", "mins": 120, "summary": "", "feynman": "用位能法證明「表滿就加倍」的動態表，每次 TABLE-INSERT 的攤銷成本是常數。你要定義位能函數、說明它為什麼永遠非負、分別算「不擴張」與「擴張」兩種情況的攤銷成本，最後說明若改成「使用率低於 1/2 就減半」，為什麼會讓攤銷成本變成 Θ(n)。", "recall": ["中序轉後序時，遇到運算子要彈出哪些堆疊元素？右結合的 ^ 有什麼不同？", "輸入 1..n 依序進堆疊，哪種輸出排列不可能得到？可能的排列有幾種？", "攤銷分析三種方法各是什麼？攤銷成本和平均情況成本差在哪？", "動態表加倍擴張時，為什麼每次插入攤銷 O(1)？縮小門檻為什麼是 1/4 而不是 1/2？", "二進位計數器只做 INCREMENT 時總翻轉次數上界？加上 DECREMENT 呢？"], "rubric": ["定義 $\\Phi=2\\cdot num-size$，並說明加倍後 $num\\ge size/2$ 所以 $\\Phi\\ge0$、初始為 0", "不擴張：實際成本 1，$\\Delta\\Phi=2$，攤銷 3", "擴張：實際成本 $num_{i-1}+1$（搬移＋插入），位能從 $num_{i-1}$ 降到 2，攤銷 3", "攤銷總和 ≥ 實際總和（因 $\\Phi_n\\ge\\Phi_0$），所以 n 次操作 $O(n)$", "在 1/2 縮小的反例：在 size/2 邊界交替 insert、delete，每次都觸發 Θ(n) 搬移"], "labs": ["sort"], "body": "## 1. 堆疊與佇列的實作細節\n\n| 結構 | 陣列實作 | 鏈結實作 | 易錯點 |\n|---|---|---|---|\n| 堆疊 | top 索引 | 頭端插入刪除 | 空堆疊 pop 要先檢查 |\n| 環狀佇列 | `front`、`rear` 取 mod | 頭刪尾插，需尾指標 | 只靠兩個指標時，「滿」與「空」無法區分 |\n| 雙端佇列 | 環狀陣列 | 雙向鏈結 | — |\n\n> [!考點] 環狀佇列的滿與空\n> 若 `front` 指向第一個元素的前一格：空 ⇔ `front == rear`；滿 ⇔ `(rear+1) % n == front`，所以容量只有 $n-1$。要用滿 $n$ 格，必須另存 `count` 或一個旗標。\n\n**用兩個堆疊做佇列**：enqueue 推入 $S_1$；dequeue 時若 $S_2$ 空，把 $S_1$ 全部倒進 $S_2$ 再 pop。單次最壞 $\\Theta(n)$，但每個元素一生只被搬一次，**攤銷 $O(1)$**。\n\n## 2. 運算式\n\n**中序轉後序**（Shunting-yard）：運算元直接輸出；`(` 推入；`)` 一路彈到 `(`；遇到運算子 $o$，先把堆疊頂端「優先序較高、或優先序相同且 $o$ 為左結合」的運算子彈出，再推入 $o$。結束時全部彈出。\n\n> [!例題] 把 `a+b*(c^d-e)^(f+g*h)-i` 轉成後序\n+++ 看解答\n`abcd^e-fgh*+^*+i-`。關鍵：`^` 是右結合，所以第二個 `^` 進來時**不**彈出前一個 `^`（但這題第一個 `^` 在括號內已被 `)` 彈出）。\n+++\n\n- 後序求值：遇運算元推入；遇運算子彈出兩個（**先彈出的是右運算元**）計算後推回。\n- 前序式可以「由右往左」掃，用同樣的堆疊求值。\n\n## 3. 堆疊排列\n\n輸入 $1,2,\\dots,n$ 依序進堆疊，可以在任何時候 pop，輸出的排列稱為堆疊排列。\n\n> [!定理] 可得排列的判準\n> 一個排列可由堆疊得到 ⇔ 不存在 $i<j<k$ 使 $p_j<p_k<p_i$（不含「312」型樣）。數量為 Catalan 數 $C_n=\\frac{1}{n+1}\\binom{2n}{n}$。\n> 例：$n=3$ 時 5 種，唯一不行的是 `3 1 2`：輸出 3 時 1、2 都在堆疊中，2 壓在 1 上面。\n\nCatalan 數同時數：$n$ 個節點的二元樹形狀數、$n+1$ 個矩陣乘法的加括號數、$n$ 對合法括號、凸 $(n+2)$ 邊形的三角剖分數、不跨越對角線的格子路徑數。$C_0..C_6 = 1,1,2,5,14,42,132$。\n\n## 4. 攤銷分析：三種方法\n\n攤銷分析是**最壞情況下一串操作的平均**，不牽涉機率；平均情況分析則依賴輸入分布。\n\n| 方法 | 做法 | 必須保證 |\n|---|---|---|\n| 聚集（aggregate） | 直接算 $n$ 次操作的總成本 $T(n)$，每次 $T(n)/n$ | — |\n| 會計（accounting） | 每種操作收費 $\\hat c_i$，多收的存成 credit 放在資料上 | 任何時刻 credit 總和 $\\ge 0$ |\n| 位能（potential） | $\\hat c_i=c_i+\\Phi(D_i)-\\Phi(D_{i-1})$ | $\\Phi(D_i)\\ge\\Phi(D_0)$ 對所有 $i$ |\n\n### 經典例子\n\n- **MULTIPOP 堆疊**：每個元素最多被 push 一次、pop 一次，$n$ 次操作總成本 $O(n)$。位能取堆疊大小。\n- **二進位計數器 INCREMENT**：第 $i$ 位每 $2^i$ 次翻一次，總翻轉 $<\\sum n/2^i=2n$。位能取「1 的個數」：每次 INCREMENT 把 $t$ 個 1 變 0、一個 0 變 1，攤銷 $(t+1)+(1-t)=2$。\n- 同時有 INCREMENT 與 DECREMENT：在 $0111\\cdots1$ 與 $1000\\cdots0$ 之間來回，每次 $\\Theta(k)$，**攤銷不再是 $O(1)$**。\n\n## 5. 動態表\n\n@lab sort\n\n| 策略 | 攤銷成本 |\n|---|---|\n| 滿了就加倍 | 插入 3（位能 $2\\,num-size$） |\n| 滿了就加常數 $c$ 格 | 插入 $\\Theta(n)$（總搬移 $\\Theta(n^2/c)$） |\n| 加倍、且使用率 < 1/4 時減半 | 插入、刪除都 $O(1)$ |\n| 加倍、且使用率 < 1/2 時減半 | 在邊界交替操作，每次 $\\Theta(n)$ |\n\n> [!陷阱] 多選題常見敘述\n> - 「攤銷 $O(1)$ 表示每次操作都是 $O(1)$」✗：單次可能 $\\Theta(n)$。\n> - 「攤銷分析需要假設輸入隨機」✗。\n> - 「位能函數可以取負值，只要最後為 0」✗：要求的是任何時刻 $\\Phi(D_i)\\ge\\Phi(D_0)$。\n> - 擴張倍率改成任何常數 $r>1$ 仍是攤銷 $O(1)$；改成加常數就不是。\n> - Splay tree、Fibonacci heap、Union-Find 的界都是攤銷界。"}, {"id": "ds-sort", "subject": "ds", "title": "排序、比較下界與選擇", "mins": 150, "summary": "", "feynman": "證明任何比較排序在最壞情況需要 Ω(n lg n) 次比較。要從決策樹模型開始：說明每個內部節點、每片葉子代表什麼，為什麼葉子至少 n! 片，高度 h 的二元樹最多幾片葉子，最後怎麼用 lg(n!) 得到 Θ(n lg n)。也要講清楚這個下界「不適用」於哪些排序、為什麼。", "recall": ["寫出 8 種排序的最佳／平均／最壞時間、額外空間、是否穩定。", "比較排序 $\\Omega(n\\lg n)$ 下界的決策樹論證。這個下界對平均情況也成立嗎？", "隨機 quicksort 期望比較次數的推導關鍵：$z_i$ 與 $z_j$ 被比較的機率是多少？", "Median-of-medians 的遞迴式；為什麼每組 3 個不行？", "同時找最大與最小最少要幾次比較？找第二小呢？"], "rubric": ["決策樹：內部節點是一次比較 $a_i\\le a_j$，葉子是一個輸出排列；一次執行是一條根到葉的路徑", "正確的演算法必須能輸出全部 $n!$ 種排列，所以葉子數 $\\ge n!$", "高度 h 的二元樹最多 $2^h$ 片葉子，故 $2^h\\ge n!$，$h\\ge\\lg(n!)$", "$\\lg(n!)\\ge \\frac n2\\lg\\frac n2=\\Omega(n\\lg n)$（或用 Stirling）", "下界只限比較模型；counting／radix／bucket 利用鍵值本身的資訊，不受此限"], "labs": ["sort"], "body": "## 1. 總表\n\n| 排序 | 最佳 | 平均 | 最壞 | 額外空間 | 穩定 | 備註 |\n|---|---|---|---|---|---|---|\n| 插入 | $n$ | $n^2$ | $n^2$ | $1$ | ✓ | 時間 $\\Theta(n+I)$，$I$ 是逆序對數 |\n| 泡沫（有提早結束） | $n$ | $n^2$ | $n^2$ | $1$ | ✓ | |\n| 選擇 | $n^2$ | $n^2$ | $n^2$ | $1$ | ✗ | 交換次數只有 $O(n)$ |\n| Shell | — | 依間距序列 | $n^{3/2}$（Knuth 序列） | $1$ | ✗ | |\n| 合併 | $n\\lg n$ | $n\\lg n$ | $n\\lg n$ | $n$ | ✓ | 鏈結串列可 $O(1)$ 額外空間 |\n| 快速 | $n\\lg n$ | $n\\lg n$ | $n^2$ | $\\lg n$～$n$（遞迴堆疊） | ✗ | 先遞迴較短的一邊可保證 $O(\\lg n)$ 堆疊 |\n| 堆積 | $n\\lg n$ | $n\\lg n$ | $n\\lg n$ | $1$ | ✗ | |\n| 計數 | $n+k$ | $n+k$ | $n+k$ | $n+k$ | ✓ | 由後往前放才穩定 |\n| 基數（LSD） | $d(n+k)$ | | | $n+k$ | ✓ | 每一位用的子排序**必須穩定** |\n| 桶 | $n$ | $n$（均勻分布） | $n^2$ | $n$ | ✓ | |\n\n@lab sort\n\n## 2. 比較排序的下界\n\n決策樹的葉子 $\\ge n!$，高度 $h\\ge\\lg n!=\\Theta(n\\lg n)$。**平均情況**也一樣：$n!$ 片葉子的二元樹，平均葉深度 $\\ge\\lg n!$（外部路徑長最小時是平衡樹）。\n\n> [!考點] 其他下界\n> - 合併兩個長度 $n$ 的已排序串列：最壞需要 $2n-1$ 次比較（相鄰對手論證）。\n> - 同時找最小與最大：$\\lceil 3n/2\\rceil-2$ 次（兩兩一組，組內比 1 次，較小者跟目前的 min 比、較大者跟 max 比），比分開找的 $2n-2$ 少。\n> - 找第二小：$n+\\lceil\\lg n\\rceil-2$（錦標賽：冠軍一路打敗的 $\\lceil\\lg n\\rceil$ 個人中選最小）。\n> - 只用比較，在已排序陣列中搜尋：$\\Omega(\\lg n)$。\n\n## 3. Quicksort 分析\n\n- 最壞：每次切成 $0$ 與 $n-1$（例如已排序的陣列、用最後一個當 pivot），$T(n)=T(n-1)+\\Theta(n)=\\Theta(n^2)$。所有元素都相等時，CLRS 的 Lomuto 版本也是 $\\Theta(n^2)$（Hoare 版或三路切割可避免）。\n- 只要每次至少切出常數比例（例如 $1:99$），$T(n)=T(n/100)+T(99n/100)+n=\\Theta(n\\lg n)$。\n- **期望比較次數**：令 $z_1<\\dots<z_n$ 為排序後的元素。$z_i$ 與 $z_j$ 被比較 ⇔ 在 $\\{z_i..z_j\\}$ 中第一個被選為 pivot 的是 $z_i$ 或 $z_j$，機率 $\\frac{2}{j-i+1}$。\n$$E[X]=\\sum_{i<j}\\frac{2}{j-i+1}=2(n+1)H_n-4n\\approx 2n\\ln n\\approx1.39\\,n\\lg n$$\n\n## 4. 線性時間排序\n\n- **計數排序**：$C[x]$ 計數後做前綴和，再**由後往前**把 $A[j]$ 放到 $B[C[A[j]]]$，保證穩定。\n- **基數排序**：$n$ 個 $b$ 位元數，每次取 $r$ 位元當一位數：$\\Theta\\!\\left(\\frac br(n+2^r)\\right)$；$b\\ge\\lg n$ 時取 $r=\\lg n$ 得 $\\Theta(bn/\\lg n)$。範圍在 $0..n^c$ 的整數可以 $O(cn)$ 排完。\n- **桶排序**：輸入均勻分布在 $[0,1)$，期望 $\\Theta(n)$。證明用 $E[n_i^2]=2-\\frac1n$。\n\n## 5. 選擇問題（第 $i$ 小）\n\n| 演算法 | 時間 |\n|---|---|\n| 排序後取 | $\\Theta(n\\lg n)$ |\n| Randomized-Select | 期望 $\\Theta(n)$，最壞 $\\Theta(n^2)$ |\n| Median of medians（每組 5 個） | 最壞 $\\Theta(n)$ |\n\n**Median of medians**：分 $\\lceil n/5\\rceil$ 組，各取中位數，遞迴求中位數的中位數 $x$。至少 $\\frac{3n}{10}-6$ 個元素比 $x$ 大（也至少這麼多比它小），所以\n$$T(n)\\le T(\\lceil n/5\\rceil)+T(7n/10+6)+O(n)=O(n)\\quad(\\tfrac15+\\tfrac{7}{10}<1)$$\n每組 3 個：$T(n)=T(n/3)+T(2n/3)+O(n)=\\Theta(n\\lg n)$，不再線性；每組 7 個仍線性。\n\n> [!陷阱] 多選題常見敘述\n> - 「heapsort 是穩定的」✗；「merge sort 需要 $\\Theta(n)$ 額外空間」對陣列成立。\n> - 「insertion sort 在幾乎排好的資料上是線性」✓（逆序對 $O(n)$ 時）。\n> - 「任何比較排序都至少要 $n\\lg n$ 次比較」✗：下界是 $\\lg n!\\approx n\\lg n-1.44n$，而且是**最壞**情況；最佳情況可以是 $n-1$。\n> - 「radix sort 是比較排序」✗。「counting sort 對負數不能用」✗（平移即可）。\n> - 用 heap 合併 $k$ 個已排序串列（總共 $n$ 個元素）：$O(n\\lg k)$。"}, {"id": "ds-heap", "subject": "ds", "title": "堆積與可合併堆積", "mins": 150, "summary": "", "feynman": "證明 Build-Max-Heap 的時間是 O(n) 而不是 O(n lg n)。推理鏈要說清楚：Max-Heapify 在高度 h 的節點上成本是 O(h)；高度為 h 的節點最多有幾個、為什麼；把成本加總成一個級數，算出它收斂到什麼常數；最後解釋為什麼 n 次 insert 建 heap 會是 Θ(n lg n)，兩者差在哪裡。", "recall": ["Build-Heap 為什麼是 O(n)？寫出求和式。", "高度 h 的節點最多幾個？n 個節點的 heap 有幾片葉子？", "d-ary heap 的 insert、extract-min 時間？Dijkstra 用 d-ary heap 時 d 取多少最好？", "Binomial tree $B_k$ 的四個性質。", "Fibonacci heap 各操作的攤銷時間；為什麼最大度數是 $O(\\lg n)$？"], "rubric": ["Max-Heapify 從高度 h 的節點往下最多走 h 層，成本 $O(h)$", "高度 h 的節點至多 $\\lceil n/2^{h+1}\\rceil$ 個（葉子 $\\lceil n/2\\rceil$ 個，每往上一層減半）", "總成本 $\\sum_{h=0}^{\\lfloor\\lg n\\rfloor}\\lceil n/2^{h+1}\\rceil O(h)=O(n\\sum h/2^h)$", "$\\sum_{h\\ge0}h/2^h=2$，所以 $O(n)$", "逐一 insert：大多數節點在底層，每個都可能上浮 $\\Theta(\\lg n)$；Build-Heap 則是大多數節點只下沉很短"], "labs": ["heap"], "body": "## 1. 二元堆積\n\n以 1 為起點：parent $\\lfloor i/2\\rfloor$、left $2i$、right $2i+1$；以 0 為起點：parent $\\lfloor(i-1)/2\\rfloor$、children $2i+1,2i+2$。\n\n- $n$ 個節點高度 $\\lfloor\\lg n\\rfloor$；葉子 $\\lceil n/2\\rceil$ 個，索引 $\\lfloor n/2\\rfloor+1..n$；高度 $h$ 的節點 $\\le\\lceil n/2^{h+1}\\rceil$。\n- **Build-Heap $O(n)$**：$\\sum_h \\frac{n}{2^{h+1}}\\cdot h=O(n)$。\n- 搜尋任意鍵值要 $O(n)$；找最大值在 min-heap 中也要看全部 $\\lceil n/2\\rceil$ 片葉子。\n\n@lab heap\n\n> [!例題] 不同的 heap 有幾種？\n> 用 $\\{1,\\dots,n\\}$ 建 max-heap，形狀固定（完全二元樹），根一定是 $n$。\n+++ 看解答\n$H(n)=\\binom{n-1}{L}H(L)H(R)$，$L,R$ 是左右子樹大小。$H(1)=H(2)=1$，$H(3)=2$，$H(4)=3$，$H(5)=\\binom43H(3)H(1)=8$，$H(7)=\\binom63\\cdot2\\cdot2=80$。\n+++\n\n## 2. 各種優先佇列的比較\n\n| 結構 | Insert | Find-min | Extract-min | Decrease-key | Union |\n|---|---|---|---|---|---|\n| 未排序陣列 | $1$ | $n$ | $n$ | $1$ | $1$（鏈結） |\n| 二元堆積 | $\\lg n$ | $1$ | $\\lg n$ | $\\lg n$ | $n$ |\n| $d$-ary heap | $\\log_d n$ | $1$ | $d\\log_d n$ | $\\log_d n$ | $n$ |\n| Leftist / Skew heap | $\\lg n$ | $1$ | $\\lg n$ | $\\lg n$ | $\\lg n$（skew 為攤銷） |\n| Binomial heap | $\\lg n$（攤銷 $1$） | $\\lg n$（存指標則 $1$） | $\\lg n$ | $\\lg n$ | $\\lg n$ |\n| Fibonacci heap（攤銷） | $1$ | $1$ | $\\lg n$ | $1$ | $1$ |\n\nDijkstra／Prim：二元堆積 $O((V+E)\\lg V)$；Fibonacci heap $O(E+V\\lg V)$；$d$-ary heap 取 $d=\\max(2,\\lceil E/V\\rceil)$ 得 $O(E\\log_{E/V}V)$。\n\n## 3. Leftist heap\n\n$s(x)$＝$x$ 到最近的空指標的距離（null path length）。性質：$s(\\text{left})\\ge s(\\text{right})$。所以最右路徑最短，長度 $\\le\\lfloor\\lg(n+1)\\rfloor$。Meld 沿兩棵的最右路徑合併，必要時交換左右子。Skew heap 不存 $s$、每次都交換，攤銷 $O(\\lg n)$。\n\n## 4. Binomial heap\n\n$B_k$：兩棵 $B_{k-1}$ 把一棵的根接成另一棵根的最左子。\n> [!考點] $B_k$ 的性質\n> 有 $2^k$ 個節點；高度 $k$；深度 $i$ 恰有 $\\binom ki$ 個節點；根的度數 $k$ 最大，且根的子樹由左到右是 $B_{k-1},\\dots,B_0$。\n\n$n$ 個元素的 binomial heap 對應 $n$ 的二進位表示：第 $k$ 位是 1 就有一棵 $B_k$，最多 $\\lfloor\\lg n\\rfloor+1$ 棵。Union 像二進位加法。\n\n## 5. Fibonacci heap\n\n- 根串列是一群無序的樹；Insert、Union 只是接串列。Extract-min 時才 **consolidate**：把度數相同的樹兩兩合併到度數都不同。\n- Decrease-key：若違反 heap 性質就把該節點剪下放到根串列；父節點若已被剪過一個孩子（mark），也剪下（**cascading cut**）。\n- 位能 $\\Phi=t(H)+2m(H)$（根數＋兩倍 mark 數）。\n- 度數為 $k$ 的節點，子樹大小 $\\ge F_{k+2}\\ge\\varphi^k$，所以最大度數 $D(n)\\le\\lfloor\\log_\\varphi n\\rfloor=O(\\lg n)$。這就是名字的由來。\n\n> [!陷阱] 多選題常見敘述\n> - 「Fibonacci heap 的 extract-min 最壞是 $O(\\lg n)$」✗：單次可能 $\\Theta(n)$（剛插入 $n$ 個後第一次 extract），$O(\\lg n)$ 是攤銷。\n> - 「已排序的陣列一定是 min-heap」✓；「min-heap 的陣列一定是排序好的」✗。\n> - 「在 max-heap 中最小值一定在葉子」✓（元素相異時）。\n> - 「用 heap 可以在 $O(n+k\\lg n)$ 找出前 $k$ 大」✓（Build-Heap 加 $k$ 次 extract）；更好的是 $O(n+k\\lg k)$（只在候選小 heap 上操作）。\n> - 中位數維護：一個 max-heap 放較小的一半、一個 min-heap 放較大的一半，每次插入 $O(\\lg n)$。"}, {"id": "ds-bst", "subject": "ds", "title": "二元樹、BST、AVL、紅黑樹與 Splay", "mins": 180, "summary": "", "feynman": "證明有 n 個內部節點的紅黑樹高度至多 2 lg(n+1)。推理鏈要先證「以 x 為根的子樹至少有 2^{bh(x)} − 1 個內部節點」（對高度歸納，說明子節點的黑高度為什麼至少 bh(x) − 1），再用「紅節點的子節點必為黑」推出 bh(root) ≥ h/2，最後合起來。", "recall": ["二元樹 $n_0$ 與 $n_2$ 的關係；n 個節點的二元樹有幾個空指標？", "哪些走訪組合能唯一決定二元樹？", "AVL 樹高度的上界從哪個遞迴式來？插入、刪除各最多幾次旋轉？", "紅黑樹五條性質；為什麼高度 ≤ 2 lg(n+1)？", "Splay tree 的三種旋轉；攤銷界與位能函數。"], "rubric": ["定義黑高度 bh(x)：從 x 往下到葉子（NIL）經過的黑節點數，不含 x 本身", "歸納基底：高度 0（x 是 NIL）時有 $2^0-1=0$ 個內部節點", "歸納步驟：x 的子節點黑高度為 bh(x) 或 bh(x)−1，所以子樹 ≥ $2\\cdot(2^{bh(x)-1}-1)+1=2^{bh(x)}-1$", "任一根到葉路徑上至少一半是黑節點（紅節點不相鄰），所以 $bh(root)\\ge h/2$", "$n\\ge 2^{h/2}-1$ ⇒ $h\\le2\\lg(n+1)$"], "labs": ["bst"], "body": "## 1. 二元樹的基本性質\n\n- 第 $i$ 層（根為第 0 層）最多 $2^i$ 個節點；高度 $h$ 最多 $2^{h+1}-1$ 個。\n- $n_0=n_2+1$（$n_k$＝度數 $k$ 的節點數）。證明：邊數 $n-1=n_1+2n_2$，又 $n=n_0+n_1+n_2$。\n- $n$ 個節點的二元樹有 $2n$ 個指標、$n-1$ 個被用到，所以 $n+1$ 個空指標（引線二元樹用它們）。\n- $n$ 個節點的完全二元樹高度 $\\lfloor\\lg n\\rfloor$。\n- $n$ 個節點的二元樹**形狀**數是 Catalan $C_n$。\n\n> [!考點] 走訪能否唯一決定樹\n> 前序＋中序、後序＋中序、層序＋中序：可以（中序能分出左右子樹）。前序＋後序：**不行**，除非是 full binary tree（每個節點 0 或 2 個孩子）。例如只有根和一個孩子時，左孩子和右孩子的前序、後序都一樣。\n\n## 2. BST\n\n搜尋、插入、刪除都是 $O(h)$。刪除有兩個孩子的節點：用中序後繼（右子樹最小）或前驅取代。\n\n- 隨機插入順序建成的 BST：期望高度 $O(\\lg n)$；平均節點深度 $\\approx2\\ln n\\approx1.39\\lg n$（和 quicksort 的比較次數是同一個式子）。\n- 依排序後的順序插入：退化成鏈，高度 $n-1$。\n- 中序走訪 $\\Theta(n)$；從最小值開始呼叫 $n-1$ 次 successor 也是 $\\Theta(n)$（每條邊最多走兩次）。\n\n@lab bst\n\n## 3. AVL 樹\n\n每個節點左右子樹高度差 $\\le1$。令 $N(h)$＝高度 $h$ 的 AVL 樹最少節點數：\n$$N(h)=N(h-1)+N(h-2)+1,\\quad N(0)=1,N(1)=2\\ \\Rightarrow\\ N(h)=F_{h+3}-1$$\n所以 $h<1.4405\\lg(n+2)-0.3277$。\n\n| 失衡型 | 判斷（以失衡節點 $z$ 與新節點位置） | 修正 |\n|---|---|---|\n| LL | 插在 $z$ 左子的左子樹 | 對 $z$ 右旋 |\n| RR | 插在右子的右子樹 | 對 $z$ 左旋 |\n| LR | 插在左子的右子樹 | 先對左子左旋，再對 $z$ 右旋 |\n| RL | 插在右子的左子樹 | 先對右子右旋，再對 $z$ 左旋 |\n\n- **插入**：只需修正最低的那個失衡祖先，**最多一次**（單或雙）旋轉，之後整棵樹恢復平衡（因為子樹高度回到插入前）。\n- **刪除**：旋轉後子樹高度可能變矮，失衡會往上傳，最多 $O(\\lg n)$ 次旋轉。\n\n## 4. 紅黑樹\n\n性質：(1) 每個節點紅或黑；(2) 根黑；(3) NIL 葉子黑；(4) 紅節點的孩子都黑；(5) 任一節點到其下所有葉子的路徑黑節點數相同。\n\n- 高度 $\\le2\\lg(n+1)$。\n- 插入：新節點塗紅；修正最多 $O(\\lg n)$ 次重新著色、**最多 2 次旋轉**。刪除：**最多 3 次旋轉**。\n- 與 **2-3-4 樹**一一對應：黑節點連同它的紅孩子合成一個 2、3 或 4 節點。插入的 case 1（叔叔紅）對應 4-節點分裂。\n\n| 比較 | AVL | 紅黑 |\n|---|---|---|\n| 高度上界 | $\\approx1.44\\lg n$ | $2\\lg(n+1)$ |\n| 搜尋 | 較快（較矮） | 稍慢 |\n| 插入旋轉 | $\\le2$（一次雙旋轉） | $\\le2$ |\n| 刪除旋轉 | $O(\\lg n)$ | $\\le3$ |\n\n> [!陷阱] 多選題常見敘述\n> - 「任何 AVL 樹都可以塗色成合法的紅黑樹」✓；反之 ✗。\n> - 「全部都是黑節點的紅黑樹是完美平衡（所有葉子同深度）」✓。\n> - 「紅黑樹中從根到葉的最長路徑不超過最短路徑的兩倍」✓。\n> - 「把 $n$ 個鍵依序插入 AVL 後中序走訪是排序好的」✓，這是 BST 的性質。\n> - 「AVL 刪除後最多一次旋轉」✗。\n\n## 5. Splay tree 與其他\n\n每次存取把該節點用 zig、zig-zig、zig-zag 轉到根。位能 $\\Phi=\\sum_x\\lg(\\text{size}(x))$；Access Lemma：splay 節點 $x$ 的攤銷成本 $\\le3(r(\\text{root})-r(x))+1$，所以每次操作攤銷 $O(\\lg n)$，**單次最壞 $O(n)$**。有「最近存取的東西很快」的特性（working set）。\n\n- **Treap**：鍵值滿足 BST、隨機優先權滿足 heap，期望高度 $O(\\lg n)$。\n- **Order-statistic tree**：每個節點多存子樹大小，OS-SELECT 與 OS-RANK 都 $O(\\lg n)$，旋轉時大小可 $O(1)$ 維護。\n- **Interval tree**：每個節點多存子樹內最大右端點，查詢重疊區間 $O(\\lg n)$。"}, {"id": "ds-hash", "subject": "ds", "title": "雜湊", "mins": 130, "summary": "", "feynman": "在均勻雜湊（uniform hashing）假設下，證明開放定址法失敗搜尋的期望探測次數至多 1/(1 − α)。推理鏈要說明：第 1 次探測撞到已佔位的機率、第 2 次在第 1 次撞到的條件下的機率為什麼是 (n−1)/(m−1)，用「至少 i 次探測」的機率連乘，再把期望值寫成這些機率的和，最後化成等比級數。", "recall": ["鏈結法成功與失敗搜尋的期望時間。", "均勻雜湊假設下開放定址失敗搜尋的期望探測數，推導想法是什麼？", "線性探測的成功／失敗搜尋（Knuth 公式）。primary 與 secondary clustering 差在哪？", "Universal hashing 的定義與一個構造。", "雙重雜湊的 $h_2$ 要滿足什麼？"], "rubric": ["用 $E[X]=\\sum_{i\\ge1}\\Pr\\{X\\ge i\\}$", "至少要第 i 次探測 ⇔ 前 i−1 次都撞到佔用的格子", "均勻雜湊下第 j 次撞到的條件機率 $\\frac{n-j+1}{m-j+1}\\le\\frac nm=\\alpha$", "所以 $\\Pr\\{X\\ge i\\}\\le\\alpha^{i-1}$", "$E[X]\\le\\sum_{i\\ge1}\\alpha^{i-1}=\\frac{1}{1-\\alpha}$（需要 $\\alpha<1$）"], "labs": ["hash"], "body": "## 1. 雜湊函數\n\n- **除法**：$h(k)=k\\bmod m$。$m$ 取不接近 2 的冪次的質數；$m=2^p$ 只看低 $p$ 位元，$m=2^p-1$ 對字串排列不敏感。\n- **乘法**：$h(k)=\\lfloor m(kA\\bmod1)\\rfloor$，$m$ 可取 $2^p$，Knuth 建議 $A\\approx(\\sqrt5-1)/2$。\n- **Universal hashing**：一族函數 $\\mathcal H$，任兩個相異鍵碰撞的機率 $\\le1/m$。構造 $h_{ab}(k)=((ak+b)\\bmod p)\\bmod m$，$p$ 為大於所有鍵的質數，$a\\in\\{1..p-1\\},b\\in\\{0..p-1\\}$。對**任何**輸入（甚至惡意的），期望鏈長 $\\le1+\\alpha$。\n\n## 2. 鏈結法\n\n負載因子 $\\alpha=n/m$。在簡單均勻雜湊下：失敗搜尋 $\\Theta(1+\\alpha)$；成功搜尋 $\\Theta(1+\\alpha/2-\\alpha/2n)$。$n=O(m)$ 時都是 $O(1)$。最壞情況全部撞在同一格，$\\Theta(n)$。\n\n## 3. 開放定址\n\n| 方法 | 探測序列 | 不同序列數 | 問題 |\n|---|---|---|---|\n| 線性 | $h(k)+i$ | $m$ | **primary clustering**：連續的佔用段越長越容易變更長 |\n| 二次 | $h(k)+c_1i+c_2i^2$ | $m$ | **secondary clustering**：初始位置相同的鍵走同一條路 |\n| 雙重 | $h_1(k)+i\\,h_2(k)$ | $\\Theta(m^2)$ | $h_2(k)$ 必須與 $m$ 互質（$m$ 取質數，或 $m=2^p$ 且 $h_2$ 為奇數） |\n\n@lab hash\n\n| 期望探測數 | 失敗搜尋／插入 | 成功搜尋 |\n|---|---|---|\n| 均勻雜湊（理想） | $\\le\\frac1{1-\\alpha}$ | $\\le\\frac1\\alpha\\ln\\frac1{1-\\alpha}$ |\n| 線性探測（Knuth） | $\\approx\\frac12\\left(1+\\frac1{(1-\\alpha)^2}\\right)$ | $\\approx\\frac12\\left(1+\\frac1{1-\\alpha}\\right)$ |\n\n$\\alpha=0.5$：均勻雜湊失敗 2 次、線性探測 2.5 次；$\\alpha=0.9$：均勻 10 次、線性 50.5 次。\n\n> [!考點] 刪除\n> 開放定址不能直接把格子清空，否則之後的搜尋會在這裡提早停下而漏找。要放 **DELETED 標記**（墓碑）：搜尋時跳過、插入時可覆蓋。墓碑多了搜尋變慢，因此需要刪除的場合偏好鏈結法。\n\n> [!考點] 二次探測何時保證找得到空位\n> $m$ 為質數且表格至少半空時，$h(k)+i^2$ 的前 $\\lceil m/2\\rceil$ 個探測位置互不相同，所以一定插得進去。超過半滿就可能失敗。\n\n## 4. 進階\n\n- **完美雜湊（FKS）**：靜態集合，兩層 universal hashing；第二層第 $j$ 格大小 $n_j^2$，期望總空間 $O(n)$，**最壞 $O(1)$ 搜尋**。\n- **Cuckoo hashing**：兩個表、兩個函數，每個鍵只可能在兩個位置之一，搜尋最壞 $O(1)$；插入時把佔位者踢到它的另一個位置。\n- **Bloom filter**：$m$ 位元、$k$ 個雜湊函數；沒有偽陰性，偽陽性率 $\\approx(1-e^{-kn/m})^k$，最佳 $k=\\frac mn\\ln2$。不能刪除（counting Bloom filter 可以）。\n- **生日問題**：$n$ 個鍵丟進 $m$ 格，$n\\approx\\sqrt{2m\\ln2}\\approx1.18\\sqrt m$ 時碰撞機率約 1/2。\n- **可擴充雜湊（extendible hashing）**：目錄大小 $2^d$，桶滿時分裂，必要時目錄加倍，適合磁碟。"}, {"id": "ds-btree", "subject": "ds", "title": "B 樹、B+ 樹、Trie 與跳躍串列", "mins": 110, "summary": "", "feynman": "證明最小度數為 t 的 B 樹，若有 n ≥ 1 個鍵，高度 h ≤ log_t((n+1)/2)。推理鏈要從「每層至少有多少個節點」開始：根至少 1 個鍵、2 個孩子；之後每個節點至少 t 個孩子；把每層節點數乘上每節點的最少鍵數加起來，得到 n 的下界，再取對數。也請說明這對磁碟存取次數的意義。", "recall": ["最小度數 t 的 B 樹，每個節點的鍵數範圍？高度上界？", "由上而下插入時，為什麼遇到滿節點要先分裂？", "B 樹刪除的三種情況（CLRS）。", "B+ 樹與 B 樹的差異；為什麼資料庫用 B+ 樹？", "跳躍串列的期望高度與期望空間。"], "rubric": ["根至少 1 個鍵；非根節點至少 $t-1$ 個鍵、至少 $t$ 個孩子", "深度 1 至少 2 個節點，深度 i 至少 $2t^{i-1}$ 個節點", "$n\\ge1+(t-1)\\sum_{i=1}^h2t^{i-1}=1+2(t-1)\\frac{t^h-1}{t-1}=2t^h-1$", "得 $t^h\\le(n+1)/2$，$h\\le\\log_t\\frac{n+1}2$", "每層一次磁碟讀取，t 很大（數百）時高度只有 2～4，所以磁碟 I/O 是 $O(\\log_t n)$"], "labs": [], "body": "## 1. B 樹（CLRS 定義，最小度數 $t\\ge2$）\n\n- 非根節點有 $t-1$ 到 $2t-1$ 個鍵（$t$ 到 $2t$ 個孩子）；根至少 1 個鍵。\n- 所有葉子同深度。高度 $h\\le\\log_t\\frac{n+1}2$。\n- 高度 $h$ 時，鍵數最少 $2t^h-1$，最多 $(2t)^{h+1}-1$。\n- 搜尋：$O(\\log_t n)$ 次磁碟存取，CPU 時間 $O(t\\log_t n)$（節點內二分搜尋可降為 $O(\\lg n)$）。\n- $t=2$ 就是 **2-3-4 樹**。另一套定義用「階數 $m$」（Knuth）：每節點最多 $m$ 個孩子、非根至少 $\\lceil m/2\\rceil$ 個；2-3 樹是 $m=3$。\n\n> [!考點] 插入：先分裂再往下走\n> 從根往下找插入位置時，**遇到滿節點（$2t-1$ 鍵）就先分裂**：中間鍵上提到父節點，左右各留 $t-1$ 個鍵。因為父節點在上一步保證不滿，所以上提一定放得下，只需單趟往下（one pass）。根滿時分裂會讓樹長高一層，這是 B 樹**唯一長高的方式**（從根往上長）。\n\n## 2. 刪除（CLRS 三種情況，保證往下走之前子節點至少有 $t$ 個鍵）\n\n1. 鍵在葉子：直接刪。\n2. 鍵在內部節點 $x$：(a) 前面的孩子有 $\\ge t$ 鍵 → 用前驅取代並遞迴刪前驅；(b) 後面的孩子有 $\\ge t$ 鍵 → 用後繼；(c) 兩個孩子都只有 $t-1$ 鍵 → 把鍵與兩個孩子合併成一個 $2t-1$ 鍵的節點再遞迴。\n3. 鍵不在 $x$：要下去的孩子只有 $t-1$ 鍵時先補：(a) 相鄰兄弟有 $\\ge t$ 鍵 → 透過父節點**借**一個（旋轉）；(b) 兄弟也只有 $t-1$ → 和兄弟及父節點的分隔鍵**合併**。根若被合併到空，樹變矮一層。\n\n## 3. B+ 樹\n\n- 所有資料（或指向資料的指標）都在**葉子**，內部節點只放索引鍵的副本。\n- 葉子串成鏈結串列，**範圍查詢**很快。\n- 內部節點不存資料，fan-out 更大，樹更矮。\n- 每次搜尋都要走到葉子（B 樹可能在內部節點就找到）。\n\n## 4. Trie 與字串結構\n\n- Trie：搜尋長度 $m$ 的字串 $O(m)$，與字串數無關；空間大。壓縮成 Patricia（radix tree）把單一孩子的鏈合併。\n- Suffix tree：$O(n)$ 建構，$O(m)$ 查子字串；suffix array $O(n\\lg n)$ 建、$O(m\\lg n)$ 查。\n\n## 5. 跳躍串列\n\n每個元素以機率 $p$（常取 1/2）升一層。期望高度 $O(\\lg n)$，期望空間 $O(n)$（$n/(1-p)$），搜尋、插入、刪除期望 $O(\\lg n)$。是用隨機性取代平衡樹的旋轉。\n\n> [!陷阱] 多選題常見敘述\n> - 「B 樹的插入可能讓樹在葉子端長高」✗：只在根分裂時長高。\n> - 「B 樹的節點越大越好」：要配合磁碟頁大小，一個節點剛好一頁。\n> - 「2-3-4 樹與紅黑樹是等價的」✓（一對多對應：3-節點有兩種紅黑表示）。\n> - 「在 B+ 樹中，內部節點的鍵一定也出現在葉子」✗：插入時分隔鍵是從葉子複製上去的，但刪除葉子中的鍵後，內部節點的分隔鍵可以保留不改，此時它已不在葉子裡。"}, {"id": "ds-unionfind", "subject": "ds", "title": "Disjoint Set（Union-Find）", "mins": 90, "summary": "", "feynman": "證明只用 union by rank（不用路徑壓縮）時，rank 為 r 的根，其樹至少有 2^r 個節點，因此樹高 ≤ ⌊lg n⌋，每次 FIND 為 O(lg n)。推理鏈要對 UNION 次數歸納：說明兩棵 rank 不同的樹合併時 rank 不變、為什麼不等式仍成立；rank 相同時新 rank 為 r+1、節點數為什麼至少 2^{r+1}。", "recall": ["鏈結串列表示法加 weighted-union 的總時間是多少？", "Union by rank 單獨使用時，樹高上界與證明想法。", "兩個啟發式一起用的時間界？$\\alpha(n)$ 有多小？", "Union-Find 在哪些演算法中用到？"], "rubric": ["只用 union by rank 時 rank 就是樹高（沒有壓縮）", "基底：單一節點 rank 0、大小 $1=2^0$", "rank 不同的兩根：較低者接到較高者下，較高者 rank 不變、大小只增加", "rank 相同（都是 r）：新根 rank 變 r+1，大小 $\\ge2^r+2^r=2^{r+1}$", "大小 $\\le n$ ⇒ $2^r\\le n$ ⇒ 高度 $\\le\\lfloor\\lg n\\rfloor$，FIND 為 $O(\\lg n)$"], "labs": ["uf"], "body": "## 1. 操作與表示\n\nMAKE-SET、UNION、FIND-SET。$n$ 次 MAKE-SET 加總共 $m$ 次操作（$m\\ge n$）。\n\n| 表示法 | 時間 |\n|---|---|\n| 鏈結串列（每個元素存代表指標） | UNION 要改 $\\Theta(n)$ 個指標；最壞 $\\Theta(m+n^2)$ |\n| 鏈結串列＋weighted union（短的接到長的） | $O(m+n\\lg n)$：每個元素的代表指標最多被改 $\\lg n$ 次（每次改它所在集合至少加倍） |\n| 森林＋union by rank | $O(m\\lg n)$ |\n| 森林＋路徑壓縮 | $\\Theta(n+f\\cdot(1+\\log_{2+f/n}n))$，$f$ 為 FIND 次數 |\n| 森林＋兩者都用 | $O(m\\,\\alpha(n))$ |\n\n@lab uf\n\n## 2. Rank 的性質\n\n- rank 沿著往根的路徑**嚴格遞增**。\n- rank 為 $r$ 的節點，子樹至少 $2^r$ 個節點（建立時），所以 rank $\\le\\lfloor\\lg n\\rfloor$。\n- rank 恰為 $r$ 的節點至多 $n/2^r$ 個。\n- 路徑壓縮後 rank 不再等於高度，只是高度的上界。\n\n$\\alpha(n)$ 是 Ackermann 函數的反函數，對 $n<10^{80}$ 都 $\\le4$，實務上可視為常數，但理論上**不是** $O(1)$。\n\n## 3. 應用\n\n- Kruskal MST：判斷邊的兩端是否已連通。\n- 無向圖的連通元件（離線、可邊加邊）、判斷加邊是否形成環。\n- Tarjan 離線 LCA。\n- 等價關係與有限自動機的等價測試。\n- 影像的連通區域標記。\n\n> [!陷阱] 多選題常見敘述\n> - 「Union-Find 可以有效支援刪除邊（拆開集合）」✗。\n> - 「用了兩個啟發式之後每次操作都是 $O(\\alpha(n))$」✗：是攤銷界，單次 FIND 仍可能 $O(\\lg n)$。\n> - 「union by size 也能保證 $O(\\lg n)$ 高度」✓。"}, {"id": "ds-graph", "subject": "ds", "title": "圖的表示、BFS、DFS、拓撲排序與連通性", "mins": 160, "summary": "", "feynman": "證明「有向圖 G 無環 ⇔ DFS 沒有產生後向邊」。兩個方向都要講：⇒ 用後向邊直接構造出一個環；⇐ 假設有環，取環上第一個被發現的點 v，用白路徑定理說明環上 v 的前一個點 u 會成為 v 的後代，所以 (u, v) 是後向邊。", "recall": ["鄰接矩陣與鄰接串列各操作的時間與空間。", "DFS 的括號定理與白路徑定理。", "有向圖 DFS 的四種邊怎麼用 d、f 判斷？無向圖有哪幾種？", "Kosaraju 求 SCC 的步驟與正確性關鍵。", "Articulation point 與 bridge 的 low 判準。"], "rubric": ["⇒（逆否）：若有後向邊 (u,v)，v 是 u 的祖先，樹路徑 v⇝u 加上 (u,v) 形成環", "⇐：設 G 有環 c，令 v 為 c 上第一個被發現的點，u 為環上 v 的前一點", "在 v.d 時刻，環上其他點都是白色，存在白路徑 v⇝u", "白路徑定理 ⇒ u 成為 v 的後代", "所以 (u,v) 是從後代指向祖先的邊，即後向邊"], "labs": ["graph"], "body": "## 1. 表示法\n\n| | 鄰接矩陣 | 鄰接串列 |\n|---|---|---|\n| 空間 | $\\Theta(V^2)$ | $\\Theta(V+E)$ |\n| 判斷 $(u,v)$ 是否為邊 | $O(1)$ | $O(\\deg u)$ |\n| 列出 $u$ 的鄰居 | $\\Theta(V)$ | $\\Theta(\\deg u)$ |\n| 求轉置 $G^T$ | $O(V^2)$ | $O(V+E)$ |\n| 適合 | 稠密圖、Floyd | 稀疏圖、BFS/DFS |\n\n無向圖 $\\sum\\deg=2|E|$；有向圖 $\\sum$ out-degree $=\\sum$ in-degree $=|E|$。\n\n> [!考點] 在 $O(V)$ 時間判斷 universal sink\n> 鄰接矩陣中找入度 $V-1$、出度 0 的點：從 $(1,1)$ 出發，$a_{ij}=1$ 就往下（$i$ 不是 sink），否則往右，最多 $2V$ 步得到唯一候選，再檢查一次。\n\n## 2. BFS\n\n- 求無權圖的最短距離；BFS 樹上的路徑就是最短路徑。$O(V+E)$。\n- 無向圖的 BFS 中，非樹邊只連同層或相鄰層的點。\n- 判斷二分圖：BFS 兩色著色，遇到同層邊（奇環）就不是。\n\n## 3. DFS\n\n- **括號定理**：任兩點 $u,v$ 的區間 $[u.d,u.f]$、$[v.d,v.f]$ 不是互斥就是包含；包含 ⇔ 祖孫關係。\n- **白路徑定理**：$v$ 是 $u$ 的後代 ⇔ 在 $u.d$ 時有一條全白的路徑從 $u$ 到 $v$。\n\n| 邊 $(u,v)$ | 探索時 $v$ 的顏色 | 時間關係 |\n|---|---|---|\n| 樹邊 | 白 | $u.d<v.d<v.f<u.f$，且由 $u$ 發現 $v$ |\n| 前向邊 | 黑 | $u.d<v.d<v.f<u.f$ |\n| 後向邊 | 灰 | $v.d\\le u.d<u.f\\le v.f$ |\n| 交叉邊 | 黑 | $v.d<v.f<u.d<u.f$ |\n\n**無向圖只有樹邊與後向邊**。\n\n@lab graph\n\n## 4. 拓撲排序\n\n- 依 DFS 完成時間 $f$ **遞減**排列；或 Kahn 演算法（反覆拿掉入度 0 的點）。$O(V+E)$。\n- 拓撲順序唯一 ⇔ 存在漢米頓路徑（順序中相鄰的兩點之間都有邊）。\n\n## 5. 強連通元件（SCC）\n\n**Kosaraju**：(1) 對 $G$ 做 DFS 算 $f$；(2) 求 $G^T$；(3) 依 $f$ 遞減的順序對 $G^T$ 做 DFS，每棵樹是一個 SCC。$O(V+E)$。關鍵引理：若 SCC $C$ 到 $C'$ 有邊，則 $f(C)>f(C')$（$f(C)$ 是 $C$ 中最大的完成時間）。SCC 縮點後的圖一定是 DAG。\n\n**Tarjan**：一次 DFS，用 low-link 值與堆疊。\n\n## 6. 雙連通\n\n$low[u]=\\min(u.d,\\ \\text{後代經一條後向邊能到的最小 } d)$。\n\n- 根是 articulation point ⇔ 在 DFS 樹中有 $\\ge2$ 個孩子。\n- 非根 $u$ 是 articulation point ⇔ 有孩子 $v$ 使 $low[v]\\ge u.d$。\n- 樹邊 $(u,v)$ 是 bridge ⇔ $low[v]>u.d$。\n- Bridge 一定不在任何環上；雙連通元件以邊來劃分，articulation point 可以屬於多個元件。\n\n## 7. 歐拉路徑\n\n| | 歐拉迴路 | 歐拉路徑 |\n|---|---|---|\n| 無向（連通） | 所有點度數為偶數 | 恰 0 或 2 個奇度點 |\n| 有向（弱連通，邊都在同一個 SCC） | 每點入度＝出度 | 恰一點出度多 1、一點入度多 1，其餘相等 |\n\nHierholzer 演算法 $O(E)$。對照：漢米頓迴路是 NP-complete。\n\n> [!陷阱] 多選題常見敘述\n> - 「DFS 樹與 BFS 樹一定不同」✗（例如樹狀圖本身）。\n> - 「有向圖中若 $u.d<v.d$，則 $v$ 是 $u$ 的後代」✗（可能是交叉邊的另一端）。\n> - 「把 DFS 完成時間遞增排列就是拓撲順序」✗，要遞減。\n> - 「在有向圖上用 DFS 找環時，碰到黑色點就是有環」✗，要碰到**灰色**點。\n> - 「BFS 可以找有權圖的最短路徑」✗，除非權重都相同（或 0/1 權重用 0-1 BFS 的雙端佇列）。"}, {"id": "al-recurrence", "subject": "al", "title": "漸近符號與遞迴式（Master、Akra–Bazzi、變數變換）", "mins": 140, "summary": "", "feynman": "用遞迴樹解釋 Master theorem 三種情況各自「成本集中在哪裡」：根、每層平均、還是葉子。要用 a、b、f(n) 說明每一層的總成本如何變化，最後用 T(n)=3T(n/4)+n lg n 走一遍並驗證 regularity 條件。", "recall": ["寫出 $O,\\Omega,\\Theta,o,\\omega$ 的嚴格定義（含量詞）。", "Master theorem 三種情況與 case 3 的 regularity 條件；$T(n)=2T(n/2)+n/\\lg n$ 屬於哪一種？", "$T(n)=2T(\\sqrt n)+\\lg n$ 怎麼解？", "把 $\\lg(n!)$、$(\\lg n)!$、$n^{\\lg\\lg n}$、$2^{\\sqrt{2\\lg n}}$ 由小到大排。"], "rubric": ["第 $j$ 層有 $a^j$ 個子問題、大小 $n/b^j$，該層總成本 $a^j f(n/b^j)$", "葉子有 $n^{\\log_b a}$ 個，葉子層總成本 $\\Theta(n^{\\log_b a})$", "Case 1：各層成本由根往葉幾何遞增，總和由葉子主導", "Case 2：各層成本相同量級，乘上 $\\log_b n$ 層，多一個 $\\lg$", "Case 3：各層成本幾何遞減、由根主導；regularity 正是「下一層總成本 ≤ c 倍這一層」", "例題寫出 $n^{\\log_4 3}\\approx n^{0.793}$，並驗證 $3\\cdot\\frac n4\\lg\\frac n4\\le\\frac34 n\\lg n$"], "labs": [], "body": "## 1. 定義與性質\n\n- $f=O(g)$：$\\exists c>0,n_0,\\ \\forall n\\ge n_0:\\ 0\\le f(n)\\le cg(n)$。\n- $f=o(g)$：$\\forall c>0,\\ \\exists n_0,\\ \\forall n\\ge n_0:\\ 0\\le f(n)<cg(n)$，等價於 $\\lim f/g=0$（若極限存在）。\n- $\\Theta$ = 同時 $O$ 與 $\\Omega$。\n\n> [!陷阱] 多選題常見陷阱\n> - $2^{2n}\\ne O(2^n)$；但 $2^{n+1}=O(2^n)$。\n> - $\\lg(n!)=\\Theta(n\\lg n)$，但 $n!\\ne\\Theta(n^n)$（$n!=o(n^n)$）。\n> - 不是所有函數都能比較：$n$ 與 $n^{1+\\sin n}$。\n> - $f=O(g)$ 不保證 $2^f=O(2^g)$（例：$f=2n,g=n$）。\n> - $f(n)=O(f(n)^2)$ 不一定成立（$f<1$ 時）。\n> - $f+o(f)=\\Theta(f)$ 成立。\n\n### 常考的大小順序（由小到大）\n$$1\\prec \\lg^*n\\prec \\lg\\lg n\\prec \\sqrt{\\lg n}\\prec\\lg n\\prec \\lg^2 n\\prec 2^{\\sqrt{2\\lg n}}\\prec n^{\\varepsilon}\\prec n\\prec n\\lg n=\\Theta(\\lg n!)\\prec n^2\\prec (\\lg n)!\\prec n^{\\lg\\lg n}=(\\lg n)^{\\lg n}\\prec 2^n\\prec n!\\prec 2^{2^n}$$\n（$\\lg(\\lg^* n)\\prec\\lg^*(\\lg n)$，因後者 $=\\lg^*n-1=\\Theta(\\lg^*n)$。$(\\lg n)!$ 比任何多項式大（取 log 得 $\\Theta(\\lg n\\lg\\lg n)$），但由 $m!<m^m$ 知 $(\\lg n)!=o((\\lg n)^{\\lg n})=o(n^{\\lg\\lg n})$：兩者取 log 同階，要更細地比。）\n\n## 2. Master theorem\n\n$T(n)=aT(n/b)+f(n)$，$a\\ge1,b>1$，令 $n^{\\log_b a}$ 為「葉子總成本」。\n\n| 情況 | 條件 | 結果 |\n|---|---|---|\n| 1 | $f(n)=O(n^{\\log_b a-\\varepsilon})$ | $\\Theta(n^{\\log_b a})$ |\n| 2 | $f(n)=\\Theta(n^{\\log_b a}\\lg^k n)$, $k\\ge0$ | $\\Theta(n^{\\log_b a}\\lg^{k+1}n)$ |\n| 3 | $f(n)=\\Omega(n^{\\log_b a+\\varepsilon})$ 且 $af(n/b)\\le cf(n)$, $c<1$ | $\\Theta(f(n))$ |\n\n> [!考點] 落在縫隙的情況（擴充版）\n> $f(n)=\\Theta(n^{\\log_b a}\\lg^k n)$：$k>-1\\Rightarrow\\Theta(n^{\\log_b a}\\lg^{k+1}n)$；$k=-1\\Rightarrow\\Theta(n^{\\log_b a}\\lg\\lg n)$；$k<-1\\Rightarrow\\Theta(n^{\\log_b a})$。\n> 例：$T(n)=2T(n/2)+n/\\lg n=\\Theta(n\\lg\\lg n)$——原始 Master 不適用（$n/\\lg n$ 不比 $n$ 小一個多項式因子）。\n\n> [!例題] $T(n)=3T(n/4)+n\\lg n$\n+++ 看解答\n$n^{\\log_4 3}\\approx n^{0.793}$，$f=n\\lg n=\\Omega(n^{0.793+\\varepsilon})$。regularity：$3\\cdot\\frac n4\\lg\\frac n4\\le\\frac34 n\\lg n$，$c=3/4<1$ 成立。故 case 3，$\\Theta(n\\lg n)$。\n+++\n\n## 3. 遞迴樹與 Akra–Bazzi\n\n- $T(n)=T(n/3)+T(2n/3)+n$：每層成本 $\\le n$，最長路徑 $\\log_{3/2}n$ 層 → $\\Theta(n\\lg n)$。\n- $T(n)=T(n/2)+T(n/4)+T(n/8)+n$：每層成本是上一層的 $7/8$，等比級數 → $\\Theta(n)$。\n- **Akra–Bazzi**：$T(n)=\\sum a_iT(b_in)+g(n)$，找 $p$ 使 $\\sum a_ib_i^p=1$，則\n$$T(n)=\\Theta\\!\\left(n^p\\left(1+\\int_1^n\\frac{g(u)}{u^{p+1}}du\\right)\\right).$$\n例：$T(n)=T(n/3)+T(2n/3)+n$，$p=1$，積分 $=\\ln n$ → $\\Theta(n\\lg n)$。\n\n## 4. 變數變換與其他型\n\n| 遞迴式 | 方法 | 結果 |\n|---|---|---|\n| $T(n)=2T(\\sqrt n)+\\lg n$ | $m=\\lg n$，$S(m)=2S(m/2)+m$ | $\\Theta(\\lg n\\lg\\lg n)$ |\n| $T(n)=\\sqrt n\\,T(\\sqrt n)+n$ | 除以 $n$：$U(n)=U(\\sqrt n)+1$ | $\\Theta(n\\lg\\lg n)$ |\n| $T(n)=T(\\sqrt n)+1$ | | $\\Theta(\\lg\\lg n)$ |\n| $T(n)=T(n-1)+n$ | 展開 | $\\Theta(n^2)$ |\n| $T(n)=T(n-1)+\\lg n$ | | $\\Theta(n\\lg n)$ |\n| $T(n)=2T(n-1)+1$ | | $\\Theta(2^n)$ |\n| $T(n)=T(n-1)+T(n-2)+1$ | 特徵根 $\\varphi$ | $\\Theta(\\varphi^n)$ |\n| $T(n)=4T(n/2)+n^2\\sqrt n$ | case 3 | $\\Theta(n^{2.5})$ |\n\n> [!陷阱] 代入法的經典錯誤\n> 要證 $T(n)=2T(\\lfloor n/2\\rfloor)+1=O(n)$，假設 $T(n)\\le cn$ 得 $T(n)\\le cn+1$，**不能**說「所以 $O(n)$」——歸納假設要的是**完全相同的形式**。修正：假設 $T(n)\\le cn-d$，得 $cn-2d+1\\le cn-d$ 只要 $d\\ge1$。"}, {"id": "al-dc", "subject": "al", "title": "分治法：Strassen、Karatsuba、最近點對、FFT", "mins": 110, "summary": "", "feynman": "解釋最近點對的 O(n log n) 演算法合併步驟為什麼每個點只要和帶狀區域中、依 y 排序後的後面 7 個點比較。推理鏈要從「左右兩半各自的最近距離 δ」出發，用 δ×2δ 矩形內最多容納幾個點的論證推出常數。", "recall": ["Strassen 用幾次乘法？遞迴式與結果？", "最近點對合併步驟為何只需檢查常數個點？", "用 merge sort 數逆序對的關鍵一步。", "FFT 的 halving lemma 是什麼？多項式乘法的三步驟？"], "rubric": ["遞迴得 $\\delta=\\min(\\delta_L,\\delta_R)$；跨中線更近的點對，兩點都落在寬 $2\\delta$ 的帶狀區", "對帶狀區中的點 p，更近的點與 p 的 y 差 < δ，都落在一個 δ×2δ 矩形", "矩形切成 8 個 $\\frac\\delta2\\times\\frac\\delta2$ 方格，每格至多一點（同側兩點距離 ≥ δ，方格對角線 < δ）", "所以依 y 排序後每點只比後面 7 個，合併 O(n)", "y 序列預先排好（或隨 merge 維持），得 $T(n)=2T(n/2)+O(n)$"], "labs": [], "body": "## 1. 分治三步\n\nDivide → Conquer → Combine。時間通常寫成 $T(n)=aT(n/b)+D(n)+C(n)$。\n\n## 2. 經典分治\n\n| 問題 | 遞迴式 | 時間 |\n|---|---|---|\n| Merge sort | $2T(n/2)+n$ | $n\\lg n$ |\n| Binary search | $T(n/2)+1$ | $\\lg n$ |\n| 最大子陣列（分治） | $2T(n/2)+n$ | $n\\lg n$（Kadane 線性） |\n| Karatsuba 大數乘法 | $3T(n/2)+n$ | $n^{\\lg3}\\approx n^{1.585}$ |\n| Strassen 矩陣乘法 | $7T(n/2)+n^2$ | $n^{\\lg7}\\approx n^{2.807}$ |\n| 一般分治矩陣乘法 | $8T(n/2)+n^2$ | $n^3$ |\n| 最近點對 | $2T(n/2)+n$ | $n\\lg n$ |\n| Fibonacci 以矩陣快速冪 | $T(n/2)+1$ | $\\lg n$ 次矩陣乘法 |\n\n> [!考點] Karatsuba\n> $(a\\cdot 10^{m}+b)(c\\cdot10^m+d)=ac\\cdot10^{2m}+((a+b)(c+d)-ac-bd)\\cdot10^m+bd$，只要三次乘法。\n\n## 3. 最近點對\n\n依 $x$ 切兩半，遞迴得 $\\delta=\\min(\\delta_L,\\delta_R)$。只看中線兩側寬 $\\delta$ 的帶狀區域，依 $y$ 排序後，每點只需和後面 7 個比（$\\delta\\times2\\delta$ 矩形內，每個 $\\delta/2$ 小方格最多一點，共 8 格）。預先排序好 $y$ 序列，合併 $O(n)$。\n\n## 4. 逆序對\n\nMerge 時若右半的 $R[j]$ 先被放出去，它與左半剩下的 $n_1-i+1$ 個元素各構成一個逆序對。$O(n\\lg n)$。\n\n## 5. FFT（多項式乘法）\n\n係數表示相乘 $\\Theta(n^2)$。改成：(1) 在 $2n$ 個 $2n$ 次單位根求值（FFT, $\\Theta(n\\lg n)$）；(2) 逐點相乘 $\\Theta(n)$；(3) 內插回係數（inverse FFT，同樣 $\\Theta(n\\lg n)$）。\n\n**Halving lemma**：$n$ 為偶數時，$n$ 個 $n$ 次單位根的平方恰為 $n/2$ 個 $n/2$ 次單位根（各出現兩次）。所以 $A(x)=A_{even}(x^2)+xA_{odd}(x^2)$ 只需遞迴兩個一半大小的問題：$T(n)=2T(n/2)+\\Theta(n)$。"}, {"id": "al-dp", "subject": "al", "title": "動態規劃", "mins": 180, "summary": "", "feynman": "以矩陣鏈乘為例，講清楚「最佳子結構」到底是什麼意思：為什麼最佳加括號在第 k 個位置切開後，左右兩段各自也必須是最佳加括號？用剪貼論證（cut-and-paste）一步一步證明，並說明為什麼這個論證在「最長簡單路徑」會失敗。", "recall": ["DP 的兩個必要性質？為什麼「最長簡單路徑」不能用 DP？", "矩陣鏈乘的遞迴式與時間；加括號方式有幾種？", "LCS 遞迴式；只要長度時空間可以壓到多少？", "0/1 背包 $O(nW)$ 為什麼不是多項式時間？", "Optimal BST 的遞迴式中 $w(i,j)$ 的意義。"], "rubric": ["定義 $m[i,j]$ 與最後一次相乘的切點 k，成本 = 左 + 右 + $p_{i-1}p_kp_j$", "假設最佳解在 k 切開，但左段不是最佳加括號", "把左段換成更便宜的加括號（剪貼），總成本嚴格變小", "與原解最佳矛盾，所以左右兩段都必須是最佳", "最長簡單路徑：兩段各自最長，接起來可能重複頂點，剪貼後不再是合法解，論證失效"], "labs": ["dp"], "body": "## 1. 什麼時候用 DP\n\n1. **最佳子結構**：最佳解包含子問題的最佳解（用剪貼論證證明）。\n2. **重疊子問題**：遞迴會反覆解同一個子問題。\n\n時間 ≈（子問題數）×（每個子問題的選擇數）。Top-down memoization 只算用得到的子問題；bottom-up 常數較小。\n\n> [!陷阱] 最短簡單路徑有最佳子結構，**最長**簡單路徑沒有：兩段子路徑各自最長，接起來可能重複經過頂點。最長簡單路徑是 NP-hard；但在 DAG 上可用 DP 線性解。\n\n## 2. 經典題與遞迴式\n\n| 問題 | 狀態 | 遞迴式 | 時間 |\n|---|---|---|---|\n| 切鋼條 | $r_n$ | $\\max_{1\\le i\\le n}(p_i+r_{n-i})$ | $n^2$ |\n| 矩陣鏈乘 | $m[i,j]$ | $\\min_{i\\le k<j} m[i,k]+m[k+1,j]+p_{i-1}p_kp_j$ | $n^3$ |\n| LCS | $c[i,j]$ | 相等 $c[i-1,j-1]+1$，否則 $\\max(c[i-1,j],c[i,j-1])$ | $mn$ |\n| 編輯距離 | $d[i,j]$ | $\\min(d[i-1,j]+1,d[i,j-1]+1,d[i-1,j-1]+[x_i\\ne y_j])$ | $mn$ |\n| 0/1 背包 | $K[i,w]$ | $\\max(K[i-1,w],K[i-1,w-w_i]+v_i)$ | $nW$ |\n| LIS | $L[i]$ | $1+\\max_{j<i,a_j<a_i}L[j]$ | $n^2$（或 $n\\lg n$） |\n| Optimal BST | $e[i,j]$ | $\\min_{i\\le r\\le j}e[i,r-1]+e[r+1,j]+w(i,j)$ | $n^3$（Knuth 優化 $n^2$） |\n| Floyd–Warshall | $d^{(k)}_{ij}$ | $\\min(d^{(k-1)}_{ij},d^{(k-1)}_{ik}+d^{(k-1)}_{kj})$ | $V^3$ |\n| TSP（Held–Karp） | $C(S,j)$ | $\\min_{i\\in S}C(S\\setminus\\{j\\},i)+d_{ij}$ | $n^22^n$ |\n| 最少硬幣 | $M[a]$ | $1+\\min_i M[a-c_i]$ | $nA$ |\n\n@lab dp\n\n> [!例題] 矩陣鏈乘\n> 維度 $p=\\langle30,35,15,5,10,20,25\\rangle$（6 個矩陣）的最少純量乘法數？\n+++ 看解答\n$m[1,6]=15125$，最佳加括號 $((A_1(A_2A_3))((A_4A_5)A_6))$。加括號方式總數是 Catalan $C_{n-1}=C_5=42$，暴力不可行。\n+++\n\n> [!例題] LCS\n> $X=\\texttt{ABCBDAB}$、$Y=\\texttt{BDCABA}$ 的 LCS 長度？\n+++ 看解答\n長度 4，例如 `BCBA`（也有 `BDAB`、`BCAB`）。LCS 不唯一，但長度唯一。用上面的動畫切到 LCS 可以看整張表與回溯路徑。\n+++\n\n## 3. 空間與重建\n\n- LCS 只要長度：保留兩列，$O(\\min(m,n))$；要重建序列則需 Hirschberg（分治＋DP）才能 $O(\\min(m,n))$ 空間。\n- 背包可壓成一維陣列，但 $w$ 要**由大到小**更新（否則同一物品會被重複放入，變成無限背包）。\n\n## 4. 偽多項式\n\n0/1 背包 $O(nW)$：輸入大小是 $O(n\\lg W)$，$W$ 對輸入長度是**指數**，所以不是多項式時間。0/1 背包是（弱）NP-complete；分數背包可用 greedy 在 $O(n\\lg n)$ 解。\n\n## 5. LIS 的 $O(n\\lg n)$\n\n維護 `tail[k]` = 長度 $k+1$ 的遞增子序列中，最小可能的結尾。每個新元素二分搜尋取代第一個 $\\ge$ 它的位置。`tail` 的長度就是答案（`tail` 本身不一定是一個合法子序列）。"}, {"id": "al-greedy", "subject": "al", "title": "貪婪法：交換論證、Huffman、擬陣", "mins": 120, "summary": "", "feynman": "用交換論證證明 Huffman 編碼最佳。要講出兩個引理：(1) 頻率最小的兩個字元可以是最深層的兄弟；(2) 把它們合併成一個新字元後，子問題的最佳解加回去仍是原問題最佳解。每一步交換時，總成本為什麼不會變大要寫出式子。", "recall": ["證明 greedy 正確的兩件事？", "Activity selection 為什麼選「最早結束」？舉出「最短活動」「最早開始」的反例。", "Huffman 正確性的兩個引理。", "擬陣的兩個條件？哪個經典演算法是擬陣 greedy？"], "rubric": ["引理一：設 x、y 頻率最小，取任一最佳樹 T，把 x、y 與最深層的兄弟 a、b 交換", "交換後成本變化 $(f(a)-f(x))(d_T(a)-d_T(x))\\ge 0$ 的方向論證，成本不增", "引理二：x、y 合併成 z，$f(z)=f(x)+f(y)$，且 $B(T)=B(T')+f(x)+f(y)$", "若 T 不是最佳，存在更好的樹（x、y 為兄弟），合併後得到比 T' 更好的子問題解，矛盾", "以歸納法把兩個引理接起來，得 greedy 結果最佳"], "labs": [], "body": "## 1. 正確性證明的模板\n\n1. **Greedy-choice property**：存在一個最佳解包含 greedy 的第一個選擇（用交換論證：拿任一最佳解，把它的某個選擇換成 greedy 的，證明不會變差）。\n2. **最佳子結構**：做完 greedy 選擇後，剩下的子問題的最佳解與該選擇合起來就是原問題最佳解。\n\n## 2. Activity selection\n\n選最早結束的活動，再遞迴。反例：\n- 最短活動：`[1,5) [4,7) [6,10)` → 選 `[4,7)` 只得 1 個，最佳是 2 個。\n- 最早開始：`[1,10) [2,3) [4,5)` → 選 `[1,10)` 只得 1 個。\n- 衝突最少：有已知 11 個活動的反例。\n\n延伸：區間分割（最少教室）= 同一時間點最大重疊數；最小化最大延遲 → 依截止時間（EDF）排序。\n\n## 3. Huffman\n\n反覆合併頻率最小的兩棵樹，$O(n\\lg n)$。成本 $B(T)=\\sum_c f(c)\\,d_T(c)$。\n\n> [!例題] 頻率 a:45 b:13 c:12 d:16 e:9 f:5（千字元）\n+++ 看解答\n合併順序：f+e=14；c+b=25；14+d=30；25+30=55；a+55=100。碼長 a:1、b,c,d:3、e,f:4，總位元 $45+3(13+12+16)+4(9+5)=224$ 千位元；固定長度需 300 千位元。\n+++\n\n> [!考點] Huffman 性質\n> - 是**前綴碼**（prefix code），最佳前綴碼一定是 full binary tree。\n> - 合併時遇到平手，碼可能不同但總長相同。\n> - 頻率為 Fibonacci 數時，樹會長成一條斜線（最大碼長 $n-1$）。\n\n## 4. 背包\n\n分數背包：依單位價值 $v_i/w_i$ 遞減放，greedy 最佳。0/1 背包 greedy 會錯：容量 50，物品 (10, 60)、(20, 100)、(30, 120)，greedy 依比例先拿 60、100 共 160；最佳是 100+120=220。\n\n## 5. 擬陣（Matroid）\n\n$M=(S,\\mathcal I)$：(1) **遺傳性**：$B\\in\\mathcal I, A\\subseteq B\\Rightarrow A\\in\\mathcal I$；(2) **交換性**：$A,B\\in\\mathcal I,|A|<|B|\\Rightarrow\\exists x\\in B-A,\\ A\\cup\\{x\\}\\in\\mathcal I$。\n在擬陣上依權重由大到小、能加就加，得最大權獨立集。\n\n- **圖擬陣**（獨立集 = 無環邊集）→ Kruskal。\n- 單位工時任務、截止時間與懲罰的排程：「可以全部準時完成的任務集合」構成擬陣。\n\n## 6. Greedy 失敗的例子\n\n- 找零：幣值 $\\{1,3,4\\}$ 湊 6，greedy 給 4+1+1，最佳 3+3。美元幣值 $\\{1,5,10,25\\}$ 時 greedy 正確。\n- Belady 離線快取（踢掉最遠才會再用的）是最佳的，是 greedy 的正面例子。"}, {"id": "al-sp", "subject": "al", "title": "最短路徑：Bellman-Ford、Dijkstra、Johnson、Floyd–Warshall", "mins": 150, "summary": "", "feynman": "證明 Dijkstra 在非負權重下正確：當 u 被取出時 u.d = δ(s,u)。推理鏈要用反證，假設 u 是第一個取出時 d 不正確的點，找出最短路徑上第一個還沒取出的點 y，說明 y.d = δ(s,y) ≤ δ(s,u) ≤ u.d ≤ y.d 這串不等式每一步的理由，並指出哪一步用到「非負」。", "recall": ["鬆弛的四個性質（三角不等式、上界、無路徑、路徑鬆弛）。", "Dijkstra 用三種優先佇列的時間？負邊的最小反例？", "所有邊加同一常數，最短路徑會變嗎？乘以正常數呢？", "Johnson 的重新加權公式為何保持最短路徑、且非負？", "差分約束如何轉成最短路徑？"], "rubric": ["反證：令 u 是第一個被取出時 $u.d\\ne\\delta(s,u)$ 的點", "取 s 到 u 最短路徑上第一個未取出的點 y，其前驅 x 已取出", "x 取出時 $x.d=\\delta(s,x)$ 並鬆弛 (x,y)，所以 $y.d=\\delta(s,y)$", "非負權重 ⇒ $\\delta(s,y)\\le\\delta(s,u)$（指出這是唯一用到非負的地方）", "u 是最小 ⇒ $u.d\\le y.d$，串成 $y.d=\\delta(s,y)\\le\\delta(s,u)\\le u.d\\le y.d$，全部相等，矛盾"], "labs": ["graph"], "body": "## 1. 基本工具\n\n$\\delta(s,v)$：最短路徑權重。RELAX$(u,v)$：若 $v.d>u.d+w(u,v)$ 則更新。\n\n- **三角不等式**：$\\delta(s,v)\\le\\delta(s,u)+w(u,v)$。\n- **上界性質**：永遠 $v.d\\ge\\delta(s,v)$，一旦相等不再改變。\n- **路徑鬆弛**：若最短路徑 $s=v_0,\\dots,v_k$ 的邊**依序**被鬆弛過（中間可穿插其他鬆弛），則 $v_k.d=\\delta(s,v_k)$。\n\n## 2. 演算法比較\n\n| 演算法 | 限制 | 時間 |\n|---|---|---|\n| BFS | 無權 | $V+E$ |\n| DAG 最短路徑 | 無環（可負邊） | $V+E$ |\n| Dijkstra（陣列） | 非負 | $V^2$ |\n| Dijkstra（binary heap） | 非負 | $(V+E)\\lg V$ |\n| Dijkstra（Fibonacci heap） | 非負 | $E+V\\lg V$ |\n| Bellman-Ford | 可負邊、偵測負環 | $VE$ |\n| Floyd–Warshall（全點對） | 無負環 | $V^3$ |\n| Johnson（全點對、稀疏） | 無負環 | $VE\\lg V$（binary）/ $V^2\\lg V+VE$ |\n| 矩陣乘法式全點對 | | $V^3\\lg V$ |\n\n@lab graph\n\n> [!陷阱] Dijkstra 遇到負邊\n> $s\\to a$ 權 2、$s\\to b$ 權 3、$b\\to a$ 權 $-2$、$a\\to c$ 權 1。Dijkstra 先取出 $a$（$d=2$）並用它把 $c$ 設為 3；之後取出 $b$ 才發現 $a$ 可以是 1，但 $a$ 已經出佇列，不會再鬆弛 $a\\to c$。結果 $c.d=3$，實際 $\\delta(s,c)=2$。\n\n> [!陷阱] 所有邊加常數 $c$\n> 路徑長變成 $w(p)+c\\cdot|p|$，邊數不同的路徑被加的量不同，最短路徑**可能改變**；乘以正常數則不變。所以「把負邊全部加成非負再跑 Dijkstra」是錯的，Johnson 用的是**頂點位能**。\n\n## 3. Bellman-Ford\n\n做 $|V|-1$ 輪「鬆弛所有邊」，再檢查一輪：若還能鬆弛，存在從 $s$ 可達的負環。正確性來自路徑鬆弛性質（最短簡單路徑最多 $|V|-1$ 條邊）。\n\n**差分約束**：$x_j-x_i\\le b_k$ → 邊 $v_i\\to v_j$ 權重 $b_k$，再加一個源點 $v_0$ 到所有點權 0。有解 $\\iff$ 沒有負環，且 $x_i=\\delta(v_0,v_i)$ 是一組解。\n\n## 4. Johnson\n\n加新點 $q$ 連到所有點權 0，跑 Bellman-Ford 得 $h(v)=\\delta(q,v)$。重新加權 $\\hat w(u,v)=w(u,v)+h(u)-h(v)\\ge0$（三角不等式）。任一路徑 $\\hat w(p)=w(p)+h(v_0)-h(v_k)$，同起終點的路徑都加同一常數，最短路徑不變。再從每點跑 Dijkstra。\n\n## 5. Floyd–Warshall\n\n$d^{(k)}_{ij}$：中間點只能用 $\\{1..k\\}$ 時的最短距離。$O(V^3)$ 時間、可原地 $O(V^2)$ 空間。$d_{ii}<0$ 代表有負環。把 min/+ 換成 OR/AND 就是**遞移閉包**（Warshall）。\n\n## 6. DAG 與關鍵路徑\n\n依拓撲序鬆弛，$O(V+E)$；把權重取負就是**最長路徑**，即 PERT 的關鍵路徑。"}, {"id": "al-mst-flow", "subject": "al", "title": "最小生成樹與網路流", "mins": 160, "summary": "", "feynman": "證明 max-flow min-cut 定理中「殘餘網路沒有擴增路徑 ⇒ 存在一個割的容量等於流量」這一步。推理鏈要定義 S = 殘餘網路中 s 可達的點，然後說明跨割的每條正向邊為什麼滿載、每條反向邊為什麼流量為 0，最後得出 |f| = c(S,T)。", "recall": ["Cut property 的完整敘述。為什麼 Kruskal、Prim 都對？", "邊權相異時 MST 唯一的證明想法。", "Max-flow min-cut 定理的三個等價敘述。", "Edmonds-Karp 的時間與擴增次數。", "二分圖最大匹配如何轉成網路流？König 定理？"], "rubric": ["定義 S = 殘餘網路中 s 可達的點；沒有擴增路徑所以 t 不在 S", "S→T 的原邊必滿載：否則殘餘邊存在，對端可達，矛盾", "T→S 的原邊流量為 0：否則殘餘網路有反向邊，矛盾", "跨割淨流量 = c(S,T)，而任何割的淨流量都等於流量值", "由「流量 ≤ 任一割的容量」得 f 是最大流、(S,T) 是最小割"], "labs": ["graph"], "
