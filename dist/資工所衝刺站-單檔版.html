<script>
/* 資工所衝刺站 — 帶我讀：每天自動排好順序，一次只給你一件事 */
'use strict';

/* 短影音看到 90% 就記為看過（clips.js 會呼叫） */
window.onClipSeen = id => { const cs = S.st.clipSeen || (S.st.clipSeen = {}); if (!cs[id]) { cs[id] = D.today(); S.save(); try { renderGoPill(location.hash.slice(1) || 'go'); } catch (e) { } } };

const Auto = {
  /* ---------- 今天的步驟清單（每天第一次打開時排好，之後只更新完成狀態） ---------- */
  plan(force) {
    const today = D.today(), A = S.st.auto || (S.st.auto = {});
    if (!force && A.date === today && A.ids && A.ids.length) return A.ids;
    const st = S.st, day = S.planDay(), plan = (DATA.plan || []).find(p => p.day === day), ids = [];
    const yPlan = (DATA.plan || []).find(p => p.day === day - 1), yLog = st.log[D.add(today, -1)];
    if (day > 1 && ((yPlan && yPlan.lessons && yPlan.lessons.length) || (yLog && yLog.lessons && yLog.lessons.length))) ids.push('blurt');
    if (Learn.cardDue().length) ids.push('cards-due');
    if (S.dueReviews().length) ids.push('review');
    // 要讀的章：先補落後的，再讀今天的；依每天可用時數決定讀幾章
    const behind = []; for (const p of DATA.plan || []) if (p.day < day) for (const lid of p.lessons || []) if (!(st.lessons[lid] || {}).read) behind.push(lid);
    const todayL = ((plan && plan.lessons) || []).filter(l => !(st.lessons[l] || {}).read);
    const cap = Math.max(1, Math.min(3, Math.round((st.settings.dailyMinutes || 360) / 150)));
    const lessons = [...new Set([...behind, ...todayL])].slice(0, cap); // 落後的先補，再讀今天的
    if (day > 30 || (!plan && !lessons.length)) { const w = Learn.weakest(1)[0]; if (w) ids.push('weak:' + w.id); }
    for (const lid of lessons) {
      const l = LESSON[lid]; if (!l) continue; const ls = st.lessons[lid] || {};
      if (!ls.read && !ls.pre && this.chQs(lid).length >= 2) ids.push('pre:' + lid);
      if (typeof Clips !== 'undefined' && Clips.list.some(c => c.lesson === lid)) ids.push('clip:' + lid);
      ids.push('read:' + lid);
      if (this.chQs(lid).length) ids.push('quiz:' + lid);
      if (l.feynman && !['pending', 'pass', 'self'].includes(ls.gate)) ids.push('feyn:' + lid);
    }
    if (DATA.lessons.some(l => (st.lessons[l.id] || {}).gate === 'revise')) ids.push('revise');
    for (const g of (plan && plan.mocks) || []) ids.push('mock:' + g);
    ids.push('adaptive');
    if (Learn.newCards().length) ids.push('cards-new');
    ids.push('checkin');
    S.st.auto = { date: today, ids, skip: [] }; S.save();
    return ids;
  },
  chQs(lid) { return QBANK.all().filter(q => q.ch === lid && q.type !== 'essay' && q.src !== 'agent'); },

  /* ---------- 每種步驟的內容、完成條件、按下去做什麼 ---------- */
  def(id) {
    const [kind, arg] = id.split(':'), st = S.st, L = S.day(), l = arg ? LESSON[arg] : null, ls = arg ? (st.lessons[arg] || {}) : {}, short = l ? l.title.split(/[：（]/)[0] : '';
    const go = h => () => { location.hash = h; };
    switch (kind) {
      case 'blurt': return { icon: '📝', title: '晨間白紙回憶', sub: '不看書，把昨天讀的東西全部寫下來', why: '先提取再複習，記得最牢；寫不出來的地方就是今天要補的洞', mins: 10, done: !!L.blurt, act: () => blurtDialog() };
      case 'cards-due': { const n = Learn.cardDue().length; return { icon: '🃏', title: `必背卡：清掉到期的 ${n} 張`, sub: '陷阱判斷、考點、回想題', why: '這些卡依記憶模型算出你快忘了，今天複習一次效益最高', mins: Math.max(3, Math.ceil(n * .3)), done: n === 0, act: () => startCards({ noNew: true, title: '到期必背卡' }) }; }
      case 'review': { const n = S.dueReviews().length; return { icon: '🔁', title: `到期複習：${n} 題`, sub: '以前做過、現在快忘了的題目', why: '在快忘記時再做一次，記憶間隔會被拉長', mins: Math.max(3, Math.ceil(n * 1.5)), done: n === 0, act: () => Practice.start(S.dueReviews(), { title: '到期複習', review: true }) }; }
      case 'pre': return { icon: '🎯', title: `讀前預測驗：${short}`, sub: '還沒讀，先猜 3 題（猜錯沒關係）', why: '被問過的問題，讀的時候大腦會主動找答案', mins: 5, done: !!(ls.pre || ls.read), act: () => { const ids = rng(Date.now() & 0xffffffff).shuffle(this.chQs(arg).map(q => q.id)).slice(0, 3); Practice.start(ids, { title: '讀前預測驗：' + l.title, pretest: arg }); } };
      case 'clip': { const cs = Clips.list.filter(c => c.lesson === arg), seen = cs.filter(c => (st.clipSeen || {})[c.id]).length; return { icon: '🎬', title: `看 60 秒短片：${short}`, sub: `${cs.length} 支${seen ? `，已看 ${seen}` : ''}；看完會自動打勾`, why: '先用畫面抓直覺，讀推導時比較不會迷路', mins: cs.length * 1, done: seen >= cs.length, act: go('#' + arg) }; }
      case 'read': return { icon: '📖', title: `精讀：${l.title}`, sub: '讀完按頁面上方的「標記讀完」', why: '這是今天的主菜：遇到粗體與「考點」框要停下來自己推一遍', mins: Math.round(l.mins * .5), done: !!ls.read, act: go('#' + arg) };
      case 'quiz': { const cs = chapterStats(arg), need = Math.min(cs.n, 5); return { icon: '✍️', title: `本章練習：${short}`, sub: `${cs.att}/${need} 題｜每題先選信心度，錯了寫錯因`, why: '讀完馬上提取，才知道是真懂還是看過', mins: 15, done: cs.att >= need, act: () => { const qs = this.chQs(arg); const un = qs.filter(q => !st.answers[q.id]); Practice.start((un.length ? un : qs).map(q => q.id), { title: l.title + '｜本章練習', limit: 8 }); } }; }
      case 'feyn': return { icon: '🧠', title: `費曼關卡：${short}`, sub: '用自己的話把核心推理講一遍（至少 200 字）', why: '講得出完整因果鏈才算懂；Agent 會指出你跳步的地方', mins: 20, done: ['pending', 'pass', 'self'].includes(ls.gate), act: () => { location.hash = '#' + arg; setTimeout(() => { const f = $('#feyn'); if (f) f.scrollIntoView({ behavior: 'smooth' }); }, 300); } };
      case 'revise': { const r = DATA.lessons.filter(x => (st.lessons[x.id] || {}).gate === 'revise'); return { icon: '🛠️', title: `重交被退回的費曼關卡（${r.length} 章）`, sub: r.slice(0, 2).map(x => x.title.split(/[：（]/)[0]).join('、'), why: '被退回的那一步，正是考場上會失分的地方', mins: 20 * Math.max(1, r.length), done: !r.length, act: () => { if (r[0]) { location.hash = '#' + r[0].id; setTimeout(() => { const f = $('#feyn'); if (f) f.scrollIntoView({ behavior: 'smooth' }); }, 300); } } }; }
      case 'mock': { const g = GROUPS.find(x => x.id === arg); return { icon: '⏱️', title: `全真模考：${g.name}`, sub: `${g.mins} 分鐘，交卷前沒有回饋；考完要填反思單`, why: '在考試條件下提取，練時間分配', mins: g.mins + 15, done: (L.mocks || []).includes(arg), act: () => Practice.startMock(arg) }; }
      case 'weak': return { icon: '🎯', title: `補弱點：${short}`, sub: '針對掌握度最低的一章做自適應練習', why: '把分數最容易拉上來的地方先補起來', mins: 25, done: !!(L.weakDone || []).includes(arg), act: () => { (L.weakDone = L.weakDone || []).push(arg); S.save(); Practice.startAdaptive(arg); } };
      case 'adaptive': { const goal = st.settings.dailyQuestions || 30; return { icon: '⚡', title: `自適應練習（今天 ${L.q}/${goal} 題）`, sub: '系統挑你八成會對的題目，弱章優先', why: '難度剛好的題目學得最多；做到今天的題數目標為止', mins: Math.max(5, Math.ceil(Math.max(0, goal - L.q) * 1.3)), done: L.q >= goal, act: () => Practice.startAdaptive() }; }
      case 'cards-new': { const n = Math.min(Learn.newLeft(), Learn.newCards().length); return { icon: '🆕', title: `新的必背卡：${n} 張`, sub: '只會出你讀過的章節', why: '每天少量加新卡，考前才不會一次爆量', mins: Math.max(3, Math.ceil(n * .4)), done: n === 0, act: () => startCards({ title: '新的必背卡' }) }; }
      case 'mini-q': return { icon: '⚡', title: `保底：自適應 10 題（今天 ${Math.min(L.q, 10)}/10）`, sub: '只要 10 題，連續天數就不會斷', why: '累的時候也要維持「每天都有碰」：中斷才是最大的損失', mins: Math.max(3, Math.ceil(Math.max(0, 10 - L.q) * 1.3)), done: L.q >= 10, act: () => { Practice.startAdaptive(); Practice.sess.opts.limit = Math.max(1, 10 - L.q); } };
      case 'checkin': return { icon: '✅', title: '晚間打卡＋反省', sub: '誠實回報今天做了什麼、哪一步最不清楚', why: '寫下明天第一件事，隔天開機就不會發呆', mins: 5, done: !!L.checkin, act: () => checkinDialog(todayTasks()) };
    }
    return { icon: '•', title: id, sub: '', why: '', mins: 0, done: true, act: () => { } };
  },
  list() { const A = S.st.auto || {}, L = S.day(), skip = new Set(A.skip || []); const ids = L.minMode ? (L.minIds || ['mini-q', 'checkin']) : this.plan(); return ids.map(id => Object.assign({ id, skipped: skip.has(id) }, this.def(id))); },
  minMode(on) { const L = S.day(); L.minMode = on; if (on) L.minIds = [...(Learn.cardDue().length ? ['cards-due'] : []), 'mini-q', 'checkin']; S.save(); },
  /* 照目前速度，考前讀得完幾章 */
  pace() {
    const day = S.planDay(), read = DATA.lessons.filter(l => (S.st.lessons[l.id] || {}).read).length;
    let expect = 0; for (const p of DATA.plan || []) if (p.day < day) expect += (p.lessons || []).length;
    const rate = read / Math.max(1, day - 1), proj = Math.min(DATA.lessons.length, Math.round(read + rate * Math.max(0, S.daysLeft())));
    return { day, read, expect, proj, total: DATA.lessons.length };
  },
  current() { return this.list().find(s => !s.done && !s.skipped) || null; },
  skip(id) { const A = S.st.auto; (A.skip = A.skip || []).push(id); S.save(); },
};

/* ======================= 帶我讀 ======================= */
function viewGo() {
  const st = S.st;
  if (!st.onboarded) return goOnboard();

<script>
/* 資工所衝刺站 — 對抗惰性：發呆偵測、離開提醒、回來時直接給下一步、桌面通知、時間到了提醒 */
'use strict';

const Nudge = {
  last: Date.now(), hiddenAt: null, idleShown: false, sent: {},
  IDLE_MIN: 8,
  init() {
    ['mousemove', 'keydown', 'pointerdown', 'scroll', 'touchstart', 'wheel'].forEach(ev => document.addEventListener(ev, () => { this.last = Date.now(); }, { passive: true, capture: true }));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { this.hiddenAt = Date.now(); return; }
      const away = this.hiddenAt ? (Date.now() - this.hiddenAt) / 60000 : 0; this.hiddenAt = null; this.last = Date.now();
      if (away >= 15) this.welcome(Math.round(away));
    });
    // 很久沒開（例如隔天第一次開）也給「歡迎回來」
    const prev = +(localStorage.getItem('csgrad.lastSeen') || 0); try { localStorage.setItem('csgrad.lastSeen', Date.now()); } catch (e) { }
    if (prev && Date.now() - prev > 3 * 3600e3 && S.st.onboarded) setTimeout(() => this.welcome(Math.round((Date.now() - prev) / 60000)), 1200);
    setInterval(() => this.tick(), 30000);
  },
  idleMin() { return (Date.now() - this.last) / 60000; },
  /* 專注計時中卻 8 分鐘沒有任何操作：可能在滑手機 → 暫停計時並問一下 */
  checkIdle() {
    const t = S.st.timer; if (!t.running || document.hidden || this.idleShown) return false;
    if (this.idleMin() < this.IDLE_MIN) return false;
    this.idleShown = true;
    this.overlay(`<div class="nd-ic">👀</div><h2>還在讀嗎？</h2><p>已經 ${this.IDLE_MIN} 分鐘沒有任何動作，專注計時先暫停（這段不算進讀書時數）。</p>`,
      [['我在讀（繼續計時）', () => { this.idleShown = false; this.last = Date.now(); S.st.timer.last = Date.now(); }, 'primary'], ['休息 10 分鐘', () => { this.idleShown = false; this.last = Date.now(); Timer.reset('break'); }]]);
    return true;
  },
  welcome(mins) {
    if (!S.st.onboarded || $('.nd-wrap')) return; const c = Auto.current(); if (!c) return;
    const away = mins >= 1440 ? `${Math.floor(mins / 1440)} 天` : mins >= 60 ? `${Math.floor(mins / 60)} 小時` : `${mins} 分鐘`;
    this.overlay(`<div class="nd-ic">${c.icon}</div><h2>歡迎回來</h2><p class="muted">你離開了 ${away}。不用想，直接做這件：</p><h3>${esc(c.title)}</h3><p class="muted small">約 ${c.mins} 分鐘｜${esc(c.why)}</p>`,
      [['開始 →', () => { location.hash = '#go'; setTimeout(() => { if (!S.st.timer.running) Timer.toggle(); c.act(); }, 60); }, 'primary'], ['只做 5 分鐘', () => Nudge.five()], ['等一下', () => { }]]);
  },
  /* 5 分鐘法則：最小的起步，做了通常就會繼續 */
  five() {
    if (!S.st.timer.running) Timer.toggle();
    const cd = Learn.cardDue().length;
    if (cd) startCards({ noNew: true, title: '5 分鐘：到期必背卡', max: 15 });
    else if (S.dueReviews().length) Practice.start(S.dueReviews().slice(0, 4), { title: '5 分鐘：到期複習', review: true });
    else if (Learn.newCards().length && Learn.newLeft()) startCards({ title: '5 分鐘：新的必背卡', max: 12 });
    else { Practice.startAdaptive(); Practice.sess.opts.limit = 4; Practice.sess.opts.title = '5 分鐘：自適應 4 題'; }
    toast('先做 5 分鐘就好。做完想停就停。', 'good');
  },
  overlay(html, btns) {
    const w = h('div', { class: 'nd-wrap', role: 'dialog', 'aria-modal': 'true' });
    w.innerHTML = `<div class="nd-box">${html}<div class="row center">${btns.map(([t, , cls], i) => `<button class="btn ${cls || ''}" data-nb="${i}">${t}</button>`).join('')}</div></div>`;
    document.body.appendChild(w);
    $$('[data-nb]', w).forEach(b => b.onclick = () => { w.remove(); btns[+b.dataset.nb][1](); });
  },
  /* ---------- 桌面通知（網站開著、在背景時也會跳） ---------- */
  canNotify() { return 'Notification' in window && Notification.permission === 'granted'; },
  async ask() { if (!('Notification' in window)) { toast('這個瀏覽器不支援通知', 'bad'); return false; } const r = await Notification.requestPermission(); S.st.settings.notify = r === 'granted'; S.save(); toast(r === 'granted' ? '已開啟提醒' : '沒有開啟通知權限', r === 'granted' ? 'good' : ''); return r === 'granted'; },
  notify(key, title, body) {
    const k = D.today() + ':' + key; if (this.sent[k] || (S.st.nudged || {})[k]) return; this.sent[k] = 1; (S.st.nudged = S.st.nudged || {})[k] = 1; S.save();
    if (this.canNotify() && document.hidden) { try { const n = new Notification(title, { body, tag: 'csgrad-' + key }); n.onclick = () => { window.focus(); location.hash = '#go'; n.close(); }; } catch (e) { } }
    else if (!document.hidden) toast(title + '：' + body, '');
  },
  tick() {
    if (!S.st.onboarded) return;
    const now = new Date(), hm = now.getHours() * 60 + now.getMinutes(), set = S.st.settings, L = S.day(), c = Auto.current();
    const toMin = s => { const m = String(s || '').match(/^(\d{1,2}):(\d{2})$/); return m ? +m[1] * 60 + +m[2] : null; };
    const start = toMin(set.studyStart), commit = toMin(L.commit || set.commitTime);
    if (start != null && hm >= start && hm < start + 180 && L.min < 1 && L.q === 0 && c) this.notify('start', '到讀書時間了', `下一步：${c.title}（約 ${c.mins} 分）`);
    if (start != null && hm >= start + 60 && hm < start + 240 && L.min < 1 && L.q === 0 && c) this.notify('start2', '已經晚了一小時', '現在只做 5 分鐘也好，打開就有下一步。');
    if (commit != null && !L.checkin && hm >= commit - 60 && hm < commit) { const left = Auto.list().filter(s => !s.done && !s.skipped).length; this.notify('commit', `一小時後要打卡`, `今天還剩 ${left} 步。做不完就切保底模式，至少不要斷。`); }
    if (commit != null && !L.checkin && hm >= commit) this.notify('commit2', '你承諾的打卡時間到了', '誠實打卡也算數：寫下今天卡在哪裡。');
    const t = S.st.timer; if (t.running && document.hidden && this.hiddenAt && Date.now() - this.hiddenAt > 5 * 60000) this.notify('away' + Math.floor(Date.now() / 1800000), '專注計時暫停中', '你切出去 5 分鐘了。回來繼續，下一步已經排好。');
  },
};

</script>

  else if (hsh === 'plan') viewPlan();
  else if (LESSON[hsh]) viewLesson(hsh);
  else if (hsh.startsWith('subj-') && SUBJ[hsh.slice(5)]) viewSubject(hsh.slice(5));
  else if (hsh === 'practice') Practice.view();
  else if (hsh === 'gen') Practice.viewGen();
  else if (hsh === 'feed' || hsh.startsWith('feed-')) viewFeed(hsh.slice(5));
  else if (hsh === 'lab') viewLabs();
  else if (hsh.startsWith('lab-')) viewLab(hsh.slice(4));
  else if (hsh === 'wrong') viewWrong();
  else if (hsh === 'cards') viewCards();
  else if (hsh === 'stats') viewStats();
  else if (hsh === 'agent') viewAgent();
  else if (hsh === 'methods') viewMethods();
  else if (hsh === 'setup') viewSetup();
  else viewToday();
  renderGoPill(hsh);
}

/* ======================= tasks & timer ======================= */
function todayTasks(date = D.today()) {
  const day = S.planDay(date);
  const plan = (DATA.plan || []).find(p => p.day === day);
  const L = S.day(date);
  const set = S.st.settings;
  const tasks = [];
  if (day > 1) tasks.push({ id: 'blurt', text: '晨間白紙回憶：不看書，寫下昨天讀的內容', done: !!L.blurt, act: 'blurt' });
  if (plan) {
    for (const lid of plan.lessons || []) {
      const l = LESSON[lid]; if (!l) continue;
      const ls = S.st.lessons[lid] || {};
      tasks.push({ id: 'read-' + lid, text: `精讀：${l.title}`, done: !!ls.read, go: '#' + lid });
      tasks.push({ id: 'feyn-' + lid, text: `費曼關卡：${l.title}`, done: ['pending', 'pass', 'self'].includes(ls.gate), go: '#' + lid + '', gate: ls.gate || 'none' });
    }
    for (const g of plan.mocks || []) {
      const grp = GROUPS.find(x => x.id === g);
      tasks.push({ id: 'mock-' + g, text: `模擬考：${grp.name}（${grp.mins} 分鐘）`, done: (L.mocks || []).includes(g), act: 'mock', arg: g });
    }
    if (plan.review) tasks.push({ id: 'revrd', text: '複習日：重讀本週費曼被退回的章節，並重交', done: !DATA.lessons.some(l => (S.st.lessons[l.id] || {}).gate === 'revise'), go: '#plan' });
  }
  tasks.push({ id: 'quiz', text: `做題 ≥ ${set.dailyQuestions} 題（今天已做 ${L.q} 題）`, done: L.q >= set.dailyQuestions, go: '#practice' });
  const due = S.dueReviews(date).length;
  tasks.push({ id: 'review', text: `清空到期複習題（FSRS 排定，還剩 ${due} 題）`, done: due === 0, go: '#wrong' });
  const cd = Learn.cardDue(date).length, cn = Math.min(Learn.newLeft(), Learn.newCards().length);
  tasks.push({ id: 'cards', text: `必背卡：到期 ${cd} 張＋新卡 ${cn} 張`, done: cd === 0 && cn === 0, go: '#cards' });
  tasks.push({ id: 'minutes', text: `專注讀書 ≥ ${(set.dailyMinutes / 60).toFixed(1)} 小時（今天 ${Math.floor(L.min)} 分）`, done: L.min >= set.dailyMinutes });
  for (const [i, t] of (S.st.agentTasks[date] || []).entries()) tasks.push({ id: 'ag-' + i, text: 'Agent 指派：' + t.text, done: !!t.done, agent: i });
  return tasks;
}

const Timer = {
  tick() {
    const t = S.st.timer;
    if (!t.running) return;
    const now = Date.now();
    const dt = Math.min(now - (t.last || now), 120000);
    t.last = now;
    if (typeof Nudge !== 'undefined' && (Nudge.idleShown || Nudge.checkIdle())) { Timer.paint(); return; }
    if (document.visibilityState === 'visible' || t.bg) {
      S.day().min += dt / 60000;
      t.sessionMs = (t.sessionMs || 0) + dt;
      t.n = (t.n || 0) + 1;
      const target = (t.phase === 'break' ? S.st.settings.brk : S.st.settings.pomo) * 60000;
      if (t.sessionMs >= target && !t.alerted) {
        t.alerted = true;
        toast(t.phase === 'break' ? '休息結束，回來專注。' : `專注 ${S.st.settings.pomo} 分鐘完成，起來走動 ${S.st.settings.brk} 分鐘。`, 'good');
      }
    }
    if (t.n % 15 === 0) S.save();
    Timer.paint();
  },
  toggle() {
    const t = S.st.timer;
    t.running = !t.running; t.last = Date.now();
    if (t.running && !t.sessionMs) { t.phase = 'focus'; t.alerted = false; }
    S.save(); Timer.paint();
  },
  reset(phase = 'focus') { const t = S.st.timer; t.sessionMs = 0; t.phase = phase; t.alerted = false; t.last = Date.now(); S.save(); Timer.paint(); },
  paint() {
    const t = S.st.timer; const el = $('#timerFace'); if (!el) return;
    const ms = t.sessionMs || 0; const mm = Math.floor(ms / 60000), ss = Math.floor(ms / 1000) % 60;
    el.textContent = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
    const btn = $('#timerBtn'); if (btn) btn.textContent = t.running ? '暫停' : '開始專注';
    const ph = $('#timerPhase'); if (ph) ph.textContent = (t.phase === 'break' ? '休息中' : '專注中') + `｜目標 ${t.phase === 'break' ? S.st.settings.brk : S.st.settings.pomo} 分`;
    const today = $('#todayMin'); if (today) today.textContent = Math.floor(S.day().min);
  },
};

/* ======================= 今日督導 ======================= */
function supervisorAlerts() {
  const out = []; const st = S.st; const today = D.today(); const y = D.add(today, -1);
  const day = S.planDay();
  if (day > 1) {
    const ly = st.log[y];
    if (!ly || !ly.checkin) out.push({ lv: 'bad', t: '昨天沒有打卡。中斷一天就要用兩天補，今天先把昨天的費曼關卡補交。' });
    else if (!ly.checkin.full) out.push({ lv: 'warn', t: `昨天未達標（完成 ${ly.checkin.done}/${ly.checkin.total} 項）。` });
  }
  const behind = [];
  for (const p of DATA.plan || []) if (p.day < day) for (const lid of p.lessons || []) if (!(st.lessons[lid] || {}).read) behind.push(lid);
  if (behind.length) out.push({ lv: 'bad', t: `進度落後 ${behind.length} 章：${behind.slice(0, 4).map(id => LESSON[id].title).join('、')}${behind.length > 4 ? '…' : ''}`, go: '#' + behind[0] });
  const rev = DATA.lessons.filter(l => (st.lessons[l.id] || {}).gate === 'revise');
  if (rev.length) out.push({ lv: 'warn', t: `費曼關卡被退回 ${rev.length} 章，思考鏈還沒補齊：${rev.slice(0, 3).map(l => l.title).join('、')}`, go: '#' + rev[0].id });
  const hcw = Object.values(st.answers).filter(a => (a.hcw || 0) > 0 && a.ok === false).length;
  if (hcw) out.push({ lv: 'warn', t: `有 ${hcw} 題「很確定卻答錯」，這是最危險的迷思，優先複習。`, go: '#wrong' });
  for (const s of DATA.subjects) { const ss = subjectStats(s.id); if (ss.att >= 10 && ss.acc < 0.6) out.push({ lv: 'warn', t: `${s.name} 正確率只有 ${(ss.acc * 100).toFixed(0)}%（${ss.att} 題），台大錄取需要穩定 75% 以上。`, go: '#subj-' + s.id }); }
  const due = S.dueReviews().length; if (due > 15) out.push({ lv: 'warn', t: `到期複習累積 ${due} 題，今天先清複習再讀新章。`, go: '#wrong' });
  const cd = Learn.cardDue().length; if (cd > 60) out.push({ lv: 'warn', t: `必背卡積了 ${cd} 張到期。拖越久，記得的機率掉越多。`, go: '#cards' });
  const cal = Learn.calibration()[2]; if (cal.n >= 8 && cal.acc < .8) out.push({ lv: 'warn', t: `你說「非常確定」的題目只答對 ${Math.round(cal.acc * 100)}%：過度自信，考場上會漏檢查。`, go: '#stats' });
  const wk = Learn.weakest(3).filter(x => x.m < .55); if (wk.length) out.push({ lv: 'warn', t: `掌握度最低：${wk.map(x => `${LESSON[x.id].title}（${Math.round(x.m * 100)}%）`).join('、')}`, go: '#stats' });
  const fc = Learn.forecast(); if (fc.n >= 30 && fc.atExam != null && fc.atExam < .5) out.push({ lv: 'info', t: `照現在的記憶狀態，如果停止複習，考試那天只剩 ${Math.round(fc.atExam * 100)}% 記得。每天清到期項目就能把它維持在 ${Math.round(Learn.ret() * 100)}%。`, go: '#stats' });
  const left = S.daysLeft();
  if (left <= 30 && left >= 0) out.push({ lv: 'info', t: `距離考試 ${left} 天。每一天都要有可驗證的產出：費曼紀錄、題數、錯因。` });
  return out;
}

function gateLabel(g) { return { pass: 'Agent 通過', pending: '待 Agent 審', revise: '被退回', self: '自評通過', none: '未交' }[g] || g; }
function chapterChip(id) {

  return `<a class="chip" href="#${id}" style="--sc:var(--s-${l.subject})"><span class="sdot"></span>${esc(l.title)}<span class="gate g-${ls.gate || 'none'}">${gateLabel(ls.gate || 'none')}</span></a>`;

function heatmap() {
  const today = D.today(); const start = D.add(today, -83 - D.parse(today).getDay());
  let cells = '';
  for (let i = 0; i < 84 + D.parse(today).getDay() + 1 && i < 91; i++) {
    const d = D.add(start, i); if (d > today) break;
    const L = S.st.log[d]; const mm = L ? L.min : 0;
    const lv = mm <= 0 ? 0 : mm < 60 ? 1 : mm < 180 ? 2 : mm < 300 ? 3 : 4;
    cells += `<i class="hm l${lv} ${L && L.checkin && L.checkin.full ? 'ck' : ''}" title="${d}：${Math.floor(mm)} 分${L ? `，${L.q} 題` : ''}"></i>`;
  }
  return `<div class="heat">${cells}</div>`;
}

function modal(title, bodyHtml, onOk, okText = '送出') {
  const wrap = h('div', { class: 'modal-wrap', role: 'dialog', 'aria-modal': 'true' });
  wrap.innerHTML = `<div class="modal"><h2>${esc(title)}</h2><div class="modal-body">${bodyHtml}</div><div class="row end"><button class="btn ghost" data-x>取消</button><button class="btn primary" data-ok>${esc(okText)}</button></div></div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  $('[data-x]', wrap).onclick = close;
  wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  $('[data-ok]', wrap).onclick = async () => { const r = await onOk(wrap); if (r !== false) close(); };
  const f = $('textarea, input', wrap); if (f) f.focus();
  return wrap;
}

function wireFeynman(l) {
  const ta = $('#feynText'); if (!ta) return;
  const ls = S.lesson(l.id);
  const cnt = () => { $('#feynCount').textContent = ta.value.trim().length + ' 字（至少 200）'; };
  ta.addEventListener('input', debounce(() => { ls.draft = ta.value; S.save(); cnt(); }, 300)); cnt();
  $('#btnFeyn').onclick = async () => {
    const text = ta.value.trim();
    if (text.length < 200) { toast('費曼解釋至少 200 字。講得出來才是真的懂。', 'bad'); return; }

    ls.gate = 'pending'; ls.submitted = D.today();
    S.day().feyn.push(l.id);
    await Bridge.send({ type: 'feynman', text, ctx: { lesson: l.id, title: l.title, prompt: l.feynman, rubric: l.rubric, attempt: S.st.msgs.filter(x => x.type === 'feynman' && x.ctx && x.ctx.lesson === l.id).length + 1 } });

  };

}

  <header class="page-head"><h1>設定</h1><p class="lede">考試日請以台大招生簡章公告為準（碩士班筆試通常在二月初）。</p></header>
  <section class="card form">
    <label for="fName">名字（督導訊息會用）</label><input id="fName" value="${esc(s.name)}">
    <label for="fExam">考試日</label><input id="fExam" type="date" value="${s.examDate}">
    <label for="fStart">30 天計畫起始日</label><input id="fStart" type="date" value="${s.startDate}">
    <label for="fMin">每日專注目標（分鐘）</label><input id="fMin" type="number" min="30" max="900" value="${s.dailyMinutes}">
    <label for="fQ">每日題數目標</label><input id="fQ" type="number" min="5" max="200" value="${s.dailyQuestions}">
    <label for="fRet">目標保留率（FSRS）</label><select id="fRet">${[[.85, '85%：複習較少，適合時間很緊'], [.9, '90%：建議'], [.95, '95%：考前衝刺，複習次數多約 2 倍']].map(([v, t]) => `<option value="${v}" ${+s.retention === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <label for="fNew">每天新開必背卡（張）</label><input id="fNew" type="number" min="0" max="100" value="${s.newCards || 20}">
    <label for="fSS">每天開始讀書的時間（到點提醒）</label><input id="fSS" type="time" value="${s.studyStart || '09:00'}">
    <label for="fCT">預設打卡時間（前一小時提醒）</label><input id="fCT" type="time" value="${s.commitTime || '22:00'}">
    <label for="fStake">沒打卡的代價（自己定）</label><input id="fStake" value="${esc(s.stake || '')}" placeholder="例：隔天多做 30 題">
    <label for="fPomo">番茄鐘專注／休息（分鐘）</label><div class="row"><input id="fPomo" type="number" min="10" max="120" value="${s.pomo}"><input id="fBrk" type="number" min="3" max="30" value="${s.brk}"></div>
    <div class="row end"><button class="btn primary" id="saveSet">儲存</button></div>
  </section>
  <section class="card"><div class="card-h"><h2>備份</h2></div>
    <p class="muted">連上 bridge 時，進度會自動寫入 <code>bridge/state.json</code>。也可以手動匯出、匯入。</p>
    <div class="row"><button class="btn" id="exp">匯出進度（複製 JSON）</button><button class="btn" id="imp">匯入進度</button><button class="btn danger" id="rst">全部重來</button></div></section>`;
  $('#saveSet').onclick = () => {
    s.name = $('#fName').value.trim(); s.examDate = $('#fExam').value || s.examDate; s.startDate = $('#fStart').value || s.startDate;
    s.dailyMinutes = +$('#fMin').value || 360; s.dailyQuestions = +$('#fQ').value || 30; s.pomo = +$('#fPomo').value || 50; s.brk = +$('#fBrk').value || 10; s.retention = +$('#fRet').value || .9; s.studyStart = $('#fSS').value || s.studyStart; s.commitTime = $('#fCT').value || s.commitTime; s.stake = $('#fStake').value.trim(); s.newCards = Math.max(0, +$('#fNew').value || 0);
    S.save(); toast('已儲存', 'good'); route();
  };
  $('#exp').onclick = () => modal('進度 JSON', `<textarea rows="14">${esc(JSON.stringify(S.st))}</textarea>`, () => true, '關閉');
  $('#imp').onclick = () => modal('貼上進度 JSON', '<textarea id="impT" rows="14"></textarea>', (w) => {
    try { const st = JSON.parse($('#impT', w).value); if (st.v !== 1) throw new Error('格式不對'); S.st = Object.assign(defaultState(), st); S.saveNow(); QBANK.build(); toast('已匯入', 'good'); route(); } catch (e) { toast('匯入失敗：' + e.message, 'bad'); return false; }
  }, '匯入');
  $('#rst').onclick = () => modal('確定全部重來？', '<p>所有作答紀錄、打卡、費曼紀錄都會清掉（bridge 資料夾裡的檔案不會刪）。</p>', () => { S.st = defaultState(); S.saveNow(); QBANK.build(); route(); }, '清除');
}

/* ======================= labs list ======================= */
function viewLabs() {
  main().innerHTML = `<header class="page-head"><div class="eyebrow">每個動畫都能改輸入、單步執行、倒退</div><h1>動畫實驗室</h1>
  <p class="lede">先預測下一步，再按「下一步」驗證。預測錯的地方就是你的觀念缺口。</p></header>
  ${DATA.subjects.map(s => { const labs = Labs.list.filter(x => x.subject === s.id); if (!labs.length) return ''; return `<h2 class="lab-sec" style="--sc:var(--s-${s.id})"><span class="sdot"></span>${esc(s.name)}</h2><div class="lab-grid">${labs.map(x => `<a class="lab-card" href="#lab-${x.id}" style="--sc:var(--s-${x.subject})"><b>${esc(x.title)}</b><span>${esc(x.desc)}</span></a>`).join('')}</div>`; }).join('')}`;
}
function viewLab(id) {
  const lab = Labs.get(id);
  if (!lab) { viewLabs(); return; }
  main().innerHTML = `<header class="page-head" style="--sc:var(--s-${lab.subject})"><div class="eyebrow subj-eb"><a href="#lab">動畫實驗室</a>｜${esc(SUBJ[lab.subject].name)}</div><h1>${esc(lab.title)}</h1><p class="lede">${esc(lab.desc)}</p></header><div id="labHost"></div>
  ${lab.lessons ? `<p class="muted">相關章節：${lab.lessons.map(chapterChip).join(' ')}</p>` : ''}`;
  Labs.mount(id, $('#labHost'), '', true);
  const L = S.day(); if (!L.labs.includes(id)) { L.labs.push(id); S.save(); }
}

/* ======================= boot ======================= */
async function boot() {
  S.load(); QBANK.build(); Learn.migrate(); S.save();
  document.addEventListener('click', e => { const t = e.target.closest('#menuBtn'); if (t) document.body.classList.toggle('rail-open'); });
  window.addEventListener('hashchange', route);
  window.addEventListener('bridge:change', () => {
    const cur = location.hash.slice(1) || 'go';
    const typing = document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName) && document.activeElement.value;
    if (!typing && !$('.modal-wrap') && (cur === 'agent' || cur === 'today' || cur === 'go')) route();
    else {
      renderRail();
      const f = $('#feyn');
      if (LESSON[cur] && f && !(document.activeElement && document.activeElement.id === 'feynText')) {
        const tmp = h('div', { html: feynmanSection(LESSON[cur]) }); f.replaceWith(tmp.firstElementChild); wireFeynman(LESSON[cur]);
      }
    }
  });
  route();
  Nudge.init();
  setInterval(Timer.tick, 1000);
  document.addEventListener('visibilitychange', () => { S.st.timer.last = Date.now(); });
  await Bridge.init();
  route();
}
window.addEventListener('katex-ready', () => route());
document.addEventListener('DOMContentLoaded', boot);


/* ======================= 短影音 ======================= */
const CLIP_LAB = { 'dm-pigeon': 'pigeon', 'dm-venn': 'venn', 'dm-catalan': 'catalan', 'dm-hasse': 'hasse', 'dm-euclid': 'euclid', 'ds-heap': 'heap', 'co-pipe': 'pipe', 'os-srtf': 'cpu', 'la-eigen': 'lintrans', 'ds-avl': 'bst', 'al-dijkstra': 'graph', 'co-cache': 'cache', 'os-lru': 'page', 'la-systems': 'gauss', 'ds-sort': 'sort', 'la-vs': 'lintrans', 'la-det': 'gauss', 'ds-hash': 'hash', 'ds-unionfind': 'uf', 'ds-graph': 'graph', 'os-deadlock': 'banker', 'al-dp': 'dp', 'al-mst-flow': 'graph', 'os-storage': 'disk' };
let feedFilter = 'all';
function clipOrder(list) { // 交錯學習：輪流換科目，不連續刷同一科
  const by = {}; list.forEach(c => (by[c.subject] = by[c.subject] || []).push(c));
  const keys = DATA.subjects.map(s => s.id).filter(k => by[k]); const out = [];
  while (out.length < list.length) for (const k of keys) if (by[k].length) out.push(by[k].shift());
  return out;
}
function lessonClipsHtml(id) {
  if (typeof Clips === 'undefined') return '';
  const cs = Clips.list.filter(c => c.lesson === id); if (!cs.length) return '';
  return `<section class="clip-sec"><div class="clip-sec-h"><h3>60 秒看懂</h3><span class="muted small">先看動畫抓直覺，再讀推導。點畫面播放／暫停，右上角開關聲音。</span><a class="btn sm" href="#feed-${cs[0].id}">全螢幕連續刷 →</a></div><div class="clip-strip" id="clipStrip"></div></section>`;
}
function mountLessonClips(id) {
  const host = $('#clipStrip'); if (!host) return;
  Clips.list.filter(c => c.lesson === id).forEach((c, i) => {
    const it = document.createElement('div'); it.className = 'clip-item'; host.appendChild(it);
    Clips.player(it, c.id, { auto: i === 0 });
    const meta = document.createElement('div'); meta.className = 'clip-meta'; meta.innerHTML = `<span>${esc(c.chip.split('·').pop().trim())}</span>${CLIP_LAB[c.id] ? `<a href="#lab-${CLIP_LAB[c.id]}">自己動手玩 →</a>` : ''}`; it.appendChild(meta);
  });
}
function viewFeed(startId) {
  const m = main();
  const subs = DATA.subjects.filter(s => Clips.list.some(c => c.subject === s.id));
  let list = clipOrder(Clips.list.slice()); if (feedFilter !== 'all') list = list.filter(c => c.subject === feedFilter);
  m.innerHTML = `<div class="feed-wrap">
    <div class="feed-filter">${[['all', '全部']].concat(subs.map(s => [s.id, s.name])).map(([k, n]) => `<button class="chip ${feedFilter === k ? 'on' : ''}" data-f="${k}" ${k !== 'all' ? `style="--sc:var(--s-${k})"` : ''}>${esc(n)}</button>`).join('')}</div>
    <div class="feed" id="feed" tabindex="0">${list.map((c, i) => { const l = LESSON[c.lesson]; const n = QBANK.all().filter(q => q.ch === c.lesson).length; return `<section class="feed-item" data-id="${c.id}">
      <div class="feed-slot"></div>
      <div class="feed-acts">
        ${l ? `<a href="#${c.lesson}"><span class="ic">📖</span>讀這章</a>` : ''}
        ${n ? `<button data-quiz="${c.lesson}"><span class="ic">✍️</span>練 ${n} 題</button>` : ''}
        ${CLIP_LAB[c.id] ? `<a href="#lab-${CLIP_LAB[c.id]}"><span class="ic">🧪</span>動手玩</a>` : ''}
        <button data-next><span class="ic">⬇</span>${i < list.length - 1 ? '下一支' : '回頂端'}</button>
      </div>
      <div class="feed-cap"><b>${esc(l ? l.title : c.chip)}</b><span>${i + 1} / ${list.length}</span></div>
    </section>`; }).join('')}
    <section class="feed-item feed-end"><div><h2>刷完了 🎉</h2><p>影片只負責給直覺。真正的分數在推導與題目裡。</p><div class="row wrap" style="justify-content:center"><a class="btn primary" href="#today">回今日督導</a><a class="btn" href="#practice">去練題</a><button class="btn" id="feedTop">從頭再刷</button></div></div></section>
    </div></div>`;
  const feed = $('#feed');
  $$('.feed-item[data-id]', m).forEach(sec => Clips.player($('.feed-slot', sec), sec.dataset.id, { auto: true, feed: true, onEnd: () => {} }));
  $$('.feed-filter .chip', m).forEach(b => b.onclick = () => { feedFilter = b.dataset.f; Clips.stopAll(); viewFeed(); });
  $$('[data-next]', m).forEach(b => b.onclick = () => { const sec = b.closest('.feed-item'); const nx = sec.nextElementSibling; if (nx && nx.dataset.id) nx.scrollIntoView({ behavior: 'smooth' }); else feed.scrollTo({ top: 0, behavior: 'smooth' }); });
  $$('[data-quiz]', m).forEach(b => b.onclick = () => { const ch = b.dataset.quiz; Practice.start(QBANK.all().filter(q => q.ch === ch).map(q => q.id), { title: LESSON[ch].title + '｜看完影片馬上練' }); });
  const top = $('#feedTop'); if (top) top.onclick = () => feed.scrollTo({ top: 0, behavior: 'smooth' });
  if (startId) { const sec = m.querySelector(`.feed-item[data-id="${CSS.escape(startId)}"]`); if (sec) requestAnimationFrame(() => { feed.scrollTop = sec.offsetTop; }); }
  feed.focus({ preventScroll: true });
}
document.addEventListener('keydown', e => {
  if (!document.body.classList.contains('feed-mode')) return; const feed = $('#feed'); if (!feed || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowDown' || e.key === 'j' || e.key === 'PageDown') { e.preventDefault(); feed.scrollBy({ top: feed.clientHeight, behavior: 'smooth' }); }
  else if (e.key === 'ArrowUp' || e.key === 'k' || e.key === 'PageUp') { e.preventDefault(); feed.scrollBy({ top: -feed.clientHeight, behavior: 'smooth' }); }
  else if (e.key === ' ') { e.preventDefault(); const i = Math.round(feed.scrollTop / feed.clientHeight); const cv = $$('.feed-item', feed)[i]?.querySelector('canvas'); if (cv) cv.click(); }
  else if (e.key === 'm') { const b = $('.snd-btn'); if (b) b.click(); }
});

</script>
