""}, {"id": "rc:al-sp:5", "kind": "recall", "ch": "al-sp", "subject": "al", "front": "差分約束如何轉成最短路徑？", "back": ""}, {"id": "key:al-mst-flow:1", "kind": "key", "ch": "al-mst-flow", "subject": "al", "front": "Cut property", "back": "設 $A$ 是某個 MST 的子集，$(S,V-S)$ 是一個**尊重** $A$ 的割（$A$ 沒有邊跨過它），$(u,v)$ 是跨過這個割的最輕邊，則 $A\\cup\\{(u,v)\\}$ 仍包含於某個 MST。", "tag": "定理"}, {"id": "key:al-mst-flow:2", "kind": "key", "ch": "al-mst-flow", "subject": "al", "front": "Max-flow min-cut", "back": "以下三者等價：(1) $f$ 是最大流；(2) 殘餘網路沒有擴增路徑；(3) 存在割 $(S,T)$ 使 $|f|=c(S,T)$。\n(2)⇒(3)：令 $S$＝殘餘網路中 $s$ 可達的點。若 $u\\in S,v\\in T$ 有邊，必滿載（否則 $v$ 可達）；若 $v\\to u$ 有流量，則殘餘網路有 $u\\to v$ 反向邊使 $v$ 可達，矛盾。所以淨流量 $=c(S,T)$。", "tag": "定理"}, {"id": "rc:al-mst-flow:1", "kind": "recall", "ch": "al-mst-flow", "subject": "al", "front": "Cut property 的完整敘述。為什麼 Kruskal、Prim 都對？", "back": ""}, {"id": "rc:al-mst-flow:2", "kind": "recall", "ch": "al-mst-flow", "subject": "al", "front": "邊權相異時 MST 唯一的證明想法。", "back": ""}, {"id": "rc:al-mst-flow:3", "kind": "recall", "ch": "al-mst-flow", "subject": "al", "front": "Max-flow min-cut 定理的三個等價敘述。", "back": ""}, {"id": "rc:al-mst-flow:4", "kind": "recall", "ch": "al-mst-flow", "subject": "al", "front": "Edmonds-Karp 的時間與擴增次數。", "back": ""}, {"id": "rc:al-mst-flow:5", "kind": "recall", "ch": "al-mst-flow", "subject": "al", "front": "二分圖最大匹配如何轉成網路流？König 定理？", "back": ""}, {"id": "tf:al-np:1", "kind": "tf", "ch": "al-np", "subject": "al", "front": "若某 NPC 問題有多項式解，則 P = NP", "ans": true, "back": ""}, {"id": "tf:al-np:2", "kind": "tf", "ch": "al-np", "subject": "al", "front": "若 $A\\le_p B$ 且 $B\\in$ P，則 $A\\in$ P", "ans": true, "back": ""}, {"id": "tf:al-np:3", "kind": "tf", "ch": "al-np", "subject": "al", "front": "若 $A\\le_p B$ 且 $A\\in$ P，則 $B\\in$ P", "ans": false, "back": ""}, {"id": "tf:al-np:4", "kind": "tf", "ch": "al-np", "subject": "al", "front": "NP 是 non-polynomial 的縮寫", "ans": false, "back": "nondeterministic polynomial"}, {"id": "tf:al-np:5", "kind": "tf", "ch": "al-np", "subject": os", "front": "monitor 的 signal 在沒有人等待時會被保留", "ans": false, "back": ""}, {"id": "tf:os-sync:4", "kind": "tf", "ch": "os-sync", "subject": "os", "front": "死結一定代表飢餓", "ans": true, "back": ""}, {"id": "tf:os-sync:5", "kind": "tf", "ch": "os-sync", "subject": "os", "front": "飢餓一定代表死結", "ans": false, "back": ""}, {"id": "tf:os-sync:6", "kind": "tf", "ch": "os-sync", "subject": "os", "front": "所有號誌操作都會造成忙等", "ans": false, "back": "用等待佇列實作的不會"}, {"id": "rc:os-sync:1", "kind": "recall", "ch": "os-sync", "subject": "os", "front": "臨界區解法的三個條件。", "back": ""}, {"id": "rc:os-sync:2", "kind": "recall", "ch": "os-sync", "subject": "os", "front": "只用 turn、只用 flag 的兩種錯誤解法分別違反哪一條？", "back": ""}, {"id": "rc:os-sync:3", "kind": "recall", "ch": "os-sync", "subject": "os", "front": "Peterson 的程式碼；為什麼在現代處理器上可能失效？", "back": ""}, {"id": "rc:os-sync:4", "kind": "recall", "ch": "os-sync", "subject": "os", "front": "Bounded buffer 中 wait(mutex) 與 wait(empty) 對調會怎樣？", "back": ""}, {"id": "rc:os-sync:5", "kind": "recall", "ch": "os-sync", "subject": "os", "front": "Hoare 與 Mesa 語意的監視器差在哪裡？為什麼 Mesa 要用 while？", "back": ""}, {"id": "rc:os-sync:6", "kind": "recall", "ch": "os-sync", "subject": "os", "front": "什麼是 priority inversion？怎麼解？", "back": ""}, {"id": "key:os-deadlock:1", "kind": "key", "ch": "os-deadlock", "subject": "os", "front": "安全狀態", "back": "安全 ⇒ 不會死結；**不安全不一定死結**（只是 OS 無法保證，行程可能不會真的要到最大需求）；死結 ⊂ 不安全。", "tag": "考點"}, {"id": "tf:os-deadlock:1", "kind": "tf", "ch": "os-deadlock", "subject": "os", "front": "RAG 有環就一定死結", "ans": false, "back": "多實例"}, {"id": "tf:os-deadlock:2", "kind": "tf", "ch": "os-deadlock", "subject": "os", "front": "系統處於不安全狀態就一定死結", "ans": false, "back": ""}, {"id": "tf:os-deadlock:3", "kind": "tf", "ch": "os-deadlock", "subject": "os", "front": "Banker 演算法可以用在行程最大需求未知的系統", "ans": false, "back": ""}, {"id": "tf:os-deadlock:4", "kind": "tf", "ch": "os-deadlock", "subject": "os", "front": "破壞互斥條件是最常用的預防法", "ans": false, "back": "很多資源本質就不可共享（印表機、鎖）"}, {"id": "rc:os-deadlock:1", "kind": "recall", "ch": "os-deadlock", "subject": "os", "front": "死結的四個必要條件。", "back": ""}, {"id": "rc:os-deadlock:2", "kind": "recall", "ch": "os-deadlock", "subject": "os", "front": "資源配置圖有環：何時一定死結、何時不一定？", "back": ""}, {"id": "rc:os-deadlock:3", "kind": "recall", "ch": "os-deadlock", "subject": "os", "front": "安全狀態、不安全狀態、死結三者的關係。", "back": ""}, {"id": "rc:os-deadlock:4", "kind": "recall", "ch": "os-deadlock", "subject": "os", "front": "Banker 演算法的資料結構與時間複雜度。", "back": ""}, {"id": "rc:os-deadlock:5", "kind": "recall", "ch": "os-deadlock", "subject": "os", "front": "n 個行程各最多需要 k 個同類資源，系統至少要幾個資源才不會死結？", "back": ""}, {"id": "tf:os-memory:1", "kind": "tf", "ch": "os-memory", "subject": "os", "front": "分頁完全沒有碎片", "ans": false, "back": "有內部碎片"}, {"id": "tf:os-memory:2", "kind": "tf", "ch": "os-memory", "subject": "os", "front": "頁越大，內部碎片越小", "ans": false, "back": "越大。頁大好處：頁表小、TLB reach 大、I/O 效率好"}, {"id": "tf:os-memory:3", "kind": "tf", "ch": "os-memory", "subject": "os", "front": "TLB 失誤一定會造成 page fault", "ans": false, "back": "只要查頁表；PTE 無效才是 page fault"}, {"id": "tf:os-memory:4", "kind": "tf", "ch": "os-memory", "subject": "os", "front": "反轉頁表能讓每個行程擁有自己的頁表", "ans": false, "back": "全系統一張"}, {"id": "tf:os-memory:5", "kind": "tf", "ch": "os-memory", "subject": "os", "front": "swap 出去的行程回來時一定要放回原來的實體位址", "ans": false, "back": "執行時期繫結時"}, {"id": "rc:os-memory:1", "kind": "recall", "ch": "os-memory", "subject": "os", "front": "位址繫結的三個時機；什麼時候邏輯位址與實體位址不同？", "back": ""}, {"id": "rc:os-memory:2", "kind": "recall", "ch": "os-memory", "subject": "os", "front": "First／best／worst fit 的比較；50% 規則說什麼？", "back": ""}, {"id": "rc:os-memory:3", "kind": "recall", "ch": "os-memory", "subject": "os", "front": "有 TLB 時的有效存取時間怎麼算？", "back": ""}, {"id": "rc:os-memory:4", "kind": "recall", "ch": "os-memory", "subject": "os", "front": "多層頁表、雜湊頁表、反轉頁表各解決什麼問題？反轉頁表的缺點？", "back": ""}, {"id": "rc:os-memory:5", "kind": "recall", "ch": "os-memory", "subject": "os", "front": "分段與分頁各會造成哪種碎片？", "b /* ---------- Markdown (subset + study extensions) ---------- */
const CALLOUT = {
  key: '考點', trap: '陷阱', proof: '證明', ex: '例題', def: '定義', thm: '定理', tip: '技巧', ntu: '台大考法', why: '為什麼', feyn: '費曼自問',
};
const CALLOUT_ZH = { 考點: 'key', 重點: 'key', 陷阱: 'trap', 注意: 'trap', 證明: 'proof', 例題: 'ex', 例: 'ex', 定義: 'def', 定理: 'thm', 引理: 'thm', 技巧: 'tip', 台大考法: 'ntu', 台大: 'ntu', 為什麼: 'why', 觀念: 'why', 費曼: 'feyn', 費曼自問: 'feyn' };
function mdInline(s, math) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (m, x) => `<code>${x}</code>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/==([^=]+)==/g, '<mark class="hl">$1</mark>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((#[\w-]+|https?:\/\/[^)\s]+)\)/g, (m, t, u) => `<a href="${u}"${u.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${t}</a>`);
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => math[+i]);

}
function md(src) {
  if (!src) return '';

  const codeBlocks = [];
  // protect fenced code
  src = src.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => { codeBlocks.push(`<pre class="code"><code>${esc(code.replace(/\n$/, ''))}</code></pre>`); return `\u0001${codeBlocks.length - 1}\u0001`; });

  const out = [];
  let i = 0;
  const inline = s => mdInline(s, math);
  function para(buf) { if (buf.length) out.push(`<p>${inline(buf.join(' '))}</p>`); }

  while (i < lines.length) {
    let line = lines[i];
    const t = line.trim();
    if (!t) { para(pbuf); pbuf = []; i++; continue; }
    let m;
    if ((m = t.match(/^\u0001(\d+)\u0001$/))) { para(pbuf); pbuf = []; out.push(codeBlocks[+m[1]]); i++; continue; }
    if ((m = t.match(/^\u0000(\d+)\u0000$/)) && math[+m[1]].startsWith('<div')) { para(pbuf); pbuf = []; out.push(math[+m[1]]); i++; continue; }
    if (/^[\u0003\u0004]\d+[\u0003\u0004]$/.test(t)) { para(pbuf); pbuf = []; out.push(t); i++; continue; }
    if ((m = t.match(/^(#{1,4})\s+(.*)$/))) {

      const lvl = Math.min(4, m[1].length + 1);
      const id = 'h-' + out.length;
      out.push(`<h${lvl} id="${id}">${inline(m[2])}</h${lvl}>`); i++; continue;
    }
    if (/^---+$/.test(t)) { para(pbuf); pbuf = []; out.push('<hr>'); i++; continue; }
    if ((m = t.match(/^@lab\s+([\w-]+)(?:\s+(.*))?$/))) { para(pbuf); pbuf = []; out.push(`<div class="lab-embed" data-lab="${m[1]}" data-params="${esc(m[2] || '')}"></div>`); i++; continue; }
    if ((m = t.match(/^\+\+\+\s*(.*)$/))) { // collapsible
      para(pbuf); pbuf = [];

    }

      para(pbuf); pbuf = [];
      const body = [];

      let kind = 'note', title = '';

      while (i < lines.length && lines[i].trim().startsWith('|')) { rows.push(lines[i].trim()); i++; }
      const cells = r => r.replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
      const head = cells(rows[0]);
      const bodyRows = rows.slice(2).map(cells);
      out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${bodyRows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);

function mdLine(s) { return md(s).replace(/^<p>/, '').replace(/<\/p>$/, ''); }
function mdBody(src, math, codeBlocks) {

  const html = md(src.replace(/\u0000(\d+)\u0000/g, '\u0003$1\u0003').replace(/\u0001(\d+)\u0001/g, '\u0004$1\u0004'));

function renderList(items, start, inline) {
  const base = items[start].ind; const ord = items[start].ord;

    if (items[i].ind > base) { const sub = renderList(items, i, inline); html = html.replace(/<\/li>$/, sub.html + '</li>'); i = sub.next; continue; }
    html += `<li>${inline(items[i].text)}</li>`; i++;

  return { html, next: i };
}

<script>
/* 資工所衝刺站 — Agent 橋接（土法：用檔案溝通）
 *  學生 → Agent : bridge/inbox.jsonl   （網頁追加，一行一則 JSON）
 *  Agent → 學生 : bridge/outbox.jsonl  （Agent 追加；純文字行也可以）
 *  進度摘要     : bridge/progress.json （網頁覆寫，給 Agent 讀）
 *  完整備份     : bridge/state.json
 *  Agent 心跳   : bridge/heartbeat.json（Agent 監聽時寫入）
 *  三種連線：http（python server.py）/ fs（Chrome/Edge 直接授權資料夾）/ offline（複製貼上）
 */
'use strict';

const Bridge = {
  mode: 'offline',
  dir: null,
  needsRegrant: false,
  hb: null,
  unread: 0,
  pollTimer: null,

  /* ---------- IndexedDB for FS handle ---------- */
  _idb(op, key, val) {
    return new Promise((res) => {
      try {
        const rq = indexedDB.open('csgrad', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onerror = () => res(null);
        rq.onsuccess = () => {
          const tx = rq.result.transaction('kv', op === 'get' ? 'readonly' : 'readwrite');
          const st = tx.objectStore('kv');
          const r2 = op === 'get' ? st.get(key) : st.put(val, key);
          r2.onsuccess = () => res(op === 'get' ? r2.result : true);
          r2.onerror = () => res(null);
        };
      } catch (e) { res(null); }
    });
  },

  async init() {
    if (location.protocol.startsWith('http')) {
      try {
        const r = await fetch('api/ping', { cache: 'no-store' });
        if (r.ok) { const j = await r.json(); if (j && j.ok) this.mode = 'http'; }
      } catch (e) { /* not served by server.py */ }
    }
    if (this.mode === 'offline' && window.showDirectoryPicker) {
      const handle = await this._idb('get', 'bridgeDir');
      if (handle) {
        try {
          const perm = await handle.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted') { this.dir = handle; this.mode = 'fs'; }
          else { this.dir = handle; this.needsRegrant = true; }
        } catch (e) { /* ignore */ }
      }
    }
    if (this.mode !== 'offline') await this.afterConnect();
    this.render();
  },

  async afterConnect() {
    await this.maybeRestore();
    await this.flushQueued();
    this.queueSync();
    this.startPolling();
    this.render();
  },

  async connectFS() {
    if (!window.showDirectoryPicker) { toast('這個瀏覽器不支援直接存取資料夾，請改用 start.bat（python server.py）', 'bad'); return; }
    try {
      if (this.dir && this.needsRegrant) {
        const p = await this.dir.requestPermission({ mode: 'readwrite' });
        if (p !== 'granted') return;
      } else {
        const d = await window.showDirectoryPicker({ id: 'csgrad-bridge', mode: 'readwrite' });
        this.dir = d;
        await this._idb('put', 'bridgeDir', d);
      }
      this.needsRegrant = false; this.mode = 'fs';
      toast('已連接 bridge 資料夾：' + this.dir.name, 'good');
      await this.afterConnect();
    } catch (e) { if (e && e.name !== 'AbortError') toast('連接失敗：' + e.message, 'bad'); }
  },

  /* ---------- low-level IO ---------- */
  async fsRead(name) {
    try { const fh = await this.dir.getFileHandle(name); const f = await fh.getFile(); return await f.text(); } catch (e) { return ''; }
  },
  async fsWrite(name, text) {
    const fh = await this.dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write(text); await w.close();
  },
  async fsAppend(name, line) {
    const fh = await this.dir.getFileHandle(name, { create: true });
    const f = await fh.getFile();
    const w = await fh.createWritable({ keepExistingData: true });
    await w.seek(f.size); await w.write(line); await w.close();
  },
  async readOutbox() {
    if (this.mode === 'http') { const r = await fetch('api/outbox', { cache: 'no-store' }); return r.ok ? await r.text() : ''; }
    if (this.mode === 'fs') return await this.fsRead('outbox.jsonl');
    return '';
  },
  async readHeartbeat() {
    try {
      let txt = '';
      if (this.mode === 'http') { const r = await fetch('api/heartbeat', { cache: 'no-store' }); txt = r.ok ? await r.text() : ''; }
      else if (this.mode === 'fs') txt = await this.fsRead('heartbeat.json');
      this.hb = txt ? JSON.parse(txt) : null;
    } catch (e) { this.hb = null; }
  },

  /* ---------- outgoing ---------- */
  async send(msg) {
    msg.id = msg.id || uid('in');
    msg.ts = msg.ts || new Date().toISOString();
    msg.from = 'student';
    const rec = Object.assign({ dir: 'out' }, msg);
    S.st.msgs.push(rec);
    S.save();
    try {
      await this._deliver(msg);
      rec.queued = false;
    } catch (e) { rec.queued = true; }
    S.save();
    window.dispatchEvent(new CustomEvent('bridge:change'));
    return rec;
  },
  async _deliver(msg) {
    const clean = Object.assign({}, msg); delete clean.dir; delete clean.queued;
    const line = JSON.stringify(clean) + '\n';
    if (this.mode === 'http') {
      const r = await fetch('api/inbox', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: line });
      if (!r.ok) throw new Error('server ' + r.status);
    } else if (this.mode === 'fs') {
      await this.fsAppend('inbox.jsonl', line);
    } else throw new Error('offline');
  },
  async flushQueued() {
    for (const m of S.st.msgs) if (m.dir === 'out' && m.queued) { try { await this._deliver(m); m.queued = false; } catch (e) { break; } }
    S.save();
  },

  /* ---------- incoming ---------- */
  parseLines(txt) {
    const out = [];
    txt.split(/\r?\n/).forEach((line, idx) => {
      const s = line.trim(); if (!s) return;
      let m = null;
      if (s.startsWith('{')) { try { m = JSON.parse(s); } catch (e) { m = null; } }
      if (!m) m = { type: 'note', text: s, id: 'txt-' + idx + '-' + hashStr(s) };
      if (!m.id) m.id = 'auto-' + idx + '-' + hashStr(s);
      out.push(m);
    });
    return out;
  },
  async poll() {
    if (this.mode === 'offline') return;
    try {
      const txt = await this.readOutbox();
      const msgs = this.parseLines(txt);
      let n = 0;
      for (const m of msgs) {
        if (S.st.seen[m.id]) continue;
        S.st.seen[m.id] = 1; n++;
        this.handle(m);
      }
      if (n) { S.save(); window.dispatchEvent(new CustomEvent('bridge:change')); }
      await this.readHeartbeat();
      this.render();
    } catch (e) { /* transient */ }
  },
  startPolling() {
    clearInterval(this.pollTimer);
    this.poll();
    this.pollTimer = setInterval(() => this.poll(), 3000);
  },
  handle(m) {
    const rec = Object.assign({ dir: 'in', ts: m.ts || new Date().toISOString() }, m);
    S.st.msgs.push(rec);
    this.unread++;
    const today = D.today();
    const type = m.type || 'note';
    if (type === 'grade' && m.replyTo) {
      const target = S.st.msgs.find(x => x.id === m.replyTo);
      if (target) {
        target.verdict = m.verdict; target.score = m.score; target.gradeText = m.text;
        if (target.type === 'feynman' && target.ctx && target.ctx.lesson) {
          const L = S.lesson(target.ctx.lesson);
          L.gate = m.verdict === 'pass' ? 'pass' : 'revise';
          L.score = m.score; L.feedback = m.text; L.gradedAt = today;
          if (m.verdict === 'pass') { L.reviewDue = D.add(today, 3); L.reviews = 0; }
        }
        if (target.type === 'essay' && target.ctx && target.ctx.qid) {
          const a = S.st.answers[target.ctx.qid];
          if (a) { a.agent = m.verdict; a.ok = m.verdict === 'pass'; if (!a.ok) { a.everWrong = true; a.box = 0; a.due = D.add(today, 1); } }
        }
      }
      toast(m.verdict === 'pass' ? 'Agent：通過 ✓' : 'Agent：退回，請補強思考鏈', m.verdict === 'pass' ? 'good' : 'bad');
    } else if ((type === 'plan' || type === 'supervise') && Array.isArray(m.tasks) && m.tasks.length) {
      const d = m.date || today;
      S.st.agentTasks[d] = m.tasks.map(t => ({ text: typeof t === 'string' ? t : t.text, done: false }));
      toast(type === 'supervise' ? '收到今日督導' : '收到 Agent 指派任務', 'good');
    } else if (type === 'quiz' && Array.isArray(m.questions)) {
      let k = 0;
      for (const q of m.questions) {
        const nq = normalizeAgentQ(q, m.id, k++);
        if (nq && !S.st.agentQuiz.find(x => x.id === nq.id)) S.st.agentQuiz.push(nq);
      }
      QBANK.build();
      toast(`Agent 出了 ${k} 題，去「練習 → Agent 出題」作答`, 'good');
    } else {
      toast('Agent：' + String(m.text || '').replace(/[*_`$#>]/g, '').slice(0, 40), '');
    }
  },

  /* ---------- progress sync ---------- */
  queueSync: null,
  async syncNow() {
    if (this.mode === 'offline') return;
    const progress = buildProgress();
    try {
      if (this.mode === 'http') {
        await fetch('api/progress', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ progress, state: S.st }) });
      } else if (this.mode === 'fs') {
        await this.fsWrite('progress.json', JSON.stringify(progress, null, 2));
        await this.fsWrite('state.json', JSON.stringify(S.st));
      }
    } catch (e) { /* retry next change */ }
  },
  async maybeRestore() {
    const fresh = !Object.keys(S.st.answers).length && !Object.keys(S.st.log).length;
    if (!fresh) return;
    try {
      let txt = '';
      if (this.mode === 'http') { const r = await fetch('api/state', { cache: 'no-store' }); txt = r.ok ? await r.text() : ''; }
      else if (this.mode === 'fs') txt = await this.fsRead('state.json');
      if (txt && txt.trim().startsWith('{')) {
        const st = JSON.parse(txt);
        if (st && st.v === 1) { S.st = Object.assign(defaultState(), st); S.saveNow(); QBANK.build(); toast('已從 bridge/state.json 還原進度', 'good'); }
      }
    } catch (e) { /* ignore */ }
  },

  /* ---------- status UI ---------- */
  status() {
    const age = this.hb && this.hb.ts ? Math.round((Date.now() - Date.parse(this.hb.ts)) / 1000) : null;
    const watching = age != null && age < 120;
    if (this.mode === 'offline') return { cls: 'off', text: this.needsRegrant ? '需重新授權資料夾' : '離線模式', sub: '訊息先存在本機' };
    return {
      cls: watching ? 'on' : 'wait',
      text: watching ? 'Agent 監聽中' : 'Agent 未監聽',
      sub: (this.mode === 'http' ? '檔案橋接（server）' : '檔案橋接（資料夾）') + (age != null ? `｜心跳 ${fmtAge(age)}前` : ''),
    };
  },
  render() {
    const st = this.status();
    $$('.bridge-pill').forEach(el => {
      el.className = 'bridge-pill ' + st.cls;
      el.innerHTML = `<span class="dot"></span><span>${esc(st.text)}</span>`;
      el.title = st.sub;
    });
    $$('.unread-badge').forEach(el => { el.textContent = this.unread ? String(this.unread) : ''; el.hidden = !this.unread; });
  },

  /* offline helper: build a prompt the student can paste to any AI */
  offlinePrompt() {
    const q = S.st.msgs.filter(m => m.dir === 'out' && m.queued);
    const head = '你是我的資工所（目標台大）家教兼督導。以下是我從學習網站送出的訊息（JSON），請依 AGENTS.md 的規則逐則回覆；費曼關卡請嚴格審查思考鏈，最後給 PASS 或 REVISE。\n\n';
    return head + q.map(m => JSON.stringify(Object.assign({}, m, { dir: undefined, queued: undefined }))).join('\n') + '\n\n我的進度摘要：\n' + JSON.stringify(buildProgress(), null, 1).slice(0, 6000);
  },
};
Bridge.queueSync = () => { if (Bridge._syncT) return; Bridge._syncT = setTimeout(() => { Bridge._syncT = null; Bridge.syncNow(); }, 2500); };

function hashStr(s) { let h1 = 5381; for (let i = 0; i < s.length; i++) h1 = ((h1 << 5) + h1 + s.charCodeAt(i)) | 0; return (h1 >>> 0).toString(36); }
function fmtAge(sec) { if (sec < 60) return sec + ' 秒'; if (sec < 3600) return Math.round(sec / 60) + ' 分'; if (sec < 86400) return Math.round(sec / 3600) + ' 小時'; return Math.round(sec / 86400) + ' 天'; }

function normalizeAgentQ(q, msgId, k) {
  if (!q || !(q.stem || q.q)) return null;
  const opts = q.options || q.opts || [];
  let type = q.type;
  let ans = q.answer;
  if (!type) type = opts.length ? (Array.isArray(ans) && ans.length > 1 ? 'multi' : 'single') : (ans != null ? 'fill' : 'essay');
  const ch = q.chapter || q.ch || 'agent';
  return {
    id: q.id ? 'ag-' + String(q.id).replace(/[^\w-]/g, '') : `ag-${hashStr(msgId)}-${k}`,
    ch, subject: (LESSON[ch] && LESSON[ch].subject) || q.subject || 'agent', diff: q.diff || q.difficulty || 3, type,
    stem: q.stem || q.q, opts: opts.map(String),
    ans: type === 'fill' ? [].concat(ans).map(String) : type === 'essay' ? [] : [].concat(ans).map(x => typeof x === 'number' ? x : opts.indexOf(x)).filter(x => x >= 0),
    expl: q.explanation || q.expl || '', src: 'agent',
  };
}

/* summary the agent reads (bridge/progress.json) */
function buildProgress() {
  const st = S.st, today = D.today();
  const last14 = [];
  for (let i = 13; i >= 0; i--) {
    const d = D.add(today, -i); const L = st.log[d];
    last14.push({ date: d, minutes: L ? Math.round(L.min) : 0, questions: L ? L.q : 0, correct: L ? L.c : 0, checkin: !!(L && L.checkin), lessons: L ? L.lessons : [] });
  }
  const subjects = {};
  for (const s of DATA.subjects) subjects[s.id] = Object.assign({ name: s.name }, subjectStats(s.id));
  const chapters = {};
  for (const l of DATA.lessons) {
    const ls = st.lessons[l.id] || {}; const cs = chapterStats(l.id);
    chapters[l.id] = { title: l.title, read: ls.read || null, gate: ls.gate || 'none', score: ls.score ?? null, quizN: cs.n, attempted: cs.att, acc: cs.acc == null ? null : +cs.acc.toFixed(2) };
  }
  const recentWrong = Object.entries(st.answers).filter(([id, a]) => a.ok === false).sort((a, b) => (b[1].last || '').localeCompare(a[1].last || '')).slice(0, 25).map(([id, a]) => {
    const q = id.startsWith('gen:') ? null : QBANK.get(id);
    return { qid: id, chapter: q ? q.ch : id.split(':')[1], stem: q ? String(q.stem).slice(0, 160) : '(隨機產生題)', conf: a.conf ?? null, cause: a.cause || null, note: st.wrongNotes[id] || null, date: a.last };
  });
  const weak = Object.entries(chapters).filter(([id, c]) => c.attempted >= 3 && c.acc != null && c.acc < 0.6).map(([id, c]) => ({ id, title: c.title, acc: c.acc }));
  const plan = (DATA.plan || []).find(p => p.day === S.planDay()) || null;
  const t = todayTasks();
  return {
    updated: new Date().toISOString(), student: st.settings.name || '', examDate: st.settings.examDate, daysLeft: S.daysLeft(),
    planDay: S.planDay(), todayPlan: plan, todayTasks: t.map(x => ({ id: x.id, text: x.text, done: x.done })), tasksDone: t.filter(x => x.done).length, tasksTotal: t.length,
    streak: S.streak(), dailyMinutesGoal: st.settings.dailyMinutes, last14, subjects, chapters, weakChapters: weak,
    highConfidenceWrong: Object.entries(st.answers).filter(([id, a]) => (a.hcw || 0) > 0).map(([id]) => id).slice(0, 20),
    dueReviews: S.dueReviews().length, recentWrong,
    pendingGates: st.msgs.filter(m => m.dir === 'out' && (m.type === 'feynman' || m.type === 'essay') && !m.verdict).map(m => ({ id: m.id, type: m.type, ctx: m.ctx })),
    todayCheckin: (st.log[today] && st.log[today].checkin) || null,
    mastery: Object.fromEntries(DATA.lessons.map(l => { const e = (st.elo || {})[l.id]; return [l.id, e && e.n ? { p: +Learn.mastery(l.id).toFixed(2), n: e.n } : null]; })),
    memory: (() => { const f = Learn.forecast(); return { items: f.n, retentionNow: f.now == null ? null : +f.now.toFixed(2), retentionAtExamIfStop: f.atExam == null ? null : +f.atExam.toFixed(2), dueToday: f.due, target: Learn.ret() }; })(),
    calibration: Learn.calibration().map(x => ({ conf: ['', 'guess', 'somewhat', 'sure'][x.conf], n: x.n, acc: x.acc == null ? null : +x.acc.toFixed(2) })),
    cards: { total: Learn.cards().length, learned: Learn.cards().filter(c => (st.srs || {})[c.id]).length, due: Learn.cardDue().length },
    wrappers: (st.wrappers || []).slice(-3),
    habits: { studyStart: st.settings.studyStart || null, commitToday: (st.log[today] || {}).commit || st.settings.commitTime || null, stake: st.settings.stake || null, minModeToday: !!(st.log[today] || {}).minMode, missedYesterday: S.planDay() > 1 && !((st.log[D.add(today, -1)] || {}).checkin), autopilot: (() => { try { const l = Auto.list(); return { done: l.filter(x => x.done).length, total: l.length, next: (l.find(x => !x.done && !x.skipped) || {}).title || null, skipped: l.filter(x => x.skipped).map(x => x.title) }; } catch (e) { return null; } })(), pace: (() => { try { return Auto.pace(); } catch (e) { return null; } })() },
  };
}

<script>
/* 資工所衝刺站 — 動畫實驗室核心 + 資料結構／演算法動畫 */
'use strict';

const Labs = {
  list: [],
  live: [],
  reg(def) { this.list.push(def); },
  get(id) { return this.list.find(x => x.id === id); },
  stopAll() { this.live.forEach(p => p.stop && p.stop()); this.live = []; },
  mountEmbeds(root) {
    $$('.lab-embed', root).forEach(el => {
      const lab = this.get(el.dataset.lab); if (!lab) { el.remove(); return; }
      el.innerHTML = `<div class="lab-teaser" style="--sc:var(--s-${lab.subject})"><div><b>動畫：${esc(lab.title)}</b><span>${esc(lab.desc)}</span></div><button class="btn">展開動畫</button></div>`;
      $('button', el).onclick = () => { el.innerHTML = ''; this.mount(lab.id, el, el.dataset.params || ''); const L = S.day(); if (!L.labs.includes(lab.id)) { L.labs.push(lab.id); S.save(); } };
    });
  },
  mount(id, host, params = '', full = false) {
    const lab = this.get(id);
    const P = Object.fromEntries((params || '').split(/\s+/).filter(Boolean).map(kv => kv.split('=')));
    const box = h('div', { class: 'lab' + (full ? ' full' : '') });
    host.appendChild(box);
    if (lab.custom) { lab.custom(box, P); return; }
    const form = h('div', { class: 'lab-form' });
    for (const f of lab.form) {
      const fid = 'lf-' + id + '-' + f.id + '-' + Math.random().toString(36).slice(2, 6);
      let input;
      const val = P[f.id] != null ? decodeURIComponent(P[f.id]).replace(/_/g, ' ') : f.value;
      if (f.type === 'select') input = h('select', { id: fid, 'data-k': f.id }, ...f.options.map(([v, t]) => h('option', { value: v, selected: String(v) === String(val) }, t)));
      else if (f.type === 'check') input = h('input', { id: fid, type: 'checkbox', 'data-k': f.id, checked: val === true || val === 'true' });
      else if (f.type === 'area') input = h('textarea', { id: fid, rows: f.rows || 4, 'data-k': f.id }, val);
      else input = h('input', { id: fid, 'data-k': f.id, value: val, type: f.type === 'number' ? 'number' : 'text', size: f.size || 30 });
      form.appendChild(h('div', { class: 'lf ' + (f.wide ? 'wide' : '') }, h('label', { for: fid }, f.label), input));
    }
    const presets = lab.presets ? h('div', { class: 'lab-presets' }, '範例：', ...lab.presets.map(p => h('button', { class: 'btn sm', type: 'button', onclick: () => { for (const [k, v] of Object.entries(p.v)) { const el = $(`[data-k="${k}"]`, form); if (el) { if (el.type === 'checkbox') el.checked = v; else el.value = v; } } run(); } }, p.name))) : null;
    const runBtn = h('button', { class: 'btn primary', type: 'button' }, '套用並重播');
    form.appendChild(h('div', { class: 'lf' }, runBtn));
    const stage = h('div', { class: 'lab-stage' });
    const note = h('div', { class: 'lab-note', 'aria-live': 'polite' });
    const ctrl = h('div', { class: 'lab-ctrl' });
    box.append(form); if (presets) box.append(presets); box.append(ctrl, note, stage);
    const read = () => Object.fromEntries($$('[data-k]', form).map(el => [el.dataset.k, el.type === 'checkbox' ? el.checked : el.value]));
    let player = null;
    const run = () => {
      let frames;
      try { frames = lab.build(read()); } catch (e) { note.innerHTML = `<span class="bad-t">輸入有誤：${esc(e.message)}</span>`; stage.innerHTML = ''; return; }
      if (player) player.stop();
      player = makePlayer(ctrl, note, stage, frames, lab.render);
      this.live.push(player);
    };
    runBtn.onclick = run;
    run();
  },
};

function makePlayer(ctrl, note, stage, frames, render) {
  let i = 0, timer = null, speed = 900;
  ctrl.innerHTML = `<button class="btn sm" data-a="first" aria-label="第一步">⏮</button><button class="btn sm" data-a="prev" aria-label="上一步">◀ 上一步</button><button class="btn sm primary" data-a="play">▶ 播放</button><button class="btn sm" data-a="next" aria-label="下一步">下一步 ▶</button><button class="btn sm" data-a="last" aria-label="最後">⏭</button>
    <label class="spd">速度<input type="range" min="150" max="2000" step="50" value="${2150 - speed}" aria-label="速度"></label><span class="stepc"></span>`;
  const show = () => {
    const f = frames[i];
    note.innerHTML = f.note ? md(f.note) : '';
    render(f, stage);
    $('.stepc', ctrl).textContent = `步驟 ${i + 1} / ${frames.length}`;
  };
  const stop = () => { clearInterval(timer); timer = null; const b = $('[data-a="play"]', ctrl); if (b) b.textContent = '▶ 播放'; };
  const play = () => {
    if (timer) return stop();
    if (i >= frames.length - 1) i = 0;
    $('[data-a="play"]', ctrl).textContent = '⏸ 暫停';
    timer = setInterval(() => { if (i < frames.length - 1) { i++; show(); } else stop(); }, speed);
  };
  ctrl.onclick = e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    const act = a.dataset.a;
    if (act === 'play') return play();
    stop();
    if (act === 'first') i = 0; if (act === 'last') i = frames.length - 1;
    if (act === 'prev') i = Math.max(0, i - 1); if (act === 'next') i = Math.min(frames.length - 1, i + 1);
    show();
  };
  $('input[type=range]', ctrl).oninput = e => { speed = 2150 - +e.target.value; if (timer) { stop(); play(); } };
  show();
  return { stop };
}

/* ---------- shared parsing ---------- */
function nums(s) { const a = String(s).split(/[\s,，;]+/).filter(Boolean).map(Number); if (a.some(isNaN)) throw new Error('請輸入以逗號或空白分隔的數字'); return a; }
function matrix(s) { return String(s).trim().split(/\n|;/).map(r => r.trim()).filter(Boolean).map(r => nums(r)); }

/* ---------- SVG helpers ---------- */
function svgTree(root, opt = {}) {
  if (!root) return '<p class="muted">（空樹）</p>';
  const nodes = []; let idx = 0, maxD = 0;
  (function walk(n, d) { if (!n) return; walk(n.l, d + 1); n._x = idx++; n._d = d; maxD = Math.max(maxD, d); nodes.push(n); walk(n.r, d + 1); })(root, 0);
  const W = Math.max(320, idx * 46 + 20), H = (maxD + 1) * 62 + 20;
  const X = n => 30 + n._x * 46, Y = n => 28 + n._d * 62;
  const hl = new Set(opt.hl || []), hl2 = new Set(opt.hl2 || []);
  let e = '', v = '';
  for (const n of nodes) for (const c of [n.l, n.r]) if (c) e += `<line x1="${X(n)}" y1="${Y(n)}" x2="${X(c)}" y2="${Y(c)}" class="edge"/>`;
  for (const n of nodes) {
    const cls = ['node', n.c === 'R' ? 'red' : n.c === 'B' ? 'black' : '', hl.has(n.k) ? 'hl' : '', hl2.has(n.k) ? 'hl2' : ''].join(' ');
    v += `<g class="${cls}"><circle cx="${X(n)}" cy="${Y(n)}" r="17"/><text x="${X(n)}" y="${Y(n) + 5}">${n.k}</text>${opt.sub ? `<text class="sub" x="${X(n)}" y="${Y(n) + 32}">${opt.sub(n)}</text>` : ''}</g>`;
  }
  return `<div class="svgwrap"><svg viewBox="0 0 ${W} ${H + (opt.sub ? 14 : 0)}" width="${W}" height="${H + (opt.sub ? 14 : 0)}" class="tree" role="img" aria-label="樹">${e}${v}</svg></div>`;
}
function svgArray(arr, opt = {}) {
  const w = 40, W = arr.length * w + 10;
  const cls = k => (opt.cls && opt.cls(k)) || '';
  return `<div class="svgwrap"><svg viewBox="0 0 ${W} 58" width="${W}" height="58" class="arr">${arr.map((x, k) => `<g class="cell ${cls(k)}"><rect x="${5 + k * w}" y="6" width="${w - 2}" height="32" rx="4"/><text x="${5 + k * w + (w - 2) / 2}" y="27">${x == null ? '' : x}</text><text class="idx" x="${5 + k * w + (w - 2) / 2}" y="52">${(opt.base ?? 0) + k}</text></g>`).join('')}</svg></div>`;
}
function svgBars(arr, opt = {}) {
  const n = arr.length, w = Math.max(14, Math.min(40, Math.floor(640 / n))), W = n * w + 10, max = Math.max(...arr, 1), H = 180;
  return `<div class="svgwrap"><svg viewBox="0 0 ${W} ${H + 24}" width="${W}" height="${H + 24}" class="bars">${arr.map((x, k) => { const bh = Math.max(3, x / max * H); return `<g class="bar ${(opt.cls && opt.cls(k)) || ''}"><rect x="${5 + k * w}" y="${H - bh}" width="${w - 3}" height="${bh}" rx="2"/><text x="${5 + k * w + (w - 3) / 2}" y="${H + 16}">${x}</text></g>`; }).join('')}</svg></div>`;
}
function htmlTable(rows, opt = {}) {
  return `<div class="tbl"><table class="lab-tbl">${opt.head ? `<thead><tr>${opt.head.map(c => `<th>${c}</th>`).join('')}</tr></thead>` : ''}<tbody>${rows.map((r, i) => `<tr>${r.map((c, j) => `<td class="${(opt.cls && opt.cls(i, j)) || ''}">${c == null ? '' : c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* =================== 排序 =================== */
const SortSim = {
  run(arr0, alg) {
    const a = arr0.slice(), F = [], sorted = new Set(); let cmp = 0, mov = 0;
    const snap = (note, hl = {}) => F.push({ a: a.slice(), note: note + `　｜比較 ${cmp} 次、交換／搬移 ${mov} 次`, hl, sorted: new Set(sorted) });
    snap('初始陣列');
    const sw = (i, j) => { [a[i], a[j]] = [a[j], a[i]]; mov++; };
    if (alg === 'bubble') {
      for (let i = 0; i < a.length - 1; i++) {
        let swapped = false;
        for (let j = 0; j < a.length - 1 - i; j++) {
          cmp++; if (a[j] > a[j + 1]) { sw(j, j + 1); swapped = true; snap(`a[${j}] > a[${j + 1}]，交換`, { swap: [j, j + 1] }); }
          else snap(`比較 a[${j}]、a[${j + 1}]，不換`, { cmp: [j, j + 1] });
        }
        sorted.add(a.length - 1 - i);
        if (!swapped) { for (let k = 0; k < a.length; k++) sorted.add(k); snap('這一輪沒有交換 → 已排好（最佳情況 O(n)）'); break; }
      }
    } else if (alg === 'insertion') {
      sorted.add(0);
      for (let i = 1; i < a.length; i++) {
        const key = a[i]; let j = i - 1;
        snap(`取 key = ${key}，往左找插入位置`, { cur: [i] });
        while (j >= 0) { cmp++; if (a[j] > key) { a[j + 1] = a[j]; mov++; snap(`${a[j]} > ${key}，右移`, { swap: [j, j + 1] }); j--; } else break; }
        a[j + 1] = key; for (let k = 0; k <= i; k++) sorted.add(k);
        snap(`把 ${key} 放到位置 ${j + 1}（左側 ${i + 1} 個已排序；逆序對數＝搬移次數）`, { cur: [j + 1] });
      }
    } else if (alg === 'selection') {
      for (let i = 0; i < a.length - 1; i++) {
        let m = i;
        for (let j = i + 1; j < a.length; j++) { cmp++; if (a[j] < a[m]) m = j; snap(`在 a[${i}..] 找最小：目前最小 a[${m}] = ${a[m]}`, { cmp: [j], cur: [m] }); }
        if (m !== i) sw(i, m); sorted.add(i);
        snap(`把最小值換到位置 ${i}（不穩定：長距離交換可能打亂相同鍵值的順序）`, { swap: [i, m] });
      }
    } else if (alg === 'merge') {
      const aux = [];
      const merge = (lo, mid, hi) => {
        for (let k = lo; k <= hi; k++) aux[k] = a[k];
        let i = lo, j = mid + 1;
        for (let k = lo; k <= hi; k++) {
          if (i > mid) a[k] = aux[j++]; else if (j > hi) a[k] = aux[i++];
          else { cmp++; if (aux[j] < aux[i]) a[k] = aux[j++]; else a[k] = aux[i++]; }
          mov++;
        }
        snap(`合併 [${lo}..${mid}] 與 [${mid + 1}..${hi}]（相等時取左邊 → 穩定）`, { range: [lo, hi] });
      };
      const sortR = (lo, hi) => { if (lo >= hi) return; const mid = (lo + hi) >> 1; sortR(lo, mid); sortR(mid + 1, hi); merge(lo, mid, hi); };
      sortR(0, a.length - 1);
    } else if (alg === 'quick') {
      const part = (p, r) => {
        const x = a[r]; let i = p - 1;
        snap(`Partition A[${p}..${r}]，pivot = A[${r}] = ${x}（CLRS Lomuto）`, { range: [p, r], cur: [r] });
        for (let j = p; j < r; j++) {
          cmp++;
          if (a[j] <= x) { i++; sw(i, j); snap(`A[${j}] ≤ pivot → i = ${i}，交換 A[${i}]、A[${j}]`, { range: [p, r], swap: [i, j], cur: [r] }); }
          else snap(`A[${j}] > pivot，跳過`, { range: [p, r], cmp: [j], cur: [r] });
        }
        sw(i + 1, r); sorted.add(i + 1);
        snap(`pivot 歸位到 ${i + 1}`, { range: [p, r], cur: [i + 1] });
        return i + 1;
      };
      const qs = (p, r) => { if (p < r) { const q = part(p, r); qs(p, q - 1); qs(q + 1, r); } else if (p === r) sorted.add(p); };
      qs(0, a.length - 1);
    } else if (alg === 'heap') {
      let n = a.length;
      const sift = (i, n2) => { for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < n2) { cmp++; if (a[l] > a[m]) m = l; } if (r < n2) { cmp++; if (a[r] > a[m]) m = r; } if (m === i) return; sw(i, m); snap(`Max-Heapify：${a[m]} 下沉`, { swap: [i, m], range: [0, n2 - 1] }); i = m; } };
      for (let i = (n >> 1) - 1; i >= 0; i--) sift(i, n);
      snap('Build-Max-Heap 完成（O(n)）', { range: [0, n - 1] });
      for (let end = n - 1; end > 0; end--) { sw(0, end); sorted.add(end); snap(`把最大值 ${a[end]} 換到尾端`, { swap: [0, end] }); sift(0, end); }

      const max = Math.max(...a); let exp = 1;

        const buckets = Array.from({ length: 10 }, () => []);
        for (const x of a) buckets[Math.floor(x / exp) % 10].push(x);
        let k = 0; for (const b of buckets) for (const x of b) { a[k++] = x; mov++; }

        exp *= 10;
      }
    }
    for (let k = 0; k < a.length; k++) sorted.add(k);
    snap('完成');
    return F;
  },
};

/* =================== Heap =================== */
const HeapSim = {
  run(ops, kind) {
    const a = [], F = []; const better = (x, y) => kind === 'max' ? x > y : x < y;
    const toTree = (i = 0) => i < a.length ? { k: a[i], l: toTree(2 * i + 1), r: toTree(2 * i + 2) } : null;
    const snap = (note, hl = []) => F.push({ a: a.slice(), tree: toTree(), note, hl: hl.map(i => a[i]) , hli: hl});
    const up = i => { while (i > 0) { const p = (i - 1) >> 1; if (better(a[i], a[p])) { [a[i], a[p]] = [a[p], a[i]]; snap(`${a[p]} 比父節點${kind === 'max' ? '大' : '小'}，上浮`, [p]); i = p; } else break; } };
    const down = i => { for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < a.length && better(a[l], a[m])) m = l; if (r < a.length && better(a[r], a[m])) m = r; if (m === i) return; [a[i], a[m]] = [a[m], a[i]]; snap(`${a[m]} 與較${kind === 'max' ? '大' : '小'}的子節點交換，下沉`, [m]); i = m; } };
    snap('空堆積');
    for (const op of ops) {
      if (op.t === 'build') {
        a.length = 0; a.push(...op.v); snap(`Build-Heap（Floyd）：先照順序放入陣列，再從最後一個內部節點 ${(a.length >> 1) - 1} 往前做下沉`);
        for (let i = (a.length >> 1) - 1; i >= 0; i--) { snap(`對索引 ${i}（值 ${a[i]}）做 Heapify`, [i]); down(i); }
        snap('Build 完成：總成本 Σ(節點高度) = O(n)');
      } else if (op.t === 'ins') { a.push(op.v); snap(`插入 ${op.v} 到陣列尾端（索引 ${a.length - 1}）`, [a.length - 1]); up(a.length - 1); snap(`插入 ${op.v} 完成`); }
      else if (op.t === 'del') {
        if (!a.length) { snap('空了'); continue; }
        const top = a[0]; const last = a.pop();
        if (a.length) { a[0] = last; snap(`取出根 ${top}；把最後一個元素 ${last} 移到根`, [0]); down(0); }
        snap(`Extract 完成，取出 ${top}`);
      }
    }
    return F;
  },
  parse(s) {
    return s.split(/[;\n]+/).map(x => x.trim()).filter(Boolean).map(x => {
      const m = x.match(/^(build|ins|insert|del|extract|pop)\s*(.*)$/i); if (!m) throw new Error('指令：build 1,2,3 / ins 5 / del');
      const t = /build/i.test(m[1]) ? 'build' : /ins/i.test(m[1]) ? 'ins' : 'del';
      return t === 'build' ? { t, v: nums(m[2]) } : t === 'ins' ? { t, v: Number(m[2]) } : { t };
    }).flatMap(o => o.t === 'ins' && isNaN(o.v) ? [] : [o]);
  },
};

/* =================== BST / AVL / RB =================== */
const TreeSim = {
  clone(n) { return n ? { k: n.k, c: n.c, h: n.h, l: TreeSim.clone(n.l), r: TreeSim.clone(n.r) } : null; },
  ht(n) { return n ? n.h : 0; },
  upd(n) { if (n) n.h = 1 + Math.max(TreeSim.ht(n.l), TreeSim.ht(n.r)); },
  rotR(z) { const y = z.l; const zr = z.r; z.l = y.l; y.l = y.r; y.r = zr;[z.k, y.k] = [y.k, z.k];[z.c, y.c] = [y.c, z.c]; z.r = y; TreeSim.upd(y); TreeSim.upd(z); },
  rotL(z) { const y = z.r; z.r = y.r; y.r = y.l; y.l = z.l;[z.k, y.k] = [y.k, z.k];[z.c, y.c] = [y.c, z.c]; z.l = y; TreeSim.upd(y); TreeSim.upd(z); },
  run(ops, kind) {
    const F = []; const T = { root: null };
    const snap = (note, hl = [], hl2 = []) => F.push({ tree: kind === 'rb' ? TreeSim.cloneRB(T.root) : TreeSim.clone(T.root), note, hl, hl2, kind });
    snap(kind === 'rb' ? '空的紅黑樹' : kind === 'avl' ? '空的 AVL 樹' : '空的 BST');
    for (const op of ops) {
      if (kind === 'rb') { if (op.t === 'ins') TreeSim.rbIns(T, op.v, snap); else snap('紅黑樹刪除較複雜，這裡只示範插入（台大常考插入的 case 1/2/3）'); continue; }
      if (op.t === 'ins') {
        if (!T.root) { T.root = { k: op.v, h: 1, l: null, r: null }; snap(`插入 ${op.v} 為根`, [op.v]); continue; }
        TreeSim.ins(T.root, op.v, kind === 'avl', snap);
      } else {
        if (!T.root) { snap('樹是空的'); continue; }
        const r = TreeSim.del(T.root, op.v, kind === 'avl', snap);
        if (r === 'REMOVE') T.root = null;
        snap(`刪除 ${op.v} 完成`);
      }
    }
    return F;
  },
  balance(n, avl, snap, why) {
    TreeSim.upd(n);
    if (!avl) return;
    const bf = TreeSim.ht(n.l) - TreeSim.ht(n.r);
    if (bf > 1) {
      const lbf = TreeSim.ht(n.l.l) - TreeSim.ht(n.l.r);
      if (lbf >= 0) { snap(`節點 ${n.k} 的平衡因子 = +2，左子 ${n.l.k} 的平衡因子 = ${lbf} → **LL 型**：對 ${n.k} 右旋`, [n.k], [n.l.k]); TreeSim.rotR(n); snap(`右旋完成，${n.k} 成為這棵子樹的根`, [n.k]); }
      else { snap(`節點 ${n.k} 的平衡因子 = +2，左子 ${n.l.k} 的平衡因子 = −1 → **LR 型**：先對 ${n.l.k} 左旋，再對 ${n.k} 右旋`, [n.k], [n.l.k]); TreeSim.rotL(n.l); snap('第一次旋轉（左旋）後變成 LL 型', [n.k]); TreeSim.rotR(n); snap(`第二次旋轉（右旋）完成，${n.k} 上升為子樹根`, [n.k]); }
    } else if (bf < -1) {
      const rbf = TreeSim.ht(n.r.l) - TreeSim.ht(n.r.r);
      if (rbf <= 0) { snap(`節點 ${n.k} 的平衡因子 = −2，右子 ${n.r.k} 的平衡因子 = ${rbf} → **RR 型**：對 ${n.k} 左旋`, [n.k], [n.r.k]); TreeSim.rotL(n); snap(`左旋完成，${n.k} 成為子樹的根`, [n.k]); }
      else { snap(`節點 ${n.k} 的平衡因子 = −2，右子 ${n.r.k} 的平衡因子 = +1 → **RL 型**：先對 ${n.r.k} 右旋，再對 ${n.k} 左旋`, [n.k], [n.r.k]); TreeSim.rotR(n.r); snap('第一次旋轉（右旋）後變成 RR 型', [n.k]); TreeSim.rotL(n); snap(`第二次旋轉（左旋）完成，${n.k} 上升為子樹根`, [n.k]); }
    }
  },
  ins(n, k, avl, snap) {
    if (k === n.k) { snap(`${k} 已存在，不插入`, [k]); return; }
    const side = k < n.k ? 'l' : 'r';
    if (!n[side]) { n[side] = { k, h: 1, l: null, r: null }; snap(`${k} ${k < n.k ? '<' : '>'} ${n.k}，插入為 ${n.k} 的${side === 'l' ? '左' : '右'}子`, [k]); }

      let s = n.r; while (s.l) s = s.l;

  },
  cloneRB(n) { return n ? { k: n.k, c: n.c, l: TreeSim.cloneRB(n.l), r: TreeSim.cloneRB(n.r) } : null; },
  rbIns(T, k, snap) {
    let y = null, x = T.root;
    while (x) { y = x; if (k === x.k) { snap(`${k} 已存在`); return; } x = k < x.k ? x.l : x.r; }

    const rotR = x2 => { const y2 = x2.l; x2.l = y2.r; if (y2.r) y2.r.p = x2; y2.p = x2.p; if (!x2.p) T.root = y2; else if (x2 === x2.p.r) x2.p.r = y2; else x2.p.l = y2; y2.r = x2; x2.p = y2; };

        z.p.c = 'B'; u.c = 'B'; gp.c = 'R'; z = gp; snap('重新著色完成', [z.k]);
      } else {
        if (left ? z === z.p.r : z === z.p.l) {
          snap(`Case 2：叔叔是黑，且 ${z.k} 是「內側」孫子 → 對父 ${z.p.k} ${left ? '左' : '右'}旋，轉成 Case 3`, [z.k], [z.p.k]);
          z = z.p; left ? rotL(z) : rotR(z); snap('旋轉後成為外側', [z.k]);
        }
        snap(`Case 3：叔叔是黑、${z.k} 在外側 → 父 ${z.p.k} 塗黑、祖父 ${z.p.p.k} 塗紅，對祖父${left ? '右' : '左'}旋`, [z.k], [z.p.k, z.p.p.k]);

  parse(s) { return s.split(/[;,\s]+/).filter(Boolean).map(t => { const m = t.match(/^(-|d|del)?(-?\d+)$/i); if (!m) throw new Error('輸入數字表示插入，前面加 d 表示刪除，如 d30'); return { t: m[1] ? 'del' : 'ins', v: Number(m[2]) }; }); },

/* =================== Hashing =================== */
const HashSim = {
  run(keys, m, method, c1 = 1, c2 = 3) {
    const T = Array(m).fill(null), F = [], chains = Array.from({ length: m }, () => []);
    const snap = (note, hl = [], probe = []) => F.push({ T: method === 'chain' ? chains.map(c => c.join('→') || null) : T.slice(), note, hl, probe });
    snap(`m = ${m}，h(k) = k mod ${m}` + (method === 'double' ? `，h₂(k) = 1 + (k mod ${m - 1})` : method === 'quad' ? `，探測 h(k) + ${c1}i + ${c2}i²` : ''));
    let total = 0;
    for (const k of keys) {
      const h0 = ((k % m) + m) % m;
      if (method === 'chain') { chains[h0].push(k); total++; snap(`${k} mod ${m} = ${h0}，接到串列尾端`, [h0]); continue; }
      const h2 = 1 + (((k % (m - 1)) + (m - 1)) % (m - 1));
      const probes = [];
      let placed = false;
      for (let i = 0; i < m; i++) {
        const j = method === 'linear' ? (h0 + i) % m : method === 'quad' ? (h0 + c1 * i + c2 * i * i) % m : (h0 + i * h2) % m;
        probes.push(j); total++;
        if (T[j] == null) { T[j] = k; snap(`插入 ${k}：第 ${i} 次探測位置 ${j}${i ? '（前面都被占）' : ''}${method === 'double' ? `，h₂ = ${h2}` : ''}`, [j], probes.slice()); placed = true; break; }
        snap(`插入 ${k}：位置 ${j} 已被 ${T[j]} 占用`, [], probes.slice());
      }
      if (!placed) snap(`${k} 插不進去（探測序列沒有走遍所有位置${method === 'quad' ? '：二次探測在 m 非質數或表半滿以上時可能失敗' : ''}）`);
    }
    snap(`完成：總探測 ${total} 次，負載因子 α = ${(keys.length / m).toFixed(2)}`);
    return F;
  },
};

Labs.reg({
  id: 'uf', title: 'Disjoint Set（Union-Find）', subject: 'ds', lessons: ['ds-unionfind'], desc: 'Union by rank + path compression 的森林變化',
  form: [{ id: 'n', label: '元素數 n', type: 'number', value: '10', size: 4 },
    { id: 'ops', label: '操作', value: 'u 1 2; u 3 4; u 2 4; u 5 6; u 6 7; u 7 4; f 1; u 8 9; u 9 0; u 0 1; f 5', wide: true },
    { id: 'rank', label: 'Union by rank', type: 'check', value: true }, { id: 'pc', label: 'Path compression', type: 'check', value: true }],
  build(v) {
    const n = Math.min(16, Math.max(2, +v.n | 0)); const p = Array.from({ length: n }, (_, i) => i), rk = Array(n).fill(0); const F = [];
    const snap = (note, hl = []) => F.push({ p: p.slice(), rk: rk.slice(), note, hl });
    snap('每個元素自成一棵樹');
    const find = x => { const path = []; while (p[x] !== x) { path.push(x); x = p[x]; } if (v.pc) for (const y of path) p[y] = x; return { root: x, path }; };
    for (const t of v.ops.split(/[;\n]+/).map(s => s.trim()).filter(Boolean)) {
      const [c, a, b] = t.split(/\s+/); const A = +a, B = +b;
      if (A >= n || (c === 'u' && B >= n)) throw new Error('元素超出範圍');
      if (c === 'f') { const r = find(A); snap(`Find(${A}) → 根 ${r.root}${v.pc && r.path.length > 1 ? `；路徑上 ${r.path.join(',')} 直接接到根（path compression）` : ''}`, [A, r.root]); }
      else { const ra = find(A).root, rb = find(B).root; if (ra === rb) { snap(`${A}、${B} 已在同一集合`); continue; }
        let x = ra, y = rb; if (v.rank && rk[x] < rk[y]) [x, y] = [y, x];
        p[y] = x; if (v.rank && rk[x] === rk[y]) rk[x]++;
        snap(`Union(${A},${B})：根 ${y} 接到根 ${x} 底下${v.rank ? `（rank ${rk[y]} 接到 rank ${rk[x]}）` : ''}`, [x, y]); }
    }
    return F;
  },
  render(f, st) {
    const n = f.p.length; const kids = Array.from({ length: n }, () => []); const roots = [];
    f.p.forEach((q, i) => q === i ? roots.push(i) : kids[q].push(i));
    let x = 0; const pos = {}; let maxD = 0;
    const lay = (u, d) => { maxD = Math.max(maxD, d); if (!kids[u].length) { pos[u] = [x++, d]; return pos[u][0]; } const xs = kids[u].map(c => lay(c, d + 1)); pos[u] = [(Math.min(...xs) + Math.max(...xs)) / 2, d]; return pos[u][0]; };
    roots.forEach(r => { lay(r, 0); x += 0.6; });
    const W = x * 46 + 30, H = (maxD + 1) * 60 + 30; const X = u => 26 + pos[u][0] * 46, Y = u => 26 + pos[u][1] * 60;
    let e = '', v2 = '';
    f.p.forEach((q, i) => { if (q !== i) e += `<line class="edge" x1="${X(i)}" y1="${Y(i)}" x2="${X(q)}" y2="${Y(q)}"/>`; });
    for (let i = 0; i < n; i++) v2 += `<g class="node ${f.hl.includes(i) ? 'hl' : ''}"><circle cx="${X(i)}" cy="${Y(i)}" r="16"/><text x="${X(i)}" y="${Y(i) + 5}">${i}</text>${f.p[i] === i ? `<text class="sub" x="${X(i)}" y="${Y(i) - 22}">r${f.rk[i]}</text>` : ''}</g>`;
    st.innerHTML = `<div class="svgwrap"><svg class="tree" viewBox="0 -10 ${W} ${H + 10}" width="${W}" height="${H + 10}">${e}${v2}</svg></div>` + svgArray(f.p.map(String)) + '<p class="muted small">下排是 parent 陣列；r 是 rank。</p>';
  },
});

/* =================== 圖演算法 =================== */
const GraphSim = {
  parse(txt, directed) {
    const E = []; const V = [];
    const add = x => { if (!V.includes(x)) V.push(x); };
    for (const line of txt.split(/[\n;]+/).map(s => s.trim()).filter(Boolean)) {
      const [a, b, w] = line.split(/[\s,]+/); if (!b) { add(a); continue; }
      add(a); add(b); E.push({ u: a, v: b, w: w == null ? 1 : Number(w) });
    }
    return { V, E, directed };
  },
  adj(G) { const A = Object.fromEntries(G.V.map(v => [v, []])); for (const e of G.E) { A[e.u].push({ v: e.v, w: e.w, e }); if (!G.directed) A[e.v].push({ v: e.u, w: e.w, e }); } for (const k in A) A[k].sort((x, y) => String(x.v).localeCompare(String(y.v), 'en', { numeric: true })); return A; },
  run(G, alg, s) {
    const F = []; const A = GraphSim.adj(G); const V = G.V;
    if (!V.includes(s)) s = V[0];
    const lab = {}, es = new Map(), vs = {};
    const snap = (note, extra = {}) => F.push(Object.assign({ note, lab: Object.assign({}, lab), es: new Map(es), vs: Object.assign({}, vs) }, extra));
    const inf = '∞';
    if (alg === 'bfs') {
      V.forEach(v => lab[v] = inf); lab[s] = 0; vs[s] = 'gray'; const Q = [s]; snap(`從 ${s} 開始，d[${s}] = 0，放入佇列`, { q: Q.slice() });
      while (Q.length) { const u = Q.shift(); vs[u] = 'cur'; snap(`取出 ${u}`, { q: Q.slice() });
        for (const { v, e } of A[u]) { if (lab[v] === inf) { lab[v] = lab[u] + 1; vs[v] = 'gray'; es.set(e, 'tree'); Q.push(v); snap(`${v} 未拜訪：d[${v}] = ${lab[v]}，π[${v}] = ${u}`, { q: Q.slice() }); } else if (!es.has(e)) es.set(e, 'dim'); }
        vs[u] = 'black'; }
      snap('BFS 完成：樹邊構成最短路徑樹（無權重）');
    } else if (alg === 'dfs') {
      let time = 0; const d = {}, f = {};
      const visit = u => { d[u] = ++time; vs[u] = 'gray'; lab[u] = d[u] + '/'; snap(`發現 ${u}（d = ${d[u]}），塗灰`);
        for (const { v, e } of A[u]) {
          if (!G.directed && es.get(e) === 'tree') continue;
          if (!vs[v]) { es.set(e, 'tree'); snap(`(${u},${v}) 是樹邊`); visit(v); }
          else if (!es.has(e)) {
            const kind = vs[v] === 'gray' ? 'back' : (G.directed ? (d[u] < d[v] ? 'fwd' : 'cross') : 'back');
            es.set(e, kind); snap(`(${u},${v})：${v} 是${vs[v] === 'gray' ? '灰色（在遞迴堆疊上）→ 後向邊，有環' : `黑色，d[${u}]${d[u] < d[v] ? '<' : '>'}d[${v}] → ${kind === 'fwd' ? '前向邊' : '交叉邊'}`}`);
          }
        }
        f[u] = ++time; vs[u] = 'black'; lab[u] = d[u] + '/' + f[u]; snap(`${u} 完成（f = ${f[u]}），塗黑`); };
      for (const u of [s, ...V.filter(x => x !== s)]) if (!vs[u]) visit(u);
      snap('DFS 完成。括號定理：任兩點的 [d,f] 區間不是包含就是不相交。依 f 遞減排就是拓撲順序（若為 DAG）');
    } else if (alg === 'dijkstra' || alg === 'prim') {
      const isP = alg === 'prim';
      V.forEach(v => lab[v] = inf); lab[s] = 0; const done = new Set(); const pi = {};
      snap(isP ? `Prim：key[${s}] = 0，其餘 ∞` : `Dijkstra：d[${s}] = 0，其餘 ∞（要求邊權 ≥ 0）`);
      while (done.size < V.length) {
        let u = null; for (const v of V) if (!done.has(v) && lab[v] !== inf && (u === null || lab[v] < lab[u])) u = v;
        if (u === null) break;
        done.add(u); vs[u] = 'black'; if (pi[u]) es.set(pi[u], 'tree');
        snap(`Extract-Min → ${u}（${isP ? 'key' : 'd'} = ${lab[u]}），從此${isP ? '加入樹' : '距離確定'}`);
        for (const { v, w, e } of A[u]) {
          if (done.has(v)) continue;
          const cand = isP ? w : lab[u] + w;
          if (lab[v] === inf || cand < lab[v]) { const old = lab[v]; lab[v] = cand; if (pi[v]) es.set(pi[v], 'dim'); pi[v] = e; es.set(e, 'cand'); vs[v] = 'gray'; snap(`${isP ? '更新' : '鬆弛'} (${u},${v})：${old} → ${cand}`); }
          else { if (!es.has(e)) es.set(e, 'dim'); snap(`(${u},${v})：${cand} ≥ ${lab[v]}，不更新`); }
        }
      }
      let tot = 0; if (isP) for (const [e, k] of es) if (k === 'tree') tot += e.w;
      snap(isP ? `Prim 完成，MST 總權重 ${tot}` : 'Dijkstra 完成：粗邊是最短路徑樹');
    } else if (alg === 'bellman') {
      V.forEach(v => lab[v] = inf); lab[s] = 0; const pi = {};
      snap(`Bellman-Ford：做 |V|−1 = ${V.length - 1} 輪，每輪依序鬆弛所有邊`);
      for (let it = 1; it < V.length; it++) {
        let ch = false;
        for (const e of G.E) { const pairs = G.directed ? [[e.u, e.v]] : [[e.u, e.v], [e.v, e.u]];
          for (const [u, v] of pairs) if (lab[u] !== inf && (lab[v] === inf || lab[u] + e.w < lab[v])) { lab[v] = lab[u] + e.w; if (pi[v]) es.set(pi[v], 'dim'); pi[v] = e; es.set(e, 'tree'); ch = true; snap(`第 ${it} 輪：鬆弛 (${u},${v})，d[${v}] = ${lab[v]}`); } }
        snap(`第 ${it} 輪結束${ch ? '' : '：沒有變動，可提早停止'}`); if (!ch) break;
      }
      let neg = false; for (const e of G.E) if (lab[e.u] !== inf && lab[e.u] + e.w < lab[e.v]) { neg = true; es.set(e, 'back'); }
      snap(neg ? '第 |V| 輪仍可鬆弛 → 有從源點可達的負環，最短路徑無定義' : '再檢查一輪沒有可鬆弛的邊 → 沒有負環');
    } else if (alg === 'kruskal') {
      const p = Object.fromEntries(V.map(v => [v, v])); const find = x => p[x] === x ? x : (p[x] = find(p[x]));
      const sorted = G.E.slice().sort((a, b) => a.w - b.w); let tot = 0, k = 0;
      snap('Kruskal：邊依權重排序：' + sorted.map(e => `${e.u}${e.v}(${e.w})`).join(' '));
      for (const e of sorted) { const a = find(e.u), b = find(e.v);
        if (a !== b) { p[a] = b; es.set(e, 'tree'); tot += e.w; k++; snap(`(${e.u},${e.v}) w=${e.w}：兩端在不同集合 → 加入（cut property）`); if (k === V.length - 1) break; }
        else { es.set(e, 'dim'); snap(`(${e.u},${e.v}) w=${e.w}：會形成環 → 捨棄`); } }
      snap(`完成，MST 總權重 ${tot}`);
    } else if (alg === 'topo') {
      const indeg = Object.fromEntries(V.map(v => [v, 0])); for (const e of G.E) indeg[e.v]++;
      V.forEach(v => lab[v] = 'in' + indeg[v]); const Q = V.filter(v => indeg[v] === 0).sort(); const order = [];
      snap(`Kahn：入度為 0 的點進佇列：${Q.join(',')}`, { q: Q.slice() });
      while (Q.length) { const u = Q.shift(); order.push(u); vs[u] = 'black'; lab[u] = '#' + order.length;
        for (const { v, e } of A[u]) { indeg[v]--; es.set(e, 'tree'); if (vs[v] !== 'black') lab[v] = 'in' + indeg[v]; if (indeg[v] === 0) { Q.push(v); Q.sort(); } }
        snap(`輸出 ${u}，順序：${order.join(' → ')}`, { q: Q.slice() }); }
      snap(order.length === V.length ? `拓撲排序：${order.join(' → ')}` : '有點始終入度 > 0 → 圖中有環，不是 DAG');
    } else if (alg === 'floyd') {
      const n = V.length, I = Object.fromEntries(V.map((v, i) => [v, i]));
      const d = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => i === j ? 0 : Infinity));
      for (const e of G.E) { d[I[e.u]][I[e.v]] = Math.min(d[I[e.u]][I[e.v]], e.w); if (!G.directed) d[I[e.v]][I[e.u]] = Math.min(d[I[e.v]][I[e.u]], e.w); }
      const mat = (k, ch) => ({ mat: d.map(r => r.map(x => x === Infinity ? '∞' : x)), ch, k });
      snap('D⁽⁰⁾ = 邊權矩陣', mat(-1, []));
      for (let k = 0; k < n; k++) { const ch = [];
        for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (d[i][k] + d[k][j] < d[i][j]) { d[i][j] = d[i][k] + d[k][j]; ch.push(i + ',' + j); }
        snap(`D⁽${k + 1}⁾：允許經過 ${V[k]}，更新 ${ch.length} 格：d[i][j] = min(d[i][j], d[i][${V[k]}] + d[${V[k]}][j])`, mat(k, ch)); }
    }
    F.forEach(f => f.G = G);
    return F;
  },
  layout(G) {
    const P = {}; const n = G.V.length;
    const preset = GraphSim.presetPos[G.V.join('')];
    G.V.forEach((v, i) => { P[v] = preset && preset[v] ? preset[v] : [260 + 190 * Math.cos(2 * Math.PI * i / n - Math.PI / 2), 210 + 170 * Math.sin(2 * Math.PI * i / n - Math.PI / 2)]; });

  },
  presetPos: {

  },
  render(f, st) {

  },

Labs.reg({

      const K = Array.from({ length: n + 1 }, () => Array(W + 1).fill(0));

      snap('K[i][c] = 前 i 個物品、容量 c 的最大價值');

    const snap = (note, cur, dep = [], path = []) => F.push({ head: ['', 'ε', ...Y.split('')], rows: C.map((r, i) => [i ? X[i - 1] : 'ε', ...r.map((x, j) => (B[i][j] ? `<small>${B[i][j]}</small>` : '') + x)]), note, cur, dep, path, off: 1 });
    snap(isE ? 'E[i][j] = X[1..i] 變成 Y[1..j] 的最少編輯數；第一列／行是全刪／全插' : 'c[i][j] = X[1..i] 與 Y[1..j] 的 LCS 長度');

      else { C[i][j] = Math.max(C[i - 1][j], C[i][j - 1]); B[i][j] = C[i - 1][j] >= C[i][j - 1] ? '↑' : '←'; snap(`${X[i - 1]} ≠ ${Y[j - 1]} → max(上 ${C[i - 1][j]}, 左 ${C[i][j - 1]}) = ${C[i][j]}`, [i, j], [[i - 1, j], [i, j - 1]]); }

    while (i > 0 && j > 0) { path.push([i, j]); const b = B[i][j]; if (b === '↖') { if (!isE || X[i - 1] === Y[j - 1]) s.push(X[i - 1]); i--; j--; } else if (b === '↑') i--; else j--; }
    snap(isE ? `編輯距離 = ${C[m][n]}（沿箭頭回溯得到操作序列）` : `LCS 長度 ${C[m][n]}，回溯得到「${s.reverse().join('')}」（LCS 不一定唯一）`, null, [], path);
    return F;
  },
  render(f, st) {

  },

<script>
/* 資工所衝刺站 — 計組／OS／線代 動畫 + 共用模擬器 Sim（隨機題也用它算答案） */
'use strict';

const Sim = {
  /* ---------- CPU 排程 ---------- */
  cpu(procs, alg, q = 2) {
    const P = procs.map((p, i) => Object.assign({ i, rem: p.bt, start: null }, p));
    const segs = [], notes = [];
    const push = (name, s, e, note) => { if (s === e) return; const last = segs[segs.length - 1]; if (last && last.p === name && last.e === s) last.e = e; else { segs.push({ p: name, s, e }); notes.push(note); } };
    const arrived = t => P.filter(p => p.at <= t && p.rem > 0);
    const byKey = (key) => (a, b) => key(a) - key(b) || a.at - b.at || a.i - b.i;
    let t = Math.min(...P.map(p => p.at));
    if (t > 0) push('idle', 0, t, `0～${t} 沒有行程到達，CPU 閒置`);
    if (alg === 'fcfs' || alg === 'sjf' || alg === 'prio') {
      while (P.some(p => p.rem > 0)) {
        let R = arrived(t);
        if (!R.length) { const nt = Math.min(...P.filter(p => p.rem > 0).map(p => p.at)); push('idle', t, nt, `閒置到 ${nt}`); t = nt; continue; }
        const key = alg === 'fcfs' ? (p => p.at) : alg === 'sjf' ? (p => p.bt) : (p => p.pr);
        R.sort(byKey(key)); const p = R[0];
        p.start = t; push(p.n, t, t + p.rem, `t=${t}：就緒 {${R.map(x => x.n).join(',')}}，選 ${p.n}（${alg === 'fcfs' ? '最早到' : alg === 'sjf' ? 'burst 最短 = ' + p.bt : '優先權最高 = ' + p.pr}），不可搶先，跑完 ${p.rem}`);
        t += p.rem; p.rem = 0; p.ct = t;
      }
    } else if (alg === 'srtf' || alg === 'pprio') {
      let cur = null;
      while (P.some(p => p.rem > 0)) {
        const R = arrived(t);
        if (!R.length) { const nt = Math.min(...P.filter(p => p.rem > 0).map(p => p.at)); push('idle', t, nt, `閒置到 ${nt}`); t = nt; cur = null; continue; }
        const key = alg === 'srtf' ? (p => p.rem) : (p => p.pr);
        R.sort(byKey(key));
        let p = R[0];
        if (cur && cur.rem > 0 && key(cur) === key(p)) p = cur; // 平手不搶先
        const why = cur && cur !== p && cur.rem > 0 ? `${p.n} 的${alg === 'srtf' ? '剩餘時間 ' + p.rem + ' < ' + cur.n + ' 的 ' + cur.rem : '優先權較高'} → 搶先` : `選 ${p.n}（${alg === 'srtf' ? '剩餘最短 ' + p.rem : '優先權 ' + p.pr}）`;
        if (p.start == null) p.start = t;
        const nextArr = Math.min(...P.filter(x => x.at > t).map(x => x.at), Infinity);
        const run = Math.min(p.rem, nextArr - t);
        push(p.n, t, t + run, `t=${t}：就緒 {${R.map(x => x.n + (alg === 'srtf' ? '(' + x.rem + ')' : '')).join(',')}}，${why}`);
        t += run; p.rem -= run; if (p.rem === 0) p.ct = t; cur = p;
      }
    } else if (alg === 'rr') {
      const Q = []; const inQ = new Set(); let idx = 0;
      const order = P.slice().sort((a, b) => a.at - b.at || a.i - b.i);
      const admit = upto => { while (idx < order.length && order[idx].at <= upto) { Q.push(order[idx]); inQ.add(order[idx]); idx++; } };
      admit(t);
      while (Q.length || idx < order.length) {
        if (!Q.length) { const nt = order[idx].at; push('idle', t, nt, `閒置到 ${nt}`); t = nt; admit(t); continue; }
        const p = Q.shift(); if (p.start == null) p.start = t;
        const run = Math.min(q, p.rem);
        const note = `t=${t}：佇列頭 ${p.n}（剩 ${p.rem}），跑 ${run}${p.rem > q ? '，時間片用完' : '，結束'}；佇列 [${Q.map(x => x.n).join(',')}]`;
        push(p.n, t, t + run, note);
        t += run; p.rem -= run;
        admit(t); // 同時到達的新行程排在被搶下來的行程前面
        if (p.rem > 0) Q.push(p); else p.ct = t;
      }
    }
    const stats = P.map(p => ({ n: p.n, at: p.at, bt: p.bt, pr: p.pr, ct: p.ct, tat: p.ct - p.at, wt: p.ct - p.at - p.bt, rt: p.start - p.at }));
    const avg = k => stats.reduce((s, x) => s + x[k], 0) / stats.length;
    const cs = segs.filter(s => s.p !== 'idle').length - 1;
    return { segs, notes, stats, avgWT: avg('wt'), avgTAT: avg('tat'), avgRT: avg('rt'), switches: cs };
  },
  /* ---------- 頁替換 ---------- */
  page(refs, n, alg) {
    const fr = Array(n).fill(null), last = {}, loaded = {}, bit = Array(n).fill(0); let ptr = 0, faults = 0;
    const steps = [];
    refs.forEach((r, t) => {
      let slot = fr.indexOf(r), victim = null, hit = slot >= 0;
      if (hit) { if (alg === 'clock') bit[slot] = 1; }
      else {
        faults++;

          if (alg === 'fifo') slot = fr.reduce((b, x, k) => loaded[x] < loaded[fr[b]] ? k : b, 0);
          else if (alg === 'lru') slot = fr.reduce((b, x, k) => last[x] < last[fr[b]] ? k : b, 0);
          else if (alg === 'opt') {
            let far = -1;
            fr.forEach((x, k) => { let nx = refs.indexOf(x, t + 1); if (nx < 0) nx = Infinity; if (nx > far) { far = nx; slot = k; } });
          } else if (alg === 'clock') { while (bit[ptr]) { bit[ptr] = 0; ptr = (ptr + 1) % n; } slot = ptr; ptr = (ptr + 1) % n; }
          victim = fr[slot];
        } else if (alg === 'clock') ptr = (slot + 1) % n;
        fr[slot] = r; loaded[r] = t; if (alg === 'clock') bit[slot] = 1;
      }
      last[r] = t;
      steps.push({ ref: r, fr: fr.slice(), hit, victim, slot, bit: bit.slice(), ptr });
    });
    return { steps, faults };
  },
  /* ---------- 磁碟排程 ---------- */
  disk(reqs, head, alg, dir = 'up', max = 199) {
    const path = [head]; let pos = head; let jump = 0; let pend = reqs.slice();
    const go = c => { path.push(c); pos = c; };
    const asc = (x, y) => x - y, desc = (x, y) => y - x;
    if (alg === 'fcfs') reqs.forEach(go);
    else if (alg === 'sstf') { while (pend.length) { const c = pend.slice().sort((x, y) => Math.abs(x - pos) - Math.abs(y - pos) || x - y)[0]; pend.splice(pend.indexOf(c), 1); go(c); } }
    else {
      const up = dir === 'up';
      const A = pend.filter(c => up ? c >= pos : c <= pos).sort(up ? asc : desc);
      const B = pend.filter(c => up ? c < pos : c > pos);
      A.forEach(go);
      if (B.length) {
        if (alg === 'scan') { const end = up ? max : 0; if (pos !== end) go(end); B.sort(up ? desc : asc).forEach(go); }
        else if (alg === 'look') B.sort(up ? desc : asc).forEach(go);
        else if (alg === 'cscan') { const end = up ? max : 0, start = up ? 0 : max; if (pos !== end) go(end); jump = Math.abs(end - start); go(start); B.sort(up ? asc : desc).forEach(c => { if (c !== pos) go(c); }); }
        else if (alg === 'clook') { B.sort(up ? asc : desc); jump = Math.abs(pos - B[0]); go(B[0]); B.slice(1).forEach(go); }
      }
    }
    let total = 0; for (let k = 1; k < path.length; k++) total += Math.abs(path[k] - path[k - 1]);
    return { path, total, totalNoJump: total - jump, jump };
  },
  /* ---------- Cache ---------- */
  cache({ C, B, A, m = 32, addrs, policy = 'lru' }) {
    const blocks = C / B; const ways = A === 'full' ? blocks : +A; const sets = blocks / ways;
    if (!Number.isInteger(sets) || sets < 1) throw new Error('容量／區塊／關聯度組合不合法');
    const ob = Math.log2(B), ib = Math.log2(sets); if (!Number.isInteger(ob) || !Number.isInteger(ib)) throw new Error('區塊大小與 set 數要是 2 的冪次');
    const tb = m - ob - ib;
    const SS = Array.from({ length: sets }, () => []); let hits = 0;
    const steps = addrs.map((a, t) => {
      const blk = Math.floor(a / B), idx = blk % sets, tag = Math.floor(blk / sets), off = a % B;
      const set = SS[idx]; const line = set.find(l => l.tag === tag); let victim = null;
      if (line) { hits++; if (policy === 'lru') line.used = t; }
      else {
        if (set.length >= ways) { const v = set.reduce((x, l) => (l.used < x.used ? l : x)); victim = v.tag; set.splice(set.indexOf(v), 1); }
        set.push({ tag, used: t, blk });
      }
      return { a, blk, idx, tag, off, hit: !!line, victim, snapshot: SS.map(q => q.map(l => ({ tag: l.tag, blk: l.blk }))) };
    });
    return { steps, hits, misses: addrs.length - hits, sets, ways, ob, ib, tb };
  },
  /* ---------- 5 級管線 ---------- */
  parseAsm(txt) {
    return txt.split(/\n|;/).map(s => s.trim()).filter(Boolean).map(line => {
      const m = line.match(/^(\w+)\s+(.*)$/); if (!m) throw new Error('看不懂：' + line);
      const op = m[1].toLowerCase(); const regs = (m[2].match(/\$?\w+/g) || []).filter(x => /^\$|^[rx]\d+$/i.test(x)).map(x => x.replace(/^\$/, '').toLowerCase());
      let dst = null, src = [];
      if (op === 'lw' || op === 'ld') { dst = regs[0]; src = [regs[1]]; }
      else if (op === 'sw' || op === 'sd') { src = [regs[0], regs[1]]; }
      else if (op === 'beq' || op === 'bne') { src = [regs[0], regs[1]]; }
      else if (/i$/.test(op) && op !== 'mul') { dst = regs[0]; src = [regs[1]]; }
      else { dst = regs[0]; src = regs.slice(1); }
      src = src.filter(r => r && r !== '0' && r !== 'zero' && r !== 'x0');
      return { line, op, dst: dst && dst !== '0' && dst !== 'zero' && dst !== 'x0' ? dst : null, src, load: op === 'lw' || op === 'ld', br: op === 'beq' || op === 'bne' };
    });
  },
  pipe(ins, fwd) {
    const R = [];
    ins.forEach((x, i) => {
      const IF = i ? R[i - 1].idS : 1;
      const idS = i ? Math.max(IF + 1, R[i - 1].idE + 1) : 2;
      let need = idS; const why = [];
      for (const r of x.src) {
        for (let j = i - 1; j >= 0; j--) if (ins[j].dst === r) {
          const p = R[j]; let t;
          if (!fwd) t = p.WB; else if (x.br) t = ins[j].load ? p.MEM + 1 : p.EX + 1; else t = ins[j].load ? p.MEM : p.EX;
          if (t > need) { need = t; }
          why.push({ j, r, t, kind: !fwd ? 'WB 寫入前半、讀取後半' : ins[j].load ? (x.br ? 'load→分支：等 MEM 結束再轉送到 ID' : 'load-use：MEM/WB 轉送到 EX') : (x.br ? 'ALU→分支（ID 比較）：EX/MEM 轉送到 ID' : 'EX/MEM 轉送到 EX') });
          break;
        }

      const idE = need; const EX = idE + 1, MEM = EX + 1, WB = MEM + 1;

    return { R, cycles: R.length ? R[R.length - 1].WB : 0, stalls: R.reduce((s, r) => s + r.stall, 0) };
  },
  /* ---------- Banker ---------- */
  banker(avail, max, alloc) {
    const n = max.length, m = avail.length;
    const need = max.map((r, i) => r.map((x, j) => x - alloc[i][j]));
    if (need.some(r => r.some(x => x < 0))) throw new Error('Allocation 不能超過 Max');
    const work = avail.slice(), fin = Array(n).fill(false), seq = [], steps = [];
    steps.push({ work: work.slice(), fin: fin.slice(), note: `Need = Max − Allocation；Work = Available = (${work.join(',')})` });
    let progress = true;
    while (progress) {
      progress = false;
      for (let i = 0; i < n; i++) if (!fin[i] && need[i].every((x, j) => x <= work[j])) {
        for (let j = 0; j < m; j++) work[j] += alloc[i][j]; fin[i] = true; seq.push(i); progress = true;
        steps.push({ work: work.slice(), fin: fin.slice(), pick: i, note: `P${i} 的 Need (${need[i].join(',')}) ≤ Work → 讓它跑完，歸還 Allocation，Work = (${work.join(',')})` });
        break;
      }
    }
    const safe = fin.every(Boolean);
    steps.push({ work: work.slice(), fin: fin.slice(), note: safe ? `安全狀態，安全序列 <${seq.map(i => 'P' + i).join(', ')}>（每次挑編號最小的可執行行程）` : `找不到可以完成的行程：P${fin.map((f, i) => f ? null : i).filter(x => x != null).join(', P')} 卡住 → 不安全狀態（不一定已死結）` });
    return { need, safe, seq, steps };
  },
};

/* ===================== Labs: OS ===================== */
function parseProcs(txt) {
  return txt.split(/\n|;/).map(s => s.trim()).filter(Boolean).map((l, i) => { const p = l.split(/[\s,]+/); if (p.length < 3) throw new Error('每行：名稱 到達 burst [優先權]'); return { n: p[0], at: +p[1], bt: +p[2], pr: p[3] != null ? +p[3] : 0 }; });
}
function ganttSvg(segs, upto) {
  const end = Math.max(...segs.map(s => s.e)); const sc = Math.min(28, 640 / Math.max(end, 1)); const W = end * sc + 30;
  const names = [...new Set(segs.map(s => s.p))].filter(x => x !== 'idle');
  return `<div class="svgwrap"><svg class="gantt" viewBox="0 0 ${W} 70" width="${W}" height="70">${segs.slice(0, upto).map(s => `<g class="seg ${s.p === 'idle' ? 'idle' : 'p' + (names.indexOf(s.p) % 6)}"><rect x="${10 + s.s * sc}" y="8" width="${(s.e - s.s) * sc}" height="30"/><text x="${10 + (s.s + s.e) / 2 * sc}" y="28">${s.p === 'idle' ? '' : s.p}</text><text class="tick" x="${10 + s.s * sc}" y="56">${s.s}</text></g>`).join('')}${upto ? `<text class="tick" x="${10 + segs[upto - 1].e * sc}" y="56">${segs[upto - 1].e}</text>` : ''}</svg></div>`;
}

Labs.reg({
  id: 'page', title: '頁替換演算法', subject: 'os', lessons: ['os-vm'], desc: 'FIFO、LRU、OPT、Clock，逐次看 frame 內容與缺頁；可以重現 Belady 異常',
  form: [{ id: 'alg', label: '演算法', type: 'select', value: 'lru', options: [['fifo', 'FIFO'], ['lru', 'LRU'], ['opt', 'OPT（最佳）'], ['clock', 'Clock（第二次機會）']] },
    { id: 'n', label: 'Frame 數', type: 'number', value: '3', size: 4 },
    { id: 'refs', label: '參考串', value: '7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1', wide: true }],
  presets: [{ name: '恐龍書參考串', v: { refs: '7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1' } }, { name: 'Belady（FIFO 3 vs 4 frames）', v: { alg: 'fifo', refs: '1 2 3 4 1 2 5 1 2 3 4 5', n: '4' } }],
  build(v) {

    let f = 0;
    return r.steps.map((s, k) => { if (!s.hit) f++; return { refs, steps: r.steps, k, note: `參考 ${s.ref}：${s.hit ? '命中' : `**缺頁**（第 ${f} 次）` + (s.victim != null ? `，換出 ${s.victim}` + (v.alg === 'opt' ? '（未來最晚才用到）' : v.alg === 'lru' ? '（最久沒用）' : v.alg === 'fifo' ? '（最早載入）' : '（參考位元為 0）') : '，放入空 frame')}${k === refs.length - 1 ? `。總缺頁 ${r.faults} 次，缺頁率 ${(r.faults / refs.length * 100).toFixed(1)}%` : ''}`, clock: v.alg === 'clock' }; });
  },
  render(f, st) {

    const head = f.refs.map((x, k) => `<span class="${k === f.k ? 'curh' : ''}">${x}</span>`);

/* ===================== Labs: 線代 ===================== */
const Frac = {
  g(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; },
  mk(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = Frac.g(n, d); return { n: n / g, d: d / g }; },
  add(a, b) { return Frac.mk(a.n * b.d + b.n * a.d, a.d * b.d); }, sub(a, b) { return Frac.mk(a.n * b.d - b.n * a.d, a.d * b.d); },
  mul(a, b) { return Frac.mk(a.n * b.n, a.d * b.d); }, div(a, b) { return Frac.mk(a.n * b.d, a.d * b.n); },
  z(a) { return a.n === 0; }, s(a) { return a.d === 1 ? String(a.n) : `${a.n}/${a.d}`; },
};
Sim.rref = function (M0) {
  const M = M0.map(r => r.map(x => Frac.mk(x))); const rows = M.length, cols = M[0].length; const ops = [];
  const snap = (note, hl = []) => ops.push({ M: M.map(r => r.map(Frac.s)), note, hl });
  snap('原矩陣');
  let r = 0; const piv = [];
  for (let c = 0; c < cols && r < rows; c++) {
    let p = r; while (p < rows && Frac.z(M[p][c])) p++;
    if (p === rows) { snap(`第 ${c + 1} 行在第 ${r + 1} 列以下全為 0 → 不是 pivot 行（對應自由變數）`); continue; }
    if (p !== r) { [M[p], M[r]] = [M[r], M[p]]; snap(`R${r + 1} ↔ R${p + 1}（列交換：det 變號）`, [r, p]); }
    const pv = M[r][c]; if (!(pv.n === 1 && pv.d === 1)) { M[r] = M[r].map(x => Frac.div(x, pv)); snap(`R${r + 1} ÷ ${Frac.s(pv)}（列倍乘：det 乘上同倍數）`, [r]); }
    for (let i = 0; i < rows; i++) if (i !== r && !Frac.z(M[i][c])) { const f = M[i][c]; M[i] = M[i].map((x, j) => Frac.sub(x, Frac.mul(f, M[r][j]))); snap(`R${i + 1} − (${Frac.s(f)})·R${r + 1}（列取代：det 不變）`, [i]); }
    piv.push(c); r++;
  }
  snap(`RREF 完成：rank = ${piv.length}，pivot 在第 ${piv.map(c => c + 1).join(', ')} 行；nullity = ${cols - piv.length}`);
  return { ops, rank: piv.length, piv, M };
};

  id: 'lintrans', title: '2×2 線性變換與特徵向量', subject: 'la', lessons: ['la-eigen', 'la-det'], desc: '看網格被矩陣拉伸、旋轉、剪切；特徵向量方向不變，面積倍率＝|det|',

    box.innerHTML = `<div class="lab-form"><div class="lf"><label for="lt-a">矩陣 A（a b / c d）</label><input id="lt-a" value="2 1 1 2" size="14"></div>

      <div class="lab-presets">範例：${[['對稱 2 1 1 2', '2 1 1 2'], ['剪切', '1 1 0 1'], ['旋轉 90°', '0 -1 1 0'], ['投影', '1 0 0 0'], ['重根不可對角化', '2 1 0 2'], ['反射', '0 1 1 0']].map(([n, v]) => `<button class="btn sm" data-v="${v}" type="button">${n}</button>`).join('')}</div>

    const css = k => getComputedStyle(document.body).getPropertyValue(k).trim() || '#888';

      ctx.clearRect(0, 0, W, W);

      ctx.strokeStyle = css('--accent'); ctx.globalAlpha = .45;
      for (let k = -8; k <= 8; k++) { ctx.beginPath(); let p = P(k, -8); ctx.moveTo(...p); p = P(k, 8); ctx.lineTo(...p); ctx.stroke(); ctx.beginPath(); p = P(-8, k); ctx.moveTo(...p); p = P(8, k); ctx.lineTo(...p); ctx.stroke(); }

      const arrow = (x, y, col, w = 3) => { const p = P(x, y); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(O, O); ctx.lineTo(...p); ctx.stroke(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, 7); ctx.fill(); };
      arrow(1, 0, css('--s-co')); arrow(0, 1, css('--s-ds'));
      const tr = a + d, det = a * d - b * c, disc = tr * tr - 4 * det; let txt = `tr = ${tr}，det = ${det}（單位正方形面積 × ${Math.abs(det)}${det < 0 ? '，方向翻轉' : ''}）。`;
      if (disc >= 0) {

        ctx.setLineDash([]);

      } else txt += ` 判別式 ${disc} < 0 → 特徵值是複數 ${tr / 2} ± ${(Math.sqrt(-disc) / 2).toFixed(3)}i，沒有實特徵向量（有旋轉成分）。`;
      $('#lt-note', box).textContent = txt + ' 橘色向量＝A 的第一行（e₁ 的像），青色＝第二行。';
    };
    let anim = null;
    $('#lt-play', box).onclick = () => { cancelAnimationFrame(anim); let t0 = null; const step = ts => { if (!t0) t0 = ts; const p = Math.min(1, (ts - t0) / 1600); sl.value = p * 100; draw(); if (p < 1) anim = requestAnimationFrame(step); }; anim = requestAnimationFrame(step); };
    $$('[data-v]', box).forEach(b => b.onclick = () => { inp.value = b.dataset.v; $('#lt-play', box).click(); });
    inp.oninput = draw; sl.oninput = draw; draw();
  },
