 $V$ 的行是 $A^TA$ 的正交單位特徵向量；$\\sigma_i=\\sqrt{\\lambda_i(A^TA)}$；$u_i=\\frac{Av_i}{\\sigma_i}$（$U$ 的行是 $AA^T$ 的特徵向量）。\n- $\\operatorname{rank}A$＝非零奇異值個數。$\\|A\\|_2=\\sigma_1$；$\\|A\\|_F^2=\\sum\\sigma_i^2$；方陣 $|\\det A|=\\prod\\sigma_i$。\n- 前 $r$ 個 $v$ 是 $C(A^T)$ 的基底、其餘是 $N(A)$；前 $r$ 個 $u$ 是 $C(A)$ 的基底、其餘是 $N(A^T)$。\n- **Eckart–Young**：$A_k=\\sum_{i\\le k}\\sigma_iu_iv_i^T$ 是最佳秩 $k$ 近似，$\\|A-A_k\\|_2=\\sigma_{k+1}$。\n- **偽逆** $A^+=V\\Sigma^+U^T$；$x^+=A^+b$ 是最小平方解中範數最小的。\n- 條件數 $\\kappa=\\sigma_{\\max}/\\sigma_{\\min}$。\n- 對稱正定矩陣的 SVD 就是它的特徵分解；一般對稱矩陣 $\\sigma_i=|\\lambda_i|$。\n\n> [!例題] $A=\\begin{bmatrix}3&0\\\\4&5\\end{bmatrix}$ 的奇異值\n+++ 看解答\n$A^TA=\\begin{bmatrix}25&20\\\\20&25\\end{bmatrix}$，特徵值 45、5，$\\sigma_1=3\\sqrt5,\\sigma_2=\\sqrt5$。驗算 $\\sigma_1\\sigma_2=15=|\\det A|$。注意 $A$ 的特徵值是 3、5，和奇異值不同。\n+++\n\n> [!陷阱] 多選題常見敘述\n> - 「奇異值就是特徵值的絕對值」✗（只對正規矩陣成立）。\n> - 「正定矩陣的所有元素都是正的」✗。\n> - 「實矩陣的特徵值都是實數」✗（旋轉矩陣）。\n> - 「$A^TA$ 與 $AA^T$ 有相同的特徵值」：非零特徵值相同 ✓，0 的個數可能不同。"}], "quiz": [{"id": "al-01", "ch": "al-recurrence", "subject": "al", "diff": 3, "type": "multi", "stem": "下列漸近關係哪些正確？", "opts": ["$2^{n+1}=O(2^n)$", "$2^{2n}=O(2^n)$", "$\\lg(n!)=\\Theta(n\\lg n)$", "$n^{\\lg\\lg n}=O((\\lg n)!)$", "$f(n)+o(f(n))=\\Theta(f(n))$", "若 $f(n)=O(g(n))$，則 $2^{f(n)}=O(2^{g(n)})$"], "ans": [0, 2, 4], "expl": "B：$2^{2n}/2^n=2^n\\to\\infty$。D：$\\lg((\\lg n)!)=\\Theta(\\lg n\\lg\\lg n)$ 與 $\\lg(n^{\\lg\\lg n})=\\lg n\\lg\\lg n$ 同階，要更細比：令 $m=\\lg n$，$(\\lg n)!=m!<m^m=n^{\\lg\\lg n}$，而且 $m!/m^m\\to0$，所以 $(\\lg n)!=o(n^{\\lg\\lg n})$，D 錯。F 反例：$f=2n,g=n$。", "fmt": "", "src": "bank"}, {"id": "al-02", "ch": "al-recurrence", "subject": "al", "diff": 3, "type": "single", "stem": "$T(n)=2T(n/2)+\\dfrac{n}{\\lg n}$ 的解為何？", "opts": ["$\\Theta(n)$", "$\\Theta(n\\lg\\lg n)$", "$\\Theta(n\\lg n)$", "Master theorem 的 case 1，$\\Theta(n)$"], "ans": [1], "expl": "$f(n)=n/\\lg n$ 不是多項式地小於 $n^{\\log_22}=n$，原始 Master 不適用。遞迴樹：第 $j$ 層成本 $\\frac{n}{\\lg n-j}$，加總 $n\\sum_{k=1}^{\\lg n}\\frac1k=n\\cdot H_{\\lg n}=\\Theta(n\\lg\\lg n)$。", "fmt": "", "src": "bank"}, {"id": "al-03", "ch": "al-recurrence", "subject": "al", "diff": 3, "type": "single", "stem": "$T(n)=2T(\\sqrt n)+\\lg n$ 的解為何？", "opts": ["$\\Theta(\\lg n)$", "$\\Theta(\\lg n\\lg\\lg n)$", "$\\Theta(\\sqrt n)$", "$\\Theta(\\lg^2 n)$"], "ans": [1], "expl": "令 $m=\\lg n$、$S(m)=T(2^m)$：$S(m)=2S(m/2)+m=\\Theta(m\\lg m)$，代回 $\\Theta(\\lg n\\lg\\lg n)$。", "fmt": "", "src": "bank"}, {"id": "al-04", "ch": "al-recurrence", "subject": "al", "diff": 2, "type": "single", "stem": "$T(n)=T(n/3)+T(2n/3)+n$ 的解為何？", "opts": ["$\\Theta(n)$", "$\\Theta(n\\lg n)$", "$\\Theta(n^{\\log_{3/2}2})$", "$\\Theta(n^2)$"], "ans": [1], "expl": "遞迴樹每層成本至多 $n$（完整的層恰為 $n$），最短路徑 $\\log_3n$ 層、最長 $\\log_{3/2}n$ 層，上下界都是 $\\Theta(n\\lg n)$。Akra–Bazzi：$(1/3)^p+(2/3)^p=1$ ⇒ $p=1$，積分 $\\int_1^n\\frac{u}{u^2}du=\\ln n$。", "fmt": "", "src": "bank"}, {"id": "al-05", "ch": "al-dc", "subject": "al", "diff": 2, "type": "fill", "stem": "用 Karatsuba 演算法乘兩個 $1024$ 位數（一路遞迴到 1 位數），共做幾次 1 位數乘法？", "opts": [], "ans": ["59049"], "expl": "$M(n)=3M(n/2)$，$M(1)=1$，$M(2^{10})=3^{10}=59049$（一般方法要 $1024^2=1048576$ 次）。", "fmt": "", "src": "bank"}, {"id": "al-06", "ch": "al-dc", "subject": "al", "diff": 1, "type": "fill", "stem": "陣列 `2, 4, 1, 3, 5` 有幾個逆序對？", "opts": [], "ans": ["3"], "expl": "(2,1)、(4,1)、(4,3)。分治時在 merge 階段：右半的元素先被放出時，左半剩下的元素都和它構成逆序對。", "fmt": "", "src": "bank"}, {"id": "al-07", "ch": "al-dp", "subject": "al", "diff": 2, "type": "fill", "stem": "矩陣鏈的維度 $p=\\langle5,10,3,12,5,50,6\\rangle$（6 個矩陣），最少需要多少次純量乘法？", "opts": [], "ans": ["2010"], "expl": "$m[1,6]=2010$，最佳加括號 $((A_1A_2)((A_3A_4)(A_5A_6)))$（CLRS 15.2-1）。用 $m[i,j]=\\min_k m[i,k]+m[k+1,j]+p_{i-1}p_kp_j$ 由短到長填表。", "fmt": "", "src": "bank"}, {"id": "al-08", "ch": "al-dp", "subject": "al", "diff": 2, "type": "fill", "stem": "`10010101` 與 `010110110` 的 LCS 長度？", "opts": [], "ans": ["6"], "expl": "例如 `100110` 或 `010101`。用動畫實驗室的 DP 填表可以看到回溯路徑（CLRS 15.4-1）。", "fmt": "", "src": "bank"}, {"id": "al-09", "ch": "al-dp", "subject": "al", "diff": 3, "type": "multi", "stem": "關於動態規劃，下列哪些正確？", "opts": ["0/1 背包的 $O(nW)$ 演算法不是多項式時間", "0/1 背包壓成一維陣列時，容量必須由大到小更新", "最長簡單路徑具有最佳子結構，所以可以用 DP 在多項式時間解", "LIS 可以在 $O(n\\lg n)$ 時間求出長度", "矩陣鏈乘的所有加括號方式數是 $2^{n-1}$", "Memoization（top-down）只會計算實際用到的子問題"], "ans": [0, 1, 3, 5], "expl": "C 錯：最長簡單路徑沒有最佳子結構（一般圖上是 NP-hard），但在 DAG 上可以 DP。E 錯：是 Catalan 數 $C_{n-1}$。B：由小到大更新會讓同一物品被重複使用，變成無限背包。", "fmt": "", "src": "bank"}, {"id": "al-10", "ch": "al-dp", "subject": "al", "diff": 3, "type": "essay", "stem": "給定字串 $s[1..n]$，要把它切成若干段，每段都是回文，求最少段數。寫出 DP 的狀態定義、遞迴式、邊界、計算順序與時間複雜度。", "opts": [], "ans": [], "expl": "**前處理**：$P[i][j]$ 表示 $s[i..j]$ 是否為回文：$P[i][j]=(s_i=s_j)\\land(j-i<2\\lor P[i+1][j-1])$，依長度由短到長填，$O(n^2)$。\n**狀態**：$c[j]$＝把前綴 $s[1..j]$ 切成回文段的最少段數。\n**遞迴**：$c[j]=\\min_{1\\le i\\le j,\\ P[i][j]}\\ c[i-1]+1$；邊界 $c[0]=0$。\n**順序**：$j=1..n$ 遞增。答案 $c[n]$（題目若問「切幾刀」則為 $c[n]-1$）。\n**時間**：每個 $j$ 掃 $j$ 個 $i$，共 $O(n^2)$；空間 $O(n^2)$（可只存 $P$）。\n**正確性**：最佳切法的最後一段 $s[i..j]$ 必是回文，剩下的前綴也必須是最佳切法（剪貼論證），所以枚舉最後一段的起點即可。", "fmt": "", "src": "bank"}, {"id": "al-11", "ch": "al-greedy", "subject": "al", "diff": 2, "type": "fill", "stem": "字元頻率為 A:1、B:1、C:2、D:3、E:5、F:8。Huffman 編碼後編碼整段文字總共需要多少位元？", "opts": [], "ans": ["45"], "expl": "合併 1+1=2、2+2=4、3+4=7、5+7=12、8+12=20。總位元數等於所有合併的和：$2+4+7+12+20=45$。頻率是 Fibonacci 數，樹退化成一條斜線，最長碼長 5 = n − 1。", "fmt": "", "src": "bank"}, {"id": "al-12", "ch": "al-greedy", "subject": "al", "diff": 3, "type": "multi", "stem": "下列關於 greedy 的敘述哪些正確？", "opts": ["Activity selection 選「最早結束」的活動可以得到最佳解", "Activity selection 選「最短」的活動也一定最佳", "分數背包依單位價值遞減挑選是最佳的", "幣值 $\\{1,3,4\\}$ 時，每次拿最大的幣值可以讓硬幣數最少", "Kruskal 演算法是圖擬陣上的 greedy", "Belady 的離線快取策略（踢掉最晚才會再用的）是最佳的"], "ans": [0, 2, 4, 5], "expl": "B 反例：`[1,5) [4,7) [6,10)`。D 反例：湊 6，greedy 4+1+1，最佳 3+3。", "fmt": "", "src": "bank"}, {"id": "al-13", "ch": "al-sp", "subject": "al", "diff": 2, "type": "fill", "stem": "CLRS 的有向圖（s→t 10、s→y 5、t→x 1、t→y 2、y→t 3、y→x 9、y→z 2、x→z 4、z→x 6、z→s 7）從 s 跑 Dijkstra，求到 t、x、y、z 的最短距離。", "opts": [], "ans": ["8,9,5,7"], "expl": "取出順序 s(0)、y(5)、z(7)、t(8)、x(9)。t 經 s→y→t = 5+3；x 經 s→y→t→x = 8+1；z 經 s→y→z = 7。動畫實驗室有這張圖。", "fmt": "d(t),d(x),d(y),d(z)", "src": "bank"}, {"id": "al-14", "ch": "al-sp", "subject": "al", "diff": 3, "type": "multi", "stem": "關於最短路徑，下列哪些正確？", "opts": ["所有邊權乘上同一個正數，最短路徑不變", "所有邊權加上同一個正數，最短路徑不變", "Bellman-Ford 跑完 $|V|-1$ 輪後若仍能鬆弛，代表有從源點可達的負環", "Dijkstra 在有負權邊但沒有負環的圖上仍然正確", "Johnson 演算法的重新加權 $\\hat w(u,v)=w(u,v)+h(u)-h(v)$ 不改變最短路徑", "在 DAG 上依拓撲順序鬆弛，可以在 $O(V+E)$ 求單源最短路徑（允許負邊）"], "ans": [0, 2, 4, 5], "expl": "B 錯：邊數不同的路徑被加的量不同。D 錯：已取出的點不會再被更新，見 al-sp 的反例。", "fmt": "", "src": "bank"}, {"id": "al-15", "ch": "al-sp", "subject": "al", "diff": 3, "type": "essay", "stem": "證明 Johnson 演算法的重新加權：(1) 不改變任兩點之間的最短路徑；(2) 新權重都非負。並說明 $h$ 是怎麼求得的、為什麼需要額外加一個點 $q$。", "opts": [], "ans": [], "expl": "**(1)** 對任一路徑 $p=\\langle v_0,\\dots,v_k\\rangle$：$\\hat w(p)=\\sum(w(v_{i-1},v_i)+h(v_{i-1})-h(v_i))=w(p)+h(v_0)-h(v_k)$（望遠鏡相消）。同起終點的所有路徑都加上同一個常數 $h(v_0)-h(v_k)$，所以最短的那條不變；負環在新權重下仍是負環（環的 $h$ 項相消）。\n**(2)** 加入新點 $q$，對每個 $v$ 加邊 $q\\to v$ 權重 0，用 Bellman-Ford 求 $h(v)=\\delta(q,v)$（同時檢查負環）。由三角不等式 $h(v)\\le h(u)+w(u,v)$ 得 $\\hat w(u,v)=w(u,v)+h(u)-h(v)\\ge0$。\n**為什麼要 $q$**：保證每個點都可達且 $h$ 有限；而且 $q$ 沒有入邊，不會產生新的路徑影響原圖中點對之間的距離。\n之後對每個點跑 Dijkstra，再把距離還原 $\\delta(u,v)=\\hat\\delta(u,v)-h(u)+h(v)$，總時間 $O(VE\\lg V)$（binary heap）。", "fmt": "", "src": "bank"}, {"id": "al-16", "ch": "al-mst-flow", "subject": "al", "diff": 1, "type": "fill", "stem": "CLRS 的無向圖（a-b 4、a-h 8、b-h 11、b-c 8、c-i 2、c-f 4、c-d 7、d-f 14、d-e 9、e-f 10、f-g 2、g-i 6、g-h 1、h-i 7）的最小生成樹權重？", "opts": [], "ans": ["37"], "expl": "Kruskal 依序取 g-h 1、c-i 2、f-g 2、a-b 4、c-f 4、c-d 7、a-h 8（或 b-c 8）、d-e 9，總和 37。MST 不唯一但權重唯一。", "fmt": "", "src": "bank"}, {"id": "al-17", "ch": "al-mst-flow", "subject": "al", "diff": 3, "type": "multi", "stem": "下列關於 MST 與網路流的敘述哪些正確？", "opts": ["邊權皆相異時 MST 唯一", "環上權重唯一最大的邊不會在任何 MST 中", "所有邊權加上常數 $c$ 後，MST 可能改變", "Edmonds–Karp 的時間是 $O(VE^2)$", "König 定理：任何圖的最大匹配大小等於最小頂點覆蓋大小", "容量都是整數時，存在整數值的最大流"], "ans": [0, 1, 3, 5], "expl": "C 錯：每棵生成樹都有 $V-1$ 條邊，總權重都加 $(V-1)c$，排序不變。E 錯：König 只對二分圖成立（三角形：匹配 1、覆蓋 2）。", "fmt": "", "src": "bank"}, {"id": "al-18", "ch": "al-np", "subject": "al", "diff": 3, "type": "multi", "stem": "下列敘述哪些正確？", "opts": ["若某個 NP-complete 問題有多項式時間演算法，則 P = NP", "若 $A\\le_pB$ 且 $B\\in\\text{P}$，則 $A\\in\\text{P}$", "若 $A\\le_pB$ 且 $A\\in\\text{P}$，則 $B\\in\\text{P}$", "所有 NP-hard 問題都屬於 NP", "2-SAT 可以在線性時間解", "0/1 背包是強 NP-complete", "若 P = NP，則 NP = co-NP"], "ans": [0, 1, 4, 6], "expl": "C 錯：歸約只給 $A$ 的上界。D 錯：停機問題是 NP-hard 但不在 NP。F 錯：0/1 背包有偽多項式解，是弱 NPC；強 NPC 的例子是 3-partition、TSP、bin packing。G：P 對補運算封閉，所以 NP = P = co-P = co-NP。", "fmt": "", "src": "bank"}, {"id": "al-19", "ch": "al-np", "subject": "al", "diff": 2, "type": "single", "stem": "要證明新問題 X 是 NP-hard，正確的做法是？", "opts": ["找一個多項式時間的歸約 $X\\le_p\\text{SAT}$", "找一個已知 NP-complete 的問題 Y，證明 $Y\\le_pX$", "證明 X 有指數時間的演算法", "證明 X 的驗證器需要指數時間"], "ans": [1], "expl": "$Y\\le_pX$ 表示能用 X 的解法解 Y，所以 X 至少和 Y 一樣難。反方向只說明 X 不比 SAT 難（等於說明 X ∈ NP）。", "fmt": "", "src": "bank"}, {"id": "al-20", "ch": "al-np", "subject": "al", "diff": 3, "type": "essay", "stem": "PARTITION：給一組正整數，能否分成總和相等的兩組？已知 SUBSET-SUM（給集合 $S$ 與目標 $t$，是否有子集合和為 $t$）是 NP-complete，證明 PARTITION 是 NP-complete。", "opts": [], "ans": [], "expl": "**PARTITION ∈ NP**：certificate 是其中一組，$O(n)$ 驗證兩組和相等。\n**歸約 SUBSET-SUM ≤p PARTITION**：令 $\\sigma=\\sum S$。若 $t>\\sigma$ 直接輸出一個無解的實例。否則令 $S'=S\\cup\\{x\\}$，$x=|\\sigma-2t|$（若 $x=0$ 就不必加）。總和為 $\\sigma+x$。\n設 $\\sigma\\ge2t$，則 $x=\\sigma-2t$，總和 $2\\sigma-2t$，每組應為 $\\sigma-t$。\n(⇒) 若 $A\\subseteq S$ 和為 $t$，則 $A\\cup\\{x\\}$ 和為 $t+\\sigma-2t=\\sigma-t$，另一組 $S\\setminus A$ 和為 $\\sigma-t$，相等。\n(⇐) 若 $S'$ 可平分，含 $x$ 的那一組其餘元素和為 $(\\sigma-t)-x=t$，即為所求子集合。\n$\\sigma<2t$ 的情況對稱（$x=2t-\\sigma$，不含 $x$ 的那組和為 $t$）。轉換顯然是多項式時間（數字長度只多一個數）。", "fmt": "", "src": "bank"}, {"id": "al-21", "ch": "al-prob", "subject": "al", "diff": 2, "type": "fill", "stem": "`ababbabbabbababbabb` 的 KMP prefix function 最後一項 $\\pi[19]$ 是多少？", "opts": [], "ans": ["8"], "expl": "完整的 $\\pi$：0 0 1 2 0 1 2 0 1 2 0 1 2 3 4 5 6 7 8（CLRS 32.4-1）。最後 8 個字元 `ababbabb` 等於開頭 8 個字元。", "fmt": "", "src": "bank"}, {"id": "al-22", "ch": "al-prob", "subject": "al", "diff": 3, "type": "multi", "stem": "下列關於隨機演算法與機率分析的敘述哪些正確？", "opts": ["隨機 quicksort 是 Las Vegas 演算法", "Miller–Rabin 回答「合數」時一定正確", "把 $A[i]$ 與 $A[\\text{RANDOM}(1,n)]$ 交換（$i=1..n$）會產生均勻隨機排列", "隨機排列的固定點個數期望值為 1，與 $n$ 無關", "$n$ 個球隨機丟入 $n$ 個箱子，期望空箱數約為 $n/e$", "期望值的線性性要求隨機變數彼此獨立"], "ans": [0, 1, 3, 4], "expl": "C 錯：$n^n$ 種等可能的執行無法平均分配到 $n!$ 種排列（$n!\\nmid n^n$，$n\\ge3$）。F 錯：線性性不需要獨立。D：每個位置是固定點的機率 $1/n$，用指示變數加總。", "fmt": "", "src": "bank"}, {"id": "co-01", "ch": "co-perf", "subject": "co", "diff": 2, "type": "fill", "stem": "同一個程式在兩台機器上的指令數都是 $10^9$。P1：2 GHz、CPI 1.5；P2：2.5 GHz、CPI 2.0。較快的機器比另一台快幾倍？（小數三位）", "opts": [], "ans": ["1.067"], "expl": "P1：$10^9\\times1.5/2\\times10^9=0.75$ s；P2：$10^9\\times2/2.5\\times10^9=0.8$ s。P1 較快，$0.8/0.75=1.067$ 倍。時脈較高的 P2 反而較慢。", "fmt": "", "src": "bank"}, {"id": "co-02", "ch": "co-perf", "subject": "co", "diff": 2, "type": "single", "stem": "一個程式執行 100 秒，其中乘法占 80 秒。若要讓整個程式快 5 倍，乘法要加速幾倍？", "opts": ["5 倍", "16 倍", "25 倍", "不可能做到"], "ans": [3], "expl": "新時間要 20 秒，但不能加速的部分就有 20 秒：$20=\\frac{80}{n}+20$ ⇒ $\\frac{80}{n}=0$，$n\\to\\infty$。Amdahl 上限 $\\frac{1}{1-0.8}=5$，只能逼近、達不到。", "fmt": "", "src": "bank"}, {"id": "co-03", "ch": "co-perf", "subject": "co", "diff": 2, "type": "multi", "stem": "下列敘述哪些正確？", "opts": ["MIPS 不考慮指令數，用它比較不同 ISA 的機器可能得到錯誤結論", "比較 SPEC ratio 時使用幾何平均，結果與選哪一台當參考機器無關", "動態功耗與電壓成正比", "把電壓降低 15%、頻率降低 15%，動態功耗約降為原來的 0.61 倍", "時脈越高的處理器執行任何程式都越快"], "ans": [0, 1, 3], "expl": "C 錯：$P\\propto CV^2f$，與電壓平方成正比。D：$0.85^2\\times0.85=0.614$。", "fmt": "", "src": "bank"}, {"id": "co-04", "ch": "co-arith", "subject": "co", "diff": 2, "type": "multi", "stem": "8 位元二補數運算，下列哪些會**溢位**？", "opts": ["$01110000+00010001$", "$10000000+01111111$", "$10000001+11111110$", "$11111111+11111111$"], "ans": [0, 2], "expl": "A：$112+17=129>127$，溢位（兩正得負）。B：$-128+127=-1$，異號相加不會溢位。C：$-127+(-2)=-129<-128$，溢位（兩負得正）。D：$-1+(-1)=-2$，雖有進位出最高位但沒有溢位。", "fmt": "", "src": "bank"}, {"id": "co-05", "ch": "co-arith", "subject": "co", "diff": 2, "type": "fill", "stem": "IEEE 754 單精度 `0xC0A00000` 代表的值？", "opts": [], "ans": ["-5"], "expl": "`1100 0000 1010 0000 …`：符號 1；指數 `10000001`=129，減 127 得 2；小數 `0100…`=0.25。值 $-1.25\\times2^2=-5$。", "fmt": "", "src": "bank"}, {"id": "co-06", "ch": "co-arith", "subject": "co", "diff": 2, "type": "single", "stem": "IEEE 754 單精度能表示的**最小正數**（含非正規數）是？", "opts": ["$2^{-126}$", "$2^{-127}$", "$2^{-149}$", "$2^{-150}$"], "ans": [2], "expl": "非正規數 $0.f\\times2^{-126}$，最小的 $f$ 是 $2^{-23}$：$2^{-23}\\times2^{-126}=2^{-149}$。$2^{-126}$ 是最小的正規數。", "fmt": "", "src": "bank"}, {"id": "co-07", "ch": "co-arith", "subject": "co", "diff": 2, "type": "fill", "stem": "用 radix-2 Booth 演算法，乘數是 8 位元的 `00111100`，總共要做幾次加法或減法？", "opts": [], "ans": ["2"], "expl": "從最低位看 $(q_i,q_{i-1})$（$q_{-1}=0$）：位元 2 出現 `10` → 減；位元 6 出現 `01` → 加。中間連續的 1 都是 `11`，只移位。一串 1 只要一減一加，這就是 Booth 的好處（一般移位相加要做 4 次加法）。", "fmt": "", "src": "bank"}, {"id": "co-08", "ch": "co-arith", "subject": "co", "diff": 3, "type": "multi", "stem": "關於浮點數，下列哪些正確？", "opts": ["浮點加法不滿足結合律", "IEEE 754 的指數欄位用二補數表示", "指數欄位全 1、小數不為 0 表示 NaN", "0.1 無法用二進位浮點數精確表示", "非正規數的有效位數與正規數一樣多", "預設的捨入方式是 round to nearest, ties to even"], "ans": [0, 2, 3, 5], "expl": "B 錯：用偏移（bias 127）。E 錯：非正規數前導位是 0，越小有效位數越少（gradual underflow）。", "fmt": "", "src": "bank"}, {"id": "co-09", "ch": "co-datapath", "subject": "co", "diff": 2, "type": "multi", "stem": "單週期 MIPS 資料路徑中，若控制訊號 ALUSrc 卡在 0，下列哪些指令會執行錯誤？", "opts": ["lw", "sw", "add", "beq"], "ans": [0, 1], "expl": "ALUSrc=0 表示 ALU 第二運算元取自暫存器（rt）。lw、sw 要用立即值算位址，所以會錯。add、beq 本來就用暫存器，不受影響。", "fmt": "", "src": "bank"}, {"id": "co-10", "ch": "co-datapath", "subject": "co", "diff": 2, "type": "fill", "stem": "五個階段的延遲為 IF 250、ID 350、EX 150、MEM 300、WB 200 ps。單週期處理器（以 lw 為最長指令）與 5 級管線處理器的時脈週期各是多少 ps？", "opts": [], "ans": ["1250,350"], "expl": "單週期要容納整條 lw：$250+350+150+300+200=1250$。管線由最慢的一級決定：350（不計管線暫存器延遲）。理想加速比 $1250/350\\approx3.57$，不是 5，因為各級不平衡。", "fmt": "單週期,管線", "src": "bank"}, {"id": "co-11", "ch": "co-pipeline", "subject": "co", "diff": 3, "type": "fill", "stem": "標準 5 級管線（前半寫、後半讀），執行：\n```\nlw  $1, 0($2)\nadd $3, $1, $4\nsub $5, $3, $6\nsw  $5, 8($2)\n```\n有 forwarding 與沒有 forwarding 時各需要幾個週期（第一條 IF 到最後一條 WB）？", "opts": [], "ans": ["9,14"], "expl": "有 forwarding：只有 lw→add 的 load-use 要 stall 1，$4+4+1=9$。沒有 forwarding：lw→add、add→sub、sub→sw 都是緊接相依，各 stall 2，$8+6=14$。用動畫實驗室的管線可以逐週期確認。", "fmt": "有,無", "src": "bank"}, {"id": "co-12", "ch": "co-pipeline", "subject": "co", "diff": 2, "type": "fill", "stem": "處理器基礎 CPI 為 1。25% 是分支，預測準確率 90%，預測錯誤懲罰 3 週期；20% 是 load，其中 40% 緊接著使用該結果（stall 1 週期）。平均 CPI？", "opts": [], "ans": ["1.155"], "expl": "$1+0.25\\times0.1\\times3+0.2\\times0.4\\times1=1+0.075+0.08=1.155$。", "fmt": "", "src": "bank"}, {"id": "co-13", "ch": "co-pipeline", "subject": "co", "diff": 3, "type": "fill", "stem": "迴圈結尾的分支在每次執行迴圈時會連續「跳」9 次、最後「不跳」1 次。整個迴圈連續執行 3 次。1-bit 預測器初始預測「跳」，2-bit 飽和計數器初始為「強烈跳」，各預測錯幾次？", "opts": [], "ans": ["5,3"], "expl": "1-bit：第一次執行只錯最後一次（1）；之後每次執行，第一次預測「不跳」又錯，最後一次又錯（各 2），共 $1+2+2=5$。2-bit：每次只錯最後一次「不跳」（狀態降為弱跳，下一次執行的第一個「跳」仍預測正確），共 3。", "fmt": "1-bit,2-bit", "src": "bank"}, {"id": "co-14", "ch": "co-pipeline", "subject": "co", "diff": 3, "type": "multi", "stem": "關於管線危障，下列哪些正確？", "opts": ["標準 5 級順序管線只會有 RAW 資料危障", "有了 forwarding 就完全不需要 stall", "把分支判斷移到 ID 階段後，若分支用到前一條 lw 的結果，需要 stall 2 個週期", "Forwarding 單元判斷 MEM hazard 時要排除 EX hazard，以取得最新的值", "增加管線級數一定提高效能", "Load-use 偵測條件是 ID/EX.MemRead 且 ID/EX.Rt 等於 IF/ID.Rs 或 IF/ID.Rt"], "ans": [0, 2, 3, 5], "expl": "B 錯（load-use）。E 錯：分支懲罰、管線暫存器負擔、功耗都會增加。C：lw 的資料要到 MEM 結束才有，分支在 ID 就要比較。", "fmt": "", "src": "bank"}, {"id": "co-15", "ch": "co-ilp", "subject": "co", "diff": 3, "type": "fill", "stem": "指令序列：\n```\nDIV.D F0, F2, F4\nADD.D F6, F0, F8\nS.D   F6, 0(R1)\nSUB.D F8, F10, F14\nMUL.D F6, F10, F8\n```\n其中 RAW、WAR、WAW 相依各有幾個（只算指令對之間）？", "opts": [], "ans": ["3,2,1"], "expl": "RAW：ADD←DIV（F0）、S.D←ADD（F6）、MUL←SUB（F8）共 3。WAR：SUB 寫 F8 而 ADD 先讀 F8；MUL 寫 F6 而 S.D 先讀 F6，共 2。WAW：ADD 與 MUL 都寫 F6，共 1。Tomasulo 用保留站換名消掉 WAR 與 WAW。", "fmt": "RAW,WAR,WAW", "src": "bank"}, {"id": "co-16", "ch": "co-ilp", "subject": "co", "diff": 3, "type": "multi", "stem": "關於動態排程，下列哪些正確？", "opts": ["Tomasulo 演算法透過保留站實現暫存器換名，消除 WAR 與 WAW", "Scoreboard 也使用暫存器換名", "沒有 ROB 的 Tomasulo 可以保證精確例外", "ROB 依程式順序 commit，使推測執行與精確例外成為可能", "CDB 一個週期只能廣播有限個結果，可能成為瓶頸", "VLIW 處理器在硬體中動態決定哪些指令一起發射"], "ans": [0, 3, 4], "expl": "B 錯：Scoreboard 用 stall 處理 WAR（延後寫回）與 WAW（延後 issue）。C 錯：結果亂序寫回暫存器。F 錯：VLIW 由編譯器決定。", "fmt": "", "src": "bank"}, {"id": "co-17", "ch": "co-cache", "subject": "co", "diff": 2, "type": "fill", "stem": "32 位元 byte 位址，64 KB、4-way 集合關聯、區塊 32 bytes 的 cache，tag、index、offset 各幾位元？", "opts": [], "ans": ["18,9,5"], "expl": "set 數 $=64\\text{K}/(32\\times4)=512$，index 9；offset $\\lg32=5$；tag $32-9-5=18$。", "fmt": "tag,index,offset", "src": "bank"}, {"id": "co-18", "ch": "co-cache", "subject": "co", "diff": 2, "type": "fill", "stem": "基礎 CPI 2，I-cache 失誤率 2%、D-cache 失誤率 4%，失誤懲罰 100 週期，load／store 占 36%。考慮 cache stall 後的 CPI？", "opts": [], "ans": ["5.44"], "expl": "指令：$0.02\\times100=2$；資料：$0.36\\times0.04\\times100=1.44$。$2+2+1.44=5.44$（COD 例題）。完美 cache 時快 $5.44/2=2.72$ 倍。", "fmt": "", "src": "bank"}, {"id": "co-19", "ch": "co-cache", "subject": "co", "diff": 3, "type": "multi", "stem": "關於 cache，下列哪些正確？", "opts": ["全關聯 cache 沒有 conflict miss", "全關聯 cache 沒有 capacity miss", "區塊越大，miss rate 一定越低", "大小 N 的直接映射 cache 的 miss rate 約等於大小 N/2 的 2-way cache（2:1 法則）", "Write-back 通常搭配 write-allocate", "4-way 集合關聯的精確 LRU 每個 set 至少需要 5 個位元", "L2 的 local miss rate 通常比 L1 的 miss rate 低"], "ans": [0, 3, 4, 5], "expl": "B 錯：容量不夠時仍會失誤。C 錯：區塊太大反而增加 conflict 失誤與污染。F：$\\lceil\\lg4!\\rceil=\\lceil\\lg24\\rceil=5$。G 錯：容易命中的存取都被 L1 吸收了，L2 的 local miss rate 往往很高。", "fmt": "", "src": "bank"}, {"id": "co-20", "ch": "co-cache", "subject": "co", "diff": 2, "type": "fill", "stem": "送位址 1 週期、DRAM 存取 15 週期、每傳一個 word 1 週期，區塊 4 words。若記憶體採 4 個 bank 交錯，miss penalty 是幾個週期？", "opts": [], "ans": ["20"], "expl": "四個 bank 同時存取：$1+15+4\\times1=20$。一個 word 寬為 $1+4\\times(15+1)=65$；四個 word 寬為 $1+15+1=17$。", "fmt": "", "src": "bank"}, {"id": "co-21", "ch": "co-vm-coherence", "subject": "co", "diff": 2, "type": "fill", "stem": "頁大小 8 KB，想做 64 KB 的 VIPT L1 cache 且不產生別名，至少要幾路集合關聯？", "opts": [], "ans": ["8"], "expl": "index＋offset 必須落在頁內位移中：$\\frac{64\\text{ KB}}{k}\\le8\\text{ KB}$ ⇒ $k\\ge8$。", "fmt": "", "src": "bank"}, {"id": "co-22", "ch": "co-vm-coherence", "subject": "co", "diff": 3, "type": "multi", "stem": "下列哪些情況**可能**發生？", "opts": ["TLB 失誤、頁表命中、cache 命中", "TLB 命中、頁表中該頁不在記憶體（page fault）", "TLB 失誤、page fault、cache 命中", "TLB 失誤、page fault、cache 失誤", "TLB 命中、cache 失誤"], "ans": [0, 3, 4], "expl": "B 不可能：頁不在記憶體時 TLB 不會有它的轉換。C 不可能：頁不在記憶體時資料不可能在 cache。", "fmt": "", "src": "bank"}, {"id": "co-23", "ch": "co-vm-coherence", "subject": "co", "diff": 3, "type": "multi", "stem": "關於一致性，下列哪些正確？", "opts": ["MESI 中處於 E 狀態的區塊被寫入時，不需要在匯流排上發出請求", "Cache coherence 協定保證多執行緒程式在任何記憶體一致性模型下都正確", "False sharing 是指不同處理器寫同一區塊中的不同變數，造成區塊被反覆 invalidate", "在 TSO 模型下，初值 x=y=0，P1 執行 x=1; r1=y，P2 執行 y=1; r2=x，可能得到 r1=r2=0", "Directory 協定需要對所有處理器廣播"], "ans": [0, 2, 3], "expl": "B 錯：coherence 只管同一個位址；不同位址之間的順序由 consistency 模型決定。E 錯：directory 用點對點訊息。", "fmt": "", "src": "bank"}, {"id": "co-24", "ch": "co-vm-coherence", "subject": "co", "diff": 3, "type": "essay", "stem": "兩顆處理器使用 MSI 與 MESI 協定。考慮 P1 讀取區塊 X（之前沒有人有 X），接著 P1 寫入 X。比較兩種協定在匯流排上的交易次數，並說明 E 狀態的意義。再說明如果 P2 在 P1 寫入後讀 X，MESI 下兩邊的狀態如何變化、誰提供資料。", "opts": [], "ans": [], "expl": "**MSI**：P1 讀失誤 → 匯流排讀（BusRd），P1 進入 S；P1 寫入 → 因為 S 不知道別人有沒有副本，必須送 invalidate／upgrade（BusUpgr 或 BusRdX），進入 M。共 **2 次**交易。\n**MESI**：P1 讀失誤時，匯流排上沒有人回應「我也有」（shared 訊號未拉起），所以進入 **E**；寫入時已知只有自己有，直接 E → M，不需匯流排交易。共 **1 次**。E 狀態省下了「先讀後寫」這種最常見的私有資料存取中的 upgrade 交易。\n**P2 讀 X**：P2 讀失誤送 BusRd；P1 監聽到，因為自己是 M（記憶體是舊的），由 P1 提供資料（cache-to-cache 傳輸，或同時寫回記憶體），P1 M → S；P2 進入 S（因為有其他副本，不能是 E）。", "fmt": "", "src": "bank"}, {"id": "co-25", "ch": "co-perf", "subject": "co", "diff": 3, "type": "essay", "stem": "以 Amdahl 定律說明：在一個 64 核心的處理器上，若程式有 5% 必須循序執行，最大加速比是多少？若問題規模隨核心數成長（弱擴展），用 Gustafson 定律估計加速比。比較兩者並說明它們的假設差異。", "opts": [], "ans": [], "expl": "**Amdahl（強擴展）**：$S=\\frac{1}{0.05+0.95/64}=\\frac{1}{0.05+0.01484}=15.4$，上限 $1/0.05=20$。\n**Gustafson（弱擴展）**：設在 64 核上執行的時間中 5% 是循序，$S=N-(1-f')(N-1)=64-0.05\\times63=60.85$。\n**差異**：Amdahl 假設**問題大小固定**、循序比例以單核執行時間計算，所以多核時循序部分變成瓶頸。Gustafson 假設**執行時間固定**、問題隨核心數變大，可平行的部分跟著變大，循序部分的比例（以平行執行時間計）維持不變，因此加速比近似線性。兩者沒有矛盾，回答的是不同問題：「同一個問題能快多少」vs「同樣時間能做多大的問題」。", "fmt": "", "src": "bank"}, {"id": "dm-01", "ch": "dm-logic", "subject": "dm", "diff": 2, "type": "multi", "stem": "下列哪些邏輯敘述正確？", "opts": ["$p\\to q\\equiv\\neg q\\to\\neg p$", "$p\\to q\\equiv q\\to p$", "$\\exists y\\,\\forall x\\,P(x,y)\\Rightarrow\\forall x\\,\\exists y\\,P(x,y)$", "$\\forall x\\,(P(x)\\lor Q(x))\\equiv\\forall x\\,P(x)\\lor\\forall x\\,Q(x)$", "$\\{\\text{NAND}\\}$ 是功能完備的", "$\\{\\land,\\lor\\}$ 是功能完備的"], "ans": [0, 2, 4], "expl": "B 是逆命題，不等價。D 反例：論域為整數，$P$＝偶數、$Q$＝奇數。F 錯：全真輸入只能輸出真，無法表示 $\\neg$。", "fmt": "", "src": "bank"}, {"id": "dm-02", "ch": "dm-logic", "subject": "dm", "diff": 2, "type": "single", "stem": "$\\neg\\,\\forall x\\,\\exists y\\,(P(x,y)\\to Q(x,y))$ 等價於？", "opts": ["$\\exists x\\,\\forall y\\,(\\neg P(x,y)\\to\\neg Q(x,y))$", "$\\exists x\\,\\forall y\\,(P(x,y)\\land\\neg Q(x,y))$", "$\\exists x\\,\\exists y\\,(P(x,y)\\land\\neg Q(x,y))$", "$\\forall x\\,\\forall y\\,(P(x,y)\\land\\neg Q(x,y))$"], "ans": [1], "expl": "量詞逐一翻轉：$\\exists x\\,\\forall y\\,\\neg(P\\to Q)$，而 $\\neg(P\\to Q)\\equiv P\\land\\neg Q$。", "fmt": "", "src": "bank"}, {"id": "dm-03", "ch": "dm-logic", "subject": "dm", "diff": 1, "type": "fill", "stem": "成績有 A、B、C、D、F 五種。至少要有幾位學生，才能保證有 6 位拿到相同成績？", "opts": [], "ans": ["26"], "expl": "廣義鴿籠：$\\lceil N/5\\rceil\\ge6$ ⇒ $N\\ge26$。25 人時可以每種成績恰 5 人。", "fmt": "", "src": "bank"}, {"id": "dm-04", "ch": "dm-logic", "subject": "dm", "diff": 3, "type": "essay", "stem": "證明：從 $\\{1,2,\\dots,2n\\}$ 中任選 $n+1$ 個數，(a) 必有兩數互質；(b) 必有一數整除另一數。", "opts": [], "ans": [], "expl": "**(a)** 把 $1..2n$ 分成 $n$ 組相鄰數 $\\{1,2\\},\\{3,4\\},\\dots,\\{2n-1,2n\\}$。選 $n+1$ 個數，由鴿籠原理必有兩數落在同一組，它們是相鄰整數。相鄰整數 $k,k+1$ 的公因數 $d$ 必整除 $(k+1)-k=1$，所以互質。\n**(b)** 每個數唯一寫成 $2^a\\cdot m$，$m$ 為奇數，$m\\in\\{1,3,\\dots,2n-1\\}$ 只有 $n$ 種。$n+1$ 個數中必有兩個的奇數部分相同，設為 $2^a m<2^b m$（$a<b$），則前者整除後者。\n兩者的界都是緊的：(a) 取全部偶數 $n$ 個；(b) 取 $\\{n+1,\\dots,2n\\}$ 這 $n$ 個數，任兩數之比小於 2，不可能整除。", "fmt": "", "src": "bank"}, {"id": "dm-05", "ch": "dm-counting", "subject": "dm", "diff": 2, "type": "fill", "stem": "$x_1+x_2+x_3+x_4=20$，$0\\le x_i\\le7$ 的整數解有幾組？", "opts": [], "ans": ["161"], "expl": "排容：無上界 $\\binom{23}3=1771$；某一個 $\\ge8$：$4\\binom{15}3=1820$；某兩個 $\\ge8$：$6\\binom73=210$；三個 $\\ge8$ 時總和已超過 20，為 0。$1771-1820+210=161$。", "fmt": "", "src": "bank"}, {"id": "dm-06", "ch": "dm-counting", "subject": "dm", "diff": 2, "type": "fill", "stem": "從 6 個元素的集合到 3 個元素的集合，有幾個映成函數？", "opts": [], "ans": ["540"], "expl": "$3^6-\\binom31 2^6+\\binom32 1^6=729-192+3=540$。也等於 $3!\\,S(6,3)=6\\times90$。", "fmt": "", "src": "bank"}, {"id": "dm-07", "ch": "dm-counting", "subject": "dm", "diff": 2, "type": "fill", "stem": "把 6 個相異的物件分成 3 個非空的、**無序**的組，有幾種分法？", "opts": [], "ans": ["90"], "expl": "即第二類 Stirling 數 $S(6,3)=540/3!=90$。用遞迴驗算：$S(6,3)=3S(5,3)+S(5,2)=3\\times25+15=90$。", "fmt": "", "src": "bank"}, {"id": "dm-08", "ch": "dm-counting", "subject": "dm", "diff": 2, "type": "fill", "stem": "6 封信隨機裝入 6 個已寫好地址的信封，全部裝錯的方法有幾種？", "opts": [], "ans": ["265"], "expl": "$D_6=6!\\left(1-1+\\frac12-\\frac16+\\frac1{24}-\\frac1{120}+\\frac1{720}\\right)=265$；遞迴 $D_6=5(D_5+D_4)=5(44+9)=265$。", "fmt": "", "src": "bank"}, {"id": "dm-09", "ch": "dm-counting", "subject": "dm", "diff": 1, "type": "fill", "stem": "6 個矩陣相乘 $A_1A_2\\cdots A_6$，有幾種完全加括號的方式？", "opts": [], "ans": ["42"], "expl": "$n$ 個矩陣的加括號數是 $C_{n-1}$，$C_5=\\frac16\\binom{10}5=42$。", "fmt": "", "src": "bank"}, {"id": "dm-10", "ch": "dm-counting", "subject": "dm", "diff": 3, "type": "multi", "stem": "下列計數敘述哪些正確？", "opts": ["把 10 顆相同的球放進 4 個相異箱子且不可空：$\\binom93$ 種", "把 10 顆相同的球放進 4 個相異箱子且不可空：$\\binom{9}{4}$ 種", "$\\sum_{k=0}^{n}\\binom nk^2=\\binom{2n}n$", "MISSISSIPPI 的相異排列數為 $\\frac{11!}{4!\\,4!\\,2!}$", "$n$ 個人圍圓桌（只考慮相對位置）有 $n!$ 種坐法", "$D_n/n!$ 在 $n\\to\\infty$ 時趨近 $1/e$"], "ans": [0, 2, 3, 5], "expl": "A：星與槓，$\\binom{n-1}{k-1}$。E 錯：$(n-1)!$。C 是 Vandermonde 的特例。", "fmt": "", "src": "bank"}, {"id": "dm-11", "ch": "dm-recur-gf", "subject": "dm", "diff": 2, "type": "fill", "stem": "$a_n=5a_{n-1}-6a_{n-2}$，$a_0=1$、$a_1=0$。求 $a_5$。", "opts": [], "ans": ["-390"], "expl": "特徵根 2、3：$a_n=A2^n+B3^n$，$A+B=1$、$2A+3B=0$ ⇒ $A=3,B=-2$。$a_5=3\\cdot32-2\\cdot243=-390$。直接推：1, 0, −6, −30, −114, −390。", "fmt": "", "src": "bank"}, {"id": "dm-12", "ch": "dm-recur-gf", "subject": "dm", "diff": 3, "type": "single", "stem": "$a_n=4a_{n-1}-4a_{n-2}+n2^n$ 的特解應假設成哪一種形式？", "opts": ["$(p_1n+p_0)2^n$", "$n(p_1n+p_0)2^n$", "$n^2(p_1n+p_0)2^n$", "$p_0n^22^n$"], "ans": [2], "expl": "特徵方程 $(r-2)^2=0$，2 是二重根；非齊次項為（一次多項式）$\\times2^n$，所以要乘 $n^2$：$n^2(p_1n+p_0)2^n$。", "fmt": "", "src": "bank"}, {"id": "dm-13", "ch": "dm-recur-gf", "subject": "dm", "diff": 2, "type": "fill", "stem": "$\\dfrac{1}{(1-x)^4}$ 展開後 $x^{10}$ 的係數？", "opts": [], "ans": ["286"], "expl": "$\\binom{n+k-1}{k-1}=\\binom{13}3=286$，也就是 4 個非負整數和為 10 的解數。", "fmt": "", "src": "bank"}, {"id": "dm-14", "ch": "dm-recur-gf", "subject": "dm", "diff": 3, "type": "fill", "stem": "長度 5、由 0、1、2 組成，且 0 出現偶數次、1 出現奇數次的字串有幾個？", "opts": [], "ans": ["61"], "expl": "EGF：$\\frac{e^x+e^{-x}}2\\cdot\\frac{e^x-e^{-x}}2\\cdot e^x=\\frac{e^{3x}-e^{-x}}4$，係數 $\\frac{3^n-(-1)^n}4$，$n=5$ 得 $\\frac{243+1}4=61$。", "fmt": "", "src": "bank"}, {"id": "dm-15", "ch": "dm-relations", "subject": "dm", "diff": 2, "type": "fill", "stem": "3 個元素的集合上有幾個反對稱關係？", "opts": [], "ans": ["216"], "expl": "對角線 3 個位置任選 $2^3$；3 對 $(a,b),(b,a)$ 每對有 3 種（都不選、只選一個）$3^3$。$8\\times27=216$。", "fmt": "", "src": "bank"}, {"id": "dm-16", "ch": "dm-relations", "subject": "dm", "diff": 2, "type": "fill", "stem": "5 個元素的集合上有幾個等價關係？", "opts": [], "ans": ["52"], "expl": "等價關係 ↔ 分割，數量為 Bell 數 $B_5=52$。", "fmt": "", "src": "bank"}, {"id": "dm-17", "ch": "dm-relations", "subject": "dm", "diff": 3, "type": "multi", "stem": "下列哪些正確？", "opts": ["空集合上的空關係同時是自反、對稱、反對稱、遞移的", "對稱且反對稱的關係一定是空關係", "兩個等價關係的交集仍是等價關係", "兩個等價關係的聯集仍是等價關係", "有限偏序集一定有極小元", "每個有限格都是布林代數"], "ans": [0, 2, 4], "expl": "B 錯：對角線的子集都對稱且反對稱。D 錯：聯集可能失去遞移性。F 錯：例如 $\\{1,2,4\\}$ 依整除是一條鏈（格），但 2 沒有補元。", "fmt": "", "src": "bank"}, {"id": "dm-18", "ch": "dm-graph", "subject": "dm", "diff": 2, "type": "fill", "stem": "有 10 個點的簡單平面圖最多有幾條邊？", "opts": [], "ans": ["24"], "expl": "$e\\le3v-6=24$，三角剖分的平面圖可以達到。", "fmt": "", "src": "bank"}, {"id": "dm-19", "ch": "dm-graph", "subject": "dm", "diff": 2, "type": "fill", "stem": "用 3 種顏色對環 $C_5$ 的頂點著色（相鄰不同色），有幾種方法？", "opts": [], "ans": ["30"], "expl": "$P(C_n,k)=(k-1)^n+(-1)^n(k-1)=2^5-2=30$。", "fmt": "", "src": "bank"}, {"id": "dm-20", "ch": "dm-graph", "subject": "dm", "diff": 2, "type": "fill", "stem": "一棵完全 3 元樹有 100 個內部節點，它有幾片葉子？", "opts": [], "ans": ["201"], "expl": "$n=mi+1=301$，葉子 $l=n-i=(m-1)i+1=201$。", "fmt": "", "src": "bank"}, {"id": "dm-21", "ch": "dm-graph", "subject": "dm", "diff": 3, "type": "multi", "stem": "下列圖論敘述哪些正確？", "opts": ["$K_5$ 與 $K_{3,3}$ 都不是平面圖", "滿足 $e\\le3v-6$ 的簡單圖一定是平面圖", "每個簡單平面圖都有度數不超過 5 的頂點", "每個平面圖都可以用 3 種顏色著色", "圖是二分圖 ⇔ 不含奇數長度的環", "$K_n$ 有 $n^{n-2}$ 棵生成樹", "有歐拉迴路的圖一定有漢米頓迴路"], "ans": [0, 2, 4, 5], "expl": "B 錯：$K_{3,3}$ 有 9 條邊 $\\le12$，卻不是平面圖。D 錯：$K_4$ 是平面圖，需要 4 色。G 錯：兩個三角形共用一點（蝴蝶圖）有歐拉迴路但沒有漢米頓迴路。", "fmt": "", "src": "bank"}, {"id": "dm-22", "ch": "dm-graph", "subject": "dm", "diff": 3, "type": "essay", "stem": "證明：任何簡單平面圖都可以用 6 種顏色著色。再說明如何把論證加強成 5 色。", "opts": [], "ans": [], "expl": "**有度數 ≤ 5 的點**：若每點度數 ≥ 6，則 $2e\\ge6v$，$e\\ge3v$，與 $e\\le3v-6$ 矛盾（$v\\ge3$；$v\\le2$ 時顯然）。\n**6 色（對 $v$ 歸納）**：取度數 ≤ 5 的點 $u$，刪除後剩下的圖仍是簡單平面圖，由歸納假設可 6 著色；$u$ 最多 5 個鄰居，最多用掉 5 色，還剩一色給 $u$。\n**5 色**：同樣取度數 ≤ 5 的 $u$。若度數 ≤ 4 或鄰居只用了 ≤ 4 色，直接著色。否則 $u$ 恰有 5 個鄰居 $v_1..v_5$（依平面嵌入的順時針順序）且顏色各不同。考慮只用 $v_1$、$v_3$ 顏色（1、3）的點形成的子圖：若 $v_1$ 與 $v_3$ 不在同一個連通塊，把 $v_1$ 那塊的顏色 1、3 對調（Kempe chain），$v_1$ 變成 3 色，空出 1 給 $u$。若在同一塊，存在一條 1-3 交替路徑連 $v_1$ 到 $v_3$，與 $u$ 圍成一個封閉曲線，把 $v_2$ 與 $v_4$ 分在內外兩側（平面性）；於是 2-4 色的 Kempe chain 不可能連接 $v_2$ 與 $v_4$，對 $v_2$ 那塊做 2、4 對調，空出 2 給 $u$。", "fmt": "", "src": "bank"}, {"id": "dm-23", "ch": "dm-nt-algebra", "subject": "dm", "diff": 2, "type": "fill", "stem": "求 $3^{2026}\\bmod7$。", "opts": [], "ans": ["4"], "expl": "費馬小定理 $3^6\\equiv1\\pmod7$。$2026=6\\times337+4$，$3^4=81\\equiv4$。", "fmt": "", "src": "bank"}, {"id": "dm-24", "ch": "dm-nt-algebra", "subject": "dm", "diff": 2, "type": "fill", "stem": "求最小正整數 $x$：$x\\equiv2\\pmod3$、$x\\equiv3\\pmod5$、$x\\equiv2\\pmod7$。", "opts": [], "ans": ["23"], "expl": "《孫子算經》的「物不知數」。$M=105$；$35\\cdot2\\cdot2+21\\cdot1\\cdot3+15\\cdot1\\cdot2=140+63+30=233\\equiv23\\pmod{105}$（$35^{-1}\\equiv2\\pmod3$、$21^{-1}\\equiv1\\pmod5$、$15^{-1}\\equiv1\\pmod7$）。", "fmt": "", "src": "bank"}, {"id": "dm-25", "ch": "dm-nt-algebra", "subject": "dm", "diff": 3, "type": "multi", "stem": "下列哪些正確？", "opts": ["$ax\\equiv b\\pmod m$ 有解 ⇔ $\\gcd(a,m)\\mid b$，且模 $m$ 下恰有 $\\gcd(a,m)$ 個解", "若對所有與 $n$ 互質的 $a$ 都有 $a^{n-1}\\equiv1\\pmod n$，則 $n$ 為質數", "有限群中任一元素的階整除群的階", "每個 abelian 群都是循環群", "$\\mathbb Z_n$ 是體 ⇔ $n$ 是質數", "階數為質數的群一定是循環群"], "ans": [0, 2, 4, 5], "expl": "B 錯：Carmichael 數（561 = 3·11·17）。D 錯：Klein 四元群 $\\mathbb Z_2\\times\\mathbb Z_2$。F：由 Lagrange，非單位元素的階只能是 $p$，它生成整個群。", "fmt": "", "src": "bank"}, {"id": "dm-26", "ch": "dm-nt-algebra", "subject": "dm", "diff": 3, "type": "essay", "stem": "證明 RSA 的正確性：$n=pq$（$p\\ne q$ 為質數），$ed\\equiv1\\pmod{\\varphi(n)}$，則對**所有** $0\\le m<n$（包含與 $n$ 不互質的 $m$），$(m^e)^d\\equiv m\\pmod n$。", "opts": [], "ans": [], "expl": "令 $ed=1+k(p-1)(q-1)$。\n**模 $p$**：若 $p\\nmid m$，由費馬 $m^{p-1}\\equiv1$，所以 $m^{ed}=m\\cdot(m^{p-1})^{k(q-1)}\\equiv m\\pmod p$。若 $p\\mid m$，兩邊都 $\\equiv0\\pmod p$。所以 $m^{ed}\\equiv m\\pmod p$ 對所有 $m$ 成立。\n**模 $q$**：同理 $m^{ed}\\equiv m\\pmod q$。\n**合起來**：$p,q$ 相異質數，$p\\mid(m^{ed}-m)$ 且 $q\\mid(m^{ed}-m)$ ⇒ $pq\\mid(m^{ed}-m)$（CRT 的唯一性），即 $m^{ed}\\equiv m\\pmod n$。\n注意只用 Euler 定理 $m^{\\varphi(n)}\\equiv1$ 只能處理 $\\gcd(m,n)=1$ 的情況，所以要分開在模 $p$、模 $q$ 下論證。", "fmt": "", "src": "bank"}, {"id": "ds-01", "ch": "ds-amortized", "subject": "ds", "diff": 2, "type": "single", "stem": "輸入序列 1, 2, 3, 4, 5 依序進入一個堆疊（任何時候都可以 pop），下列哪一個輸出序列**不可能**得到？", "opts": ["2 3 1 5 4", "4 1 3 2 5", "1 5 4 3 2", "3 4 2 1 5"], "ans": [1], "expl": "不可得 ⇔ 含有「312」型樣：存在 $i<j<k$ 使 $p_j<p_k<p_i$。選項 B 中 4、1、3 正是這個型樣：輸出 4 時 1、2、3 都已在堆疊裡（3 在最上面），下一個要輸出 1 就必須先彈出 3、2。其餘選項都可以模擬出來，例如 A：push1 push2 pop2 push3 pop3 pop1 push4 push5 pop5 pop4。", "fmt": "", "src": "bank"}, {"id": "ds-02", "ch": "ds-amortized", "subject": "ds", "diff": 1, "type": "fill", "stem": "輸入 1..5 依序進堆疊，可以得到幾種不同的輸出排列？", "opts": [], "ans": ["42"], "expl": "堆疊排列數是 Catalan 數 $C_5=\\frac{1}{6}\\binom{10}{5}=42$。", "fmt": "", "src": "bank"}, {"id": "ds-03", "ch": "ds-amortized", "subject": "ds", "diff": 2, "type": "fill", "stem": "把中序式 `(a+b)*c-d/e^f^g` 轉成後序式（`^` 右結合，其餘左結合）。", "opts": [], "ans": ["ab+c*defg^^/-"], "expl": "`^` 是右結合，`e^f^g` 是 `e^(f^g)`，後序 `efg^^`；整體 `ab+c*` 減去 `d/(e^(f^g))`，得 **ab+c*defg^^/-**。", "fmt": "不含空白", "src": "bank"}, {"id": "ds-04", "ch": "ds-amortized", "subject": "ds", "diff": 3, "type": "multi", "stem": "動態表的策略為「滿了就加倍；使用率（num/size）降到 1/4 以下就縮成一半」。下列敘述哪些正確？", "opts": ["任意 n 次 INSERT／DELETE 的總成本是 $O(n)$", "每一次操作的最壞成本都是 $O(1)$", "若改成「使用率低於 1/2 就縮成一半」，攤銷成本仍是 $O(1)$", "縮小後的使用率是 1/2，離下一次擴張或縮小都還有 $\\Theta(size)$ 次操作的距離", "位能函數可以取為：使用率 ≥ 1/2 時 $2\\,num-size$，使用率 < 1/2 時 $size/2-num$"], "ans": [0, 3, 4], "expl": "A、D、E 正確。B 錯：擴張或縮小的那一次要搬移 $\\Theta(n)$ 個元素，只是攤銷 $O(1)$。C 錯：在 size/2 邊界交替 insert、delete，每次都觸發 $\\Theta(n)$ 的擴張或縮小。D 是會計法直覺：每次搬家後都存了一段「緩衝」，足以累積 credit 支付下一次搬家。", "fmt": "", "src": "bank"}, {"id": "ds-05", "ch": "ds-sort", "subject": "ds", "diff": 3, "type": "multi", "stem": "下列關於排序的敘述，哪些正確？", "opts": ["只用比較的排序演算法，平均情況也需要 $\\Omega(n\\lg n)$ 次比較", "Heapsort 是穩定的", "Insertion sort 的執行時間是 $\\Theta(n+I)$，$I$ 為逆序對數", "Radix sort 每一位使用的子排序不需要穩定", "把 Randomized-Select 換成 median-of-medians 挑 pivot，quicksort 的最壞情況變成 $O(n\\lg n)$", "每組 3 個的 median-of-medians 仍然是線性時間"], "ans": [0, 2, 4], "expl": "A：$n!$ 片葉子的二元樹平均深度至少 $\\lg n!$。C：每次內層迴圈的移動恰好消除一個逆序對。E：每次都切在中位數，$T(n)=2T(n/2)+O(n)$。B 錯（長距離交換）；D 錯（LSD radix 依賴子排序穩定，否則前一輪的順序被打亂）；F 錯：$T(n)=T(n/3)+T(2n/3)+O(n)=\\Theta(n\\lg n)$。", "fmt": "", "src": "bank"}, {"id": "ds-06", "ch": "ds-sort", "subject": "ds", "diff": 2, "type": "fill", "stem": "在 100 個相異數中**同時**找出最大值與最小值，最壞情況下最少需要幾次比較？", "opts": [], "ans": ["148"], "expl": "兩兩一組比 50 次；50 個較小者中找最小 49 次、50 個較大者中找最大 49 次：$50+49+49=148=\\lceil3n/2\\rceil-2$。這也是下界（對手論證）。", "fmt": "", "src": "bank"}, {"id": "ds-07", "ch": "ds-sort", "subject": "ds", "diff": 2, "type": "single", "stem": "隨機 quicksort 中，令排序後第 3 小與第 7 小的元素為 $z_3,z_7$。它們在整個執行過程中被直接比較的機率是多少？", "opts": ["1/7", "2/7", "2/5", "1/2"], "ans": [2], "expl": "$z_i$ 與 $z_j$ 被比較 ⇔ $\\{z_i,\\dots,z_j\\}$ 中第一個被選為 pivot 的是 $z_i$ 或 $z_j$。這個集合有 $j-i+1=5$ 個元素，機率 $2/5$。", "fmt": "", "src": "bank"}, {"id": "ds-08", "ch": "ds-sort", "subject": "ds", "diff": 3, "type": "essay", "stem": "證明 median-of-medians（每組 5 個）的 SELECT 在最壞情況下是 $O(n)$，並說明每組 3 個為什麼不行、每組 7 個為什麼可以。", "opts": [], "ans": [], "expl": "**比 $x$ 大的元素數**：$\\lceil n/5\\rceil$ 組的中位數中，至少一半（扣掉 $x$ 自己那組與最後不滿的一組）的中位數 $\\ge x$；這些組各至少有 3 個元素 $\\ge x$。所以至少 $3\\left(\\lceil\\frac12\\lceil\\frac n5\\rceil\\rceil-2\\right)\\ge\\frac{3n}{10}-6$ 個元素大於 $x$；同理小於 $x$ 的也至少這麼多。遞迴那一邊最多 $\\frac{7n}{10}+6$ 個。\n**遞迴式**：$T(n)\\le T(\\lceil n/5\\rceil)+T(7n/10+6)+O(n)$。代入法假設 $T(n)\\le cn$：$c(n/5+1)+c(7n/10+6)+an\\le cn$ ⇔ $cn/10-7c-an\\ge0$，$n$ 夠大且 $c>10a$ 時成立。關鍵是 $\\frac15+\\frac7{10}=\\frac9{10}<1$。\n**每組 3 個**：保證只剩 $\\frac{2n}3$，$T(n)=T(n/3)+T(2n/3)+O(n)$，比例和為 1，每層都是 $\\Theta(n)$，共 $\\Theta(\\lg n)$ 層 → $\\Theta(n\\lg n)$。**每組 7 個**：$T(n/7)+T(5n/7+c)$，$\\frac17+\\frac57<1$，仍線性。", "fmt": "", "src": "bank"}, {"id": "ds-09", "ch": "ds-heap", "subject": "ds", "diff": 2, "type": "fill", "stem": "對陣列 `5, 3, 17, 10, 84, 19, 6, 22, 9` 執行 Build-Max-Heap（由最後一個內部節點往前 Max-Heapify），結果陣列為何？", "opts": [], "ans": ["84,22,19,10,3,17,6,5,9"], "expl": "依序 heapify 索引（1 起算）4、3、2、1：10 與 22 交換；17 與 19 交換；3 與 84 交換；根 5 一路下沉（與 84、22、10 交換）。結果 **84, 22, 19, 10, 3, 17, 6, 5, 9**（CLRS 6.3-1）。", "fmt": "逗號分隔", "src": "bank"}, {"id": "ds-10", "ch": "ds-heap", "subject": "ds", "diff": 3, "type": "fill", "stem": "用 $\\{1,2,\\dots,7\\}$ 能建成幾種不同的 max-heap？", "opts": [], "ans": ["80"], "expl": "形狀固定為完全二元樹，根必為 7；左右子樹各 3 個節點。從剩下 6 個數選 3 個給左子樹 $\\binom63=20$，每棵 3 節點子樹有 $H(3)=2$ 種：$20\\times2\\times2=80$。", "fmt": "", "src": "bank"}, {"id": "ds-11", "ch": "ds-heap", "subject": "ds", "diff": 3, "type": "multi", "stem": "關於可合併堆積，下列敘述哪些正確？", "opts": ["Binomial tree $B_k$ 在深度 $i$ 恰有 $\\binom ki$ 個節點", "Fibonacci heap 的 Extract-Min 最壞情況為 $O(\\lg n)$", "Fibonacci heap 中度數為 $k$ 的節點，其子樹至少有 $F_{k+2}$ 個節點", "Leftist heap 的最右路徑長度至多 $\\lfloor\\lg(n+1)\\rfloor$", "用 binary heap 實作 Dijkstra 在稠密圖上（$E=\\Theta(V^2)$）比用陣列快", "Binomial heap 的 Union 類似二進位加法"], "ans": [0, 2, 3, 5], "expl": "B 錯：$O(\\lg n)$ 是攤銷界，剛插入 $n$ 個元素後第一次 Extract-Min 要 consolidate $n$ 棵樹。E 錯：binary heap 為 $O(E\\lg V)=O(V^2\\lg V)$，陣列版 $O(V^2)$ 較快。C 是最大度數 $O(\\lg n)$ 的關鍵。", "fmt": "", "src": "bank"}, {"id": "ds-12", "ch": "ds-heap", "subject": "ds", "diff": 3, "type": "essay", "stem": "設計一個資料結構，支援 Insert、Delete-Min、Delete-Max，每個操作最壞 $O(\\lg n)$，Find-Min 與 Find-Max 為 $O(1)$。寫出結構、每個操作的做法與時間分析。", "opts": [], "ans": [], "expl": "**方法一：min-max heap**。完全二元樹，偶數層（根為第 0 層）是 min 層、奇數層是 max 層：min 層的節點小於其所有後代，max 層的節點大於其所有後代。最小值在根，最大值是根的兩個孩子之一（$O(1)$）。Insert 放在尾端，先與父節點比較決定往 min 層或 max 層方向上浮，再只和祖父比（每次跳兩層），$O(\\lg n)$。Delete 把最後一個元素移到被刪位置，再向下「trickle down」：在孫子（與孩子）中找最小（或最大）交換，每次跳兩層，$O(\\lg n)$。\n**方法二：兩個 heap 加交叉指標**。一個 min-heap、一個 max-heap 存同一批元素，每個元素在兩邊各有一個節點並互相指向。Delete-Min 從 min-heap 取出後，用指標在 max-heap 中以 $O(\\lg n)$ 刪除該節點（換上最後一個元素再上浮或下沉）。交換節點時要更新指標。\n兩種都是 Insert、Delete-Min、Delete-Max $O(\\lg n)$；方法二空間為兩倍。", "fmt": "", "src": "bank"}, {"id": "ds-13", "ch": "ds-bst", "subject": "ds", "diff": 2, "type": "fill", "stem": "高度為 5（只有根時高度為 0）的 AVL 樹，最少有幾個節點？", "opts": [], "ans": ["20"], "expl": "$N(h)=N(h-1)+N(h-2)+1$，$N(0)=1,N(1)=2$：2→4→7→12→**20**。也等於 $F_{h+3}-1=F_8-1=21-1$。", "fmt": "", "src": "bank"}, {"id": "ds-14", "ch": "ds-bst", "subject": "ds", "diff": 2, "type": "fill", "stem": "某二元樹的前序為 `A B D H E C F G`、中序為 `H D B E A F C G`。後序為何？", "opts": [], "ans": ["HDEBFGCA"], "expl": "根 A；中序中 A 左邊 `H D B E` 是左子樹（前序 `B D H E`：根 B，左 `H D`、右 `E`；`H D` 中根 D、左 H），右邊 `F C G`（根 C，左 F、右 G）。後序 **H D E B F G C A**。", "fmt": "不含空白", "src": "bank"}, {"id": "ds-15", "ch": "ds-bst", "subject": "ds", "diff": 3, "type": "fill", "stem": "依序把 10, 20, 30, 25, 28, 27, 5 插入空的 AVL 樹，最後的前序走訪為何？", "opts": [], "ans": ["25,10,5,20,28,27,30"], "expl": "插 30：在 10 做 RR → 20(10,30)。插 28：30 失衡，LR → 20(10, 28(25,30))。插 27：20 失衡（右子 28 的 bf=+1）→ RL，先在 28 右旋再在 20 左旋 → 25(20(10), 28(27,30))。插 5：20 失衡（LL）→ 右旋 → 25(10(5,20), 28(27,30))。前序 **25, 10, 5, 20, 28, 27, 30**。可用動畫實驗室的 AVL 驗證。", "fmt": "逗號分隔", "src": "bank"}, {"id": "ds-16", "ch": "ds-bst", "subject": "ds", "diff": 3, "type": "multi", "stem": "關於紅黑樹與 AVL 樹，下列哪些正確？", "opts": ["任何 AVL 樹都可以著色成合法的紅黑樹", "任何紅黑樹都是 AVL 樹", "紅黑樹插入的修正最多 2 次旋轉；刪除最多 3 次旋轉", "AVL 樹刪除一個節點後最多只需要一次（單或雙）旋轉", "紅黑樹中，從某節點出發到葉子的最長路徑不超過最短路徑的兩倍", "有 $n$ 個內部節點的紅黑樹，高度至多 $2\\lg(n+1)$"], "ans": [0, 2, 4, 5], "expl": "B 錯：紅黑樹允許左右子樹高度差到接近兩倍。D 錯：AVL 刪除後旋轉可能讓子樹變矮，失衡往上傳，最多 $O(\\lg n)$ 次旋轉；插入才保證一次。A 的構造：依「高度」決定顏色，讓每個節點的黑高度一致。", "fmt": "", "src": "bank"}, {"id": "ds-17", "ch": "ds-hash", "subject": "ds", "diff": 2, "type": "fill", "stem": "在均勻雜湊假設下，負載因子 $\\alpha=3/4$ 的開放定址表，**失敗**搜尋的期望探測次數上界是多少？", "opts": [], "ans": ["4"], "expl": "$\\frac{1}{1-\\alpha}=\\frac{1}{1/4}=4$。成功搜尋的上界是 $\\frac1\\alpha\\ln\\frac1{1-\\alpha}=\\frac43\\ln4\\approx1.85$。", "fmt": "", "src": "bank"}, {"id": "ds-18", "ch": "ds-hash", "subject": "ds", "diff": 3, "type": "multi", "stem": "關於雜湊，下列敘述哪些正確？", "opts": ["開放定址法刪除元素時要放 DELETED 標記，不能直接清空", "$m=2^p$ 時雙重雜湊仍可用，只要 $h_2(k)$ 永遠是奇數", "二次探測在任何負載因子下都保證能找到空位", "線性探測有 $\\Theta(m^2)$ 種不同的探測序列", "使用 universal hashing 時，對任何輸入（包括惡意挑選的）期望鏈長都是 $O(1+\\alpha)$", "Bloom filter 可能有偽陰性"], "ans": [0, 1, 4], "expl": "C 錯：$m$ 為質數且表至少半空才保證。D 錯：線性與二次探測都只有 $m$ 種（由初始位置決定），雙重雜湊才有 $\\Theta(m^2)$。F 錯：Bloom filter 只會偽陽性。B：$h_2$ 為奇數時與 $2^p$ 互質，探測序列會走遍整張表。", "fmt": "", "src": "bank"}, {"id": "ds-19", "ch": "ds-hash", "subject": "ds", "diff": 2, "type": "fill", "stem": "$m=11$，雙重雜湊 $h(k,i)=(k+i\\cdot h_2(k))\\bmod 11$，$h_2(k)=1+(k\\bmod10)$，依序插入 10, 22, 31, 4, 15, 28, 17, 88, 59。最後的表（位置 0 到 10）？", "opts": [], "ans": ["22,-,59,17,4,15,28,88,-,31,10"], "expl": "例如 31：$31\\bmod11=9$ 空 → 9。88：$88\\bmod11=0$ 被 22 占；$h_2=9$，$(0+9)=9$ 被 31 占；$(0+18)\\bmod11=7$ 空 → 7。59：$59\\bmod11=4$ 被占；$h_2=10$，$14\\bmod11=3$ 被 17 占；$24\\bmod11=2$ 空 → 2。結果 **22, -, 59, 17, 4, 15, 28, 88, -, 31, 10**（CLRS 11.4-1）。", "fmt": "逗號分隔，空位寫 -", "src": "bank"}, {"id": "ds-20", "ch": "ds-btree", "subject": "ds", "diff": 2, "type": "fill", "stem": "最小度數 $t=3$ 的 B 樹若高度為 3（根在深度 0），最少有多少個鍵？", "opts": [], "ans": ["53"], "expl": "根至少 1 鍵、2 個孩子；之後每個節點至少 $t=3$ 個孩子、$t-1=2$ 個鍵。深度 1、2、3 各至少 2、6、18 個節點：$n\\ge1+2(2+6+18)=53=2t^h-1$。", "fmt": "", "src": "bank"}, {"id": "ds-21", "ch": "ds-btree", "subject": "ds", "diff": 3, "type": "multi", "stem": "關於 B 樹與 B+ 樹，下列哪些正確？", "opts": ["B 樹只會因為根節點分裂而長高", "B 樹的插入可以讓某片葉子比其他葉子深一層", "由上而下插入時，遇到滿節點就先分裂，可以保證一趟往下走完", "B+ 樹的葉子串成鏈結串列，適合範圍查詢", "B+ 樹中內部節點的鍵一定也存在於某片葉子"], "ans": [0, 2, 3], "expl": "B 錯：所有葉子永遠同深度。E 錯：刪除葉子中的鍵後，內部節點的分隔鍵可以保留不動，這時它已不在任何葉子中。", "fmt": "", "src": "bank"}, {"id": "ds-22", "ch": "ds-unionfind", "subject": "ds", "diff": 2, "type": "multi", "stem": "關於 Disjoint-set forest，下列哪些正確？", "opts": ["只用 union by rank 時，樹高不超過 $\\lfloor\\lg n\\rfloor$", "同時用 union by rank 與 path compression，$m$ 次操作總時間為 $O(m\\,\\alpha(n))$", "同時使用兩種啟發式後，每次 FIND-SET 的最壞情況都是 $O(\\alpha(n))$", "rank 沿著往根的路徑嚴格遞增", "Union-Find 可以有效地支援「刪除一條邊、把集合拆開」"], "ans": [0, 1, 3], "expl": "C 錯：$O(\\alpha(n))$ 是攤銷界，單次 FIND 可能走 $\\Theta(\\lg n)$。E 錯：Union-Find 只能合併。", "fmt": "", "src": "bank"}, {"id": "ds-23", "ch": "ds-graph", "subject": "ds", "diff": 2, "type": "fill", "stem": "無向圖的邊為 1-2、2-3、3-1、3-4、4-5、5-6、6-4、6-7。它有幾個 articulation point？", "opts": [], "ans": ["3"], "expl": "點 3 連接三角形 {1,2,3} 與其餘部分；點 4 連接 3 與三角形 {4,5,6}；點 6 連接 7。去掉 1、2、5、7 都不會使圖不連通。答案 3（3、4、6）；bridge 有 2 條（3-4、6-7）。", "fmt": "", "src": "bank"}, {"id": "ds-24", "ch": "ds-graph", "subject": "ds", "diff": 3, "type": "multi", "stem": "關於 DFS，下列哪些正確？", "opts": ["無向圖的 DFS 只會產生樹邊與後向邊", "有向圖中若 $u.d<v.d$，則 $v$ 一定是 $u$ 的後代", "有向圖無環 ⇔ DFS 沒有後向邊", "依 DFS 完成時間**遞增**排列就是拓撲順序", "Kosaraju 演算法中，第二次 DFS 是在 $G^T$ 上依第一次完成時間遞減的順序進行", "非根節點 $u$ 是 articulation point ⇔ 有孩子 $v$ 使 $low[v]\\ge u.d$"], "ans": [0, 2, 4, 5], "expl": "B 錯：$v$ 可能在 $u$ 完成之後才被另一棵子樹發現（交叉邊的情況）。D 錯：要遞減。", "fmt": "", "src": "bank"}, {"id": "ds-25", "ch": "ds-graph", "subject": "ds", "diff": 3, "type": "essay", "stem": "有向圖 $G$ 稱為 semiconnected：對任意兩點 $u,v$，至少有 $u\\leadsto v$ 或 $v\\leadsto u$。設計 $O(V+E)$ 的演算法判斷 $G$ 是否 semiconnected，並證明正確性。", "opts": [], "ans": [], "expl": "**演算法**：(1) 求 SCC 並縮點成元件圖 $G^{SCC}$（DAG），$O(V+E)$；(2) 對 $G^{SCC}$ 做拓撲排序得 $C_1,C_2,\\dots,C_k$；(3) 檢查每對相鄰的 $C_i\\to C_{i+1}$ 是否都有邊。全部有邊則 semiconnected。\n**正確性**：同一個 SCC 內的點互相可達，所以只要看元件之間。若相鄰元件間都有邊，則 $C_1\\to C_2\\to\\cdots\\to C_k$ 是一條漢米頓路徑，任兩個元件 $C_i,C_j$（$i<j$）都有 $C_i\\leadsto C_j$。反之，若某對相鄰的 $C_i,C_{i+1}$ 之間沒有邊：因為拓撲順序中 $C_{i+1}$ 之前的元件都排在 $C_i$ 及其前面，任何從 $C_i$ 到 $C_{i+1}$ 的路徑都必須經過拓撲序介於兩者之間的元件，但沒有這種元件，所以 $C_i\\not\\leadsto C_{i+1}$；而拓撲序保證 $C_{i+1}\\not\\leadsto C_i$，取兩元件中各一點即為反例。\n**時間**：SCC、拓撲排序、檢查相鄰邊都是 $O(V+E)$。", "fmt": "", "src": "bank"}, {"id": "la-01", "ch": "la-systems", "subject": "la", "diff": 2, "type": "multi", "stem": "$A$ 是 $m\\times n$ 矩陣。下列哪些正確？", "opts": ["若 $m<n$，則 $Ax=0$ 一定有非零解", "若 $m<n$，則 $Ax=b$ 一定有無限多解", "$Ax=b$ 對每個 $b$ 都有解 ⇔ $\\operatorname{rank}A=m$", "列運算不改變 $A$ 的行空間", "$\\operatorname{rank}(A^TA)=\\operatorname{rank}A$", "$\\operatorname{rank}(A^2)=\\operatorname{rank}A$ 對所有方陣成立"], "ans": [0, 2, 4], "expl": "B 錯：可能無解（$b\\notin C(A)$）。D 錯：列運算保持列空間與零空間，行空間會變。F 反例 $\\begin{bmatrix}0&1\\\\0&0\\end{bmatrix}$：rank 1，平方為零矩陣。", "fmt": "", "src": "bank"}, {"id": "la-02", "ch": "la-systems", "subject": "la", "diff": 1, "type": "fill", "stem": "$\\begin{bmatrix}1&2&3\\\\4&5&6\\\\7&8&9\\end{bmatrix}$ 的 rank？", "opts": [], "ans": ["2"], "expl": "第三列 = 2×第二列 − 第一列；前兩列獨立。", "fmt": "", "src": "bank"}, {"id": "la-03", "ch": "la-systems", "subject": "la", "diff": 2, "type": "fill", "stem": "$A$ 是 $5\\times7$、rank 3。$\\dim N(A)$ 與 $\\dim N(A^T)$ 各是多少？", "opts": [], "ans": ["4,2"], "expl": "$\\dim N(A)=n-r=7-3=4$；$\\dim N(A^T)=m-r=5-3=2$。", "fmt": "dim N(A),dim N(Aᵀ)", "src": "bank"}, {"id": "la-04", "ch": "la-systems", "subject": "la", "diff": 3, "type": "essay", "stem": "證明 $\\operatorname{rank}(AB)\\le\\min(\\operatorname{rank}A,\\operatorname{rank}B)$，並舉例說明等號不一定成立。", "opts": [], "ans": [], "expl": "**$\\le\\operatorname{rank}A$**：$AB$ 的每一行是 $A$ 的行的線性組合（$AB$ 的第 $j$ 行 $=A b_j$），所以 $C(AB)\\subseteq C(A)$，$\\dim C(AB)\\le\\dim C(A)$。\n**$\\le\\operatorname{rank}B$**：$N(B)\\subseteq N(AB)$（$Bx=0$ ⇒ $ABx=0$），兩者都在 $\\mathbb R^p$ 中，所以 $\\operatorname{nullity}(AB)\\ge\\operatorname{nullity}(B)$，由 rank–nullity 得 $\\operatorname{rank}(AB)\\le\\operatorname{rank}B$。（或：$\\operatorname{rank}(AB)=\\operatorname{rank}(B^TA^T)\\le\\operatorname{rank}B^T$。）\n**等號不成立的例子**：$A=\\begin{bmatrix}1&0\\\\0&0\\end{bmatrix}$、$B=\\begin{bmatrix}0&0\\\\0&1\\end{bmatrix}$，兩者 rank 1，但 $AB=0$。", "fmt": "", "src": "bank"}, {"id": "la-05", "ch": "la-vs", "subject": "la", "diff": 2, "type": "multi", "stem": "下列哪些是所述向量空間的子空間？", "opts": ["$\\{A\\in M_{n\\times n}:\\operatorname{tr}A=0\\}$", "$\\{A\\in M_{n\\times n}:\\det A=0\\}$", "$\\{p\\in P_3:p(1)=0\\}$", "$\\{(x,y)\\in\\mathbb R^2:xy\\ge0\\}$", "$\\{f:\\mathbb R\\to\\mathbb R \\mid f''+f=0\\}$", "$\\{x\\in\\mathbb R^3:Ax=b\\}$，$b\\ne0$"], "ans": [0, 2, 4], "expl": "B：$\\operatorname{diag}(1,0)+\\operatorname{diag}(0,1)=I$ 不奇異，加法不封閉。D：$(1,0)+(0,-1)$ 落在第四象限。F：不含零向量。", "fmt": "", "src": "bank"}, {"id": "la-06", "ch": "la-vs", "subject": "la", "diff": 2, "type": "fill", "stem": "跡為 0 的 $4\\times4$ 實對稱矩陣構成的空間，維度是多少？", "opts": [], "ans": ["9"], "expl": "對稱矩陣維度 $\\frac{4\\cdot5}2=10$，再加一條線性限制 $\\operatorname{tr}=0$，得 9。", "fmt": "", "src": "bank"}, {"id": "la-07", "ch": "la-vs", "subject": "la", "diff": 2, "type": "fill", "stem": "$U$、$W$ 是 $\\mathbb R^5$ 的子空間，$\\dim U=3$、$\\dim W=4$。$\\dim(U\\cap W)$ 最小可能是多少？", "opts": [], "ans": ["2"], "expl": "$\\dim(U\\cap W)=\\dim U+\\dim W-\\dim(U+W)\\ge3+4-5=2$。", "fmt": "", "src": "bank"}, {"id": "la-08", "ch": "la-vs", "subject": "la", "diff": 3, "type": "essay", "stem": "設 $T:V\\to V$ 線性且 $T^2=T$（$V$ 有限維）。證明 $V=\\ker T\\oplus\\operatorname{range}T$，並說明 $T$ 可對角化、特徵值只有 0 與 1。", "opts": [], "ans": [], "expl": "**分解**：任一 $v$ 寫成 $v=(v-T(v))+T(v)$。$T(v)\\in\\operatorname{range}T$；$T(v-T(v))=T(v)-T^2(v)=0$，所以 $v-T(v)\\in\\ker T$。故 $V=\\ker T+\\operatorname{range}T$。\n**交集為 0**：若 $w\\in\\ker T\\cap\\operatorname{range}T$，則 $w=T(u)$ 且 $T(w)=0$；$w=T(u)=T^2(u)=T(w)=0$。所以是直和。\n**對角化**：在 range 上 $T$ 是恆等（$T(T(u))=T(u)$），特徵值 1；在 ker 上特徵值 0。取 ker 的基底與 range 的基底合起來就是 $V$ 的基底，$T$ 的矩陣是 $\\operatorname{diag}(0,\\dots,0,1,\\dots,1)$。也可以從最小多項式整除 $x(x-1)$（無重根）得到。且 $\\operatorname{rank}T=\\operatorname{tr}T$。", "fmt": "", "src": "bank"}, {"id": "la-09", "ch": "la-det", "subject": "la", "diff": 2, "type": "fill", "stem": "$\\det\\begin{bmatrix}1&1&1&1\\\\1&2&4&8\\\\1&3&9&27\\\\1&5&25&125\\end{bmatrix}$ = ？", "opts": [], "ans": ["48"], "expl": "Vandermonde，$x=1,2,3,5$：$(2-1)(3-1)(5-1)(3-2)(5-2)(5-3)=1\\cdot2\\cdot4\\cdot1\\cdot3\\cdot2=48$。", "fmt": "", "src": "bank"}, {"id": "la-10", "ch": "la-det", "subject": "la", "diff": 2, "type": "fill", "stem": "$A$ 是 $3\\times3$、$\\det A=2$。求 $\\det(2A^{-1})\\cdot\\det(\\operatorname{adj}A)$。", "opts": [], "ans": ["16"], "expl": "$\\det(2A^{-1})=2^3\\cdot\\frac12=4$；$\\det(\\operatorname{adj}A)=(\\det A)^{n-1}=2^2=4$。乘積 16。", "fmt": "", "src": "bank"}, {"id": "la-11", "ch": "la-det", "subject": "la", "diff": 2, "type": "fill", "stem": "$5\\times5$ 矩陣對角線全是 3、其餘元素全是 1，行列式？", "opts": [], "ans": ["112"], "expl": "$(a-b)^{n-1}(a+(n-1)b)=2^4\\cdot(3+4)=112$。推法：矩陣 $=2I+J$，$J$（全 1）的特徵值為 5、0、0、0、0，所以 $2I+J$ 的特徵值 7、2、2、2、2。", "fmt": "", "src": "bank"}, {"id": "la-12", "ch": "la-det", "subject": "la", "diff": 3, "type": "multi", "stem": "下列哪些正確（$A$、$B$ 為 $n\\times n$）？", "opts": ["$\\det(A+B)=\\det A+\\det B$", "$\\det(-A)=-\\det A$", "奇數階實反對稱矩陣的行列式為 0", "$\\det(A^TA)\\ge0$", "行列式相同的兩個矩陣相似", "若 $\\operatorname{rank}A=n-1$，則 $\\operatorname{rank}(\\operatorname{adj}A)=1$"], "ans": [2, 3, 5], "expl": "B：$\\det(-A)=(-1)^n\\det A$。C：$\\det A=\\det A^T=\\det(-A)=-\\det A$。E 反例：$I$ 與 $\\begin{bmatrix}1&1\\\\0&1\\end{bmatrix}$。", "fmt": "", "src": "bank"}, {"id": "la-13", "ch": "la-eigen", "subject": "la", "diff": 2, "type": "fill", "stem": "$3\\times3$ 矩陣 $A$ 的特徵值為 1、2、4。求 $\\det(A^2+I)$。", "opts": [], "ans": ["170"], "expl": "$A^2+I$ 的特徵值為 $\\lambda^2+1$：2、5、17，乘積 170。", "fmt": "", "src": "bank"}, {"id": "la-14", "ch": "la-eigen", "subject": "la", "diff": 3, "type": "multi", "stem": "下列哪些正確？", "opts": ["可逆矩陣一定可對角化", "$A^2=A$ 的矩陣一定可對角化", "兩個可對角化矩陣的和一定可對角化", "$AB$ 與 $BA$ 有相同的非零特徵值", "$n$ 個相異特徵值 ⇒ 可對角化", "相似矩陣有相同的特徵向量", "若 $A\\ne0$ 且 $A^2=0$，則 $A$ 不可對角化"], "ans": [1, 3, 4, 6], "expl": "A 反例 $\\begin{bmatrix}1&1\\\\0&1\\end{bmatrix}$。C 反例：$\\begin{bmatrix}1&0\\\\0&0\\end{bmatrix}+\\begin{bmatrix}0&1\\\\0&1\\end{bmatrix}$ 的和為 $\\begin{bmatrix}1&1\\\\0&1\\end{bmatrix}$（兩者各自有相異特徵值，可對角化）。G：特徵值全為 0，若可對角化則為零矩陣。", "fmt": "", "src": "bank"}, {"id": "la-15", "ch": "la-eigen", "subject": "la", "diff": 3, "type": "single", "stem": "$5\\times5$ 矩陣 $A$ 的特徵多項式為 $(x-2)^5$，最小多項式為 $(x-2)^3$，$\\dim N(A-2I)=2$。它的 Jordan 形式由哪些大小的 Jordan 區塊組成？", "opts": ["3、1、1", "3、2", "2、2、1", "5"], "ans": [1], "expl": "區塊數 = 幾何重數 2；最大區塊 = 3（最小多項式的次方）；總大小 5。只能是 3＋2。", "fmt": "", "src": "bank"}, {"id": "la-16", "ch": "la-eigen", "subject": "la", "diff": 3, "type": "essay", "stem": "證明 $AB$ 與 $BA$（皆為 $n\\times n$）有相同的特徵多項式。若 $A$ 是 $m\\times n$、$B$ 是 $n\\times m$（$m\\ne n$），結論如何修正？", "opts": [], "ans": [], "expl": "**$A$ 可逆時**：$BA=A^{-1}(AB)A$，兩者相似，特徵多項式相同。\n**一般情況**：令 $A_t=A+tI$，除了有限個 $t$（$-t$ 為 $A$ 的特徵值）以外都可逆，所以 $\\det(\\lambda I-A_tB)=\\det(\\lambda I-BA_t)$。兩邊都是 $t$ 的多項式，在無限多個 $t$ 相等，所以恆等；令 $t=0$ 即得。（也可用分塊矩陣：$\\begin{bmatrix}I&-A\\\\0&\\lambda I\\end{bmatrix}\\begin{bmatrix}\\lambda I&A\\\\B&I\\end{bmatrix}$ 與另一個順序的乘積取行列式。）\n**非方陣**：$\\lambda^n\\det(\\lambda I_m-AB)=\\lambda^m\\det(\\lambda I_n-BA)$。所以非零特徵值（含重數）相同，0 的重數相差 $|m-n|$。例如 $u v^T$（$n\\times n$，秩 1）與 $v^Tu$（$1\\times1$）：前者的特徵值是 $v^Tu$ 與 $n-1$ 個 0。", "fmt": "", "src": "bank"}, {"id": "la-17", "ch": "la-ortho", "subject": "la", "diff": 2, "type": "fill", "stem": "把 $b=(1,1,1)$ 投影到 $a=(1,2,2)$ 所張的直線上，投影向量為何？", "opts": [], "ans": ["5/9,10/9,10/9"], "expl": "$\\frac{a^Tb}{a^Ta}a=\\frac59(1,2,2)$。誤差 $(4/9,-1/9,-1/9)$ 與 $a$ 正交（$4/9-2/9-2/9=0$）。", "fmt": "分數，逗號分隔", "src": "bank"}, {"id": "la-18", "ch": "la-ortho", "subject": "la", "diff": 2, "type": "fill", "stem": "用直線 $y=C+Dt$ 對資料點 $(0,0)、(1,8)、(3,8)、(4,20)$ 做最小平方擬合，求 $C$ 與 $D$。", "opts": [], "ans": ["1,4"], "expl": "$A^TA=\\begin{bmatrix}4&8\\\\8&26\\end{bmatrix}$，$A^Tb=\\begin{bmatrix}36\\\\112\\end{bmatrix}$。解 $4C+8D=36$、$8C+26D=112$ 得 $D=4$、$C=1$（Strang 的例子）。", "fmt": "C,D", "src": "bank"}, {"id": "la-19", "ch": "la-ortho", "subject": "la", "diff": 3, "type": "multi", "stem": "下列哪些正確？", "opts": ["投影矩陣 $P$ 滿足 $P^2=P$ 且 $P^T=P$", "投影矩陣一定可逆", "投影矩陣的跡等於它的秩", "若 $Q$ 是 $m\\times n$（$m>n$）且行正交單位，則 $QQ^T=I$", "正交矩陣的特徵值絕對值為 1", "用 QR 解最小平方比解正規方程數值上更穩定"], "ans": [0, 2, 4, 5], "expl": "B 錯：除非 $P=I$。D 錯：只有 $Q^TQ=I$；$QQ^T$ 是投影到 $C(Q)$ 的投影矩陣。C：特徵值只有 0、1，1 的個數等於秩。", "fmt": "", "src": "bank"}, {"id": "la-20", "ch": "la-sym-svd", "subject": "la", "diff": 3, "type": "single", "stem": "$A=\\begin{bmatrix}1&a&0\\\\a&1&a\\\\0&a&1\\end{bmatrix}$ 為正定的條件？", "opts": ["$|a|<1$", "$|a|<\\frac{1}{\\sqrt2}$", "$|a|<\\frac12$", "任意實數 $a$"], "ans": [1], "expl": "領先主子式：$1>0$；$1-a^2>0$；$\\det A=1(1-a^2)-a(a)=1-2a^2>0$ ⇒ $|a|<1/\\sqrt2$（此時第二個條件自動成立）。也可由特徵值 $1,\\ 1\\pm\\sqrt2a$ 看出。", "fmt": "", "src": "bank"}, {"id": "la-21", "ch": "la-sym-svd", "subject": "la", "diff": 2, "type": "fill", "stem": "$A=\\begin{bmatrix}1&1\\\\0&0\\\\1&1\\end{bmatrix}$ 的 2-範數 $\\|A\\|_2$（最大奇異值）是多少？", "opts": [], "ans": ["2"], "expl": "$A^TA=\\begin{bmatrix}2&2\\\\2&2\\end{bmatrix}$，特徵值 4、0，奇異值 2、0。$\\|A\\|_2=\\sigma_1=2$；rank 為 1。", "fmt": "", "src": "bank"}, {"id": "la-22", "ch": "la-sym-svd", "subject": "la", "diff": 3, "type": "multi", "stem": "下列哪些正確？", "opts": ["奇異值就是特徵值的絕對值", "實對稱矩陣的奇異值等於其特徵值的絕對值", "正定矩陣的所有元素都是正的", "半正定的判別必須檢查所有主子式，不能只看領先主子式", "$\\|A-A_k\\|_2=\\sigma_{k+1}$，$A_k$ 是 SVD 的前 $k$ 項和", "正規矩陣（$AA^H=A^HA$）可以被么正矩陣對角化"], "ans": [1, 3, 4, 5], "expl": "A 錯：例如 $\\begin{bmatrix}1&1\\\\0&1\\end{bmatrix}$ 特徵值 1、1，奇異值不是 1、1。C 反例 $\\begin{bmatrix}2&-1\\\\-1&2\\end{bmatrix}$。D 反例 $\\begin{bmatrix}0&0\\\\0&-1\\end{bmatrix}$。", "fmt": "", "src": "bank"}, {"id": "la-23", "ch": "la-sym-svd", "subject": "la", "diff": 3, "type": "essay", "stem": "證明：若 $A$ 是實對稱矩陣且 $A^k=0$（某個正整數 $k$），則 $A=0$。這個結論對非對稱矩陣成立嗎？", "opts": [], "ans": [], "expl": "**證法一（特徵值）**：$A$ 實對稱，$A=Q\\Lambda Q^T$。$A^k=Q\\Lambda^kQ^T=0$ ⇒ $\\Lambda^k=0$ ⇒ 每個 $\\lambda_i^k=0$ ⇒ $\\lambda_i=0$ ⇒ $\\Lambda=0$ ⇒ $A=0$。\n**證法二（$k=2$ 的直接論證，再推廣）**：若 $A^2=0$，則對任意 $x$，$\\|Ax\\|^2=x^TA^TAx=x^TA^2x=0$，所以 $Ax=0$ 對所有 $x$，$A=0$。一般 $k$：取 $2^j\\ge k$，$A^{2^j}=0$，反覆套用 $A^{2m}=(A^m)^2=0\\Rightarrow A^m=0$（$A^m$ 也對稱），往下推到 $A=0$。\n**非對稱**：不成立，$\\begin{bmatrix}0&1\\\\0&0\\end{bmatrix}^2=0$。關鍵在於對稱矩陣可正交對角化，冪零與可對角化同時成立只能是零矩陣。", "fmt": "", "src": "bank"}, {"id": "os-01", "ch": "os-process", "subject": "os", "diff": 3, "type": "fill", "stem": "下列程式從 main 開始執行，`x` 共被印出幾次（printf 立即輸出）？\n```c\nfork();\nfork() && fork();\nfork();\nprintf(\"x\");\n```", "opts": [], "ans": ["12"], "expl": "第一個 fork 後 2 個行程。每個行程執行 `fork() && fork()`：父行程得到正值、繼續第二個 fork；子行程得到 0、短路。所以每個行程變成 3 個：$2\\times3=6$。最後一個 fork 再加倍：12，每個印一次。", "fmt": "", "src": "bank"}, {"id": "os-02", "ch": "os-process", "subject": "os", "diff": 3, "type": "single", "stem": "程式為 `printf(\"A\"); fork(); printf(\"B\\n\");`，輸出到終端機（stdout 為行緩衝）。字母 A 一共出現幾次？", "opts": ["1", "2", "3", "不確定，取決於排程"], "ans": [1], "expl": "`printf(\"A\")` 沒有換行，A 還留在使用者空間的緩衝區；fork 把緩衝區一起複製，父子各自印 `B\\n` 時都把 `AB` 一起輸出。所以出現兩行 `AB`。若第一行是 `printf(\"A\\n\")` 就只有一次（輸出到終端時）；導向到檔案時則因全緩衝仍是兩次。", "fmt": "", "src": "bank"}, {"id": "os-03", "ch": "os-process", "subject": "os", "diff": 2, "type": "multi", "stem": "同一個行程中的多個執行緒，下列哪些是**共享**的？", "opts": ["全域變數", "heap 上配置的物件", "堆疊", "程式計數器", "開啟的檔案", "暫存器內容"], "ans": [0, 1, 4], "expl": "每個執行緒有自己的 PC、暫存器與堆疊（所以區域變數不共享）；程式碼、資料段、heap、開啟的檔案共享。", "fmt": "", "src": "bank"}, {"id": "os-04", "ch": "os-sched", "subject": "os", "diff": 2, "type": "fill", "stem": "行程（到達時間, burst）：P1(0,7)、P2(2,4)、P3(4,1)、P4(5,4)。使用 SRTF，平均等待時間？", "opts": [], "ans": ["3"], "expl": "甘特圖：P1[0,2) P2[2,4) P3[4,5) P2[5,7) P4[7,11) P1[11,16)。等待：P1 9、P2 1、P3 0、P4 2，平均 3。非搶先 SJF 則為 4。", "fmt": "", "src": "bank"}, {"id": "os-05", "ch": "os-sched", "subject": "os", "diff": 2, "type": "fill", "stem": "同一組行程 P1(0,7)、P2(2,4)、P3(4,1)、P4(5,4)，用 RR（q=2，新到達的行程排在被換下的行程之前），平均等待時間？", "opts": [], "ans": ["5"], "expl": "P1[0,2) P2[2,4) P1[4,6) P3[6,7) P2[7,9) P4[9,11) P1[11,13) P4[13,15) P1[15,16)。完成時間 P1 16、P2 9、P3 7、P4 15；等待 9、3、2、6，平均 5。（t=2 時 P2 到達、P1 被換下，佇列 [P2, P1]；t=4 時 P3 到達、P2 被換下，佇列 [P1, P3, P2]；t=6 時佇列 [P3, P2, P4, P1]。）可以在動畫實驗室輸入驗證。", "fmt": "", "src": "bank"}, {"id": "os-06", "ch": "os-sched", "subject": "os", "diff": 3, "type": "multi", "stem": "關於 CPU 排程，下列哪些正確？", "opts": ["所有行程同時到達時，非搶先 SJF 的平均等待時間最小", "SRTF 不會造成飢餓", "RR 的時間片趨近無限大時就是 FCFS", "Rate-monotonic 的使用率超過 $n(2^{1/n}-1)$ 時一定會錯過截止時間", "EDF 對週期性工作（截止時間＝週期、可搶先）在 $U\\le1$ 時一定可排程", "平均周轉時間不一定隨著 RR 的時間片增加而變小"], "ans": [0, 2, 4, 5], "expl": "B 錯：長工作可能一直被短工作搶先。D 錯：該界是充分條件，超過後不一定失敗，要實際畫時間軸。", "fmt": "", "src": "bank"}, {"id": "os-07", "ch": "os-sched", "subject": "os", "diff": 3, "type": "single", "stem": "兩個週期性工作：$T_1$ 週期 50、執行 20；$T_2$ 週期 100、執行 35。用 rate-monotonic 排程是否能滿足所有截止時間？", "opts": ["可以，使用率 0.75 小於 2 個工作的界 0.828", "不可以，使用率超過 0.693", "不可以，因為 $T_2$ 的執行時間比 $T_1$ 長", "無法判斷，必須用 EDF"], "ans": [0], "expl": "$U=20/50+35/100=0.75\\le2(\\sqrt2-1)\\approx0.828$，RM 保證可排程。$\\ln2\\approx0.693$ 是 $n\\to\\infty$ 的界，不適用於 $n=2$。", "fmt": "", "src": "bank"}, {"id": "os-08", "ch": "os-sync", "subject": "os", "diff": 2, "type": "single", "stem": "兩個行程的進入區程式碼如下（$P_i$，$j=1-i$）：\n```c\nflag[i] = true;\nwhile (flag[j]) ;\n/* critical section */\nflag[i] = false;\n```\n它違反了臨界區問題的哪一個條件？", "opts": ["互斥", "Progress（兩者可能同時卡住）", "只違反 bounded waiting", "三個條件都滿足"], "ans": [1], "expl": "若 $P_0$、$P_1$ 先後設好 flag 再檢查對方，兩者都看到對方的 flag 為真而永遠等待（死結），違反 progress。互斥是滿足的：進入臨界區的人必定看到對方 flag 為假，而對方要進入必須先設自己的 flag，之後就會被擋住。", "fmt": "", "src": "bank"}, {"id": "os-09", "ch": "os-sync", "subject": "os", "diff": 2, "type": "fill", "stem": "號誌 x、y 初值皆為 0。\n```\nP1: wait(x); print(\"a\"); signal(y);\nP2: print(\"b\"); signal(x); wait(y); print(\"c\");\n```\n唯一可能的輸出為何？", "opts": [], "ans": ["bac"], "expl": "P1 一開始卡在 wait(x)，只有 P2 能先印 b 並 signal(x)；P2 接著卡在 wait(y)，P1 印 a 並 signal(y)；最後 P2 印 c。", "fmt": "", "src": "bank"}, {"id": "os-10", "ch": "os-sync", "subject": "os", "diff": 3, "type": "multi", "stem": "下列哪些正確？", "opts": ["Mesa 語意的監視器中，被喚醒的行程要用 while 迴圈重新檢查條件", "監視器的 signal 在沒有行程等待時會被保留，之後的 wait 會直接通過", "生產者若先 wait(mutex) 再 wait(empty)，在緩衝區滿時可能造成死結", "Peterson 演算法不加 memory barrier 也能在現代多核心處理器上正確運作", "Priority inheritance 可以解決 priority inversion", "只使用 test_and_set 的簡單 spinlock 滿足互斥，但不保證 bounded waiting"], "ans": [0, 2, 4, 5], "expl": "B 錯：條件變數沒有記憶，這點和號誌不同。D 錯：讀寫可能被重排。", "fmt": "", "src": "bank"}, {"id": "os-11", "ch": "os-sync", "subject": "os", "diff": 3, "type": "essay", "stem": "用號誌寫出 readers–writers 問題的一個解，使得「一旦有寫者在等待，新來的讀者就不能進入」（寫者優先），並說明在你的解中讀者是否可能飢餓。", "opts": [], "ans": [], "expl": "號誌：`rw=1`（資源）、`rmutex=1`、`wmutex=1`（保護計數）、`readTry=1`（寫者等待時擋住新讀者），計數 `rc=0, wc=0`。\n```c\nwriter:\n  wait(wmutex); wc++; if (wc == 1) wait(readTry); signal(wmutex);\n  wait(rw);  /* write */  signal(rw);\n  wait(wmutex); wc--; if (wc == 0) signal(readTry); signal(wmutex);\n\nreader:\n  wait(readTry);\n    wait(rmutex); rc++; if (rc == 1) wait(rw); signal(rmutex);\n  signal(readTry);\n  /* read */\n  wait(rmutex); rc--; if (rc == 0) signal(rw); signal(rmutex);\n```\n**說明**：第一個寫者拿走 `readTry`，之後新讀者都卡在 `wait(readTry)`；已在讀的讀者讀完後最後一個釋放 `rw`，寫者才進入。只要不斷有寫者到達，`wc` 一直大於 0，`readTry` 不會被釋放，所以**讀者可能飢餓**（與第一型問題寫者會飢餓相對）。若要兩者都不飢餓，可以用一個公平的「排隊號誌」讓讀寫者依到達順序通過。", "fmt": "", "src": "bank"}, {"id": "os-12", "ch": "os-deadlock", "subject": "os", "diff": 2, "type": "fill", "stem": "系統有 7 台磁帶機，每個行程最多同時需要 3 台。在不做任何死結處理的情況下，最多可以有幾個行程而保證不會死結？", "opts": [], "ans": ["3"], "expl": "最壞情況每個行程拿 2 台並等第 3 台，只要再多 1 台就有人能完成：需要 $n(3-1)+1\\le7$ ⇒ $n\\le3$。4 個行程時的反例：3 個行程各拿 2 台、第 4 個拿 1 台，7 台用完，每個行程都還缺台數，全部卡住。", "fmt": "", "src": "bank"}, {"id": "os-13", "ch": "os-deadlock", "subject": "os", "diff": 3, "type": "multi", "stem": "關於死結，下列哪些正確？", "opts": ["死結的四個必要條件必須同時成立", "資源配置圖有環就一定死結", "處於不安全狀態就一定死結", "每類資源只有一個實例時，資源配置圖有環就等於死結", "要求依資源編號遞增順序申請，可以破壞循環等待", "Banker 演算法需要事先知道每個行程的最大需求"], "ans": [0, 3, 4, 5], "expl": "B 錯：多實例時不一定。C 錯：不安全只是無法保證，行程不一定真的會要到最大需求。", "fmt": "", "src": "bank"}, {"id": "os-14", "ch": "os-deadlock", "subject": "os", "diff": 2, "type": "fill", "stem": "三種資源，Available=(3,3,2)。Allocation：P0(0,1,0) P1(2,0,0) P2(3,0,2) P3(2,1,1) P4(0,0,2)；Max：P0(7,5,3) P1(3,2,2) P2(9,0,2) P3(2,2,2) P4(4,3,3)。若每一步都挑「編號最小且 Need ≤ Work」的行程，安全序列為何？", "opts": [], "ans": ["P1,P3,P0,P2,P4"], "expl": "Need：P0(7,4,3) P1(1,2,2) P2(6,0,0) P3(0,1,1) P4(4,3,1)。Work=(3,3,2)：P1 → (5,3,2)；P3 → (7,4,3)；P0 → (7,5,3)；P2 → (10,5,5)；P4 → (10,5,7)。恐龍書給的序列 <P1,P3,P4,P2,P0> 也正確，安全序列不唯一。", "fmt": "例：P1,P3,P0,P2,P4", "src": "bank"}, {"id": "os-15", "ch": "os-memory", "subject": "os", "diff": 2, "type": "fill", "stem": "TLB 查詢 20 ns、記憶體存取 100 ns、TLB 命中率 80%、單層頁表（TLB 失誤後才查頁表）。有效存取時間？", "opts": [], "ans": ["140"], "expl": "$0.8\\times(20+100)+0.2\\times(20+200)=96+44=140$ ns。命中率 98% 時為 122 ns。", "fmt": "", "src": "bank"}, {"id": "os-16", "ch": "os-memory", "subject": "os", "diff": 2, "type": "fill", "stem": "32 位元虛擬位址、頁大小 4 KB、每個 PTE 4 bytes，單層頁表有多少 MB？", "opts": [], "ans": ["4"], "expl": "VPN 20 位元，$2^{20}$ 個 PTE × 4 B = 4 MB，每個行程一份且必須連續，這就是要用多層頁表的原因。", "fmt": "", "src": "bank"}, {"id": "os-17", "ch": "os-memory", "subject": "os", "diff": 3, "type": "multi", "stem": "下列哪些正確？", "opts": ["分頁沒有外部碎片，但有內部碎片", "頁越大，內部碎片越小", "反轉頁表的大小與實體記憶體大小成正比", "反轉頁表很容易實作共享記憶體", "TLB 失誤不一定造成 page fault", "依 50% 規則，first-fit 下約有 1/3 的記憶體可能因外部碎片而無法使用"], "ans": [0, 2, 4, 5], "expl": "B 錯：頁越大，最後一頁浪費越多。D 錯：每個頁框只有一項，難以讓多個虛擬位址對應同一頁框。", "fmt": "", "src": "bank"}, {"id": "os-18", "ch": "os-vm", "subject": "os", "diff": 2, "type": "fill", "stem": "參考串 `1 2 3 4 2 1 5 6 2 1 2 3 7 6 3 2 1 2 3 6`，4 個頁框（初始為空），LRU 會發生幾次缺頁？", "opts": [], "ans": ["10"], "expl": "同一參考串：LRU 在 1～7 個頁框時分別為 20、18、15、10、8、7、7；FIFO 為 20、18、16、14、10、10、7；OPT 為 20、15、11、8、7、7、7（恐龍書習題）。", "fmt": "", "src": "bank"}, {"id": "os-19", "ch": "os-vm", "subject": "os", "diff": 2, "type": "fill", "stem": "記憶體存取 200 ns，處理缺頁平均 8 ms，缺頁率 $p=0.001$。有效存取時間是多少 ns？", "opts": [], "ans": ["8199.8"], "expl": "$(1-0.001)\\times200+0.001\\times8{,}000{,}000=199.8+8000=8199.8$ ns，比沒有缺頁時慢約 40 倍。", "fmt": "", "src": "bank"}, {"id": "os-20", "ch": "os-vm", "subject": "os", "diff": 3, "type": "multi", "stem": "下列哪些正確？", "opts": ["LRU 與 OPT 都不會發生 Belady 異常", "FIFO 在任何參考串上，頁框增加都會讓缺頁增加", "Thrashing 發生時，CPU 使用率會下降", "Working set 模型需要知道未來的參考序列", "Clock 演算法在所有參考位元都是 1 時退化成 FIFO", "依列走訪以列為主（row-major）存放的大陣列，缺頁數比依行走訪少"], "ans": [0, 2, 4, 5], "expl": "B 錯：Belady 異常只發生在某些參考串上。D 錯：看的是過去 $\\Delta$ 次參考。", "fmt": "", "src": "bank"}, {"id": "os-21", "ch": "os-storage", "subject": "os", "diff": 2, "type": "fill", "stem": "柱面 0～199，磁頭在 53，請求佇列 98, 183, 37, 122, 14, 124, 65, 67。用 SSTF 的總磁頭移動量？", "opts": [], "ans": ["236"], "expl": "53→65→67→37→14→98→122→124→183：$12+2+30+23+84+24+2+59=236$。", "fmt": "", "src": "bank"}, {"id": "os-22", "ch": "os-storage", "subject": "os", "diff": 3, "type": "fill", "stem": "inode 有 10 個直接指標、1 個單層間接、1 個雙層間接指標；區塊 1 KB、指標 4 bytes。最大檔案大小是多少 KB？", "opts": [], "ans": ["65802"], "expl": "一個區塊放 256 個指標。直接 10 KB；單層 256 KB；雙層 $256^2=65536$ KB。總和 $10+256+65536=65802$ KB（約 64.26 MB）。", "fmt": "", "src": "bank"}, {"id": "os-23", "ch": "os-storage", "subject": "os", "diff": 3, "type": "multi", "stem": "下列關於 RAID 與檔案系統的敘述哪些正確？", "opts": ["RAID 5 的小寫入需要 4 次磁碟 I/O", "RAID 5 可以容忍任兩顆磁碟同時故障", "RAID 1+0 比 RAID 0+1 可靠", "Hard link 不能跨檔案系統", "刪除 symbolic link 指向的原檔後，透過連結仍可讀到資料", "FAT 是把鏈結配置的指標集中存放在一張表中"], "ans": [0, 2, 3, 5], "expl": "B 錯：那是 RAID 6。E 錯：符號連結只存路徑，原檔刪除後變成懸空連結；hard link 才會保留資料。", "fmt": "", "src": "bank"}, {"id": "os-24", "ch": "os-vm", "subject": "os", "diff": 3, "type": "essay", "stem": "說明 thrashing 的成因與惡性循環，並比較 working-set 模型與 page-fault frequency（PFF）兩種對策各自如何決定要給行程多少頁框、何時要暫停行程。", "opts": [], "ans": [], "expl": "**成因**：行程分到的頁框少於它目前 locality 需要的頁數，於是不停缺頁；行程大多在等磁碟 I/O，CPU 使用率下降。若排程器看到 CPU 閒置而提高多工程度、加入更多行程，每個行程的頁框更少、缺頁更多（全域替換時還會搶別人的頁框），形成惡性循環，系統幾乎沒有進度。\n**Working set**：以最近 $\\Delta$ 次參考用到的相異頁數 $WSS_i$ 估計行程目前的 locality，給它至少 $WSS_i$ 個頁框。若 $D=\\sum WSS_i>$ 總頁框數，就挑行程暫停（swap out），把頁框分給其他行程；有餘裕時再恢復。需要追蹤 working set（用參考位元加計時中斷近似），$\\Delta$ 的選擇影響準確度。\n**PFF**：直接量測每個行程的缺頁率，設上下界：高於上界就多給頁框；低於下界就收回頁框。若高於上界卻沒有空頁框，就暫停某個行程。比 working set 便宜，直接以症狀（缺頁率）調整。\n兩者都是區域性的控制：保證每個執行中的行程有足夠的頁框涵蓋它的 locality。", "fmt": "", "src": "bank"}], "plan": [{"day": 1, "title": "開局：漸進分析 × 線性系統", "goal": "建立「用精確的界說話」的習慣；高斯消去要熟到不會算錯。", "lessons": ["al-recurrence", "la-systems"], "mocks": [], "review": false}, {"day": 2, "title": "行程模型 × 攤銷分析", "goal": "fork 語意要能畫行程樹；攤銷三法都要能寫出位能函數。", "lessons": ["os-process", "ds-amortized"], "mocks": [], "review": false}, {"day": 3, "title": "邏輯證明 × 效能公式", "goal": "歸納法寫法固定化；CPU time 公式與 Amdahl 一次搞懂。", "lessons": ["dm-logic", "co-perf"], "mocks": [], "review": false}, {"day": 4, "title": "排序與下界 × 向量空間", "goal": "比較排序下界的 ], "review": false}, {"day": 19, "title": "貪婪 × Cache", "goal": "交換論證；Cache 設計與 AMAT。", "lessons": ["al-greedy", "co-cache"], "mocks": [], "review": false}, {"day": 20, "title": "對稱矩陣與 SVD × 最短路徑", "goal": "正定判別與 SVD；Dijkstra 正確性、Johnson 重新加權。", "lessons": ["la-sym-svd", "al-sp"], "mocks": [], "review": false}, {"day": 21, "title": "儲存系統 × 數論與代數", "goal": "磁碟排程、RAID、檔案配置；同餘、CRT、群。", "lessons": ["os-storage", "dm-nt-algebra"], "mocks": [], "review": false}, {"day": 22, "title": "MST 與網路流 × 虛擬記憶體硬體與一致性", "goal": "Cut property、Max-flow min-cut；TLB、MESI、記憶體一致性。", "lessons": ["al-mst-flow", "co-vm-coherence"], "mocks": [], "review": false}, {"day": 23, "title": "NP-完備 × 機率分析與字串", "goal": "歸約的方向；隨機化分析與 KMP。", "lessons": ["al-np", "al-prob"], "mocks": [], "review": false}, {"day": 24, "title": "複習日 #3", "goal": "模擬考：計算機結構與作業系統；重寫高信心答錯的題目。", "lessons": [], "mocks": ["sys"], "review": true}, {"day": 25, "title": "弱點補強：數學", "goal": "依錯題本與 Agent 指派；做無限隨機題（行列式、特徵值、計數、遞迴）各 10 題。", "lessons": [], "mocks": [], "review": false}, {"day": 26, "title": "弱點補強：資結演算法＋系統", "goal": "依錯題本與 Agent 指派；被退回的費曼關卡全部重交。", "lessons": [], "mocks": [], "review": false}, {"day": 27, "title": "全真模考：資料結構與演算法", "goal": "100 分鐘計時，交卷後逐題寫錯因。", "lessons": [], "mocks": ["dsa"], "review": false}, {"day": 28, "title": "全真模考：計算機結構與作業系統", "goal": "100 分鐘計時，交卷後逐題寫錯因。", "lessons": [], "mocks": ["sys"], "review": false}, {"day": 29, "title": "全真模考：數學（線代＋離散）", "goal": "100 分鐘計時，交卷後逐題寫錯因。", "lessons": [], "mocks": ["math"], "review": false}, {"day": 30, "title": "總複習：錯題清零＋費曼總關卡", "goal": "每一科挑三章，不看書做白紙回憶，再對照補洞。", "lessons": [], "mocks": [], "review": false}], "methods": "## 先說結論\n\n一個月讀完六科而且要上台大，靠的不是「讀很多遍」，而是**每天都被迫把東西提取出來、講清楚、找出錯在哪**。這個網站的每個功能都在做這件事。下面是對應關係，照著用就好。\n\n| 學習法 | 證據說它有效的原因 | 在網站裡是哪個功能 |\n|---|---|---|\n| **費曼學習法** | 講得出完整因果鏈，才代表真的理解；講不出來的那一步就是缺口 | 每章最後的「費曼關卡」，Agent 逐步檢查思考鏈，有跳步就退回並追問 |\n| **主動回想**（retrieval practice） | 從記憶中提取比重讀更能鞏固記憶 | 章首的「讀前先回想」；「主動回想模式」把重點遮起來，先講再看 |\n| **白紙回憶**（blurting） | 不看書寫出全部記得的內容，最能暴露遺忘 | 每天早上的「晨間白紙回憶」，寄給 Agent 對照漏掉什麼 |\n| **間隔重複＋FSRS 記憶模型** | 在快忘記時複習，記憶保留最久；FSRS 為每一題、每一張卡估計「穩定度」，預測你此刻還記得的機率 | 做過的每一題、每張必背卡、每種計算題型，都在記得機率掉到目標保留率（預設 90%）時才再出現；考前自動把間隔壓在考試日之前 |\n| **必背卡**（提取＋判斷） | 台大多選題考的是「看起來對但錯」的敘述；快速判斷 ✓／✗ 是最直接的提取練習 | 從教材自動抽出 390 張：149 張陷阱判斷、21 張考點、220 張回想題；只開放已讀或計畫已到的章節 |\n| **讀前預測驗**（pretesting） | 先被問過的問題，讀的時候會主動找答案；就算猜錯也比直接讀記得牢 | 還沒讀的章節頂端有「讀前預測驗」：先猜 3 題，只公布正解不給詳解，也不計入錯題 |\n| **適度困難**（desirable difficulty） | 太簡單學不到、太難會放棄；研究建議讓答對率維持在八成多 | 「自適應練習」：模型即時估計你每章的掌握度，挑「預測答對率約 82%」的題目，弱章優先、各章交錯 |\n| **交錯練習**（interleaving） | 混合不同題型，逼自己先判斷「這是哪一類問題」 | 「交錯混合練習」從所有已讀章節隨機抽題；30 天計畫每天兩科交錯 |\n| **後設認知**（信心度校準） | 知道自己「不知道」比答對更重要；高信心答錯是最頑固的迷思 | 作答前必選信心度；「學習儀表板」畫出校準：你說「非常確定」時實際答對幾成；過度自信會出現在督導警報 |\n| **掌握度追蹤** | 憑感覺判斷「這章會了」通常偏樂觀 | 學習儀表板的章節掌握度熱圖（Elo 模型），≥ 85% 才算台大水準；點任一格就針對那章練 |\n| **錯誤分析** | 只看正解不會改變錯誤的思路 | 答錯必填錯因（觀念不清／推理跳步／計算失誤／題意誤讀／粗心／沒背熟）與「我原本以為…但其實…」 |\n| **雙重編碼**（dual coding） | 文字＋圖像兩條路徑記得更牢 | 每章的「60 秒看懂」短影音；動畫實驗室：先預測下一步，再按「下一步」驗證 |\n| **刻意練習** | 針對弱點、立即回饋、反覆 | 無限隨機題（答案由模擬器算，永遠不會做完）；台大難度題；Agent 依弱點出題 |\n| **番茄鐘＋時數紀錄** | 專注時段＋強制休息，避免假性讀書 | 今日督導的專注計時，只有按下開始的時間才算 |\n| **模擬考** | 在考試條件下提取，訓練時間分配與抗壓 | 三科全真模考，100 分鐘、交卷前不給回饋 |\n| **考後反思單**（exam wrapper） | 考完只看分數不會進步；把失分歸因、寫成下次的具體行動才會 | 模考交卷後填反思單：失分原因、最花時間的題、下次要改變的一件事（寫成「如果……就……」），之後每天的今日督導都會提醒你 |\n| **外部監督** | 有人看著，執行率會大幅提高 | 每日任務、打卡、連續達標天數、督導警報，以及 Agent 每天的督導訊息 |\n| **降低起步成本**（5 分鐘法則） | 拖延最難的是開始；只承諾 5 分鐘，開始後通常會繼續 | 「帶我讀」只給一件事、一個按鈕；「只做 5 分鐘」；按開始自動啟動專注計時；離開回來直接給下一步 |\n| **環境提示**（cue） | 固定時間、固定觸發，比靠意志力可靠 | `setup_autostart.bat` 讓電腦每天定時＋開機自動打開網站；到點、快到打卡時間會跳通知 |\n| **承諾與損失規避** | 說出口的承諾、自己定的代價、怕失去連續紀錄，都會提高執行率 | 每天選打卡時間並倒數；「沒打卡的代價」；連續天數「今天沒打卡就歸零」 |\n| **絕不連斷兩天** | 斷一天沒關係，連斷兩天習慣就會崩 | 斷掉的隔天跳紅色警告；「保底模式」15 分鐘也能保住連續天數 |\n| **誠實的時數** | 假性讀書會讓你高估自己 | 切到別的分頁不計時；8 分鐘沒動作自動暫停並詢問 |\n\n## 每天怎麼用（建議流程）\n\n**不想自己排？打開「▶ 帶我讀」，照它給的那一步做就好。** 下面的流程它已經幫你排進去了，還會依你的記憶狀態與弱點微調。\n\n1. **早上 30 分鐘**：今日督導 → 晨間白紙回憶（寫昨天兩章）→ 必背卡清掉到期卡（通常 10～15 分鐘）。\n2. **上午**：第一章。讀前預測驗（3 題）→ 刷「60 秒看懂」→ 讀內容與動畫 → 開「主動回想模式」再過一次 → 交費曼關卡。\n3. **下午**：第二章，同樣流程。\n4. **晚上**：自適應練習 15 題＋本章練習（湊滿當日題數）→ 錯題寫錯因 → 清空到期複習題 → 晚間打卡寫反省。\n5. **每週一次**：看學習儀表板。校準偏了就放慢作答、寫思考鏈；掌握度紅色的章節排進隔天。\n5. **Agent**：讓它在背景監聽；費曼被退回的，隔天早上先補。\n\n## 費曼關卡的通過標準（Agent 也照這個審）\n\n1. 涵蓋所有關鍵點（送出後可以對照）。\n2. 每一步都有「因為…所以…」，沒有「很明顯」「所以就」帶過的地方。\n3. 至少一個具體的例子或數字代入。\n4. 說得出結論**什麼時候不成立**（反例、邊界條件、需要的假設）。\n5. 沒有觀念錯誤。\n\n少一項就退回。退回不是失敗：退回的那一步，正是考場上會失分的地方。\n\n## 一個月的現實\n\n六科在 30 天內讀到台大程度，每天需要 6 小時以上的有效專注，而且不能有空白日。計畫第 8、16、24 天是複習日，用來補進度與重交費曼。如果某天沒達標，系統會在隔天的督導警報提醒你，Agent 也會在督導訊息中調整後續任務。任何教材都無法保證錄取；能保證的是，照這套流程走完，你會清楚知道自己每一科哪裡還不會。\n", "cards": [{"id": "key:ds-amortized:1", "kind": "key", "ch": "ds-amortized", "subject": "ds", "front": "環狀佇列的滿與空", "back": "若 `front` 指向第一個元素的前一格：空 ⇔ `front == rear`；滿 ⇔ `(rear+1) % n == front`，所以容量只有 $n-1$。要用滿 $n$ 格，必須另存 `count` 或一個旗標。", "tag": "考點"}, {"id": "key:ds-amortized:2", "kind": "key", "ch": "ds-amortized", "subject": "ds", "front": "可得排列的判準", "back": "一個排列可由堆疊得到 ⇔ 不存在 $i<j<k$ 使 $p_j<p_k<p_i$（不含「312」型樣）。數量為 Catalan 數 $C_n=\\frac{1}{n+1}\\binom{2n}{n}$。\n例：$n=3$ 時 5 種，唯一不行的是 `3 1 2`：輸出 3 時 1、2 都在堆疊中，2 壓在 1 上面。", "tag": "定理"}, {"id": "tf:ds-amortized:1", "kind": "tf", "ch": "ds-amortized", "subject": "ds", "front": "攤銷 $O(1)$ 表示每次操作都是 $O(1)$", "ans": false, "back": "單次可能 $\\Theta(n)$"}, {"id": "tf:ds-amortized:2", "kind": "tf", "ch": "ds-amortized", "subject": "ds", "front": "攤銷分析需要假設輸入隨機", "ans": false, "back": ""}, {"id": "tf:ds-amortized:3", "kind": "tf", "ch": "ds-amortized", "subject": "ds", "front": "位能函數可以取負值，只要最後為 0", "ans": false, "back": "要求的是任何時刻 $\\Phi(D_i)\\ge\\Phi(D_0)$"}, {"id": "rc:ds-amortized:1", "kind": "recall", "ch": "ds-amortized", "subject": "ds", "front": "中序轉後序時，遇到運算子要彈出哪些堆疊元素？右結合的 ^ 有什麼不同？", "back": ""}, {"id": "rc:ds-amortized:2", "kind": "recall", "ch": "ds-amortized", "subject": "ds", "front": "輸入 1..n 依序進堆疊，哪種輸出排列不可能得到？可能的排列有幾種？", "back": ""}, {"id": "rc:ds-amortized:3", "kind": "recall", "ch": "ds-amortized", "subject": "ds", "front": "攤銷分析三種方法各是什麼？攤銷成本和平均情況成本差在哪？", "back": ""}, {"id": "rc:ds-amortized:4", "kind": "recall", "ch": "ds-amortized", "subject": "ds", "front": "動態表加倍擴張時，為什麼每次插入攤銷 O(1)？縮小門檻為什麼是 1/4 而不是 1/2？", "back": ""}, {"id": "rc:ds-amortized:5", "kind": "recall", "ch": "ds-amortized", "subject": "ds", "front": "二進位計數器只做 INCREMENT 時總翻轉次數上界？加上 DECREMENT 呢？", "back": ""}, {"id": "key:ds-sort:1", "kind": "key", "ch": "ds-sort", "subject": "ds", "front": "其他下界", "back": "- 合併兩個長度 $n$ 的已排序串列：最壞需要 $2n-1$ 次比較（相鄰對手論證）。\n- 同時找最小與最大：$\\lceil 3n/2\\rceil-2$ 次（兩兩一組，組內比 1 次，較小者跟目前的 min 比、較大者跟 max 比），比分開找的 $2n-2$ 少。\n- 找第二小：$n+\\lceil\\lg n\\rceil-2$（錦標賽：冠軍一路打敗的 $\\lceil\\lg n\\rceil$ 個人中選最小）。\n- 只用比較，在已排序陣列中搜尋：$\\Omega(\\lg n)$。", "tag": "考點"}, {"id": "tf:ds-sort:1", "kind": "tf", "ch": "ds-sort", "subject": "ds", "front": "heapsort 是穩定的", "ans": false, "back": ""}, {"id": "tf:ds-sort:2", "kind": "tf", "ch": "ds-sort", "subject": "ds", "front": "insertion sort 在幾乎排好的資料上是線性", "ans": true, "back": "逆序對 $O(n)$ 時"}, {"id": "tf:ds-sort:3", "kind": "tf", "ch": "ds-sort", "subject": "ds", "front": "任何比較排序都至少要 $n\\lg n$ 次比較", "ans": false, "back": "下界是 $\\lg n!\\approx n\\lg n-1.44n$，而且是**最壞**情況；最佳情況可以是 $n-1$"}, {"id": "tf:ds-sort:4", "kind": "tf", "ch": "ds-sort", "subject": "ds", "front": "radix sort 是比較排序", "ans": false, "back": ""}, {"id": "tf:ds-sort:5", "kind": "tf", "ch": "ds-sort", "subject": "ds", "front": "counting sort 對負數不能用", "ans": false, "back": "平移即可"}, {"id": "rc:ds-sort:1", "kind": "recall", "ch": "ds-sort", "subject": "ds", "front": "寫出 8 種排序的最佳／平均／最壞時間、額外空間、是否穩定。", "back": ""}, {"id": "rc:ds-sort:2", "kind": "recall", "ch": "ds-sort", "subject": "ds", "front": "比較排序 $\\Omega(n\\lg n)$ 下界的決策樹論證。這個下界對平均情況也成立嗎？", "back": ""}, {"id": "rc:ds-sort:3", "kind": "recall", "ch": "ds-sort", "subject": "ds", "front": "隨機 quicksort 期望比較次數的推導關鍵：$z_i$ 與 $z_j$ 被比較的機率是多少？", "back": ""}, {"id": "rc:ds-sort:4", "kind": "recall", "ch": "ds-sort", "subject": "ds", "front": "Median-of-medians 的遞迴式；為什麼每組 3 個不行？", "back": ""}, {"id": "rc:ds-sort:5", "kind": "recall", "ch": "ds-sort", "subject": "ds", "front": "同時找最大與最小最少要幾次比較？找第二小呢？", "back": ""}, {"id": "key:ds-heap:1", "kind": "key", "ch": "ds-heap", "subject": "ds", "front": "$B_k$ 的性質", "back": "有 $2^k$ 個節點；高度 $k$；深度 $i$ 恰有 $\\binom ki$ 個節點；根的度數 $k$ 最大，且根的子樹由左到右是 $B_{k-1},\\dots,B_0$。", "tag": "考點"}, {"id": "tf:ds-heap:1", "kind": "tf", "ch": "ds-heap", "subject": "ds", "front": "Fibonacci heap 的 extract-min 最壞是 $O(\\lg n)$", "ans": false, "back": "單次可能 $\\Theta(n)$（剛插入 $n$ 個後第一次 extract），$O(\\lg n)$ 是攤銷"}, {"id": "tf:ds-heap:2", "kind": "tf", "ch": "ds-heap", "subject": "ds", "front": "已排序的陣列一定是 min-heap", "ans": true, "back": ""}, {"id": "tf:ds-heap:3", "kind": "tf", "ch": "ds-heap", "subject": "ds", "front": "min-heap 的陣列一定是排序好的", "ans": false, "back": ""}, {"id": "tf:ds-heap:4", "kind": "tf", "ch": "ds-heap", "subject": "ds", "front": "在 max-heap 中最小值一定在葉子", "ans": true, "back": "元素相異時"}, {"id": "tf:ds-heap:5", "kind": "tf", "ch": "ds-heap", "subject": "ds", "front": "用 heap 可以在 $O(n+k\\lg n)$ 找出前 $k$ 大", "ans": true, "back": "Build-Heap 加 $k$ 次 extract）；更好的是 $O(n+k\\lg k)$（只在候選小 heap 上操作"}, {"id": "rc:ds-heap:1", "kind": "recall", "ch": "ds-heap", "subject": "ds", "front": "Build-Heap 為什麼是 O(n)？寫出求和式。", "back": ""}, {"id": "rc:ds-heap:2", "kind": "recall", "ch": "ds-heap", "subject": "ds", "front": "高度 h 的節點最多幾個？n 個節點的 heap 有幾片葉子？", "back": ""}, {"id": "rc:ds-heap:3", "kind": "recall", "ch": "ds-heap", "subject": "ds", "front": "d-ary heap 的 insert、extract-min 時間？Dijkstra 用 d-ary heap 時 d 取多少最好？", "back": ""}, {"id": "rc:ds-heap:4", "kind": "recall", "ch": "ds-heap", "subject": "ds", "front": "Binomial tree $B_k$ 的四個性質。", "back": ""}, {"id": "rc:ds-heap:5", "kind": "recall", "ch": "ds-heap", "subject": "ds", "front": "Fibonacci heap 各操作的攤銷時間；為什麼最大度數是 $O(\\lg n)$？", "back": ""}, {"id": "key:ds-bst:1", "kind": "key", "ch": "ds-bst", "subject": "ds", "front": "走訪能否唯一決定樹", "back": "前序＋中序、後序＋中序、層序＋中序：可以（中序能分出左右子樹）。前序＋後序：**不行**，除非是 full binary tree（每個節點 0 或 2 個孩子）。例如只有根和一個孩子時，左孩子和右孩子的前序、後序都一樣。", "tag": "考點"}, {"id": "tf:ds-bst:1", "kind": "tf", "ch": "ds-bst", "subject": "ds", "front": "任何 AVL 樹都可以塗色成合法的紅黑樹", "ans": true, "back": "反之 ✗"}, {"id": "tf:ds-bst:2", "kind": "tf", "ch": "ds-bst", "subject": "ds", "front": "全部都是黑節點的紅黑樹是完美平衡（所有葉子同深度）", "ans": true, "back": ""}, {"id": "tf:ds-bst:3", "kind": "tf", "ch": "ds-bst", "subject": "ds", "front": "紅黑樹中從根到葉的最長路徑不超過最短路徑的兩倍", "ans": true, "back": ""}, {"id": "tf:ds-bst:4", "kind": "tf", "ch": "ds-bst", "subject": "ds", "front": "把 $n$ 個鍵依序插入 AVL 後中序走訪是排序好的", "ans": true, "back": "這是 BST 的性質"}, {"id": "tf:ds-bst:5", "kind": "tf", "ch": "ds-bst", "subject": "ds", "front": "AVL 刪除後最多一次旋轉", "ans": false, "back": ""}, {"id": "rc:ds-bst:1", "kind": "recall", "ch": "ds-bst", "subject": "ds", "front": "二元樹 $n_0$ 與 $n_2$ 的關係；n 個節點的二元樹有幾個空指標？", "back": ""}, {"id": "rc:ds-bst:2", "kind": "recall", "ch": "ds-bst", "subject": "ds", "front": "哪些走訪組合能唯一決定二元樹？", "back": ""}, {"id": "rc:ds-bst:3", "kind": "recall", "ch": "ds-bst", "subject": "ds", "front": "AVL 樹高度的上界從哪個遞迴式來？插入、刪除各最多幾次旋轉？", "back": ""}, {"id": "rc:ds-bst:4", "kind": "recall", "ch": "ds-bst", "subject": "ds", "front": "紅黑樹五條性質；為什麼高度 ≤ 2 lg(n+1)？", "back": ""}, {"id": "rc:ds-bst:5", "kind": "recall", "ch": "ds-bst", "subject": "ds", "front": "Splay tree 的三種旋轉；攤銷界與位能函數。", "back": ""}, {"id": "key:ds-hash:1", "kind": "key", "ch": "ds-hash", "subject": "ds", "front": "刪除", "back": "開放定址不能直接把格子清空，否則之後的搜尋會在這裡提早停下而漏找。要放 **DELETED 標記**（墓碑）：搜尋時跳過、插入時可覆蓋。墓碑多了搜尋變慢，因此需要刪除的場合偏好鏈結法。", "tag": "考點"}, {"id": "key:ds-hash:2", "kind": "key", "ch": "ds-hash", "subject": "ds", "front": "二次探測何時保證找得到空位", "back": "$m$ 為質數且表格至少半空時，$h(k)+i^2$ 的前 $\\lceil m/2\\rceil$ 個探測位置互不相同，所以一定插得進去。超過半滿就可能失敗。", "tag": "考點"}, {"id": "rc:ds-hash:1", "kind": "recall", "ch": "ds-hash", "subject": "ds", "front": "鏈結法成功與失敗搜尋的期望時間。", "back": ""}, {"id": "rc:ds-hash:2", "kind": "recall", "ch": "ds-hash", "subject": "ds", "front": "均勻雜湊假設下開放定址失敗搜尋的期望探測數，推導想法是什麼？", "back": ""}, {"id": "rc:ds-hash:3", "kind": "recall", "ch": "ds-hash", "subject": "ds", "front": "線性探測的成功／失敗搜尋（Knuth 公式）。primary 與 secondary clustering 差在哪？", "back": ""}, {"id": "rc:ds-hash:4", "kind": "recall", "ch": "ds-hash", "subject": "ds", "front": "Universal hashing 的定義與一個構造。", "back": ""}, {"id": "rc:ds-hash:5", "kind": "recall", "ch": "ds-hash", "subject": "ds", "front": "雙重雜湊的 $h_2$ 要滿足什麼？", "back": ""}, {"id": "key:ds-btree:1", "kind": "key", "ch": "ds-btree", "subject": "ds", "front": "插入：先分裂再往下走", "back": "從根往下找插入位置時，**遇到滿節點（$2t-1$ 鍵）就先分裂**：中間鍵上提到父節點，左右各留 $t-1$ 個鍵。因為父節點在上一步保證不滿，所以上提一定放得下，只需單趟往下（one pass）。根滿時分裂會讓樹長高一層，這是 B 樹**唯一長高的方式**（從根往上長）。", "tag": "考點"}, {"id": "tf:ds-btree:1", "kind": "tf", "ch": "ds-btree", "subject": "ds", "front": "B 樹的插入可能讓樹在葉子端長高", "ans": false, "back": "只在根分裂時長高"}, {"id": "tf:ds-btree:2", "kind": "tf", "ch": "ds-btree", "subject": "ds", "front": "2-3-4 樹與紅黑樹是等價的", "ans": true, "back": "一對多對應：3-節點有兩種紅黑表示"}, {"id": "tf:ds-btree:3", "kind": "tf", "ch": "ds-btree", "subject": "ds", "front": "在 B+ 樹中，內部節點的鍵一定也出現在葉子", "ans": false, "back": "插入時分隔鍵是從葉子複製上去的，但刪除葉子中的鍵後，內部節點的分隔鍵可以保留不改，此時它已不在葉子裡"}, {"id": "rc:ds-btree:1", "kind": "recall", "ch": "ds-btree", "subject": "ds", "front": "最小度數 t 的 B 樹，每個節點的鍵數範圍？高度上界？", "back": ""}, {"id": "rc:ds-btree:2", "kind": "recall", "ch": "ds-btree", "subject": "ds", "front": "由上而下插入時，為什麼遇到滿節點要先分裂？", "back": ""}, {"id": "rc:ds-btree:3", "kind": "recall", "ch": "ds-btree", "subject": "ds", "front": "B 樹刪除的三種情況（CLRS）。", "back": ""}, {"id": "rc:ds-btree:4", "kind": "recall", "ch": "ds-btree", "subject": "ds", "front": "B+ 樹與 B 樹的差異；為什麼資料庫用 B+ 樹？", "back": ""}, {"id": "rc:ds-btree:5", "kind": "recall", "ch": "ds-btree", "subject": "ds", "front": "跳躍串列的期望高度與期望空間。", "back": ""}, {"id": "tf:ds-unionfind:1", "kind": "tf", "ch": "ds-unionfind", "subject": "ds", "front": "Union-Find 可以有效支援刪除邊（拆開集合）", "ans": false, "back": ""}, {"id": "tf:ds-unionfind:2", "kind": "tf", "ch": "ds-unionfind", "subject": "ds", "front": "用了兩個啟發式之後每次操作都是 $O(\\alpha(n))$", "ans": false, "back": "是攤銷界，單次 FIND 仍可能 $O(\\lg n)$"}, {"id": "tf:ds-unionfind:3", "kind": "tf", "ch": "ds-unionfind", "subject": "ds", "front": "union by size 也能保證 $O(\\lg n)$ 高度", "ans": true, "back": ""}, {"id": "rc:ds-unionfind:1", "kind": "recall", "ch": "ds-unionfind", "subject": "ds", "front": "鏈結串列表示法加 weighted-union 的總時間是多少？", "back": ""}, {"id": "rc:ds-unionfind:2", "kind": "recall", "ch": "ds-unionfind", "subject": "ds", "front": "Union by rank 單獨使用時，樹高上界與證明想法。", "back": ""}, {"id": "rc:ds-unionfind:3", "kind": "recall", "ch": "ds-unionfind", "subject": "ds", "front": "兩個啟發式一起用的時間界？$\\alpha(n)$ 有多小？", "back": ""}, {"id": "rc:ds-unionfind:4", "kind": "recall", "ch": "ds-unionfind", "subject": "ds", "front": "Union-Find 在哪些演算法中用到？", "back": ""}, {"id": "key:ds-graph:1", "kind": "key", "ch": "ds-graph", "subject": "ds", "front": "在 $O(V)$ 時間判斷 universal sink", "back": "鄰接矩陣中找入度 $V-1$、出度 0 的點：從 $(1,1)$ 出發，$a_{ij}=1$ 就往下（$i$ 不是 sink），否則往右，最多 $2V$ 步得到唯一候選，再檢查一次。", "tag": "考點"}, {"id": "tf:ds-graph:1", "kind": "tf", "ch": "ds-graph", "subject": "ds", "front": "DFS 樹與 BFS 樹一定不同", "ans": false, "back": "例如樹狀圖本身"}, {"id": "tf:ds-graph:2", "kind": "tf", "ch": "ds-graph", "subject": "ds", "front": "有向圖中若 $u.d<v.d$，則 $v$ 是 $u$ 的後代", "ans": false, "back": "可能是交叉邊的另一端"}, {"id": "tf:ds-graph:3", "kind": "tf", "ch": "ds-graph", "subject": "ds", "front": "把 DFS 完成時間遞增排列就是拓撲順序", "ans": false, "back": "要遞減"}, {"id": "tf:ds-graph:4", "kind": "tf", "ch": "ds-graph", "subject": "ds", "front": "在有向圖上用 DFS 找環時，碰到黑色點就是有環", "ans": false, "back": "要碰到**灰色**點"}, {"id": "tf:ds-graph:5", "kind": "tf", "ch": "ds-graph", "subject": "ds", "front": "BFS 可以找有權圖的最短路徑", "ans": false, "back": "除非權重都相同（或 0/1 權重用 0-1 BFS 的雙端佇列）"}, {"id": "rc:ds-graph:1", "kind": "recall", "ch": "ds-graph", "subject": "ds", "front": "鄰接矩陣與鄰接串列各操作的時間與空間。", "back": ""}, {"id": "rc:ds-graph:2", "kind": "recall", "ch": "ds-graph", "subject": "ds", "front": "DFS 的括號定理與白路徑定理。", "back": ""}, {"id": "rc:ds-graph:3", "kind": "recall", "ch": "ds-graph", "subject": "ds", "front": "有向圖 DFS 的四種邊怎麼用 d、f 判斷？無向圖有哪幾種？", "back": ""}, {"id": "rc:ds-graph:4", "kind": "recall", "ch": "ds-graph", "subject": "ds", "front": "Kosaraju 求 SCC 的步驟與正確性關鍵。", "back": ""}, {"id": "rc:ds-graph:5", "kind": "recall", "ch": "ds-graph", "subject": "ds", "front": "Articulation point 與 bridge 的 low 判準。", "back": ""}, {"id": "key:al-recurrence:1", "kind": "key", "ch": "al-recurrence", "subject": "al", "front": "落在縫隙的情況（擴充版）", "back": "$f(n)=\\Theta(n^{\\log_b a}\\lg^k n)$：$k>-1\\Rightarrow\\Theta(n^{\\log_b a}\\lg^{k+1}n)$；$k=-1\\Rightarrow\\Theta(n^{\\log_b a}\\lg\\lg n)$；$k<-1\\Rightarrow\\Theta(n^{\\log_b a})$。\n例：$T(n)=2T(n/2)+n/\\lg n=\\Theta(n\\lg\\lg n)$——原始 Master 不適用（$n/\\lg n$ 不比 $n$ 小一個多項式因子）。", "tag": "考點"}, {"id": "rc:al-recurrence:1", "kind": "recall", "ch": "al-recurrence", "subject": "al", "front": "寫出 $O,\\Omega,\\Theta,o,\\omega$ 的嚴格定義（含量詞）。", "back": ""}, {"id": "rc:al-recurrence:2", "kind": "recall", "ch": "al-recurrence", "subject": "al", "front": "Master theorem 三種情況與 case 3 的 regularity 條件；$T(n)=2T(n/2)+n/\\lg n$ 屬於哪一種？", "back": ""}, {"id": "rc:al-recurrence:3", "kind": "recall", "ch": "al-recurrence", "subject": "al", "front": "$T(n)=2T(\\sqrt n)+\\lg n$ 怎麼解？", "back": ""}, {"id": "rc:al-recurrence:4", "kind": "recall", "ch": "al-recurrence", "subject": "al", "front": "把 $\\lg(n!)$、$(\\lg n)!$、$n^{\\lg\\lg n}$、$2^{\\sqrt{2\\lg n}}$ 由小到大排。", "back": ""}, {"id": "key:al-dc:1", "kind": "key", "ch": "al-dc", "subject": "al", "front": "Karatsuba", "back": "$(a\\cdot 10^{m}+b)(c\\cdot10^m+d)=ac\\cdot10^{2m}+((a+b)(c+d)-ac-bd)\\cdot10^m+bd$，只要三次乘法。", "tag": "考點"}, {"id": "rc:al-dc:1", "kind": "recall", "ch": "al-dc", "subject": "al", "front": "Strassen 用幾次乘法？遞迴式與結果？", "back": ""}, {"id": "rc:al-dc:2", "kind": "recall", "ch": "al-dc", "subject": "al", "front": "最近點對合併步驟為何只需檢查常數個點？", "back": ""}, {"id": "rc:al-dc:3", "kind": "recall", "ch": "al-dc", "subject": "al", "front": "用 merge sort 數逆序對的關鍵一步。", "back": ""}, {"id
