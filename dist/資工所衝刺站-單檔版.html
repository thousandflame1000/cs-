<script>
/* 資工所衝刺站 — 離散數學動畫：鴿籠（Erdős–Szekeres）、排容文氏圖、Catalan 反射原理、Hasse 圖、延伸歐幾里得 */
'use strict';

/* ============ 鴿籠：Erdős–Szekeres ============ */
Labs.reg({
  id: 'pigeon', title: '鴿籠原理：Erdős–Szekeres', subject: 'dm', lessons: ['dm-logic'], desc: 'n²+1 個相異數一定有長度 n+1 的遞增或遞減子序列：看每個數拿到的數對 (i, d) 怎麼被塞進 n² 個鴿籠',
  form: [{ id: 'seq', label: '相異數列（建議 n²+1 個）', value: '5 3 8 1 9 2 7 4 6 10', wide: true }],
  presets: [{ name: 'n=3，10 個數', v: { seq: '5 3 8 1 9 2 7 4 6 10' } }, { name: 'n=2，5 個數', v: { seq: '3 1 4 5 2' } }, { name: '極端：9 個數剛好沒有長度 4', v: { seq: '3 2 1 6 5 4 9 8 7' } }],
  build(v) {
    const a = nums(v.seq); if (new Set(a).size !== a.length) throw new Error('數字要相異');
    const N = a.length, n = Math.max(1, Math.ceil(Math.sqrt(N - 1)));
    const inc = Array(N).fill(null), dec = Array(N).fill(null), F = [];
    const snap = (note, extra = {}) => F.push(Object.assign({ a, n, inc: inc.slice(), dec: dec.slice(), note }, extra));
    snap(`共 ${N} 個數。令 $n=${n}$（$n^2+1=${n * n + 1}$）。對每個 $a_k$ 定義 $i_k$＝以它**開頭**的最長遞增子序列長度、$d_k$＝最長遞減子序列長度。從右往左算。`);
    for (let k = N - 1; k >= 0; k--) {
      let bi = 1, bd = 1;
      for (let j = k + 1; j < N; j++) { if (a[j] > a[k]) bi = Math.max(bi, inc[j] + 1); if (a[j] < a[k]) bd = Math.max(bd, dec[j] + 1); }
      inc[k] = bi; dec[k] = bd;
      snap(`$a_{${k + 1}}=${a[k]}$：後面比它大的數中最大的 $i$ 加 1 → $i=${bi}$；比它小的數中最大的 $d$ 加 1 → $d=${bd}$。`, { cur: k });
    }
    const big = inc.findIndex((x, k) => x > n || dec[k] > n);
    snap(`假設所有 $(i_k,d_k)$ 都 $\\le ${n}$，數對只有 $${n}^2=${n * n}$ 種（下方 ${n}×${n} 的鴿籠）。但有 ${N} 個數${N > n * n ? '，比鴿籠多 → 一定有兩個數擠在同一格' : '，沒有比鴿籠多，不保證'}。`, { grid: true });
    if (N > n * n) snap(`為什麼擠在同一格就矛盾？設 $a_s,a_t$（$s<t$）數對相同。若 $a_s<a_t$，把 $a_s$ 接在以 $a_t$ 開頭的最長遞增子序列前面，得到更長的，$i_s\\ge i_t+1$；若 $a_s>a_t$ 則 $d_s\\ge d_t+1$。兩者都和「數對相同」矛盾，所以假設錯誤：**一定有某個 $i_k$ 或 $d_k$ 大於 ${n}**。`, { grid: true });
    // reconstruct longest
    let k0 = 0; let useInc = true; let best = 0;
    for (let k = 0; k < N; k++) { if (inc[k] > best) { best = inc[k]; k0 = k; useInc = true; } if (dec[k] > best) { best = dec[k]; k0 = k; useInc = false; } }
    const path = [k0]; let cur = k0;
    while (true) { let nx = -1; for (let j = cur + 1; j < N; j++) if ((useInc ? a[j] > a[cur] && inc[j] === inc[cur] - 1 : a[j] < a[cur] && dec[j] === dec[cur] - 1)) { nx = j; break; } if (nx < 0) break; path.push(nx); cur = nx; }
    snap(`所以一定有某個 $i_k$ 或 $d_k$ 超過 ${n}。這裡最長的是**${useInc ? '遞增' : '遞減'}**子序列 ${path.map(k => a[k]).join(' → ')}，長度 ${path.length}${path.length >= n + 1 ? `，達到 $n+1=${n + 1}$ ✓` : `（數字不到 $n^2+1$ 個，定理不保證）`}。`, { path, grid: true });
    return F;
  },
  render(f, st) {
    const N = f.a.length, w = 58, W = N * w + 20;
    const inPath = k => f.path && f.path.includes(k);
    let svg = `<div class="svgwrap"><svg viewBox="0 0 ${W} 110" width="${W}" height="110" class="arr">`;
    f.a.forEach((x, k) => {
      const cls = [k === f.cur ? 'hl' : '', inPath(k) ? 'hl' : '', f.pair && f.pair.includes(k) ? 'probe' : ''].join(' ');
      svg += `<g class="cell ${cls}"><rect x="${10 + k * w}" y="10" width="${w - 8}" height="40" rx="6"/><text x="${10 + k * w + (w - 8) / 2}" y="36" style="font-size:16px">${x}</text>
        <text class="idx" x="${10 + k * w + (w - 8) / 2}" y="70" style="font-size:13px">${f.inc[k] == null ? '' : '(' + f.inc[k] + ',' + f.dec[k] + ')'}</text><text class="idx" x="${10 + k * w + (w - 8) / 2}" y="92">a${k + 1}</text></g>`;
    });
    svg += '</svg></div>';
    let grid = '';
    if (f.grid) {
      const rows = [];
      for (let i = 1; i <= f.n; i++) rows.push([`<b>i=${i}</b>`, ...Array.from({ length: f.n }, (_, d) => f.a.filter((x, k) => f.inc[k] === i && f.dec[k] === d + 1).join(', '))]);
      const over = f.a.filter((x, k) => f.inc[k] > f.n || f.dec[k] > f.n);
      grid = `<p class="muted small">鴿籠（數對 (i,d)，i、d ≤ ${f.n}）：</p>` + htmlTable(rows, { head: ['', ...Array.from({ length: f.n }, (_, d) => 'd=' + (d + 1))], cls: (i, j) => j > 0 && String(rows[i][j]).includes(',') ? 'chg' : '' }) + (over.length ? `<p class="small">超出鴿籠（i 或 d > ${f.n}）：<b>${over.join(', ')}</b></p>` : '');
    }
    st.innerHTML = svg + grid;
  },
});

/* ============ 排容：三集合文氏圖 ============ */
Labs.reg({
  id: 'venn', title: '排容原理：三集合文氏圖', subject: 'dm', lessons: ['dm-counting'], desc: '一項一項加減，看每個區域「被算了幾次」，最後每塊都剛好 1 次',
  form: [{ id: 'A', label: '|A|', type: 'number', value: '20', size: 4 }, { id: 'B', label: '|B|', type: 'number', value: '25', size: 4 }, { id: 'C', label: '|C|', type: 'number', value: '18', size: 4 },
    { id: 'AB', label: '|A∩B|', type: 'number', value: '8', size: 4 }, { id: 'AC', label: '|A∩C|', type: 'number', value: '6', size: 4 }, { id: 'BC', label: '|B∩C|', type: 'number', value: '7', size: 4 }, { id: 'ABC', label: '|A∩B∩C|', type: 'number', value: '3', size: 4 }],
  presets: [{ name: '1～100 被 2、3、5 整除', v: { A: '50', B: '33', C: '20', AB: '16', AC: '10', BC: '6', ABC: '3' } }],
  build(v) {
    const g = k => +v[k];
    const abc = g('ABC'), ab = g('AB') - abc, ac = g('AC') - abc, bc = g('BC') - abc;
    const a = g('A') - ab - ac - abc, b = g('B') - ab - bc - abc, c = g('C') - ac - bc - abc;
    const R = { a, b, c, ab, ac, bc, abc };
    if (Object.values(R).some(x => x < 0 || isNaN(x))) throw new Error('數字不一致：某個區域會是負的');
    const memb = { a: 'A', b: 'B', c: 'C', ab: 'AB', ac: 'AC', bc: 'BC', abc: 'ABC' };
    const cnt = Object.fromEntries(Object.keys(R).map(k => [k, 0]));
    const steps = [['+', 'A'], ['+', 'B'], ['+', 'C'], ['−', 'AB'], ['−', 'AC'], ['−', 'BC'], ['+', 'ABC']];
    const F = []; let total = 0; const terms = [];
    F.push({ R, cnt: Object.assign({}, cnt), on: '', note: `七個區域的實際大小已標在圖上（由交集反推）。目標：$|A\\cup B\\cup C|$。排容的秘密是：**每個區域最後都要剛好被算 1 次**。` });
    for (const [sg, S] of steps) {
      const delta = sg === '+' ? 1 : -1; const val = g(S); total += delta * val; terms.push(`${sg === '+' ? (terms.length ? '+' : '') : '−'}${val}`);
      for (const k of Object.keys(R)) if ([...S].every(ch => memb[k].includes(ch))) cnt[k] += delta;
      const bad = Object.keys(R).filter(k => cnt[k] !== 1);
      F.push({ R, cnt: Object.assign({}, cnt), on: S, note: `${sg === '+' ? '加上' : '減掉'} $|${[...S].join('\\cap ')}|=${val}$。目前算式 ${terms.join(' ')} = ${total}。` + (bad.length ? `還沒剛好算 1 次的區域：${bad.length} 塊。` : '**全部區域都剛好 1 次** ✓') });
    }
    F.push({ R, cnt, on: 'ABC*', note: `$|A\\cup B\\cup C|=${total}$。直接把七塊加起來驗算：${Object.values(R).join('+')} = ${Object.values(R).reduce((x, y) => x + y, 0)}。` });
    return F;
  },
  render(f, st) {
    const pos = { a: [150, 140], b: [330, 140], c: [240, 300], ab: [240, 115], ac: [175, 235], bc: [305, 235], abc: [240, 195] };
    const circ = (cx, cy, nm, col, on) => `<circle cx="${cx}" cy="${cy}" r="120" style="fill:${col};fill-opacity:${on ? 0.28 : 0.08};stroke:${col};stroke-width:${on ? 4 : 2}"/><text x="${cx + (nm === 'A' ? -110 : nm === 'B' ? 110 : 0)}" y="${cy + (nm === 'C' ? 140 : -95)}" style="font-size:20px;font-weight:700;fill:${col}">${nm}</text>`;
    const on = s => f.on && (f.on.includes(s) || f.on === 'ABC*');
    let svg = `<div class="svgwrap"><svg viewBox="0 0 480 460" width="480" height="460">` + circ(180, 170, 'A', 'var(--s-ds)', on('A')) + circ(300, 170, 'B', 'var(--s-al)', on('B')) + circ(240, 275, 'C', 'var(--s-co)', on('C'));
    for (const [k, [x, y]] of Object.entries(pos)) {
      const c = f.cnt[k]; const col = c === 1 ? 'var(--good)' : c === 0 ? 'var(--ink-2)' : 'var(--bad)';
      svg += `<text x="${x}" y="${y}" style="font-size:18px;font-weight:700">${f.R[k]}</text><text x="${x}" y="${y + 20}" style="font-size:12px;fill:${col}">算了 ${c} 次</text>`;
    }
    st.innerHTML = svg + '</svg></div>';
  },
});

/* ============ Catalan：反射原理 ============ */
Labs.reg({
  id: 'catalan', title: 'Catalan 數：反射原理', subject: 'dm', lessons: ['dm-counting'], desc: '壞路徑第一次碰到 y=x+1 後，把剩下的步伐上下對調，一一對應到終點 (n−1, n+1) 的路徑',
  form: [{ id: 'path', label: '路徑（R＝右、U＝上）', value: 'RUURURRU', wide: true }],
  presets: [{ name: '壞路徑 n=4', v: { path: 'RUURURRU' } }, { name: '好路徑 n=4', v: { path: 'RRUURRUU' } }, { name: '一開始就壞', v: { path: 'URRURUUR' } }, { name: 'n=5 壞路徑', v: { path: 'RRUUURRURU' } }],
  build(v) {
    const p = v.path.toUpperCase().replace(/[^RU]/g, '');
    const n = p.length / 2; if (!Number.isInteger(n) || [...p].filter(c => c === 'R').length !== n) throw new Error('R 與 U 的個數要相同');
    const C = (m, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (m - k + i) / i; return Math.round(r); };
    const pts = [[0, 0]]; for (const c of p) { const [x, y] = pts[pts.length - 1]; pts.push(c === 'R' ? [x + 1, y] : [x, y + 1]); }
    const touch = pts.findIndex(([x, y]) => y === x + 1);
    const F = [];
    F.push({ n, pts, k: 0, touch, refl: null, note: `從 $(0,0)$ 走到 $(${n},${n})$，每步向右或向上。**好路徑**：永遠不跑到對角線 $y=x$ 的上方。總路徑數 $\\binom{${2 * n}}{${n}}=${C(2 * n, n)}$。` });
    for (let k = 1; k <= pts.length - 1; k++) {
      const hit = k === touch;
      F.push({ n, pts, k, touch: hit || k > touch ? touch : -1, refl: null, note: hit ? `第 ${k} 步碰到虛線 $y=x+1$：這是**壞路徑**，記下第一次碰到的點 (${pts[k].join(',')})。` : `第 ${k} 步：${p[k - 1] === 'R' ? '向右' : '向上'}到 (${pts[k].join(',')})。` });
    }
    if (touch < 0) { F.push({ n, pts, k: pts.length - 1, touch, refl: null, note: `整條路徑沒有碰到 $y=x+1$，是好路徑。好路徑共有 $C_${n}=\\frac{1}{${n + 1}}\\binom{${2 * n}}{${n}}=${C(2 * n, n) / (n + 1)}$ 條。換一條壞路徑看看反射。` }); return F; }
    const refl = pts.slice(0, touch + 1);
    for (let k = touch; k < p.length; k++) { const [x, y] = refl[refl.length - 1]; refl.push(p[k] === 'R' ? [x, y + 1] : [x + 1, y]); F.push({ n, pts, k: pts.length - 1, touch, refl: refl.slice(), note: `反射：第 ${k + 1} 步原本${p[k] === 'R' ? '向右' : '向上'}，對調成${p[k] === 'R' ? '向上' : '向右'}。` }); }
    F.push({ n, pts, k: pts.length - 1, touch, refl, note: `反射後的路徑終點是 $(${n - 1},${n + 1})$。每條壞路徑都對應到唯一一條終點為 $(${n - 1},${n + 1})$ 的路徑，反之亦然（再反射一次就回來），所以壞路徑有 $\\binom{${2 * n}}{${n + 1}}=${C(2 * n, n + 1)}$ 條。好路徑 $=${C(2 * n, n)}-${C(2 * n, n + 1)}=${C(2 * n, n) - C(2 * n, n + 1)}=C_${n}$。` });
    return F;
  },
  render(f, st) {
    const n = f.n, s = Math.min(66, 400 / (n + 1)), O = 30, H = (n + 1) * s + O + 44;
    const X = x => O + x * s, Y = y => H - O - y * s;
    let g = '';
    for (let i = 0; i <= n + 1; i++) { g += `<line x1="${X(0)}" y1="${Y(i)}" x2="${X(n)}" y2="${Y(i)}" class="axis" style="stroke-width:1"/>`; if (i <= n) g += `<line x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(n + 1)}" class="axis" style="stroke-width:1"/>`; }
    g += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(n)}" y2="${Y(n)}" style="stroke:var(--good);stroke-width:2"/><line x1="${X(0)}" y1="${Y(1)}" x2="${X(n)}" y2="${Y(n + 1)}" style="stroke:var(--pen);stroke-width:2;stroke-dasharray:6 5"/>`;
    const poly = (pts, col, w) => `<polyline points="${pts.map(([x, y]) => X(x) + ',' + Y(y)).join(' ')}" style="fill:none;stroke:${col};stroke-width:${w};stroke-linejoin:round"/>`;
    g += poly(f.pts.slice(0, f.k + 1), 'var(--accent)', 4);
    if (f.refl) g += poly(f.refl, 'var(--hl-strong)', 4) + `<circle cx="${X(n - 1)}" cy="${Y(n + 1)}" r="7" style="fill:var(--hl-strong)"/><text x="${X(n - 1)}" y="${Y(n + 1) - 12}">(${n - 1},${n + 1})</text>`;
    if (f.touch >= 0) { const [x, y] = f.pts[f.touch]; g += `<circle cx="${X(x)}" cy="${Y(y)}" r="8" style="fill:var(--pen)"/>`; }
    g += `<text x="${X(n)}" y="${Y(n) + 22}">(${n},${n})</text><text x="${X(0)}" y="${Y(0) + 20}">(0,0)</text>`;
    st.innerHTML = `<div class="svgwrap"><svg viewBox="0 0 ${X(n) + 70} ${H}" width="${X(n) + 70}" height="${H}">${g}</svg></div><p class="legend small"><span class="lg tree">原路徑</span><span class="lg cand">反射後</span><span class="lg back">y = x + 1</span></p>`;
  },
});

/* ============ Hasse 圖：整除偏序 ============ */
Labs.reg({
  id: 'hasse', title: 'Hasse 圖：整除偏序', subject: 'dm', lessons: ['dm-relations'], desc: '從「所有可比較的邊」刪到 Hasse 圖，再看最長鏈、最大反鏈、gcd 與 lcm',
  form: [{ id: 'n', label: 'n 的所有正因數', type: 'number', value: '60', size: 6 }, { id: 'x', label: '元素 x', type: 'number', value: '12', size: 5 }, { id: 'y', label: '元素 y', type: 'number', value: '20', size: 5 }],
  presets: [{ name: '24', v: { n: '24', x: '6', y: '8' } }, { name: '30（布林代數）', v: { n: '30', x: '6', y: '10' } }, { name: '72', v: { n: '72', x: '12', y: '18' } }],
  build(v) {
    const n = +v.n; if (!(n >= 2 && n <= 720)) throw new Error('n 請在 2～720');
    const D = []; for (let d = 1; d <= n; d++) if (n % d === 0) D.push(d);
    const omega = m => { let c = 0; for (let p = 2; p * p <= m; p++) while (m % p === 0) { m /= p; c++; } return c + (m > 1 ? 1 : 0); };
    const lv = Object.fromEntries(D.map(d => [d, omega(d)]));
    const all = [], cover = [];
    for (const a of D) for (const b of D) if (a < b && b % a === 0) { all.push([a, b]); if (!D.some(c => c !== a && c !== b && c % a === 0 && b % c === 0)) cover.push([a, b]); }
    const H = Math.max(...Object.values(lv));
    const chain = [1]; while (chain[chain.length - 1] !== n) { const c = chain[chain.length - 1]; chain.push(cover.find(([a]) => a === c)[1]); }
    const levels = Array.from({ length: H + 1 }, (_, i) => D.filter(d => lv[d] === i)); const wide = levels.reduce((x, y) => y.length > x.length ? y : x);
    const x = +v.x, y = +v.y; if (!D.includes(x) || !D.includes(y)) throw new Error('x、y 必須是 n 的因數');
    const gcd = (p, q) => q ? gcd(q, p % q) : p; const g = gcd(x, y), l = x / g * y;
    const sq = (() => { let m = n; for (let p = 2; p * p <= m; p++) { if (m % (p * p) === 0) return false; while (m % p === 0) m /= p; } return true; })();
    const base = { D, lv, H };
    return [
      Object.assign({}, base, { edges: all, note: `${D.length} 個正因數，「$a\\mid b$」是偏序（自反、反對稱、遞移）。先畫出所有可比較的對：共 ${all.length} 條邊，很亂。` }),
      Object.assign({}, base, { edges: cover, note: `Hasse 圖只保留**覆蓋關係**（$a\\mid b$ 且中間沒有其他元素），其餘由遞移性推得。剩 ${cover.length} 條邊；層數＝質因數個數（含重數）。` }),
      Object.assign({}, base, { edges: cover, hl: chain, note: `最長鏈 ${chain.join(' | ')}，長度 ${chain.length}。依 Mirsky 定理，至少要 ${chain.length} 個反鏈才能蓋住整個集合。` }),
      Object.assign({}, base, { edges: cover, hl2: wide, note: `最大反鏈（兩兩不可比較）：{${wide.join(', ')}}，大小 ${wide.length}。依 **Dilworth 定理**，最少需要 ${wide.length} 條鏈才能覆蓋全部元素。` }),
      Object.assign({}, base, { edges: cover, hl: [x, y], hl2: [g, l], note: `$${x}\\wedge ${y}=\\gcd=${g}$（最大下界）、$${x}\\vee ${y}=\\operatorname{lcm}=${l}$（最小上界）。任兩元素都有 meet 與 join，所以是**格**。${sq ? `$n=${n}$ 沒有平方因數，這個格是布林代數（同構於 ${omega(n)} 個質因數的冪集合）。` : `$n=${n}$ 有平方因數，不是布林代數（有元素沒有補元）。`}` }),
    ];
  },
  render(f, st) {
    const W = 560, levels = Array.from({ length: f.H + 1 }, (_, i) => f.D.filter(d => f.lv[d] === i));
    const Hh = (f.H + 1) * 80 + 30; const P = {};
    levels.forEach((ds, i) => ds.forEach((d, j) => { P[d] = [W / 2 + (j - (ds.length - 1) / 2) * Math.min(90, (W - 60) / ds.length), Hh - 40 - i * 80]; }));
    const on = (arr, d) => arr && arr.includes(d);
    let g = f.edges.map(([a, b]) => { const hlE = f.hl && on(f.hl, a) && on(f.hl, b) && f.hl.indexOf(b) === f.hl.indexOf(a) + 1; return `<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" style="stroke:${hlE ? 'var(--accent)' : 'var(--ink-2)'};stroke-width:${hlE ? 4 : 1.4};opacity:${f.edges.length > 40 ? 0.45 : 0.9}"/>`; }).join('');
    for (const d of f.D) g += `<g class="gnode ${on(f.hl, d) ? 'cur' : ''}"><circle cx="${P[d][0]}" cy="${P[d][1]}" r="19" style="${on(f.hl2, d) ? 'fill:var(--hl)' : ''}"/><text x="${P[d][0]}" y="${P[d][1] + 5}">${d}</text></g>`;
    st.innerHTML = `<div class="svgwrap"><svg class="graph" viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}">${g}</svg></div>`;
  },
});

/* ============ 延伸歐幾里得 ============ */
Labs.reg({
  id: 'euclid', title: '延伸歐幾里得與模反元素', subject: 'dm', lessons: ['dm-nt-algebra'], desc: '一列一列算 q、r、s、t，最後得到 gcd = sa + tb 與反元素',
  form: [{ id: 'a', label: 'a', type: 'number', value: '252', size: 7 }, { id: 'b', label: 'b', type: 'number', value: '198', size: 7 }],
  presets: [{ name: '252, 198', v: { a: '252', b: '198' } }, { name: '求 17 在模 3120 的反元素（RSA）', v: { a: '3120', b: '17' } }, { name: 'Fibonacci（最壞情況）', v: { a: '89', b: '55' } }],
  build(v) {
    const a0 = Math.abs(Math.trunc(+v.a)), b0 = Math.abs(Math.trunc(+v.b)); if (!a0 || !b0) throw new Error('請輸入正整數');
    const rows = [[a0, '', 1, 0], [b0, '', 0, 1]]; const F = [];
    const head = ['i', 'r', 'q', 's', 't', 's·a + t·b'];
    const view = (hl) => ({ head, rows: rows.map((r, i) => [i, r[0], r[1], r[2], r[3], `${r[2]}·${a0} + ${r[3]}·${b0} = ${r[2] * a0 + r[3] * b0}`]), hl });
    F.push(Object.assign(view([0, 1]), { note: `初始：$r_0=${a0}=1\\cdot a+0\\cdot b$，$r_1=${b0}=0\\cdot a+1\\cdot b$。不變量：每一列都滿足 $r_i=s_ia+t_ib$。` }));
    while (rows[rows.length - 1][0] !== 0) {
      const [r1, , s1, t1] = rows[rows.length - 2], [r2, , s2, t2] = rows[rows.length - 1];
      const q = Math.floor(r1 / r2); rows[rows.length - 1][1] = q;
      rows.push([r1 - q * r2, '', s1 - q * s2, t1 - q * t2]);
      F.push(Object.assign(view([rows.length - 1]), { note: `$q=\\lfloor ${r1}/${r2}\\rfloor=${q}$；新的一列＝上上列 − ${q}×上一列：$r=${r1 - q * r2}$，$s=${s1 - q * s2}$，$t=${t1 - q * t2}$。` }));
    }
    const k = rows.length - 2; const [g, , s, t] = rows[k];
    let tail = `$\\gcd(${a0},${b0})=${g}=(${s})\\cdot${a0}+(${t})\\cdot${b0}$（Bézout），共 ${rows.length - 2} 次除法。`;
    if (g === 1) tail += ` 因為 gcd = 1：$${b0}^{-1}\\equiv ${((t % a0) + a0) % a0}\\pmod{${a0}}$，$${a0}^{-1}\\equiv ${((s % b0) + b0) % b0}\\pmod{${b0}}$。`;
    else tail += ` gcd ≠ 1，所以兩者在彼此的模下都沒有乘法反元素。`;
    F.push(Object.assign(view([k]), { note: tail }));
    return F;
  },
  render(f, st) { st.innerHTML = htmlTable(f.rows, { head: f.head, cls: i => f.hl.includes(i) ? 'chg' : '' }); },
});

<script>
/* 資工所衝刺站 — 無限隨機題：題目隨機產生，答案由模擬器／公式精確計算 */
'use strict';

const GU = {
  fact: n => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; },
  C: (n, k) => { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); },
  gcd: (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; },
  frac: (n, d) => { if (d < 0) { n = -n; d = -d; } const g = GU.gcd(n, d) || 1; n /= g; d /= g; return d === 1 ? String(n) : `${n}/${d}`; },
  modpow: (a, e, m) => { let r = 1n, b = BigInt(a) % BigInt(m); let E = BigInt(e); const M = BigInt(m); while (E > 0n) { if (E & 1n) r = r * b % M; b = b * b % M; E >>= 1n; } return Number(r); },
  det: M => { const n = M.length; if (n === 1) return M[0][0]; if (n === 2) return M[0][0] * M[1][1] - M[0][1] * M[1][0]; let s = 0; for (let j = 0; j < n; j++) s += (j % 2 ? -1 : 1) * M[0][j] * GU.det(M.slice(1).map(r => r.filter((_, k) => k !== j))); return s; },
  tex: M => `\\begin{bmatrix}${M.map(r => r.join(' & ')).join(' \\\\ ')}\\end{bmatrix}`,
  round: (x, k = 4) => String(+x.toFixed(k)),
};

const Gen = {
  list: [],
  reg(d) { this.list.push(d); },
  get(id) { return this.list.find(x => x.id === id); },
  make(id, seed) {
    const g = this.get(id); if (!g) return null;
    const r = rng(seed * 2654435761 + id.length * 97);
    const q = g.make(r);
    return Object.assign({ id: `gen:${id}:${seed}`, ch: g.ch, subject: g.subject, diff: g.diff || 2, src: 'gen', opts: [], chTitle: g.title }, q, { ans: [].concat(q.ans).map(x => typeof x === 'number' && q.type !== 'fill' ? x : String(x)) });
  },
};

/* ======================= 作業系統 ======================= */
Gen.reg({ id: 'sched', subject: 'os', ch: 'os-sched', title: 'CPU 排程平均等待時間', desc: 'FCFS／SJF／SRTF／RR／優先權', diff: 2,
  make(r) {
    const n = r.int(4, 5); const algs = [['fcfs', 'FCFS'], ['sjf', '非搶先 SJF'], ['srtf', 'SRTF'], ['rr', 'RR'], ['prio', '非搶先優先權'], ['pprio', '可搶先優先權']];
    const [alg, name] = r.pick(algs); const q = r.int(2, 4);
    let t = 0; const P = Array.from({ length: n }, (_, i) => { if (i) t += r.int(0, 3); return { n: 'P' + (i + 1), at: t, bt: r.int(1, 9), pr: r.int(1, 5) }; });
    const res = Sim.cpu(P, alg, q);

    return {
      type: 'fill', fmt: '平均等待時間（可填分數或小數）',
      stem: `以 **${name}${alg === 'rr' ? `（q = ${q}）` : ''}** 排程下列行程，求**平均等待時間**。\n\n| 行程 | 到達 | Burst | 優先權（小者優先） |\n|---|---|---|---|\n${P.map(p => `| ${p.n} | ${p.at} | ${p.bt} | ${p.pr} |`).join('\n')}\n\n慣例：平手時先到者優先、再比編號；可搶先演算法遇到相同條件不搶先；RR 中同一時刻新到達的行程排在被換下的行程前面。`,
      ans: [GU.round(avg), GU.frac(Math.round(avg * n), n)],
      expl: `甘特圖：${res.segs.map(s => `${s.p === 'idle' ? '閒置' : s.p}[${s.s},${s.e})`).join(' → ')}\n\n| 行程 | 完成 | 周轉 = 完成 − 到達 | 等待 = 周轉 − burst |\n|---|---|---|---|\n${res.stats.map(s => `| ${s.n} | ${s.ct} | ${s.tat} | ${s.wt} |`).join('\n')}\n\n平均等待 = ${res.stats.map(s => s.wt).join(' + ')} / ${n} = **${GU.frac(Math.round(avg * n), n)}**`,
    };
  } });

Gen.reg({ id: 'page', subject: 'os', ch: 'os-vm', title: '頁替換缺頁數', desc: 'FIFO／LRU／OPT', diff: 2,

Gen.reg({ id: 'disk', subject: 'os', ch: 'os-storage', title: '磁碟排程總移動量', desc: 'SSTF／SCAN／C-SCAN／LOOK／C-LOOK', diff: 2,

      ans: [res.total], expl: `路徑：${res.path.join(' → ')}\n\n總移動 = ${res.path.slice(1).map((p, k) => Math.abs(p - res.path[k])).join(' + ')} = **${res.total}**${res.jump ? `（其中回程跳躍 ${res.jump}；若題目說不計回程則為 ${res.totalNoJump}）` : ''}` };

Gen.reg({ id: 'eat', subject: 'os', ch: 'os-memory', title: 'TLB／缺頁有效存取時間', desc: 'EAT 計算與缺頁率上限', diff: 2,
  make(r) {
    if (r() < 0.6) {
      const m = r.pick([50, 80, 100, 120, 200]), t = r.pick([5, 10, 20]), h = r.pick([0.8, 0.9, 0.95, 0.98, 0.99]), L = r.pick([1, 2, 3]);
      const eat = h * (t + m) + (1 - h) * (t + (L + 1) * m);
      return { type: 'fill', fmt: 'ns', stem: `記憶體存取 ${m} ns，TLB 查詢 ${t} ns（先查 TLB，失誤後才走頁表），頁表為 **${L} 層**，TLB 命中率 ${h * 100}%。不考慮缺頁與 cache，有效存取時間 EAT 是多少 ns？`, ans: [GU.round(eat)],
        expl: `命中：TLB + 1 次記憶體 = ${t + m}；失誤：TLB + ${L} 次查頁表 + 1 次取資料 = ${t + (L + 1) * m}。\n\nEAT = ${h}×${t + m} + ${GU.round(1 - h)}×${t + (L + 1) * m} = **${GU.round(eat)} ns**` };
    }
    const ma = r.pick([100, 200, 250]), F = r.pick([5, 8, 10]) * 1e6, slow = r.pick([10, 20, 40]);
    const p = (slow / 100 * ma) / (F - ma);
    return { type: 'fill', fmt: '可用科學記號，如 2.5e-6', stem: `記憶體存取 ${ma} ns，處理一次缺頁平均 ${F / 1e6} ms。若要讓有效存取時間的變慢幅度不超過 ${slow}%，缺頁率 p 最大是多少？`, ans: [String(p)],
      expl: `(1−p)·${ma} + p·${F} ≤ ${ma}×${1 + slow / 100} ⇒ p·(${F} − ${ma}) ≤ ${slow / 100 * ma} ⇒ p ≤ **${p.toExponential(3)}**。缺頁率要低到約每 ${Math.round(1 / p).toLocaleString()} 次存取才 1 次，這就是為什麼 thrashing 一出現效能就崩潰。` };
  } });

Gen.reg({ id: 'ptsize', subject: 'os', ch: 'os-memory', title: '頁表大小與分層數', desc: '虛擬位址、頁大小、PTE 大小', diff: 3,
  make(r) {
    const va = r.pick([32, 36, 39, 48]), pg = r.pick([12, 13, 14]), pte = r.pick([2, 3]); // log2
    const vpn = va - pg;
    if (r() < 0.5) return { type: 'fill', fmt: '填 k（大小為 2^k bytes）', stem: `虛擬位址 ${va} bits，頁大小 ${2 ** (pg - 10)} KB，每個 PTE ${2 ** pte} bytes。單層頁表大小為 $2^k$ bytes，求 k。`, ans: [vpn + pte], expl: `offset = ${pg} bits，VPN = ${va} − ${pg} = ${vpn} bits，所以有 $2^{${vpn}}$ 個 PTE，大小 $2^{${vpn}} \\times 2^{${pte}} = 2^{${vpn + pte}}$ bytes。` };
    const per = pg - pte; const lv = Math.ceil(vpn / per);
    return { type: 'fill', stem: `虛擬位址 ${va} bits，頁大小 ${2 ** (pg - 10)} KB，PTE ${2 ** pte} bytes。若每一層頁表都必須剛好放進一個頁框，至少需要幾層頁表？`, ans: [lv],
      expl: `一頁可放 $2^{${pg}}/2^{${pte}} = 2^{${per}}$ 個 PTE，所以每層吃 ${per} 個 VPN bits。VPN = ${vpn} bits，層數 = ⌈${vpn}/${per}⌉ = **${lv}**。` };
  } });

Gen.reg({ id: 'fork', subject: 'os', ch: 'os-process', title: 'fork() 輸出次數', desc: '算行程數與印出次數', diff: 2,
  make(r) {
    if (r() < 0.4) {

      const code = inLoop ? `for (int i = 0; i < ${n}; i++) {\n    fork();\n    printf("X");\n}` : `for (int i = 0; i < ${n}; i++)\n    fork();\nprintf("X");`;
      const ans = inLoop ? 2 ** (n + 1) - 2 : 2 ** n;
      return { type: 'fill', stem: '下列程式（假設 printf 立即輸出、無緩衝問題）共印出幾個 X？\n\n```c\n' + code + '\n```', ans: [ans],
        expl: inLoop ? `第 i 輪（i=1..${n}）fork 後有 $2^i$ 個行程，各印一次：$\\sum_{i=1}^{${n}} 2^i = 2^{${n + 1}}-2 = ${ans}$。` : `迴圈結束時有 $2^{${n}}$ 個行程，各印一次 = ${ans}。` };

Gen.reg({ id: 'banker', subject: 'os', ch: 'os-deadlock', title: '銀行家演算法安全序列', desc: '判斷安全並給序列', diff: 2,

Gen.reg({ id: 'cachebits', subject: 'co', ch: 'co-cache', title: 'Cache 位址切割', desc: 'tag／index／offset 位元數與總位元', diff: 2,
  make(r) {
    const C = 2 ** r.int(12, 17), B = r.pick([16, 32, 64]), A = r.pick([1, 2, 4, 8, 'full']), m = r.pick([32, 32, 40]);
    const blocks = C / B, ways = A === 'full' ? blocks : A, sets = blocks / ways;
    const ob = Math.log2(B), ib = Math.log2(sets), tb = m - ob - ib;
    if (r() < 0.6) return { type: 'fill', fmt: 'tag,index,offset', stem: `${m}-bit byte 位址，cache 容量 ${C / 1024} KB，區塊 ${B} bytes，${A === 'full' ? '全關聯' : A === 1 ? '直接映射' : A + '-way 集合關聯'}。tag、index、offset 各幾 bits？`, ans: [`${tb},${ib},${ob}`],
      expl: `區塊數 = ${C}/${B} = ${blocks}；set 數 = ${blocks}/${ways} = ${sets}。offset = lg ${B} = ${ob}，index = lg ${sets} = ${ib}，tag = ${m} − ${ib} − ${ob} = **${tb}**。` };
    const bits = blocks * (8 * B + tb + 1);
    return { type: 'fill', fmt: '總位元數（整數）', stem: `${m}-bit byte 位址，${C / 1024} KB 資料容量，區塊 ${B} bytes，${A === 'full' ? '全關聯' : A === 1 ? '直接映射' : A + '-way'}。每個區塊有 1 個 valid bit（不計 dirty、LRU 位元）。cache 實際需要多少 bits（資料＋tag＋valid）？`, ans: [bits],
      expl: `tag = ${tb} bits。每塊 = ${8 * B}（資料）+ ${tb}（tag）+ 1（valid）= ${8 * B + tb + 1} bits，共 ${blocks} 塊 → **${bits}** bits（約資料量的 ${(bits / (8 * C)).toFixed(3)} 倍）。` };
  } });

Gen.reg({ id: 'cachesim', subject: 'co', ch: 'co-cache', title: 'Cache 命中次數', desc: '直接映射 vs 集合關聯，手算 hit／miss', diff: 2,

      expl: res.steps.map(s => `${s.a}（塊 ${s.blk}→set ${s.idx}）${s.hit ? 'H' : 'M'}`).join('，') + `\n\n命中 **${res.hits}** 次。` };

Gen.reg({ id: 'amdahl', subject: 'co', ch: 'co-perf', title: 'Amdahl 定律', desc: '整體加速與所需加速倍數', diff: 2,
  make(r) {
    const f = r.pick([0.4, 0.5, 0.6, 0.75, 0.8, 0.9, 0.95]), s = r.pick([2, 4, 5, 8, 10, 20]);
    const S = 1 / ((1 - f) + f / s);
    if (r() < 0.6) return { type: 'fill', stem: `程式有 ${f * 100}% 的執行時間可以被加速 ${s} 倍，整體加速比是多少？（取到小數點後三位）`, ans: [GU.round(S, 3)], expl: `$S = \\frac{1}{(1-f) + f/s} = \\frac{1}{${GU.round(1 - f)} + ${f}/${s}} = ${GU.round(S, 4)}$。上限 $\\frac{1}{1-f} = ${GU.round(1 / (1 - f), 3)}$。` };
    const Smax = 1 / (1 - f); const target = +(1 + (Smax - 1) * r.pick([0.3, 0.5, 0.6])).toFixed(2);
    const need = f / (1 / target - (1 - f));
    return { type: 'fill', stem: `可加速部分占執行時間 ${f * 100}%。要讓整體加速比達到 ${target}，這部分至少要加速幾倍？（小數三位）`, ans: [GU.round(need, 3)], expl: `$\\frac{1}{${target}} = ${GU.round(1 - f)} + \\frac{${f}}{s}$ ⇒ $s = \\frac{${f}}{1/${target} - ${GU.round(1 - f)}} = ${GU.round(need, 4)}$。目標不能超過 $1/(1-f) = ${GU.round(Smax, 3)}$。` };
  } });

Gen.reg({ id: 'cpi', subject: 'co', ch: 'co-perf', title: 'CPI 與執行時間', desc: '指令組成 → 平均 CPI → CPU time', diff: 1,
  make(r) {
    const cls = [['ALU', r.int(1, 2)], ['Load/Store', r.int(2, 5)], ['Branch', r.int(2, 4)]]; let a = r.pick([40, 45, 50, 55]), b = r.pick([20, 25, 30]); const c = 100 - a - b;

<script>
/* 資工所衝刺站 — 學習引擎：FSRS 記憶排程、章節掌握度（Elo）、自適應選題、保留率預測、必背卡佇列 */
'use strict';

/* ---------- FSRS-4.5：每張卡記住「穩定度 S」與「難度 D」，在記得機率掉到目標保留率時排下一次 ---------- */
const FSRS = {
  w: [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755],
  F: 19 / 81, DEC: -0.5,
  R(t, s) { return Math.pow(1 + this.F * Math.max(0, t) / Math.max(s, .01), this.DEC); },
  ivl(s, r) { return s / this.F * (Math.pow(r, 1 / this.DEC) - 1); },
  d0(g) { return Math.min(10, Math.max(1, this.w[4] - (g - 3) * this.w[5])); },
  /* 回傳複習後的新狀態（不改原物件） */
  next(c, g, day) {
    const w = this.w, n = Object.assign({}, c || {});
    if (!c || !c.reps) { n.s = w[g - 1]; n.d = this.d0(g); n.reps = 1; n.lapses = g === 1 ? 1 : 0; }
    else {
      const t = Math.max(0, D.diff(c.last, day)), r = this.R(t, c.s);
      if (g === 1) { n.s = Math.min(c.s, w[11] * Math.pow(c.d, -w[12]) * (Math.pow(c.s + 1, w[13]) - 1) * Math.exp(w[14] * (1 - r))); n.lapses = (c.lapses || 0) + 1; }
      else n.s = c.s * (1 + Math.exp(w[8]) * (11 - c.d) * Math.pow(c.s, -w[9]) * (Math.exp(w[10] * (1 - r)) - 1) * (g === 2 ? w[15] : 1) * (g === 4 ? w[16] : 1));
      const dd = c.d - w[6] * (g - 3); n.d = Math.min(10, Math.max(1, w[7] * this.d0(3) + (1 - w[7]) * dd));
      n.reps = (c.reps || 0) + 1;
    }
    n.s = Math.max(.1, n.s); n.last = day; n.g = g;
    return n;
  },
};

const Learn = {
  GRADES: ['', '忘了', '困難', '記得', '輕鬆'],
  ret() { return +(S.st.settings.retention || .9); },
  maxIvl() { const left = S.daysLeft(); return left > 2 ? left - 1 : 365; },
  daysFor(s) { return Math.max(1, Math.min(this.maxIvl(), Math.round(FSRS.ivl(s, this.ret())))); },
  keyOf(qid) { return qid.startsWith('gen:') ? 'g:' + qid.split(':')[1] : qid; },
  gradeOf(ok, conf) { if (!ok) return 1; if (conf === 1) return 2; if (conf === 3) return 4; return 3; },
  card(key) { return (S.st.srs || {})[key]; },
  review(key, g, day = D.today()) {
    const srs = S.st.srs || (S.st.srs = {});
    const n = FSRS.next(srs[key], g, day);
    n.due = D.add(day, g === 1 ? 1 : this.daysFor(n.s));
    n.hist = ((srs[key] && srs[key].hist) || []).concat([[day, g]]).slice(-12);
    srs[key] = n; return n;
  },
  /* 四個按鈕各自會排到幾天後（給必背卡的按鈕顯示用） */
  preview(key) { const c = this.card(key), day = D.today(); return [1, 2, 3, 4].map(g => g === 1 ? 1 : this.daysFor(FSRS.next(c, g, day).s)); },
  Rnow(c, day = D.today()) { return c && c.last ? FSRS.R(D.diff(c.last, day), c.s) : null; },
  isDue(c, day = D.today()) { return c && c.due && c.due <= day; },

  /* ---------- 章節掌握度：Elo／Rasch 模型，P(答對) = σ(θ_章 − b_題) ---------- */
  bOf(q) { return ((q && q.diff) || 2) - 2; },
  sig(x) { return 1 / (1 + Math.exp(-x)); },
  elo(qid, ok, q) {
    q = q || (qid.startsWith('gen:') ? Practice.genQ(qid) : QBANK.get(qid)); if (!q || !q.ch) return;
    const E = S.st.elo || (S.st.elo = {}); const e = E[q.ch] || (E[q.ch] = { t: 0, n: 0 });
    const p = this.sig(e.t - this.bOf(q)), K = Math.max(.15, .7 / (1 + e.n * .05));
    e.t = Math.max(-4, Math.min(4, e.t + K * ((ok ? 1 : 0) - p))); e.n++;
  },
  mastery(ch) { const e = (S.st.elo || {})[ch]; return e && e.n ? this.sig(e.t) : null; },
  pOf(q) { const e = (S.st.elo || {})[q.ch]; return this.sig((e ? e.t : 0) - this.bOf(q)); },

  /* ---------- 舊紀錄遷移：把 Leitner 時代的作答歷史重播進 FSRS 與 Elo ---------- */
  migrate() {
    if (S.st.srs && S.st.elo) return;
    S.st.srs = S.st.srs || {}; S.st.elo = S.st.elo || {};
    const ev = [];
    for (const [qid, a] of Object.entries(S.st.answers || {})) for (const h of (a.hist || [])) ev.push([h.d, qid, h.ok, h.conf]);
    ev.sort((x, y) => x[0].localeCompare(y[0]));
    for (const [d, qid, ok, conf] of ev) { const c = this.review(this.keyOf(qid), this.gradeOf(ok, conf), d); if (!qid.startsWith('gen:') && S.st.answers[qid]) S.st.answers[qid].due = c.due; try { this.elo(qid, ok); } catch (e) { } }
  },

  /* ---------- 到期清單 ---------- */
  dueQuestions(day = D.today()) { return Object.entries(S.st.srs || {}).filter(([k, c]) => this.isDue(c, day) && QBANK.get(k)).map(([k]) => k); },
  dueGens(day = D.today()) { return Object.entries(S.st.srs || {}).filter(([k, c]) => k.startsWith('g:') && this.isDue(c, day) && Gen.get(k.slice(2))).map(([k]) => k.slice(2)); },
  freshGen(gid) { return `gen:${gid}:${Math.floor(Math.random() * 1e9)}`; },

  /* ---------- 必背卡 ---------- */
  cards() { return DATA.cards || []; },
  cardDue(day = D.today(), filt = () => true) { return this.cards().filter(c => filt(c) && this.isDue(this.card(c.id), day)); },
  newCards(filt = () => true, limit) {
    const day = S.planDay(), seen = S.st.srs || {};
    const planOrder = {}; (DATA.plan || []).forEach(p => (p.lessons || []).forEach(l => { if (!(l in planOrder)) planOrder[l] = p.day; }));
    const unlocked = ch => (S.st.lessons[ch] || {}).read || (planOrder[ch] || 99) <= day;
    let pool = this.cards().filter(c => filt(c) && !seen[c.id] && unlocked(c.ch));
    const kindOrder = { tf: 0, key: 1, recall: 2 };
    pool.sort((a, b) => (planOrder[a.ch] || 99) - (planOrder[b.ch] || 99) || kindOrder[a.kind] - kindOrder[b.kind]);
    return limit == null ? pool : pool.slice(0, Math.max(0, limit));
  },
  newLeft() { return Math.max(0, (S.st.settings.newCards || 20) - (S.day().newCards || 0)); },

  /* ---------- 保留率預測：每張已學卡用 FSRS 算「今天」與「考試那天（若從此不複習）」記得的機率 ---------- */
  forecast() {
    const today = D.today(), ex = S.st.settings.examDate; let n = 0, now = 0, atExam = 0, due = 0;
    for (const [k, c] of Object.entries(S.st.srs || {})) { if (!c.last) continue; n++; now += FSRS.R(D.diff(c.last, today), c.s); atExam += FSRS.R(D.diff(c.last, ex), c.s); if (c.due <= today) due++; }
    return { n, now: n ? now / n : null, atExam: n ? atExam / n : null, due };
  },

  /* ---------- 校準：你說的信心 vs 實際答對率 ---------- */
  calibration() {
    const b = { 1: [0, 0], 2: [0, 0], 3: [0, 0] };
    for (const a of Object.values(S.st.answers || {})) for (const h of (a.hist || [])) if (h.conf && b[h.conf]) { b[h.conf][0]++; if (h.ok) b[h.conf][1]++; }
    return [1, 2, 3].map(k => ({ conf: k, n: b[k][0], acc: b[k][0] ? b[k][1] / b[k][0] : null }));
  },

  /* ---------- 自適應選題：讓預測答對率落在 80–85%，同時偏向弱章、避免連續同一章 ---------- */
  TARGET: .82,
  pick(done, prevCh, only) {
    const today = D.today(), readCh = DATA.lessons.filter(l => (S.st.lessons[l.id] || {}).read).map(l => l.id);
    const pd = S.planDay(); const planned = new Set(); (DATA.plan || []).forEach(p => { if (p.day <= pd) (p.lessons || []).forEach(x => planned.add(x)); });
    let chs = only ? [only] : readCh.length >= 2 ? readCh : [...new Set([...readCh, ...planned])];
    if (!chs.length) chs = DATA.lessons.map(l => l.id);
    const chSet = new Set(chs), cand = [];
    const due = new Set(this.dueQuestions());
    for (const q of QBANK.all()) { if (!chSet.has(q.ch) || q.type === 'essay' || done.has(q.id)) continue; const a = S.st.answers[q.id]; cand.push({ id: q.id, q, ch: q.ch, today: a && a.last === today, due: due.has(q.id), fresh: !a }); }
    for (const g of Gen.list) { if (!chSet.has(g.ch)) continue; const k = 'g:' + g.id, c = this.card(k); cand.push({ id: this.freshGen(g.id), q: { ch: g.ch, diff: g.diff || 2 }, ch: g.ch, gen: true, due: this.isDue(c, today), fresh: !c, today: [...done].some(x => x.startsWith('gen:' + g.id + ':')) }); }
    if (!cand.length) return null;
    const r = Math.random;
    let best = null, bs = 1e9;
    for (const c of cand) {
      const p = this.pOf(c.q), m = this.mastery(c.ch);
      let sc = Math.abs(p - this.TARGET) * 2 + (m == null ? .15 : m * .6) + (c.ch === prevCh ? .7 : 0) + (c.today ? .9 : 0) - (c.due ? .45 : 0) - (c.fresh ? .1 : 0) + (c.gen ? .08 : 0) + r() * .25;
      if (sc < bs) { bs = sc; best = c; }
    }
    return best;
  },
  /* 最弱的幾章（有做過題目的） */
  weakest(k = 3) { return DATA.lessons.map(l => ({ id: l.id, m: this.mastery(l.id), n: ((S.st.elo || {})[l.id] || {}).n || 0 })).filter(x => x.m != null && x.n >= 3).sort((a, b) => a.m - b.m).slice(0, k); },
};

</script>
<script>
/* 資工所衝刺站 — 練習引擎：章節練習、交錯練習、錯題複習、Agent 出題、隨機題、模擬考 */
'use strict';

function normAns(s) {
  return String(s).trim().toLowerCase()
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[\s　]/g, '').replace(/[，、；;]/g, ',').replace(/（/g, '(').replace(/）/g, ')').replace(/－/g, '-')
    .replace(/^[\[{(]/, '').replace(/[\]})]$/, '').replace(/,+$/, '');
}
function numVal(s) {
  if (/^-?\d+(\.\d+)?(e[-+]?\d+)?$/i.test(s)) return parseFloat(s);
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/); if (m) return parseFloat(m[1]) / parseFloat(m[2]);
  return null;
}
function fillCorrect(input, answers) {
  const a = normAns(input); if (!a) return false;
  return answers.some(x => {
    const b = normAns(x); if (a === b) return true;
    const na = numVal(a), nb = numVal(b);
    if (na != null && nb != null) return Math.abs(na - nb) <= 1e-6 + 1e-3 * Math.abs(nb);
    return false;
  });
}
const LETTERS = 'ABCDEFGH';

const Practice = {
  sess: null,

  getQ(id) { return id.startsWith('gen:') ? this.genQ(id) : QBANK.get(id); },
  genQ(id) { const [, gid, seed] = id.split(':'); try { return Gen.make(gid, +seed); } catch (e) { return null; } },

  start(ids, opts = {}) {
    ids = ids.filter(id => this.getQ(id));
    if (opts.shuffle) ids = rng(Date.now() & 0xffffffff).shuffle(ids);
    if (opts.limit) ids = ids.slice(0, opts.limit);
    if (!ids.length) { toast('沒有可以練的題目', ''); return; }
    this.sess = { ids, i: 0, opts, results: [], t0: Date.now(), state: 'ask' };
    if (location.hash === '#practice') route(); else location.hash = '#practice';
  },

  startAdaptive(only) {
    const first = Learn.pick(new Set(), null, only);
    if (!first) { toast('沒有可以練的題目', ''); return; }
    const m0 = {}; DATA.lessons.forEach(l => m0[l.id] = Learn.mastery(l.id));
    this.sess = { ids: [first.id], i: 0, opts: { title: only ? '自適應練習：' + LESSON[only].title : '自適應練習', adaptive: true, limit: 15, only }, results: [], t0: Date.now(), state: 'ask', m0 };
    if (location.hash === '#practice') route(); else location.hash = '#practice';
  },
  advance() {
    const s = this.sess; s.i++;
    if (s.opts.adaptive && s.i >= s.ids.length && s.ids.length < s.opts.limit) { const prev = (this.getQ(s.ids[s.i - 1]) || {}).ch; const nx = Learn.pick(new Set(s.ids), prev, s.opts.only); if (nx) s.ids.push(nx.id); }
    this.view();
  },

  /* ---------- home ---------- */
  view() {
    if (this.sess && this.sess.mock) return this.renderMock();
    if (this.sess) return this.sess.i >= this.sess.ids.length ? this.renderSummary() : this.renderCard();
    const studied = DATA.lessons.filter(l => (S.st.lessons[l.id] || {}).read).map(l => l.id);
    const due = S.dueReviews();
    const agq = S.st.agentQuiz.filter(q => !S.st.answers[q.id]);
    main().innerHTML = `
    <header class="page-head"><div class="eyebrow">測驗本身就是最有效的學習（提取練習）</div><h1>練習與模考</h1>
    <p class="lede">每題作答前先選信心度；答錯一定要寫錯因。很確定卻答錯的題目會被標記為「危險迷思」，優先重出。</p></header>
    <div class="mode-grid">
      <button class="mode hot" id="mAdapt"><b>自適應練習</b><span>模型即時挑題，讓你的答對率維持在 80–85%（最有學習效果的難度），弱章優先、各章交錯</span></button>
      <button class="mode" id="mDue" ${due.length ? '' : 'disabled'}><b>到期複習</b><span>FSRS 排定今天該再做的 ${due.length} 題（含計算題型）</span></button>
      <button class="mode" id="mInter"><b>交錯混合練習</b><span>從你已讀過的 ${studied.length} 章隨機抽 20 題，各科交錯出題</span></button>
      <button class="mode" id="mAgent" ${agq.length ? '' : 'disabled'}><b>Agent 出題</b><span>${agq.length} 題未作答</span></button>
      <button class="mode" id="mHard"><b>台大難度題</b><span>只出難度 3，已讀章節優先</span></button>
      <a class="mode" href="#gen"><b>無限隨機題</b><span>排程、頁替換、Cache、Heap、AVL、行列式…答案由模擬器算出</span></a>
    </div>
    <h2 class="sec">全真模擬考</h2>
    <div class="mode-grid">${GROUPS.map(g => `<button class="mode mock" data-mock="${g.id}"><b>${g.name}</b><span>${g.mins} 分鐘｜選擇＋計算＋證明｜交卷前不給回饋</span></button>`).join('')}</div>
    <h2 class="sec">依章節</h2>
    <div class="ch-pick">${DATA.subjects.map(s => `<div><h3 style="--sc:var(--s-${s.id})"><span class="sdot"></span>${esc(s.name)}</h3>${DATA.lessons.filter(l => l.subject === s.id).map(l => { const cs = chapterStats(l.id); return `<button class="ch-btn" data-ch="${l.id}" ${cs.n ? '' : 'disabled'}>${esc(l.title)}<small>${cs.att}/${cs.n}${cs.acc != null ? '・' + Math.round(cs.acc * 100) + '%' : ''}</small></button>`; }).join('')}</div>`).join('')}</div>`;
    const pool = () => QBANK.all().filter(q => q.src !== 'agent');
    $('#mInter').onclick = () => {
      const src = studied.length ? pool().filter(q => studied.includes(q.ch)) : pool();
      this.start(src.map(q => q.id), { title: '交錯混合練習', shuffle: true, limit: 20 });
    };
    $('#mDue').onclick = () => this.start(due, { title: '到期複習', review: true });
    $('#mAdapt').onclick = () => this.startAdaptive();
    $('#mAgent').onclick = () => this.start(agq.map(q => q.id), { title: 'Agent 出題' });
    $('#mHard').onclick = () => {
      let src = pool().filter(q => q.diff >= 3); const st = src.filter(q => studied.includes(q.ch));
      this.start((st.length >= 10 ? st : src).map(q => q.id), { title: '台大難度題', shuffle: true, limit: 15 });
    };
    $$('[data-mock]').forEach(b => b.onclick = () => this.startMock(b.dataset.mock));
    $$('[data-ch]').forEach(b => b.onclick = () => this.start(QBANK.all().filter(q => q.ch === b.dataset.ch).map(q => q.id), { title: LESSON[b.dataset.ch].title }));
  },

  /* ---------- question card ---------- */
  answerUI(q, name = 'opt') {
    if (q.type === 'single' || q.type === 'multi') {
      return `<div class="opts" role="${q.type === 'single' ? 'radiogroup' : 'group'}">${q.opts.map((o, k) => `<label class="opt"><input type="${q.type === 'single' ? 'radio' : 'checkbox'}" name="${name}" value="${k}"><span class="ol">${LETTERS[k]}</span><span class="ot">${md(o).replace(/^<p>|<\/p>$/g, '')}</span></label>`).join('')}</div>${q.type === 'multi' ? '<p class="muted small">複選題：全對才給分（台大常見）。</p>' : ''}`;
    }
    if (q.type === 'fill') return `<div class="fill"><input id="${name}-fill" autocomplete="off" placeholder="${esc(q.fmt || '輸入答案')}"><span class="muted small">${q.fmt ? '格式：' + esc(q.fmt) : '數字可填分數，如 3/4'}</span></div>`;
    return `<textarea id="${name}-essay" rows="9" placeholder="寫出完整推理或證明。每一步都要有理由。"></textarea>`;
  },
  readResponse(q, root, name = 'opt') {
    if (q.type === 'single') { const r = $(`input[name="${name}"]:checked`, root); return r ? [+r.value] : null; }
    if (q.type === 'multi') { const r = $$(`input[name="${name}"]:checked`, root).map(x => +x.value); return r.length ? r : null; }
    if (q.type === 'fill') { const v = $(`#${name}-fill`, root).value.trim(); return v || null; }
    const v = $(`#${name}-essay`, root).value.trim(); return v || null;
  },
  isCorrect(q, resp) {
    if (resp == null) return false;
    if (q.type === 'single' || q.type === 'multi') { const a = [...q.ans].sort().join(','), b = [...resp].sort().join(','); return a === b; }
    if (q.type === 'fill') return fillCorrect(resp, q.ans);
    return null;
  },
  fmtAns(q) {
    if (q.type === 'single' || q.type === 'multi') return q.ans.map(k => LETTERS[k]).join('、');
    if (q.type === 'fill') return q.ans[0];
    return '見詳解';
  },
  fmtResp(q, r) {
    if (r == null) return '（未作答）';
    if (q.type === 'single' || q.type === 'multi') return r.map(k => LETTERS[k]).join('、');
    return String(r);
  },
  metaLine(q) {
    const ch = LESSON[q.ch];
    return `<span class="chip sm" style="--sc:var(--s-${q.subject})"><span class="sdot"></span>${esc(ch ? ch.title : (q.chTitle || q.ch))}</span>
      <span class="stars" title="難度">${'★'.repeat(q.diff || 2)}${'☆'.repeat(3 - (q.diff || 2))}</span>
      <span class="muted small">${q.type === 'multi' ? '複選' : q.type === 'single' ? '單選' : q.type === 'fill' ? '計算／填答' : '申論／證明'}｜${q.src === 'agent' ? 'Agent 出題' : q.src === 'gen' ? '隨機產生' : '題庫'}</span>`;
  },

  renderCard() {
    const s = this.sess; const qid = s.ids[s.i]; const q = this.getQ(qid);
    if (!q) { s.i++; return this.view(); }
    s.state = 'ask'; s.conf = null; s.p = Learn.pOf(q);
    const m = main();
    m.innerHTML = `
    <header class="page-head slim"><div class="eyebrow">${esc(s.opts.title || '練習')}｜第 ${s.i + 1} / ${s.opts.adaptive ? s.opts.limit : s.ids.length} 題</div>
      <div class="progress"><i style="width:${(s.i / (s.opts.adaptive ? s.opts.limit : s.ids.length)) * 100}%"></i></div></header>
    <section class="card qcard">
      <div class="q-meta">${this.metaLine(q)}</div>
      <div class="q-stem prose">${md(q.stem)}</div>
      <div id="ansArea">${this.answerUI(q)}</div>
      <div class="conf"><span>作答前，你有多確定？</span>
        ${[[1, '用猜的'], [2, '有點把握'], [3, '非常確定']].map(([v, t]) => `<button class="cf" data-conf="${v}">${t}</button>`).join('')}</div>
      ${q.type !== 'essay' ? `<details class="reason"><summary>寫下思考鏈（建議：講得出每一步才算會）</summary><textarea id="reasonText" rows="4" placeholder="例：因為 load 後緊接著用 → 必須 stall 1 cycle，再 forward 自 MEM/WB……"></textarea></details>` : ''}
      <div class="row end"><button class="btn ghost" id="qSkip">跳過</button><button class="btn primary" id="qSubmit">提交</button></div>
      <div id="feedback"></div>
    </section>
    <div class="row end"><button class="btn ghost" id="qQuit">結束這回</button></div>`;
    $$('.cf', m).forEach(b => b.onclick = () => { $$('.cf', m).forEach(x => x.classList.remove('on')); b.classList.add('on'); s.conf = +b.dataset.conf; });
    $('#qSkip').onclick = () => { s.results.push({ qid, skipped: true }); this.advance(); };
    $('#qQuit').onclick = () => { s.ids = s.ids.slice(0, s.i); this.view(); };
    $('#qSubmit').onclick = () => this.submit(q, qid);
    const fi = $('#opt-fill'); if (fi) fi.addEventListener('keydown', e => { if (e.key === 'Enter') this.submit(q, qid); });
  },

  submit(q, qid) {
    const s = this.sess; if (s.state !== 'ask') return;
    const m = main();
    const resp = this.readResponse(q, m);
    if (resp == null) { toast('先作答', 'bad'); return; }
    if (!s.conf && !s.opts.pretest) { toast('先選信心度（這是後設認知訓練的一部分）', 'bad'); return; }
    s.state = 'done';
    const reasoning = ($('#reasonText') || {}).value || '';
    $('#qSubmit').disabled = true; $('#qSkip').disabled = true;
    $$('input, textarea', $('#ansArea')).forEach(x => x.disabled = true);
    const fb = $('#feedback');
    if (q.type === 'essay') {
      fb.innerHTML = `<div class="fb neutral"><b>參考解答</b>（對照你的推理，誠實自評）</div><div class="prose expl">${md(q.expl)}</div>
      <div class="selfeval"><span>你的答案涵蓋了參考解答的每個關鍵步驟嗎？</span>
      <button class="btn" data-se="full">完整涵蓋</button><button class="btn" data-se="part">部分</button><button class="btn" data-se="none">不會</button></div>
      <div class="row"><button class="btn" id="sendEssay">送 Agent 批改（建議）</button></div><div id="afterSE"></div>`;
      $$('[data-se]', fb).forEach(b => b.onclick = () => {
        const ok = b.dataset.se === 'full';
        S.answer(qid, ok, { conf: s.conf, q });
        s.results.push({ qid, ok, conf: s.conf, resp });
        $$('[data-se]', fb).forEach(x => x.disabled = true);
        if (!ok) this.causeUI(qid, $('#afterSE'), q, resp, reasoning); else this.nextBtn($('#afterSE'), q, qid, resp, reasoning);
      });
      $('#sendEssay').onclick = async () => {
        await Bridge.send({ type: 'essay', text: resp, ctx: { qid, chapter: q.ch, stem: q.stem, reference: q.expl } });
        toast('已送 Agent 批改', 'good'); $('#sendEssay').disabled = true;
      };
      return;
    }
    const ok = this.isCorrect(q, resp);
    if (s.opts.pretest) {
      s.results.push({ qid, ok, conf: s.conf, resp });
      if (q.type !== 'fill') $$('.opt', m).forEach((el, k) => { if (q.ans.includes(k)) el.classList.add('right'); else if (resp.includes(k)) el.classList.add('wrong'); });
      fb.innerHTML = `<div class="fb neutral"><b>${ok ? '猜對了' : '沒猜中'}</b>　正解：${esc(this.fmtAns(q))}<div class="muted small">先不給詳解。讀這章時，找出「為什麼是這個答案」。</div></div><div id="afterFb"></div>`;
      this.nextBtn($('#afterFb'), q, qid, resp, reasoning); return;
    }
    const a = S.answer(qid, ok, { conf: s.conf, q });
    if (q.src === 'gen') S.day().gens++;
    s.results.push({ qid, ok, conf: s.conf, resp });
    // mark options
    if (q.type !== 'fill') $$('.opt', m).forEach((el, k) => { if (q.ans.includes(k)) el.classList.add('right'); else if (resp.includes(k)) el.classList.add('wrong'); });
    fb.innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><b>${ok ? '正確' : '錯誤'}</b>　正解：${esc(this.fmtAns(q))}${ok ? '' : `　你的答案：${esc(this.fmtResp(q, resp))}`}
      ${!ok && s.conf === 3 ? '<div class="hcw">你非常確定卻答錯：這是危險迷思，已列入優先複習。把錯誤的想法寫下來，才會被修正。</div>' : ''}
      ${ok && s.conf === 1 ? '<div class="muted small">用猜的猜對不算會，這題仍會再出現。</div>' : ''}
      <div class="muted small">模型預測你答對的機率：${Math.round(s.p * 100)}%｜下次複習：${a.due || '—'}</div></div>
      <div class="prose expl">${md(q.expl || '')}</div><div id="afterFb"></div>`;
    if (!ok) this.causeUI(qid, $('#afterFb'), q, resp, reasoning);
    else this.nextBtn($('#afterFb'), q, qid, resp, reasoning);
  },

  causeUI(qid, host, q, resp, reasoning) {
    host.innerHTML = `<div class="cause"><b>錯因分析（必填）</b>
      <div class="row wrap">${CAUSES.map(c => `<button class="cf" data-cause="${c}">${c}</button>`).join('')}</div>
      <textarea id="causeNote" rows="3" placeholder="我原本以為……，但其實……，因為……（寫出錯誤的那一步）">${esc(S.st.wrongNotes[qid] || '')}</textarea></div><div id="nb"></div>`;
    let cause = null;
    $$('[data-cause]', host).forEach(b => b.onclick = () => { $$('[data-cause]', host).forEach(x => x.classList.remove('on')); b.classList.add('on'); cause = b.dataset.cause; });
    this.nextBtn($('#nb'), q, qid, resp, reasoning, () => {
      if (!cause) { toast('先選錯因', 'bad'); return false; }
      const note = $('#causeNote').value.trim();
      const a = S.st.answers[qid]; a.cause = cause; if (note) S.st.wrongNotes[qid] = note; S.save();
      return true;
    });
  },

  nextBtn(host, q, qid, resp, reasoning, guard) {
    const s = this.sess;
    host.insertAdjacentHTML('beforeend', `<div class="row end"><button class="btn" id="askThis">請 Agent 講解這題</button><button class="btn primary" id="qNext">${s.i + 1 >= s.ids.length ? '看結果' : '下一題'}</button></div>`);
    $('#askThis').onclick = async () => {
      if (guard && !guard()) return;
      const note = S.st.wrongNotes[qid] || '';
      await Bridge.send({ type: 'ask', text: `請講解這題，特別是我錯的那一步。${note ? '\n我的錯因筆記：' + note : ''}${reasoning ? '\n我的思考鏈：' + reasoning : ''}`, ctx: { qid, chapter: q.ch, stem: q.stem, options: q.opts, myAnswer: this.fmtResp(q, resp), answer: this.fmtAns(q), explanation: q.expl } });
      toast('已送出', 'good'); $('#askThis').disabled = true;
    };
    $('#qNext').onclick = () => { if (guard && !guard()) return; this.advance(); };
  },

  renderSummary() {
    const s = this.sess; const res = s.results.filter(r => !r.skipped);
    const ok = res.filter(r => r.ok).length; const hcw = res.filter(r => !r.ok && r.conf === 3).length;
    const lucky = res.filter(r => r.ok && r.conf === 1).length;
    const mins = Math.round((Date.now() - s.t0) / 60000);

      main().innerHTML = `<header class="page-head"><div class="eyebrow">${esc(s.opts.title)}</div><h1>猜中 ${ok} / ${res.length}</h1><p class="lede">分數不重要。帶著這 ${res.length} 個問題去讀，讀到答案時停下來確認自己懂了為什麼。</p></header>
      <div class="row"><a class="btn primary" href="#go">下一步 →</a><a class="btn" href="#${s.opts.pretest}">直接讀這章</a></div>`; this.sess = null; return; }

    <header class="page-head"><div class="eyebrow">${esc(s.opts.title || '練習')}｜${mins} 分鐘</div><h1>${res.length ? Math.round(ok / res.length * 100) : 0}%　<small>${ok} / ${res.length} 題</small></h1>
    <p class="lede">${hcw ? `高信心答錯 ${hcw} 題（最需要處理）。` : ''}${lucky ? `猜對 ${lucky} 題（不算會）。` : ''}錯題已排入間隔複習。</p></header>

    <div class="row end"><button class="btn" id="again">再練錯的</button><a class="btn primary" href="#go">下一步 →</a></div></section>

    const wrongIds = res.filter(r => !r.ok).map(r => r.qid);
    $('#again').disabled = !wrongIds.length;
    $('#again').onclick = () => this.start(wrongIds, { title: '重練錯題', review: true });
    this.sess = null;
  },

  /* ---------- 模擬考 ---------- */
  startMock(gid) {
    const g = GROUPS.find(x => x.id === gid);
    const r = rng(Date.now() & 0xffffffff);
    const bank = QBANK.all().filter(q => g.subs.includes(q.subject) && q.src !== 'agent');
    const obj = r.shuffle(bank.filter(q => q.type !== 'essay'));
    const ess = r.shuffle(bank.filter(q => q.type === 'essay'));

    const pickBal = (arr, n) => { const out = []; const by = g.subs.map(sid => arr.filter(q => q.subject === sid)); let k = 0; while (out.length < n && by.some(b => b.length)) { const b = by[k++ % by.length]; if (b.length) out.push(b.shift()); } return out; };

  },
  renderMock() {

  },
  handIn() {
    const s = this.sess; const m = main(); clearInterval(s.mock.timer);

      const q = this.getQ(id); const root = $('#eq-' + k, m);

  },
  renderMockResult() {
    const s = this.sess; const g = GROUPS.find(x => x.id === s.mock.gid);
    const objR = s.results.filter(r => r.ok !== null); const ok = objR.filter(r => r.ok).length;
    main().innerHTML = `<header class="page-head"><div class="eyebrow">模擬考成績｜${esc(g.name)}｜用時 ${s.mock.mins} 分</div>
      <h1>選擇／計算 ${ok} / ${objR.length}</h1><p class="lede">申論題已送 Agent 批改。逐題對照詳解，錯題都已進入錯題本，請到錯題本補寫錯因。</p></header>

        <div class="muted">你的答案：${esc(this.fmtResp(q, r.resp))}｜正解：${esc(this.fmtAns(q))}</div><details class="sol"><summary>詳解</summary><div class="prose">${md(q.expl || '')}</div></details></li>`; }).join('')}</ol>
      ${wrapperHtml(s.mock.gid, `${ok}/${objR.length}`)}
      <div class="row end"><a class="btn" href="#wrong">去錯題本寫錯因</a><a class="btn primary" href="#go">下一步 →</a></div>`;
    wireWrapper(s.mock.gid, `${ok}/${objR.length}`);
    this.sess = null;
  },

  /* ---------- 無限隨機題 ---------- */
  viewGen() {
    main().innerHTML = `<header class="page-head"><div class="eyebrow">題目與答案由模擬器即時算出，數量無限</div><h1>無限隨機題</h1>
      <p class="lede">計算題是台大拿分的地方，靠的是手感：每種至少連對 5 題再換下一種。</p>
      <div class="row"><button class="btn primary" id="genMix">全部混合 20 題</button></div></header>
      ${DATA.subjects.map(sb => { const gs = Gen.list.filter(x => x.subject === sb.id); if (!gs.length) return ''; return `<h2 class="lab-sec" style="--sc:var(--s-${sb.id})"><span class="sdot"></span>${esc(sb.name)}</h2><div class="lab-grid">${gs.map(x => { const st = genStats(x.id); return `<button class="lab-card" data-gen="${x.id}" style="--sc:var(--s-${x.subject})"><b>${esc(x.title)}</b><span>${esc(x.desc || '')}</span><span class="muted small">${st.n ? `做過 ${st.n} 題・${Math.round(st.c / st.n * 100)}%` : '還沒做過'}</span></button>`; }).join('')}</div>`; }).join('')}`;
    const seed = () => Math.floor(Math.random() * 1e9);
    $('#genMix').onclick = () => this.start(Array.from({ length: 20 }, () => `gen:${rng(seed()).pick(Gen.list).id}:${seed()}`), { title: '隨機混合 20 題' });
    $$('[data-gen]').forEach(b => b.onclick = () => this.start(Array.from({ length: 10 }, () => `gen:${b.dataset.gen}:${seed()}`), { title: Gen.get(b.dataset.gen).title + '｜10 題' }));
  },
};
function genStats(gid) {
  let n = 0, c = 0;
  for (const [id, a] of Object.entries(S.st.answers)) if (id.startsWith('gen:' + gid + ':')) { n += a.n; c += a.c; }
  return { n, c };
}

</script>
<script>
/* 資工所衝刺站 — 直式短影音（9:16）：程式即時算出每一幀 + Web Audio 合成音樂與音效 */
'use strict';

/* ======================= 音樂與音效（全部即時合成） ======================= */
const Sound = {
  ac: null, master: null, mus: null, fx: null, on: false, timer: null, step: 0, next: 0, users: 0,
  init() {
    if (this.ac) return;

  },
  toggle() { this.init(); if (!this.ac) return false; this.on = !this.on; if (this.on) { this.ac.resume(); if (this.users > 0) this.startMusic(); } else this.stopMusic(); try { localStorage.setItem('csgrad.sound', this.on ? '1' : '0'); } catch (e) { } document.querySelectorAll('.snd-btn').forEach(b => { b.classList.toggle('on', this.on); b.textContent = this.on ? '🔊' : '🔇'; }); return this.on; },
  env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); },
  osc(type, f, t, dur, peak, dest, a = .005) { const o = this.ac.createOscillator(), g = this.ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); o.connect(g); g.connect(dest); this.env(g, t, a, peak, dur); o.start(t); o.stop(t + a + dur + .05); return o; },
  noiseHit(t, dur, peak, type, freq, dest, q = 1) { const s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain(); s.buffer = this.noise; f.type = type; f.frequency.value = freq; f.Q.value = q; s.connect(f); f.connect(g); g.connect(dest); this.env(g, t, .003, peak, dur); s.start(t, Math.random() * .5); s.stop(t + dur + .05); return f; },
  /* 背景音樂：92 BPM、Am–F–C–G 的 lo-fi 小品 */
  musicStep(st, t, s16) {
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12), chords = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], bass = [45, 41, 48, 43], arp = [0, 1, 2, 1, 2, 0, 1, 2];

      for (const m of ch) for (const det of [-6, 6]) { const o = this.ac.createOscillator(), g = this.ac.createGain(), f = this.ac.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det; f.type = 'lowpass'; f.frequency.value = 900; o.connect(f); f.connect(g); g.connect(this.mus); const e = t + 16 * s16; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.032, t + .45); g.gain.setValueAtTime(.032, e - .05); g.gain.linearRampToValueAtTime(.0001, e + .5); o.start(t); o.stop(e + .6); }
      this.osc('sine', mtof(bass[bar]), t, 1.6, .32, this.mus, .01);
    }
    if (s === 8) this.osc('sine', mtof(bass[bar]), t, .9, .25, this.mus, .01);
    if (s % 2 === 0) this.osc('triangle', mtof(ch[arp[(st / 2) % 8]] + 12), t, .26, .1, this.mus);
    if (s === 0 || s === 10) { const o = this.osc('sine', 120, t, .32, .55, this.mus, .002); o.frequency.exponentialRampToValueAtTime(42, t + .25); }
    if (s === 4 || s === 12) this.noiseHit(t, .18, .16, 'bandpass', 1800, this.mus, .8);
    if (s % 2 === 0) this.noiseHit(t + (s % 4 === 2 ? s16 * .12 : 0), .04, s % 4 === 2 ? .07 : .045, 'highpass', 7000, this.mus);
  },
  BPM: 92,
  /* 背景音樂：92 BPM、Am–F–C–G 的 lo-fi 小品 */
  startMusic() {
    if (!this.on || !this.ac || this.timer) return;
    const s16 = 60 / this.BPM / 4; this.step = 0; this.next = this.ac.currentTime + .08;
    this.timer = setInterval(() => { while (this.next < this.ac.currentTime + .15) { this.musicStep(this.step, this.next, s16); this.step++; this.next += s16; } }, 25);
  },
  stopMusic() { clearInterval(this.timer); this.timer = null; },
  /* 離線把整支短片的配樂＋音效算成 WAV（匯出 MP4 用） */
  async renderClip(clip, sr = 44100) {
    const ac = new OfflineAudioContext(2, Math.ceil(sr * clip.dur), sr), o = Object.create(Sound);
    o.ac = ac; o.on = true; o.master = ac.createGain(); o.master.connect(ac.destination);
    o.master.gain.setValueAtTime(0, 0); o.master.gain.linearRampToValueAtTime(.85, .4); o.master.gain.setValueAtTime(.85, clip.dur - .8); o.master.gain.linearRampToValueAtTime(0, clip.dur - .05);
    const comp = ac.createDynamicsCompressor(); comp.connect(o.master);
    o.mus = ac.createGain(); o.mus.gain.value = .4; o.mus.connect(comp); o.fx = ac.createGain(); o.fx.gain.value = .8; o.fx.connect(comp);
    const b = ac.createBuffer(1, sr, sr), d = b.getChannelData(0), r = (() => { let a = 7; return () => ((a = (a * 1103515245 + 12345) & 0x7fffffff) / 0x3fffffff) - 1; })(); for (let i = 0; i < sr; i++) d[i] = r(); o.noise = b;
    const s16 = 60 / this.BPM / 4; for (let st = 0, t = .05; t < clip.dur; st++, t += s16) o.musicStep(st, t, s16);
    for (const [ts, nm] of clip.sfx || []) o.sfx(nm, ts);
    const buf = await ac.startRendering(), L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length, out = new DataView(new ArrayBuffer(44 + n * 4));
    const w = (o2, s2) => { for (let i = 0; i < s2.length; i++) out.setUint8(o2 + i, s2.charCodeAt(i)); };
    w(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * 4, true);
    for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }

  },
  use(d) { this.users = Math.max(0, this.users + d); if (this.users > 0) this.startMusic(); else this.stopMusic(); },
  sfx(name, at) {
    if (!this.on || !this.ac) return; const t = (at == null ? this.ac.currentTime : at) + .005, F = this.fx;
    if (name === 'pop') { const o = this.osc('sine', 520, t, .12, .5, F, .003); o.frequency.exponentialRampToValueAtTime(980, t + .08); }
    else if (name === 'tick') this.osc('square', 1400, t, .03, .12, F, .001);
    else if (name === 'whoosh') { const f = this.noiseHit(t, .45, .35, 'bandpass', 500, F, 1.4); f.frequency.exponentialRampToValueAtTime(3500, t + .4); }
    else if (name === 'land') { const o = this.osc('triangle', 330, t, .18, .35, F, .002); o.frequency.exponentialRampToValueAtTime(180, t + .15); }
    else if (name === 'ding') { this.osc('sine', 1320, t, .9, .32, F); this.osc('sine', 1980, t, .6, .12, F); }
    else if (name === 'success') [0, .09, .18, .3].forEach((d, i) => this.osc('triangle', [523, 659, 784, 1047][i], t + d, .35, .3, F));
    else if (name === 'error') { this.osc('square', 140, t, .28, .22, F); this.osc('square', 147, t, .28, .18, F); }
    else if (name === 'rise') { const o = this.osc('sawtooth', 200, t, .7, .12, F, .05); o.frequency.exponentialRampToValueAtTime(900, t + .6); }
    else if (name === 'boom') { const o = this.osc('sine', 90, t, .7, .6, F, .002); o.frequency.exponentialRampToValueAtTime(35, t + .5); this.noiseHit(t, .4, .25, 'lowpass', 800, F); }
  },
};
try { Sound.wanted = localStorage.getItem('csgrad.sound') !== '0'; } catch (e) { Sound.wanted = true; }
/* 瀏覽器規定要先有一次點擊才能出聲：第一次點頁面任何地方就自動開聲音（除非之前按過靜音） */
document.addEventListener('pointerdown', e => { if (Sound.wanted && !Sound.on && !(e.target.closest && e.target.closest('.snd-btn'))) Sound.toggle(); }, true);
document.addEventListener('visibilitychange', () => { if (!Sound.ac) return; if (document.hidden) Sound.ac.suspend(); else if (Sound.on) Sound.ac.resume(); });

/* ======================= 繪圖引擎 ======================= */
const Clips = (() => {
  const W = 720, H = 1280;
  let ctx = null;
  const C = { ink: '#eef3ff', dim: '#8390ab', faint: '#2a3552', teal: '#2ee6c9', amber: '#ffc547', coral: '#ff6b8b', violet: '#a98bff', green: '#5cf28a', blue: '#5aa8ff' };
  const SUBC = { ds: C.teal, al: C.violet, co: C.amber, os: C.coral, dm: C.green, la: C.blue };
  const SANS = '"Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif', SERIF = '"Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif', MONO = '"JetBrains Mono","DejaVu Sans Mono",Consolas,monospace';

        caps(t, [[.4, 4.3, 'CLRS 的歸約鏈：全部從 CIRCUIT-SAT 出發'], [4.4, 10.3, 'A ≤ₚ B：把 A 的題目轉成 B 的題目'], [10.4, 14.5, '最常見的錯：箭頭方向弄反'], [14.6, 18.5, 'X ∈ NP，再找一個已知 NPC 歸約到 X'], [18.6, 26.7, '這幾個問題互相轉換，背熟這條鏈']]);
      } });
  })();

  /* ================= 演算法：指示隨機變數 ================= */
  (() => {
    const sc = [3, 1, 6, 2, 7, 5, 4, 9, 8, 10], bx = i => 85 + i * 61, st = i => 2 + i * .7; let mx = 0; const hire = sc.map(v => { const h = v > mx; if (h) mx = v; return h; });
    def({ id: 'al-prob', subject: 'al', lesson: 'al-prob', chip: '演算法 · 機率分析', hook: ['只要遇到更好的就換人', '平均要換幾次？'], dur: 26,
      sfx: [...sc.map((_, i) => [st(i), hire[i] ? 'ding' : 'tick']), [9.6, 'whoosh'], [12.6, 'pop'], [14.4, 'rise'], [17.4, 'success']],
      draw(t) {
        let best = 0, hires = 0; sc.forEach((v, i) => { if (t >= st(i)) { if (v > best) { best = v; hires++; } } });
        sc.forEach((v, i) => { if (t < st(i)) return; const u = P(t, st(i), .5, E.back), h = v * 34 * Math.min(1.1, u), col = hire[i] ? C.green : C.dim; ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = hire[i] ? 18 : 0; rrect(bx(i) - 22, 760 - h, 44, h, 8, col + (hire[i] ? 'aa' : '55'), col, 1.5); ctx.restore();
          txt(String(v), bx(i), 740 - h, { size: 20, font: MONO, weight: 800, alpha: cl(u) }); txt(`#${i + 1}`, bx(i), 784, { size: 16, font: MONO, color: C.dim, alpha: cl(u) }); if (hire[i] && t > st(i) + .3) txt('錄取', bx(i), 812, { size: 16, weight: 900, color: C.green, alpha: P(t, st(i) + .3, .3) }); });
        txt(`錄取次數 ${hires}`, W / 2, 340, { size: 36, weight: 900, color: C.green, alpha: P(t, 2, .4) * (1 - P(t, 17.1, .3)), glow: 12 });
        const B = P(t, 9.6, .5); if (B > 0) { ctx.save(); ctx.globalAlpha = B; rrect(60, 840, 600, 190, 22, 'rgba(8,13,28,.94)', C.amber, 2); ctx.restore();
          txt('Xᵢ = 1 若第 i 位被錄取', W / 2, 880, { size: 26, font: MONO, weight: 800, alpha: B });
          txt('P(第 i 位是前 i 位裡最好的) = 1/i', W / 2, 930, { size: 24, font: MONO, weight: 800, color: C.amber, alpha: P(t, 12.6, .5) });
          txt('E[X] = Σ 1/i = Hₙ ≈ ln n', W / 2, 985, { size: 32, font: MONO, weight: 900, color: C.green, glow: 12, alpha: P(t, 14.4, .5) }); }

        caps(t, [[.4, 1.9, '面試 10 個人，順序隨機'], [2, 9.5, '每遇到比目前最好的還好，就換人'], [9.6, 17.3, '指示隨機變數：把「錄取次數」拆成每個人錄不錄取'], [17.4, 25.7, '期望值線性：不用管彼此相不相關，直接相加']]);

  /* ======================= 播放器 ======================= */
  const get = id => LIST.find(c => c.id === id);
  function render(c2d, clip, t) {
    ctx = c2d; ctx.save(); bg(t, SUBC[clip.subject] || C.teal); hook(t, clip); clip.draw(t);
    txt('資工所衝刺站', W / 2, 1238, { size: 18, color: C.dim, weight: 700, spacing: 6, alpha: .7 });
    ctx.restore(); const f = Math.min(cl(t / .35), cl((clip.dur - t) / .35)); if (f < 1) { c2d.fillStyle = `rgba(5,8,15,${1 - f})`; c2d.fillRect(0, 0, W, H); }
  }
  const players = [];
  function player(host, id, opts = {}) {
    const clip = get(id); if (!clip) return null;
    const box = document.createElement('div'); box.className = 'clip-player' + (opts.feed ? ' feed' : '');
    box.innerHTML = `<canvas width="${W}" height="${H}"></canvas><div class="clip-bar"><i></i></div><button class="clip-btn snd-btn ${Sound.on ? 'on' : ''}" aria-label="聲音開關" title="音樂與音效">${Sound.on ? '🔊' : '🔇'}</button><div class="clip-hint">點一下暫停／播放</div>`;
    host.appendChild(box);
    const cv = box.querySelector('canvas'), c2d = cv.getContext('2d'), bar = box.querySelector('.clip-bar i');
    const st = { t: opts.start || 2.2, playing: false, raf: 0, last: 0, clip, fresh: true };
    const draw = () => { render(c2d, clip, st.t); bar.style.width = (st.t / clip.dur * 100) + '%'; };
    const loop = now => { if (!st.playing) return; const dt = Math.min(.1, (now - st.last) / 1000); st.last = now; const p = st.t; st.t += dt;
      if (!st.seen && st.t >= clip.dur * .9) { st.seen = true; if (window.onClipSeen) window.onClipSeen(clip.id); }
      if (st.t >= clip.dur) { st.t = 0; if (opts.onEnd) opts.onEnd(api); } else { for (const [ts, nm] of clip.sfx || []) if (ts > p && ts <= st.t) Sound.sfx(nm); }
      draw(); st.raf = requestAnimationFrame(loop); };
    const api = { box, clip, play() { if (st.playing) return; players.forEach(p => p !== api && p.pause()); if (st.fresh || st.t >= clip.dur - .05 || opts.restart) { st.t = 0; opts.restart = false; st.fresh = false; } st.playing = true; st.last = performance.now(); Sound.use(1); box.classList.add('playing'); st.raf = requestAnimationFrame(loop); },
      pause() { if (!st.playing) return; st.playing = false; cancelAnimationFrame(st.raf); Sound.use(-1); box.classList.remove('playing'); }, stop() { api.pause(); if (api.io) api.io.disconnect(); } };
    cv.addEventListener('click', () => { st.playing ? api.pause() : api.play(); });
    box.querySelector('.snd-btn').addEventListener('click', e => { e.stopPropagation(); Sound.wanted = Sound.toggle(); });
    draw();
    if (opts.auto && 'IntersectionObserver' in window) { api.io = new IntersectionObserver(es => es.forEach(en => { if (en.intersectionRatio >= .6) { opts.restart = !!opts.feed; api.play(); } else api.pause(); }), { threshold: [0, .6, 1] }); api.io.observe(box); }
    players.push(api); return api;
  }
  function stopAll() { players.splice(0).forEach(p => p.stop()); }
  return { list: LIST, get, render, player, stopAll, W, H, SUBC };
})();

</script>
<script>
/* 資工所衝刺站 — 學習法升級：必背卡（FSRS）、學習儀表板（校準／掌握度／遺忘曲線）、讀前預測驗、模考反思 */
'use strict';

/* ======================= 必背卡 ======================= */
let CardSess = null;
function cardFilter(sub, kind) { return c => (!sub || sub === 'all' || c.subject === sub) && (!kind || kind === 'all' || c.kind === kind); }
function interleave(arr) { // 同一章不要連著出
  const by = {}; arr.forEach(c => (by[c.ch] = by[c.ch] || []).push(c)); const keys = rng(Date.now() & 0xffff).shuffle(Object.keys(by)); const out = [];
  while (out.length < arr.length) for (const k of keys) if (by[k].length) out.push(by[k].shift());
  return out;
}
function startCards(opts = {}) {
  const f = cardFilter(opts.sub, opts.kind);
  const due = rng(Date.now() & 0xffffffff).shuffle(Learn.cardDue(D.today(), f));
  const fresh = opts.noNew ? [] : Learn.newCards(f, opts.newLimit ?? Learn.newLeft());
  const list = interleave(due.concat(fresh)).slice(0, opts.max || 120);
  if (!list.length) { toast(opts.kind === 'tf' ? '今天沒有到期的陷阱卡，也沒有新卡可開（先讀新的章節）' : '今天的卡片都做完了', 'good'); return; }
  CardSess = { list, i: 0, t0: Date.now(), res: [], requeue: {}, title: opts.title || '今日必背卡', state: 'front' };
  if (location.hash === '#cards') route(); else location.hash = '#cards';
}
function viewCards() {
  if (CardSess) return CardSess.i >= CardSess.list.length ? cardSummary() : renderCardItem();
  const all = Learn.cards(), srs = S.st.srs || {}, today = D.today();
  const due = Learn.cardDue(today).length, newN = Math.min(Learn.newLeft(), Learn.newCards().length), learned = all.filter(c => srs[c.id]).length;
  let rs = 0, rn = 0; all.forEach(c => { const r = Learn.Rnow(srs[c.id]); if (r != null) { rs += r; rn++; } });
  main().innerHTML = `
  <header class="page-head"><div class="eyebrow">FSRS 記憶模型：每張卡在你「快要忘記」的那天才出現</div><h1>必背卡</h1>
  <p class="lede">從教材自動抽出 ${all.length} 張卡：<b>陷阱判斷</b>（台大多選題最愛的錯誤敘述）、<b>考點</b>、<b>讀前回想題</b>。只會開放已讀或計畫已到的章節。</p></header>
  <section class="kpis kpis4">
    <div class="kpi"><span class="k">${due}</span><span class="l">今天到期</span></div>
    <div class="kpi"><span class="k">${newN}<small>/${S.st.settings.newCards || 20}</small></span><span class="l">今天可開新卡</span></div>
    <div class="kpi"><span class="k">${learned}<small>/${all.length}</small></span><span class="l">已學</span></div>
    <div class="kpi"><span class="k">${rn ? pct(rs / rn) : '—'}</span><span class="l">此刻平均記得機率</span></div>
  </section>
  <div class="mode-grid">
    <button class="mode" id="cToday" ${due + newN ? '' : 'disabled'}><b>開始今日卡片</b><span>到期 ${due} 張＋新卡 ${newN} 張，交錯出題</span></button>
    <button class="mode" id="cTf"><b>陷阱判斷快問快答</b><span>只出 ✓／✗ 敘述，← 錯　→ 對</span></button>
    <button class="mode" id="cCram" ${learned ? '' : 'disabled'}><b>考前總複習</b><span>把已學的卡依「最快忘記」排序，抽 40 張</span></button>
  </div>
  <h2 class="sec">各科牌組</h2>
  <div class="deck-grid">${DATA.subjects.map(s => { const cs = all.filter(c => c.subject === s.id); const l = cs.filter(c => srs[c.id]).length, d = cs.filter(c => Learn.isDue(srs[c.id], today)).length;
    return `<button class="deck" data-sub="${s.id}" style="--sc:var(--s-${s.id})"><span class="sdot"></span><b>${esc(s.name)}</b><span class="muted small">${l}/${cs.length} 已學｜到期 ${d}</span><span class="bar"><i style="width:${cs.length ? l / cs.length * 100 : 0}%"></i></span></button>`; }).join('')}</div>
  <section class="card"><div class="card-h"><h3>四個按鈕怎麼按</h3></div>

  $$('[data-sub]').forEach(b => b.onclick = () => startCards({ sub: b.dataset.sub, title: SUBJ[b.dataset.sub].name + '｜必背卡' }));
}
function renderCardItem() {

  const isNew = !srs, R = Learn.Rnow(srs);
  main().innerHTML = `
  <header class="page-head slim"><div class="eyebrow">${esc(s.title)}｜${s.i + 1} / ${s.list.length}</div><div class="progress"><i style="width:${s.i / s.list.length * 100}%"></i></div></header>
  <section class="card fcard k-${c.kind}" style="--sc:var(--s-${c.subject})">
    <div class="q-meta"><span class="chip sm" style="--sc:var(--s-${c.subject})"><span class="sdot"></span>${esc(l ? l.title : c.ch)}</span><span class="tag">${KIND_ZH[c.kind]}${c.tag === '定理' ? '・定理' : ''}</span><span class="muted small">${isNew ? '新卡' : `上次 ${srs.last}｜此刻記得機率 ${pct(R)}`}</span></div>
    <div class="f-front prose">${c.kind === 'tf' ? '<div class="f-ask">這句話對嗎？</div>' : c.kind === 'key' ? '<div class="f-ask">說出這個考點的完整內容（公式、條件、例外）</div>' : '<div class="f-ask">先在腦中完整回答，再翻面</div>'}<div class="f-q">${md(c.front)}</div></div>
    <div id="fAct">${c.kind === 'tf' ? `<div class="tf-btns"><button class="btn tf no" data-tf="0">✗ 錯 <kbd>←</kbd></button><button class="btn tf yes" data-tf="1">✓ 對 <kbd>→</kbd></button></div>` : `<div class="row center"><button class="btn primary" id="flip">翻面 <kbd>空白鍵</kbd></button></div>`}</div>
    <div id="fBack"></div>
  </section>
  <div class="row end"><button class="btn ghost" id="cQuit">結束這回</button></div>`;
  $$('[data-tf]').forEach(b => b.onclick = () => cardTF(b.dataset.tf === '1'));
  const fl = $('#flip'); if (fl) fl.onclick = cardFlip;
  $('#cQuit').onclick = () => { s.list = s.list.slice(0, s.i); route(); };
}
function backHtml(c) {
  const l = LESSON[c.ch];
  if (c.kind === 'key') return `<div class="prose f-b">${md(c.back)}</div>`;
  if (c.kind === 'recall') return `<div class="f-b"><p>對照章節：<a href="#${c.ch}">${esc(l ? l.title : c.ch)}</a>（講不出推理鏈的那一步，就是要按「忘了」的地方）</p></div>`;
  return `<div class="prose f-b">${c.back ? md(c.back) : `<p class="muted">為什麼${c.ans ? '對' : '錯'}？先自己講一遍理由；講不出來就去 <a href="#${c.ch}">${esc(l ? l.title : c.ch)}</a> 找。</p>`}</div>`;
}
function rateBtns(c, def) {
  const iv = Learn.preview(c.id), lab = d => d < 1.5 ? '明天' : d < 30 ? `${d} 天` : `${(d / 30).toFixed(1)} 月`;
  return `<div class="rate">${[1, 2, 3, 4].map(g => `<button class="btn rt r${g} ${def === g ? 'on' : ''}" data-g="${g}"><b>${Learn.GRADES[g]}</b><small>${lab(iv[g - 1])}</small><kbd>${g}</kbd></button>`).join('')}</div>`;
}
function cardTF(pick) {
  const s = CardSess; if (s.state !== 'front') return; s.state = 'back'; const c = s.list[s.i], ok = pick === c.ans; s.pick = pick;
  $$('[data-tf]').forEach(b => { b.disabled = true; if ((b.dataset.tf === '1') === c.ans) b.classList.add('right'); else if ((b.dataset.tf === '1') === pick) b.classList.add('wrong'); });
  $('#fBack').innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><b>${ok ? '答對' : '答錯'}</b>　這句話是 <b>${c.ans ? '對的 ✓' : '錯的 ✗'}</b></div>${backHtml(c)}
    <p class="muted small">系統依對錯幫你選了「${ok ? '記得' : '忘了'}」；猜對請改按「困難」，秒答請改按「輕鬆」。</p>${rateBtns(c, ok ? 3 : 1)}`;

}
function cardFlip() {

  $('#fAct').innerHTML = ''; $('#fBack').innerHTML = `${backHtml(c)}${rateBtns(c)}`; wireRate(null);
}
function wireRate(def) { CardSess.def = def; $$('[data-g]').forEach(b => b.onclick = () => cardRate(+b.dataset.g)); }
function cardRate(g) {
  const s = CardSess; if (s.state !== 'back') return; s.state = 'done'; const c = s.list[s.i], isNew = !Learn.card(c.id);

}

  const s = CardSess, n = s.res.length, ok = s.res.filter(r => r.ok).length, mins = Math.max(1, Math.round((Date.now() - s.t0) / 60000));

  main().innerHTML = `<header class="page-head"><div class="eyebrow">${esc(s.title)}｜${mins} 分鐘</div><h1>${n} 張　<small>一次就記得 ${n ? Math.round(ok / n * 100) : 0}%</small></h1>
  <p class="lede">按「忘了」的卡已在這回合重出過，明天會再出現。明天預計到期 ${tom} 張。</p></header>

document.addEventListener('keydown', e => {
  if (!CardSess || (location.hash.slice(1) || '') !== 'cards' || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) return;
  const s = CardSess, c = s.list[s.i]; if (!c) return;

  else if (s.state === 'back') { if (/^[1-4]$/.test(e.key)) { e.preventDefault(); cardRate(+e.key); } else if ((e.key === ' ' || e.key === 'Enter') && s.def) { e.preventDefault(); cardRate(s.def); } }
});

/* ======================= 學習儀表板 ======================= */
function viewStats() {
  const fc = Learn.forecast(), cal = Learn.calibration(), today = D.today(), srs = S.st.srs || {};
  const causes = {}; Object.values(S.st.answers).forEach(a => { if (a.cause) causes[a.cause] = (causes[a.cause] || 0) + 1; });
  const cTot = Object.values(causes).reduce((a, b) => a + b, 0);

  const pts = []; const ents = Object.values(srs).filter(c => c.last);
  for (let d = 0; d <= 60; d += 2) { let s = 0; ents.forEach(c => s += FSRS.R(D.diff(c.last, today) + d, c.s)); pts.push(ents.length ? s / ents.length : null); }
  const exD = S.daysLeft(); const W2 = 640, H2 = 180;
  const path = pts.map((v, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1) * W2).toFixed(1)},${(H2 - (v ?? 0) * H2).toFixed(1)}`).join(' ');
  const last14 = Array.from({ length: 14 }, (_, i) => { const d = D.add(today, i - 13), L = S.st.log[d]; return { d, q: L ? L.q : 0, c: L ? L.c : 0 }; }); const mq = Math.max(10, ...last14.map(x => x.q));
  const calMsg = (() => { const c3 = cal[2], c1 = cal[0]; if (c3.n >= 5 && c3.acc < .85) return `<p class="bad-t">你說「非常確定」時只答對 ${pct(c3.acc)}：過度自信。考場上這種題你不會回頭檢查，最危險。</p>`; if (c1.n >= 5 && c1.acc > .65) return `<p class="muted">你說「用猜的」卻答對 ${pct(c1.acc)}：你比自己以為的更會，作答時可以更果斷。</p>`; return c3.n + cal[1].n + c1.n >= 10 ? '<p class="good-t">信心與實際表現大致一致，保持。</p>' : '<p class="muted">至少答 10 題（都要選信心度）後才看得出校準。</p>'; })();
  main().innerHTML = `

function pretestHtml(l) {
  const ls = S.st.lessons[l.id] || {}; if (ls.read || ls.pre) return '';
  const n = QBANK.all().filter(q => q.ch === l.id && q.type !== 'essay' && q.src !== 'agent').length; if (n < 2) return '';
  return `<aside class="callout c-ntu pretest"><div class="c-label">讀前預測驗｜先猜 3 題再讀</div><p>還沒讀就先作答，猜錯也沒關係：被問過的問題，讀的時候大腦會主動找答案（pretesting effect）。只公布正解、不給詳解，也不計入錯題。</p><div class="row"><button class="btn primary" id="btnPre">開始預測驗</button></div></aside>`;
}
function wirePretest(l) {
  const b = $('#btnPre'); if (!b) return;
  b.onclick = () => { const ids = rng(Date.now() & 0xffffffff).shuffle(QBANK.all().filter(q => q.ch === l.id && q.type !== 'essay' && q.src !== 'agent').map(q => q.id)).slice(0, 3); Practice.start(ids, { title: '讀前預測驗：' + l.title, pretest: l.id }); };
}

/* ======================= 模考反思單（exam wrapper） ======================= */
const WRAP_CAUSES = ['觀念沒讀到', '觀念不清', '計算失誤', '題意誤讀', '時間不夠', '粗心', '證明寫不出來'];
function wrapperHtml(gid, score) {
  return `<section class="card wrapper" id="wrapCard"><div class="card-h"><h2>考後反思單</h2><span class="muted small">寫完才算考完：把失分變成下次的具體行動</span></div>
    <p><b>1. 失分主要來自哪裡？</b>（可複選）</p><div class="row wrap">${WRAP_CAUSES.map(c => `<button class="cf" data-wc="${c}">${c}</button>`).join('')}</div>
    <label for="wSlow"><b>2.</b> 哪一題花最多時間？值得嗎？</label><textarea id="wSlow" rows="2"></textarea>
    <label for="wPrep"><b>3.</b> 考前的準備方式，哪一個最有用、哪一個沒用？</label><textarea id="wPrep" rows="2"></textarea>
    <label for="wChange"><b>4. 下一場模考前，我會改變的一件事</b>（寫成「如果……就……」）</label><textarea id="wChange" rows="2" placeholder="例：如果一題計算超過 8 分鐘，就先跳過，最後再回來。"></textarea>
    <div class="row end"><button class="btn primary" id="wSave">送出反思</button></div></section>`;
}
function wireWrapper(gid, score) {
  const host = $('#wrapCard'); if (!host) return; const pick = new Set();
  $$('[data-wc]', host).forEach(b => b.onclick = () => { b.classList.toggle('on'); pick.has(b.dataset.wc) ? pick.delete(b.dataset.wc) : pick.add(b.dataset.wc); });
  $('#wSave').onclick = async () => {
    const change = $('#wChange').value.trim(); if (!pick.size || change.length < 12) { toast('至少選一個失分原因，並寫下具體要改變的一件事', 'bad'); return; }
    const w = { date: D.today(), gid, score, causes: [...pick], slow: $('#wSlow').value.trim(), prep: $('#wPrep').value.trim(), change };
    (S.st.wrappers = S.st.wrappers || []).push(w); S.save();
    await Bridge.send({ type: 'reflect', text: `模考反思（${(GROUPS.find(g => g.id === gid) || {}).name || gid}，客觀題 ${score}）\n失分原因：${w.causes.join('、')}\n最花時間：${w.slow || '—'}\n準備方式：${w.prep || '—'}\n下次要改變：${change}`, ctx: w });
    host.innerHTML = `<div class="fb good"><b>已記錄</b>　接下來每天的今日督導都會提醒你：「${esc(change)}」</div>`;
  };
}
